# config/tos_status_board.yaml — `sts tos status` (TOS 한 장 상태판) 설정
#
# 계획: docs/plans/2026-10-22-tos-rescope-plan.md §2 문장 5 «한 장 상태판» · §3 M4.
# 상태판은 읽기 전용이다. 아래 경로를 열기만 하고(sqlite 는 file:...?mode=ro) 쓰지 않는다.

# 상태 루트. `~` 와 환경변수는 펼친다. `--state-dir` 가 이 값을 덮는다.
state_dir: "~/.local/state/tos"

# 상태 루트 아래 이름들 — 러너·크론이 쓰는 이름과 같아야 한다.
tenant_sessions_subdir: cp3-sessions # tools/tos_cp3/runners/run_tenant_session.sh 의 세션 디렉터리 부모
tenant_cron_log_glob: "cp3-*-tenant-daily.cron.log" # 크론 래퍼 로그(세션 디렉터리가 생기기 전의 실패가 여기 남는다)
paper_sessions_subdir: paper-sessions # 상주 paper 세션 산출물(YYYY-MM-DD-HHMMSS-<DIR>)
paper_ops_subdir: paper-ops # paper-session.pid · paper-session.driver.pid
paper_data_subdir: paper-data # 상주 paper 데이터 잎 부모(<종목> 잎) — report.json 이 아직 없을 때 bootproof 종목으로 잎을 찾는다
# pid 파일의 pid 가 그 프로세스인지 — /proc/<pid>/cmdline 에 이 문자열이 있어야 살아 있다고 본다
# (pid 재사용 방지). 런타임은 `python -c '…from tos_runtime.compose.cli import main…'`,
# 드라이버는 `~/.config/kis-probes/tos_paper_session.py` 로 뜬다.
paper_runtime_cmdline_needle: tos_runtime
paper_driver_cmdline_needle: tos_paper_session

# stale 거절 허용치 — #931 운영자 지시(2026-10-23). 판정하는 수는 M5 ①:
#   m5_post_boot_consumed_ids_with_a_present_value_refused_as_unknown / post_boot_consumed_ids
#   (session_inputs.consumed_field_states 정의 그대로 — 값을 쥐고도 UNKNOWN 으로 거절된
#   post-boot 소비 봉). 이 비율이 값을 넘으면 종료된 세션은 «막힘», 진행 중 세션은 «확인».
# 이 값과 별개로, stale 이 아닌 사유는 1건이라도 «막힘»이다 — TIME_NOT_ADMITTED 가 아닌
# 보류 사유와, MARKETFEED_FIELD_REFUSED 의 stale 이 아닌 거절 사유.
stale_refusal_ratio_max: 0.005

# 생산자 지연(as_of − 분 마감) 백분위. nearest-rank.
latency_percentiles: [50, 90]

# 최근 N 개 세션 날짜를 한 줄씩 보여 준다(§2-1 «연속 10 거래일» 을 한눈에).
history_days: 10
