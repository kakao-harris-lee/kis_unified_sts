# config/tos_cp3_b3.yaml — 장후 B3 대조 자동 실행 설정
#
# 로드맵: docs/plans/2026-10-22-tos-rescope-plan.md §2-1 «장후 B3 대조에서
# unresolved = 0, 설명 안 되는 divergence 0». 그 문장을 재는 수는
# `<session>/b3/report/summary.json` 에만 있고, 그 파일을 쓰는 것은
# tools/tos_cp3/diff_decisions.py 하나다.
#
# 이 파일을 읽는 것: tools/tos_cp3/post_session_b3.py (세션 러너 step 14 가 호출).
# 수동 절차 여섯 줄은 docs/runbooks/tos-paper-boot-history.md §7.2-d 에 있고,
# 자동 단계는 그 여섯 줄을 **그대로 서브프로세스로** 돌린다 — 계산을 다시 구현하지
# 않는다.

# 끄는 스위치. false 면 세션은 그대로 가고 b3/status.json 에 verdict: skipped 가
# 남는다(대조 결과가 «없음» 인지 «끄여 있었다» 인지 상태판이 가를 수 있게).
enabled: true

# B3 가 유효한 시장. 레거시 Setup D 리플레이(B1a·B2)는 선물 프레임을 읽으므로
# stock 목 주문 트리(PR-3a) 세션에서는 돌리지 않는다 — 돌리면 거부가 아니라
# «설명 안 되는 차이» 로 나온다.
markets: ["futures"]

# 세션 디렉터리 아래 산출물 디렉터리 이름. 상태판(tools/tos_cp3/status_board.py)이
# `<session>/b3/report/summary.json` 을 읽으므로 이 값은 그쪽과 같아야 한다.
subdir: "b3"

# B1a·B2 가 읽는 레거시 Setup D 전략 YAML(모든 임계값·창의 출처). 저장소 루트
# 기준 상대 경로다. 방향(LONG/SHORT)별로 갈라지지 않는다 — 레거시 경로가 양쪽
# fade 를 다 내고, 방향은 B1b 쪽 렌더된 전략이 결정한다.
legacy_strategy_yaml: "config/strategies/futures/setup_d_vwap_reversion.yaml"

# 여섯 단계 전체의 벽시계 예산(초). 각 서브프로세스는 «남은 시간» 을 타임아웃으로
# 받으므로 전체가 이 값을 넘지 못한다. 고른 값이 아니라 실측에서 왔다 —
# TOTAL_TIMEOUT_MEASUREMENT 참조. 러너의 바깥 ceiling(CP3_B3_CEILING_S 기본값)보다
# 작아야 하고, tests/tools/test_cp3_post_session_b3.py 가 그 관계를 고정한다.
total_timeout_s: 480
