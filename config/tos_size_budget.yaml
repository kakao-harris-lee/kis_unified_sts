    재이관됨 — 아래 records.py 항목 및 2026-09-11 LOW-1 노트 참고. 이 문단은 K-1
    당시의 실제 이력이라 그대로 둔다). K-3(``step`` 필수화)·K-4(item 6/12 문언
    재작성)·K-5(SendSeal docstring 정정) 는 같은 파일에서 순증감 없이 문언만
    바뀌었다(측정치 불변).
    2026-09-11 독립 리뷰 라운드 #1 처분(MEDIUM-2/MEDIUM-3) — measured 1844→1849(+5).
    item 6/12 UNKNOWN 사유 문언을 "caller derives"(단정) → "caller is responsible for
    deriving"(책임 서술)로 재작성(커널은 `bool | None` 만 보고 출처를 검증할 수
    없음) · item 12 SATISFIED 사유에 venue_session_account_facts_current 가
    여전히 operator attestation 임을 알리는 절 추가(그 필드의 UNKNOWN 분기는 이미
    정직했으나 SATISFIED 분기만 그 사실을 누락하고 있었음).
    2026-09-12 kernel round #3 K-2(§2 결정 4) — measured 1849→1827(-22).
    ``_check_venue_generations`` 의 전체 판정 본문(약 34줄)이 신규
