    축약(아래 ``__call__`` 항목 참고 — 순감소 방향이나 신규 step 배선이
    net 증가로 남음).
    2026-09-11 kernel round #2 K-1 mesh 분리(§2 결정 1) — measured 2007→1844(-163).
