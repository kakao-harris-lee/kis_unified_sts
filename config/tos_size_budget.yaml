    POTENTIALLY_LIVE_OBSERVED→POTENTIALLY_LIVE_TRANSITION(17) · 신규
    NETWORK_CALL_ENTERED(step 18 진입 직전 write-ahead 마크, send_once 직전
    기록)→NETWORK_CALL(18) · EGRESS_RESULT_RECORDED/UNCERTAIN_SEND→
    EVIDENCE_RECORD(19)); SEND_REFUSED 는 halt 사이트마다 실제로 실패한
    step 을 개별 전달(_halt 의 step 이 이제 필수 키워드 인자). 신규
