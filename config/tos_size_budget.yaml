# config/tos_size_budget.yaml — tos kernel module/function size budget (Phase 1 작업 6)
#
# 검사기: tools/tos_size_budget.py · 테스트: tests/tools/test_tos_size_budget.py
# 설계 근거: docs/plans/2026-09-07-tos-phase1-kernel-hard-gate-execution-plan.md §3
#
# 임계값은 설정값이다(CLAUDE.md 비협상: thresholds belong in config, not code).
# exceptions 등재는 면허가 아니라 가시성이다 — 분해는 Phase 1 범위 밖, 등재만 강제한다.
# expires_on 경과 = --check red (fail-closed). owner/decomposition_order/expires_on 은
# 운영자 조정 가능한 값이다.
#
# measured 는 등재 시점의 실측 스냅샷이지, 장식이 아니다 — 검사기의 class-(f)
# [measured-drift] 가 등재된 measured 를 대상의 현재 실측치와 대조해 어긋나면(증가든
# 감소든) --check red 를 낸다. 대상이 계속 자라도 measured 를 갱신하지 않으면 영원히
# green 인 구멍을 막는 래칫이다. measured 갱신은 항상 «의도적 재등재» —
# `python tools/tos_size_budget.py` (요약 모드)로 재측정한 값을 여기 손으로 옮겨 적을 것
# (독립 리뷰 M2, 2026-09-07 — 등재 당시 값이 이후 커밋들에서 실제로 드리프트했음을 실측).

module_max_lines: 1000
function_max_lines: 100

scope:
  - tos/src/tos
  # design #40 D1.3 item 5 (PROPOSED 2026-09-07, same-PR-as-ratification per
  # that document's §0) — the runtime shell's own source tree gets the same
  # module/function size discipline as the kernel from day one. No longer a
  # skeleton (120 tracked files under tos/runtime as of 2026-09-08's slice
  # #3 landing). It has registered exceptions of its own now — 3 of the 11
  # below are tos/runtime/src (the sentence here said "all 29 below are
  # tos/src/tos" until the 2026-11-13 S4 re-measure, by which time it had been
  # false for some time). An exception entry is added here the same way the
  # kernel's own were, if/when a runtime target genuinely needs one.
  - tos/runtime/src
  # CP-3 B1b (docs/plans/2026-10-07-tos-cp3-first-tenant-kickoff.md §3 B1b).
  # `tos/runtime/cp3` is a SIBLING of `tos/runtime/src`, deliberately outside
  # it: the paper release pin's `expected_code_digest` folds every `*.py` under
  # the two installed package roots (`tos/src/tos`, `tos/runtime/src/tos_runtime`)
  # and the resident paper session ABORTS on a mismatch, so B1b adds no bytes
  # there. Being outside also meant this budget never saw it — the 2026-10-08
  # independent review measured runner.py at 1,820 lines against the 1,000 cap
  # with three functions over 100, all invisible. Added to `scope` so the caps
  # are enforced, and the module was DECOMPOSED along its existing seams rather
  # than registering four day-one exceptions: this file's own header calls
  # registration "면허가 아니라 가시성", which is the right stance for inherited
  # code and the wrong one for code written this week. 0 exceptions below are
  # cp3's.
  - tos/runtime/cp3
  # CP-3 ③ 실시간 필드 생산자 (docs/plans/2026-10-10-tos-cp3-live-field-producer-plan.md
  # §3.5 「크기 예산 범위에 넣는다」). `tools/tos_cp3/live_producer` 는 레거시 측
  # (방화벽 밖)이라 `tos/src` · `tos/runtime/src` 와 같은 설치 패키지가 아니지만,
  # tenant 저널에 쓰는 코드이므로 커널·런타임과 같은 모듈/함수 크기 규율을 받는다.
  # tos/runtime/cp3 를 넣은 것과 같은 이유다 — 범위에 없으면 캡이 **보이지 않는다**
  # (2026-10-08 독립 리뷰가 runner.py 1,820 줄을 그렇게 찾았다). 착수 시점 위반 0 ·
  # 아래 exceptions 중 이 디렉터리의 것은 0 건.
  - tools/tos_cp3/live_producer

