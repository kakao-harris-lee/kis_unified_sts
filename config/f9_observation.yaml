# F-9 Gate 1 shadow observation — harvest targets and observation evidence.
#
# Read by scripts/ops/f9_observation_harvest.py. Nothing in that script hardcodes
# a service name, a container name, a log pattern, or a threshold; they all live
# here (CLAUDE.md: configuration-driven only).
#
# The session window is NOT here — it is read from
# config/market_schedule.yaml::market_schedule.futures.regular.{open,close}
# through shared/decision/context.py's loader (the one PR #668 added), so this
# file cannot drift from what the runtime believes the session is.
#
# WHY the `observed` / `blind` split exists: from 2026-09-17 00:00 to
# 2026-09-18 12:34 both monitor daemons were up with RestartCount=0 while
# consuming nothing (a vanished-stream NOGROUP loop, fixed in #739/#741). A row
# recorded on either day would have said "consumers: 4" and been wrong. "How
# many are running" is not "how many observed"; only a line a consumer emits
# when it really handles a message proves the second.

f9_observation:
  # Harvest destination: reports/f9-gate1/<KST date>/<service>.<HHMMSS>.log
  # (git-ignored; these files ARE the durable record — Redis streams carry a
  # 24h TTL and their entries vanish).
  report_root: "reports/f9-gate1"
  container_prefix: "kis_paper-"
  # KST clock time `docker logs --since` starts from. Before the 08:45 open so
  # a pre-open blind window is captured too.
  harvest_since: "08:00"
  # Blind timestamps closer together than this are reported as one window.
  # The dense blind signals repeat every 30-60s, so 300s merges a run without
  # merging two genuinely separate outages.
  blind_run_merge_seconds: 300
  # How long a consumer may go without proving it consumed before the silence
  # stops counting as liveness. A line only testifies to the instant it was
  # written: a harvest whose coverage brackets the session says "we watched",
  # never "it was working". Without this bound one surviving
  # `stream_message_processed` plus a startup and a shutdown banner — three
  # lines — rendered a whole session `consumed (COMPLETE)`. That was reachable
  # while `services/futures_monitor/daemon.py` ran its consume loop as an
  # unretrieved task whose death left `_status_loop` holding the process up;
  # both monitors now run one loop on `shared/streaming/stage.py`, so the
  # consume loop cannot die without ending the process. The bound stays: a
  # wedged handler and a silent upstream still reach the same silence.
  #
  # 1800s is a policy knob, not a measurement: long enough that a normal lull in
  # sparse shadow traffic does not trip it, short enough that a wedged consumer
  # is named for the same session rather than a week later. It bounds three
  # gaps — open to the first proof, between consecutive proofs, and the last
  # proof to the close — each of which must be at or under this value (a gap of
  # exactly 1800s passes).
  #
  # It applies only to services with `freshness_scored: true` (the default).
  # See futures-decision-engine below for why the producer is not one of them.
  #
  # NOTE: the idle path emits nothing at any log level today
  # (shared/streaming/stage.py: xreadgroup -> no messages -> post_poll ->
  # sleep(0) -> continue), so a genuinely quiet session trips this and reads
  # PARTIAL. That is the runbook's INERT-GATE CAVEAT applied to the observation
  # surface, and it stops being noise once the idle branch emits a heartbeat.
  observation_max_gap_seconds: 1800
  # Counters printed in the observation-log row's third column, in order.
  #
  # The first three are the pipeline funnel and narrow monotonically:
  # candidates -> final -> fills. `dropped` is NOT a fourth funnel stage — it is
  # a correction term on `fills`, listed here rather than left in the JSON
  # sidecar because the reconciliation it exists for ("Gate 1 says 3 fills, the
  # ledger shows 2") happens while reading this row. See the `dropped` counter
  # under futures-monitor for what it does and does not bound.
  #
  # Adding it also makes a dropped message count toward `has_evidence`
  # (f9_observation_harvest.py: `any(self.counters.values())`), which only
  # matters on a day both holiday sources call closed. That is correct: a
  # dropped message means traffic arrived, so the day was not dead — the exact
  # case the NO_SESSION override exists for.
  row_counters: ["candidates", "final", "fills", "dropped"]

  services:
    - name: futures-decision-engine
      container: futures-decision-engine
      # The producer of candidates. Its "observation" is evaluating setups
      # against a live market context, not consuming a stream.
      role: producer
      # `docker logs` without --tail (or with a large one) stops at
      # 2026-09-09 23:30 on a container that survived the host reboots — see
      # the "--tail caveat" in docs/runbooks/futures-pipeline-cutover-f9.md.
      harvest_mode: tail
      harvest_tail: 900
      # NOT scored against observation_max_gap_seconds, and no per-service bound
      # is offered in its place. The reason is structural, not a complaint about
      # the number.
      #
      # A consumer's proof (`stream_message_processed`) is emitted once per
      # message in shared/streaming/stage.py, so it is traffic-driven: given
      # traffic, silence between two proofs is a real claim about the consumer.
      # This producer's proof is the setup-evaluation INFO below, and
      # shared/strategy/entry/setup_eval_publisher.py emits it once per *state
      # change* (setup_eval_throttle_key(name, outcome, reason)) — an unchanged
      # verdict logs nothing however many cycles run. Silence therefore carries
      # no information about liveness at any timescale, and a bound over it
      # would assert something the emitter cannot support.
      #
      # Measured on the two real harvests (08:45-15:45, in-session):
      #   2026-09-11  observed 24, worst gap 11235s | +blind 36, worst 11235s
      #   2026-09-18  observed 10, worst gap 17050s | +blind 20, worst 17050s
      # Widening the proof set to `observed + blind` moves the worst gap by zero
      # on both days — the blind set is sparser — so there is no pattern to
      # promote. A bound loose enough to pass (~18000s) would assert only
      # "proved itself once in some five-hour window", i.e. <=2 proofs per
      # session, fitted to one sample it clears by 5%. The zero-proof case it
      # looks like it guards is already caught: `not observed` -> no_evidence.
      #
      # 09-11 looks denser only because 374 of its 422 in-session lines are the
      # per-cycle `prev_close: no daily bar data` WARNING that PR #668 removed.
      # 09-18 — 21 timestamped lines across seven hours, including one 4h44m
      # stretch emitting nothing — is the current shape of a healthy producer.
      #
      # The fix is an emission, not a threshold: this producer needs its own
      # liveness line. A heartbeat in shared/streaming/stage.py's idle branch
      # does NOT reach it — services/decision_engine does not go through
      # stage.py at all.
      #
      # Exempt from SCORING, never from DISCLOSURE. A day whose every service
      # consumed but whose exempt service went silent past the bound reads
      # `LIVENESS_UNVERIFIED`, not `COMPLETE`, and the row quotes the reason
      # below — otherwise a producer with one 08:46 evaluation and no line for
      # the next six hours fifty-nine minutes rendered `4/4 consumed
      # (COMPLETE)` with the counts bare.
      freshness_scored: false
      freshness_unscored_reason: >-
        proof is logged once per setup-eval state change, not per cycle, so
        silence cannot be told from a dead daemon
      observed:
        # One line per setup-evaluation state change: proof the daemon had a
        # market context and ran the setup against it.
        - '\[setup_[a-z_0-9]+\] (signal [a-z]+|no signal this cycle): '
      blind:
        # Checked BEFORE `observed`, so a reject whose reason is "I had no
        # input" counts as blindness, not as an evaluation.
        - '\[setup_[a-z_0-9]+\] no signal this cycle: (no_market_context|no_vwap|no_prev_close)\b'
        # Emitted every cycle while the tick feed is stale — the dense signal
        # that gives a blind window its edges.
        - 'Indicator data stale for \S+ \(\d+s since last tick'
      counters:
        candidates:
          pattern: 'event=signal_published\b'

    - name: futures-risk-filter
      container: futures-risk-filter
      role: consumer
      harvest_mode: since
      observed:
        - 'event=stream_message_processed .*\bconsumer_group=risk_filter\b'
      blind: &stream_consumer_blind
        - 'event=monitor_stream_read_error\b'
        - 'event=tick_stream_read_error\b'
        - 'event=consumer_group_ensure_failed\b'
        # The group was GONE and had to be recreated: whatever was published
        # while it was missing never reached this consumer. This is the exact
        # 2026-09-17 / 09-18 signature. Both spellings are listed because the
        # harvested logs of that window predate PR #740's structured wording.
        - 'event=consumer_group_recovered\b'
        - 'consumer group missing; recreated\b'
        - 'xreadgroup error; sleeping'
      counters:
        # The runbook's de-duplication rule: a redelivered candidate logs a
        # fresh verdict under the SAME msg_id, so the raw count overstates
        # passes. Keep the last verdict per msg_id and count the passes.
        final:
          pattern: 'risk_filter verdict=(?P<state>passed|rejected) msg_id=(?P<key>\S+)'
          keep_last_per_key: true
          count_state: "passed"

    - name: futures-order-router
      container: futures-order-router
      role: consumer
      harvest_mode: since
      observed:
        - 'event=stream_message_processed .*\bconsumer_group=order_router\b'
      blind: *stream_consumer_blind

    - name: futures-monitor
      container: futures-monitor
      role: consumer
      harvest_mode: since
      # INSTRUMENTATION BOUNDARY, 2026-09-23 (PR #776). This daemon moved from a
      # hand-rolled consume loop onto shared/streaming/stage.py's
      # MultiStreamStage, and what it emits changed with it. `reports/f9-gate1/`
      # is the durable record — Redis streams carry a 24h TTL — so a session
      # re-scoring an old day is reading logs written by a different daemon.
      # Three facts, in the order they will bite:
      #
      # 1. `fills: 0` ON EVERY PRE-DEPLOY DAY IS A STRUCTURAL ZERO, NOT A
      #    MEASUREMENT. The counter below reads a line the old loop never
      #    emitted, so the number had no emitter behind it. Do not quote a
      #    pre-deploy day as "0 shadow fills observed"; it is a null result. A
      #    zero looks like data, which is why this one misleads.
      # 2. Pre-deploy day directories hold ZERO `stream_message_processed`
      #    lines, and the `observed` pattern below is unchanged, so re-scoring
      #    an old day returns the identical verdict it returned before — there
      #    is no inflation hazard. The hazard is interpretive: that verdict
      #    reads as a daemon health problem when it was an instrumentation gap.
      # 3. BLIND DETECTION IS CONTINUOUS ACROSS THE BOUNDARY and needs no
      #    caveat: pre-deploy days carry `event=monitor_stream_read_error`,
      #    post-deploy days `xreadgroup error; sleeping`, and the shared
      #    `&stream_consumer_blind` anchor lists both.
      #
      # THE BOUNDARY IS THE DEPLOY DATE, NOT THE MERGE DATE — the day the
      # container was recreated on the new image. `reports/f9-gate1/<KST date>/`
      # is date-keyed, so that single date is the whole discriminator.
      # deploy_date: TBD  # <- fill in when paper is redeployed; do not guess
      observed:
        - 'event=stream_message_processed .*\bconsumer_group=futures_monitor\b'
      blind: *stream_consumer_blind
      counters:
        # Every shadow fill reaches the ledger through this consumer, so the
        # fill count and the monitor's proof-of-consumption are the same line.
        # That is why a blind monitor cannot report "0 fills" as a measurement.
        #
        # TWO KNOWN DEFECTS IN THIS COUNT, both owned by step 3 of
        # docs/plans/2026-09-19-stream-consumer-liveness-and-monitor-dedup-design.md,
        # and both to be closed with issue #767 (same family: the count reads
        # one line and ignores what the next one says about it).
        #
        # 1. STRUCTURAL ZERO BEFORE PR #776 IS DEPLOYED. The hand-rolled loop
        #    never emitted `stream_message_processed` at all, so every date
        #    directory harvested before the deploy carries `fills: 0` with no
        #    emitter behind it. That is not "no shadow fills observed"; it is
        #    "nothing could have been counted". The boundary is the DEPLOY date
        #    (the day the container was recreated on the new image), not the
        #    merge date, because the report tree is keyed by KST date.
        #
        # 2. OVER-COUNT AFTER IT IS. services/futures_monitor/daemon.py's
        #    handle_message catches a raising handler, logs
        #    `stream_message_dropped`, and returns True so the framework ACKs —
        #    deliberately, to preserve drop-and-continue. The stage then emits
        #    `stream_message_processed ack=true` for that same msg_id, and this
        #    pattern counts it. A fill that was never processed therefore
        #    inflates a number Gate 1 reports as a measurement. The evidence to
        #    correct it is in the same harvest (an ERROR-level
        #    `stream_message_dropped` carrying the same msg_id and stream), but
        #    subtracting it needs msg_id correlation the harvester does not do
        #    yet — which is exactly the feature #767 needs. Do not "fix" this by
        #    changing the catch: re-raising would make the daemon die on the
        #    first malformed record, trading one bad count for total blindness.
        #
        #    Until then `dropped` below REPORTS the overcount instead of letting
        #    it hide inside `fills`. It is an upper bound on the correction, not
        #    the correction: it counts drops on both input streams, so a dropped
        #    *signal* inflates it without having inflated `fills`. That is the
        #    safe direction — it can only make a reconciler look, never stop
        #    them looking. Without it, an overcounted fill is indistinguishable
        #    from a correctly consumed one: Gate 1 reports 3 fills, the ledger
        #    shows 2 trades, and nothing in the row suggests the counter.
        fills:
          pattern: 'event=stream_message_processed stream=order\.fill\.futures\.shadow\b'
        dropped:
          pattern: 'event=stream_message_dropped\b'

    - name: trader-futures
      container: trader-futures
      # Harvested for the row's "Orchestrator (ledger)" column. NOT part of the
      # decoupled observation surface, so it is never scored in the verdict.
      role: reference
      harvest_mode: since

  # Read live at run time, recorded in the JSON sidecar under `point_in_time`,
  # and NEVER used to verdict a day: Redis streams expire after 24h, so none of
  # this is reconstructible for a past session. The verdict comes only from the
  # harvested files above.
  point_in_time:
    redis_url_env: "REDIS_URL"
    redis_url_default: "redis://localhost:6379/1"
    tick_stream: "raw_data"
    daily_reference_key: "futures:daily_reference:{symbol}"
    # Trading symbol for the daily_reference lookup, taken from the harvested
    # logs so a past-date run still names the right key.
    symbol_pattern: '\bsymbol=(A[0-9]{5})\b'
    consumer_groups:
      - stream: "signal.candidate.futures.shadow"
        group: "risk_filter"
      - stream: "signal.final.futures.shadow"
        group: "order_router"
      - stream: "order.fill.futures.shadow"
        group: "futures_monitor"
