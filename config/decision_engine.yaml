# Decision Engine configuration — services/decision_engine consumer-side wiring.
#
# This file does NOT hold Setup A/C/D entry parameters. The decision_engine's
# setup roster and every setup threshold come from
# `config/strategies/futures/<registry_name>.yaml` (`strategy.enabled` selects
# the roster, `strategy.entry.params` supplies the parameters) — the same files
# the monolithic orchestrator's Setup adapters read, so both runtimes trade one
# operating point. The `setup_a_gap_reversion` / `setup_c_event_reaction` /
# `setup_d_vwap_reversion` sections that used to live here were dead config: no
# code loaded them and their values had drifted from the deployed strategy YAML.
# See docs/plans/2026-09-08-setup-d-decoupled-port.md §0-2 / §3-A.

# services/decision_engine consumer-side wiring for the shared market-risk
# ENTRY gate (unified roadmap Phase 2D, §5.2 track C). The gate itself —
# mode, reaction matrix, staleness bound, Redis key — lives in
# config/market_risk_gate.yaml; THAT file's `mode` is the single
# off/shadow/enforce switch. This section only controls how the decision_engine
# daemon interprets the gate's shadow-mode output; mirrors
# config/stock_market_risk_gate.yaml for the stock M4-P pipeline.
market_risk_gate:
  # Shadow-mode would-block observations repeat every eval cycle (~60s tick)
  # for as long as the band holds; log at most once per interval per reason
  # (shared.risk.log_throttle.ReasonLogThrottle, same pattern as the stock
  # side's would_block_log_interval_seconds).
  would_block_log_interval_seconds: 300.0
