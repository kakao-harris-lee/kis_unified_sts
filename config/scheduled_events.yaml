# Macro event calendar — updated manually at the start of each month.
# impact_tier: 1 = top tier (FOMC, CPI, NFP), 2 = medium (BOK, PPI), 3 = minor
# scheduled_at: UTC ISO 8601 (append Z). KST = UTC+9.
#
# TIMING SEMANTICS FOR SETUP C
# ──────────────────────────────────────────────────────────────────────────────
# Setup C fires when scheduled_at <= ctx.now (KST) AND elapsed < window_minutes
# (default 15 min). ctx.now is the live tick timestamp during the KR session
# 09:00–15:45 KST (= 00:00–06:45 UTC).
#
# Events that CAN fire Setup C (KST-session-time):
#   BOK rate decisions      10:00 KST = 01:00 UTC  (in-session)
#   China PMI/NBS data      10:30 KST = 01:30 UTC  (in-session)
#   KOSPI200 rebalance eff  15:00 KST = 06:00 UTC  (in-session, close window)
#   KR CPI (some years)     08:00 KST = 23:00 UTC prev — within 15-min gap window at 09:00
#
# Events that CANNOT fire Setup C (fire outside KR session):
#   FOMC rate decision      03:00–05:00 KST (pre-session)
#   US CPI                  22:30 KST next day (post-session)
#   US NFP                  22:30 KST next day (post-session)
#   → These are retained for operator reference and Setup A gap context only.
#
# Sources (all entries dated 2026-08 onward were transcribed from these):
#   BOK:          bok.or.kr annual "금융통화위원회 정기회의 개최 예정일정" press
#                 release. 8 rate-decision meetings/yr. The BOK does not publish an
#                 official statement minute; 10:00 KST is this repo's convention.
#   China NBS:    stats.gov.cn "主要统计信息发布日程表" — 采购经理指数月度报告,
#                 last day of month at 09:30 Beijing (CST=UTC+8) = 10:30 KST.
#                 NOTE: entries before 2026-08 used an inherited ~09:00 KST
#                 approximation; only 2026-08+ entries carry the sourced 09:30 CST.
#   KOSPI200 rebalance: KRX regular review is SEMI-ANNUAL (June + December), not
#                 quarterly. Effective after the close of the reflection date.
#                 There is no Mar/Sep rebalance — earlier Mar/Sep entries are stale.
#   FOMC:         federalreserve.gov/monetarypolicy/fomccalendars.htm
#                 Statement released 14:00 ET on the 2nd day of each meeting.
#   US CPI:       bls.gov/schedule/news_release/cpi.htm (8:30 ET)
#   US NFP:       bls.gov/schedule/news_release/empsit.htm (8:30 ET)
#                 8:30 EDT = 12:30 UTC = 21:30 KST (Mar–Oct)
#                 8:30 EST = 13:30 UTC = 22:30 KST (Nov–Feb)
#   KR CPI:       kostat.go.kr 「물가, 고용, 산업활동동향 보도계획」 annual PDF.
#                 Released 08:00 KST, typically the 2nd–6th of the FOLLOWING month.
#                 NOTE: the earlier "last business day of prior month" rule was an
#                 approximation; 2026-08+ entries use the published KOSTAT dates.
# ──────────────────────────────────────────────────────────────────────────────

