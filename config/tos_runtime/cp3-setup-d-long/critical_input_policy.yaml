# =============================================================================
# critical_input_policy.yaml — CP-3 tenant (Setup D / LONG) **필드 선언**
# =============================================================================
# 이 파일은 상주 `config/tos_runtime/paper/` 의 같은 파일의 사본이 **아니다** — 그
# 파일은 부팅 증명 픽스처(`bootproof_band` 가 읽는 세 필드)이고, 이 파일은 CP-3 첫
# tenant 전략(`strategies/setup_d_long.strategy.yaml`)의 상류 필드 **열다섯**을 선언한다.
#
# 출처: docs/plans/2026-10-07-tos-cp3-first-tenant-kickoff.md §5 1 (「새 필드는 **tenant
#       설정 트리**의 `critical_input_policy.yaml` 에 다섯 값(unit/scale/multiplier/sign/
#       max_age_ms)과 출처를 적어 선언한다 — 상주 `paper` 트리는 건드리지 않는다」) ·
#       §5 3 ② · 운영자 승인 2026-10-07(결정 1·4·5·6).
#
# 로더: tos_runtime.marketfeed.policy.load_critical_input_policy
# 원본 템플릿: tos/runtime/config/critical_input_policy.example.yaml
#
# ── `max_age_ms` ×15 = 800 — 「운영자 결정 2026-10-09: 800 ms (= 커널 시간 예산 1000 − Σ지연 200)」 · 등급 M ──
#
# **운영자 결정 2026-10-09 (대화): 「max_age_ms : 800ms 로 정해」.** 적힌 수는 커널의 시간
# 수용 예산과 **같은 수**다: `time.yaml::MAX_time_conservative_freshness_age_ms` **1000** 에서
# `Σdelay_bounds`(`tos_runtime/marketfeed/time_projection.py` 의 `_DELAY_BOUND_FIELDS` 네 항
# × 50 = **200**)를 뺀 **800 ms**. 같은 트리 `marketfeed.yaml` 헤더가 같은 도출을 적는다.
# 종전 판은 열다섯 전부 `null` 이었고 그래서 **이 파일이 로드되지 않았다**(로더가 `null`
# `max_age_ms` 를 거부한다). 그 fail-closed 상태는 2026-10-09 에 닫혔고, 이 판은 그때 적은
# 180000 을 **폐기하고** 운영자가 정한 800 으로 바꾼 것이다(아래 「연혁」).
#
# ── 등급 M — 운영자·서버에서만 산출 가능(수동) ──────────────────────────────────
# 등급 어휘는 `docs/plans/2026-09-12-tos-operator-value-proposals.md:4` 다. **M** 인 이유는
# 나머지 셋이 이 값에 대해 **거짓 진술**이기 때문이다:
#   * **A 아님** — VER-002 에 이 키의 APPROVED 좌표가 없다. 산술의 두 항(1000 · 50×4)은
#     A 지만 등급은 **키를 따라가지 산술의 입력을 따라가지 않는다**. 제안표
#     `docs/plans/2026-09-18-tos-config-value-proposal.md` 에도 이 키 행이 없다(상위 계획
#     §7.8 A-5: 「신선도 한도 — 안전 값이다. 그래서 채택하지 않았다」).
#   * **B 아님** — 공식 문서 근거도 측정 근거도 없다. ③ 생산자가 아직 없으므로 잴 발행
#     지연 자체가 없다.
#   * **C 아님** — C 는 개발 측 보수 제안을 뜻하는데, 개발 측 제안은 180000 이었고 같은
#     헤더가 800 을 「현행 ③ 의미론에서는 성립하지 않는 자리수」로 적었다. 그 수를 개발 측
#     제안이라고 부르면 거짓이다. 800 은 보수 여유가 아니라 커널 예산의 **천장**이기도 하다.
# ⚠ **M 을 과대 주장하지 않는다.** 800 이라는 **수 자체**는 저장소 안에서 도출된다
# (1000 − 200; `tos/runtime/tests/compose/test_deploy_policies.py` 가 이 트리의 `time.yaml`
# 에서 다시 계산해 이 열다섯과 대조한다). 운영자에게서만 나온 것은 **이 키를 그 예산에
# 결속한다는 결정**이고, 그 결정이 아래 ③ 의무를 만든다.
#
# ── 구속 결과: ③ 은 저널 append 시각을 as_of_ms 로 찍어야 한다 ──────────────────
# `max_age_ms` 와 커널 시간 경로는 **같은 양**을 잰다 —
# `tos_runtime/marketfeed/snapshot.py::_derive_field_state` 의 `if now_ms - as_of_ms >
# spec.max_age_ms: return FieldState.UNKNOWN, "stale"` 와 `marketfeed/time_projection.py` 의
# `source_age = wall_clock_now() - as_of`. 그러므로 **현행 B1a 의미론에서는 열다섯 전부
# STALE 이다**: `as_of_ms` 가 봉의 **라벨(OPEN)** 이고(`produce_fields.derive_as_of_ms`
# 독스트링: 「Epoch milliseconds of the bar's LABELLED minute. **The label, not label+60s**」)
# B1a 가 쓰는 봉은 1분이므로(`derive_raw_event_id`: `<symbol>:1m:<...>`) 관측이 가질 수 있는
# **최소** 나이가 60,000 ms 다. 60,000 > 800 이므로 `_derive_field_state` 가 필드마다
# `(UNKNOWN, "stale")` 를 돌려주고, 커널의 ∅/UNKNOWN 바닥이 그 키들을 떨어뜨려
# (`tos/src/tos/marketfeed/value.py`) R1 의 AND 가 거짓 → NO_ACTION, 송신 0 이다(fail-closed).
# → **그러므로 이 값은 ③ 에 대한 요구사항이다**: ③ 실시간 생산자는 상주 저널 수집기처럼
# 저널에 append 하는 시각을 `as_of_ms` 로 찍어야 한다(그 수집기는 「an honest source event
# time」을 찍는다 — `marketfeed/scheduler.py::_finalize_pending`). 라벨 스탬프 생산자는 이
# 트리를 **결코** 결정까지 끌고 가지 못하고, 그것은 한도를 올려서 고칠 수 있는 문제가
# **아니다** — 올리면 커널 시간 경로가 같은 관측을 같은 양으로 재서 STALE 로 거부한다.
# ③ 착지 시 이 셋이 **한 예산을 나눠 쓴다**: 이 키 ×15 · `poll_interval_ms` ·
# `journal_pass_allowance_ms`(저널 pacing 가드가 뒤 둘의 합을 같은 800 ms 에 댄다 —
# `compose/_marketfeed_wiring.py::_load_config_within_freshness_budget`).
#
# ── 180000 은 폐기됐다 (연혁) ───────────────────────────────────────────────────
# 2026-10-09 초판은 「출처가 없어도 설정이 필요하니 적용」 지시에 대해 **봉 주기에서**
# 3P = 180,000 을 도출해 적었다(등급 C): 라벨 T 의 봉은 T+1P 에 닫히고 T+2P 에 교체되므로
# 2P = 120,000 은 하한(infimum)이고 세 번째 P 가 발행·폴 지연 여유라는 논증이었다. 그 판은
# **파일이 로드되게 할 뿐** 시간 경로를 열지 못했고(같은 헤더가 그것을 「800 ms 예산의
# 75 배」로 적었다), 운영자 결정이 그 간극을 **예산 쪽으로** 닫았다.
#
# **보수 방향 = 작게.** 너무 작으면 필드가 `UNKNOWN` 이 되어 fail-closed 고, 너무 크면
# **진짜로 낡은 필드가 VALID 로 읽힌다** — 그쪽이 fail-OPEN 이다. 800 은 커널 예산을 넘지
# 않는 **가장 큰** 값이므로 이 방향으로 더 키울 수 없다: 키우면 커널이 거부할 관측을 이
# 로더만 VALID 로 읽는 비대칭이 된다.
# 상주 트리의 **600000 은 베껴 오지 않았다**: 그 근거(「렌더가 저널을 부팅 직전에
# 생성하므로 그 여유는 실제로 그 부팅 지연만 덮는다」)는 **배치 저널 부팅**에만 성립하고
# 이 tenant 의 생산자는 다른 모양이다. B1a 의 필드 lineage 도 unit/scale/multiplier/sign 은
# 적지만 `max_age_ms` 는 적지 **않으므로**(kickoff §5 3 ②, 의도된 차이 B1b-D3) 생산자 쪽에도
# 베껴 올 원천이 없다.
#
# ── 좌표 칸 없음 ────────────────────────────────────────────────────────────────
# 이 파일은 계좌·종목을 담지 않으므로 `scripts/tos/render_paper_config.py` 가 건드리지
# 않는다(상주 트리의 같은 파일과 같다).
# =============================================================================

# --- identity ---------------------------------------------------------------
# 제안표 §4.3 식별자 규칙(`tos-paper-<무엇>-g<세대>`, 세대 1)을 따른다. 상주 트리의
# `tos-paper-critical-input-bootproof-g1` 과 **다른 이름을 쓴다** — 내용이 사본이 아니고
# (세 픽스처 필드 vs 열다섯 tenant 필드), `bootproof` 라는 토큰이 이 문서에 대해
# 거짓이기 때문이다.
policy_id: "tos-paper-cp3-setup-d-long-critical-input-g1"
policy_version: "1.0.0"
policy_generation: 1

# 발행 스냅샷의 귀속 주체(tos.capsule.CriticalInputSnapshot.issuer_principal_id).
# 상주 트리의 같은 칸과 같은 꼴이고, 치환 대상이 아니므로 확정 리터럴이다.
issuer_principal_id: "tos-paper-cp3-setup-d-long-critical-input-issuer-g1"

# --- scope --------------------------------------------------------------
# `environment` — **`paper` 다.** kickoff §5 1 이 그 이유를 적는다: 로더는 이 토큰을
#   `--environment-label` 과 **대조하지 않으므로**(상주 트리 같은 파일 56–62행의 실측)
#   어긋나도 조용히 부팅하고 증거만 틀린 라벨을 단다. 그래서 이 트리의
#   `venue_constraint_policy.yaml::scope.environments` ·
#   `order_construction_policy.yaml` 이 선언한 `paper` 와 **같은 값**을 박는다
#   (compose 의 `_cross_check_scope` 가 그 둘끼리는 대조한다 →
#    `VenuePolicyScopeMismatch`).
#   ⚠ 이 토큰은 발행되는 모든 스냅샷·캡슐의 covered content 로 들어간다.
#   ⚠ 그러므로 `paper` 는 **환경 라벨**이고 tenant 식별자가 아니다 — 상주 세션과 이
#   tenant 는 같은 라벨 아래 **다른 data dir · 다른 설정 트리**로 돈다(결정 3).
#
# `decision_class` / `intended_use` — 상주 트리와 같은 조합(진입 결정).
environment: "paper"
decision_class: "entry"
intended_use: "entry-decision"

# --- admissible fields -------------------------------------------------
# tenant 전략이 읽는 필드와 B1b 러너가 봉마다 발행하는 필드의 합집합 = B1a 의
# `FIELD_ORDER` 열다섯(`tools/tos_cp3/produce_fields.py` FIELD_ORDER). 목록에 없는
# 필드는 커널의 UNKNOWN 바닥이 떨어뜨린다(tos/src/tos/marketfeed/value.py).
#
# 순서는 B1a 의 `FIELD_ORDER` 그대로다(앞 여섯은 봉 자체, 나머지는 파생 Setup D 입력).
#
# unit/scale/multiplier/sign 의 **출처는 B1a 의 필드 lineage** 이고, 그 lineage 는
# 이 파일이 쓰는 모양 그대로 적는다(`produce_fields._field_lineage` 독스트링: 「the
# unit/scale/multiplier triple in the shape `config/tos_runtime/paper/
# critical_input_policy.yaml` uses (a token for `scale`, a number for `multiplier`)」).
# 네 값은 **각각 별개의 안전 필드**이며 하나의 토큰으로 합치지 않는다
# (tos/src/tos/capsule/observation.py Mapping 독스트링).
#
#   * 가격 꼴 여섯(open/high/low/close/vwap/atr14 `_x100`) — unit `index_point` ·
#     scale `hundredths` · multiplier `100` · sign `unsigned`
#     (`produce_fields._price_field`; PRICE_SCALE=100, 양자화 half_up).
#   * `volume` — unit `contract` · scale `unit` · multiplier `1` · sign `unsigned`
#     (같은 파일 `volume` 항목; 이미 정수).
#   * `session_token` — unit `opaque_token` · scale `none` · multiplier `1` ·
#     sign `unsigned` (봉의 KST 날짜. 토큰은 불투명하게 둔다 — 장시간을 읽지 않는다).
#   * `z_x1000` — unit `atr` · scale `thousandths` · multiplier `1000` ·
#     sign **`signed`** (VWAP 괴리는 부호가 있다; 양자화 truncate_toward_zero. 진입
#     임계 `z_entry_max_x1000 = -1800` 이 이 부호·배율에 결속된다 —
#     `strategy_bindings.yaml`).
#   * 불린 여섯(hi_vol/stall_ok/reversal_ok/entry_window/vwap_reverted/eod) —
#     unit `bool` · scale `none` · multiplier `1` · sign `unsigned`
#     (`produce_fields._bool_field`; 양자화 exact).
#
# ⚠ `max_age_ms: 800` 은 열다섯 **전부 동일**하고, 그 이유도 선언이다: 열다섯이 모두
#   **같은 1분봉에서 같은 라벨 `as_of_ms` 로 한꺼번에 발행된다**(B1a 는 봉마다
#   `FIELD_ORDER` 전부를 한 레코드로 쓴다 — `produce_fields.FieldRecord`). 그러므로 필드별
#   수명 차이가 없고, 다른 값을 주면 같은 발행의 멤버들이 서로 다른 시각에 STALE 이 되는
#   **설명 없는 비대칭**이 된다. 값의 도출·등급·보수 방향은 위 헤더에 있다.
fields:
  # --- the bar itself (what B1b builds a tos.backtest.Bar from) --------------
  - field_key: "open_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "high_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "low_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "close_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "volume"
    unit: "contract"
    scale: "unit"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "session_token"
    unit: "opaque_token"
    scale: "none"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 800
  # --- derived Setup D inputs ----------------------------------------------
  - field_key: "vwap_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "atr14_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "z_x1000"
    unit: "atr"
    scale: "thousandths"
    multiplier: "1000"
    sign: "signed"
    max_age_ms: 800
  - field_key: "hi_vol"
    unit: "bool"
    scale: "none"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "stall_ok"
    unit: "bool"
    scale: "none"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "reversal_ok"
    unit: "bool"
    scale: "none"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 800
  - field_key: "entry_window"
    unit: "bool"
