# =============================================================================
# critical_input_policy.yaml — CP-3 tenant (Setup D / LONG) **필드 선언**
# =============================================================================
# 이 파일은 상주 `config/tos_runtime/paper/` 의 같은 파일의 사본이 **아니다** — 그
# 파일은 부팅 증명 픽스처(`bootproof_band` 가 읽는 세 필드)이고, 이 파일은 CP-3 첫
# tenant 전략(`strategies/setup_d_long.strategy.yaml`)의 상류 필드 **열다섯**을 선언한다.
#
# 출처: docs/plans/2026-10-07-tos-cp3-first-tenant-kickoff.md §5 1 (「새 필드는 **tenant
#       설정 트리**의 `critical_input_policy.yaml` 에 다섯 값(unit/scale/multiplier/sign/
#       max_age_ms)과 출처를 적어 선언한다 — 상주 `paper` 트리는 건드리지 않는다」) ·
#       §5 3 ② · 운영자 승인 2026-10-07(결정 1·4·5·6).
#
# 로더: tos_runtime.marketfeed.policy.load_critical_input_policy
# 원본 템플릿: tos/runtime/config/critical_input_policy.example.yaml
#
# ── `max_age_ms` ×15 = 180000 — 「운영자 지시 2026-10-09: 출처 없이 적용」 · 등급 C ──
#
# ⚠ **이 값에는 원천이 없다.** 운영자가 2026-10-09 에 「출처가 없어도 설정이 필요하니
# 적용」을 지시했고, 그래서 **지어낸 수가 아니라 도출한 수**를 적는다. 등급은 **C**
# (개발 측 보수 제안 — 근거 명시 · 서버 실측 후 하향 가능;
# `docs/plans/2026-09-12-tos-operator-value-proposals.md:4` 의 원천 등급 어휘).
# 종전 판은 열다섯 전부 `null` 이었고 그래서 **이 파일이 로드되지 않았다** — 로더가
# `null` `max_age_ms` 를 거부한다. 그 fail-closed 상태를 운영자 지시로 닫는다.
#
# **두 후보 출처는 여전히 값을 주지 못한다** — 그래서 등급이 A·B 가 아니고 C 다:
#   * 제안표 `docs/plans/2026-09-18-tos-config-value-proposal.md` 는 이 키에 행이 없다
#     (상위 계획 §7.8 A-5: 「특히 `critical_input_policy::fields[].max_age_ms` 는
#      신선도 한도 — 안전 값이다. 그래서 채택하지 않았다」).
#   * B1a(`tools/tos_cp3/produce_fields.py`)의 필드 lineage 는 unit/scale/multiplier/
#     sign 을 적지만 `max_age_ms` 는 적지 **않는다** — 백테스트는 주입된 시간 경계로
#     신선도를 판정하고 필드별 수명 소비자가 없다(kickoff §5 3 ②, 의도된 차이 B1b-D3).
# 상주 트리의 **600000 은 베껴 오지 않았다**: 그 근거(「렌더가 저널을 부팅 직전에
# 생성하므로 그 여유는 실제로 그 부팅 지연만 덮는다」)는 **배치 저널 부팅**에만 성립하고
# 이 tenant 의 생산자는 다른 모양이다.
#
# ── 도출 (실측 2026-10-09) ──────────────────────────────────────────────────────
# ① **봉 주기 P = 60,000 ms.** B1a 가 쓰는 유일한 봉은 1분봉이고 조인 키가 그것을
#    토큰으로 적는다 — `produce_fields.derive_raw_event_id`: `<symbol>:1m:<...>`.
# ② **`as_of_ms` 는 봉의 「라벨」 = 봉 시작(OPEN)이다.**
#    `produce_fields.derive_as_of_ms` 독스트링: 「Epoch milliseconds of the bar's
#    LABELLED minute. **The label, not label+60s**」 — 세션 필드(`entry_window`·`eod`)가
#    라벨로 계산되므로 봉 끝 스탬프는 그것들과 어긋난다는 이유다.
# ③ **런타임이 재는 나이는 `now_ms - as_of_ms` 이고 `now_ms` 는 실 시스템 벽시계다.**
#    `tos_runtime/marketfeed/snapshot.py::_derive_field_state`: `if now_ms - as_of_ms >
#    spec.max_age_ms: return FieldState.UNKNOWN, "stale"`; `now_ms` 는
#    `marketfeed/scheduler.py` 의 `self._time_service.wall_clock_now()` 다.
# ②+③ 이므로 **라벨 T 의 봉이 가질 수 있는 최소 나이는 1P** 다(T+1P 에야 봉이 닫힌다).
# 그 봉은 후속 봉이 발행되는 **T+2P 까지** 가장 신선한 진실이다. 따라서
#   * **2P = 120,000 은 하한(infimum)이지 안전값이 아니다** — 발행 지연이 0 일 때만
#     만족되고, 1 ms 라도 늦으면 교체 직전의 봉이 STALE 로 읽힌다. 그 모양은 이
#     저장소가 **이미 측정한 결함**이다(이슈 #807 · 같은 트리 `marketfeed.yaml` 헤더:
#     「패스 직후 도착한 관측은 언제나 STALE 이었고, 거부된 관측은 소비 처리되어
#     **재시도되지 않았다**」 — 리허설 18 건 중 7 건).
#   * 그래서 **세 번째 P 를 발행·폴 지연 여유로 둔다**: 3P = **180,000 ms**.
#     여유를 측정값으로 쓰지 않는 이유는 생산자가 없어서(③ 미착수) 측정할 것이 없고,
#     **같은 양(봉 주기)에서 파생하는 것이 숫자를 지어내지 않는 유일한 길**이기 때문이다.
#
# **보수 방향 = 작게.** 너무 작으면 필드가 `UNKNOWN` 이 되고 커널의 ∅/UNKNOWN 바닥이
# 그 키를 떨어뜨려(`tos/src/tos/marketfeed/value.py`) R1 의 AND 가 거짓 → NO_ACTION,
# 송신 0 이다(fail-closed). 너무 크면 **진짜로 낡은 필드가 VALID 로 읽힌다** — 그쪽이
# fail-OPEN 이다. 180,000 은 정상 운전에서 만족 가능한 **가장 작은 봉-주기 배수**다.
#
# ⚠⚠ **이 값이 송신을 열지 않는다 — 그리고 이 값은 구속 제약도 아니다(실측).**
# 커널의 시간 수용 경로는 **같은 양**(`source_age = wall_clock_now() - as_of`,
# `marketfeed/time_projection.py:38`)을 `time.yaml::MAX_time_conservative_freshness_age_ms`
# **1000 ms** 에서 `Σdelay_bounds`(4×50 = 200)를 뺀 **800 ms** 예산에 댄다(같은 트리
# `marketfeed.yaml` 헤더의 도출). 라벨 스탬프 1분봉의 `source_age` 는 **≥ 60,000 ms**,
# 그 예산의 75 배다. 즉 `max_age_ms` 를 채우면 **이 파일이 로드될 뿐**이고 시간 경로는
# 여전히 STALE 로 읽는다. 「로드된다」를 「부팅하면 돈다」로 읽지 말 것.
#
# → **③ 실시간 생산자가 측정되면 이 값을 하향하거나 다시 도출한다.** 특히 ③ 이 상주
# 수집기처럼 **append 시각**을 `as_of_ms` 로 찍으면(저널 수집기는 「an honest source
# event time」을 찍는다 — `marketfeed/scheduler.py::_finalize_pending`) 올바른 한도는
# 180,000 이 아니라 위 800 ms 예산 자리수다. 그때 이 셋을 함께 다시 본다:
# 이 키 ×15 · `poll_interval_ms` · `journal_pass_allowance_ms`.
#
# ── 좌표 칸 없음 ────────────────────────────────────────────────────────────────
# 이 파일은 계좌·종목을 담지 않으므로 `scripts/tos/render_paper_config.py` 가 건드리지
# 않는다(상주 트리의 같은 파일과 같다).
# =============================================================================

# --- identity ---------------------------------------------------------------
# 제안표 §4.3 식별자 규칙(`tos-paper-<무엇>-g<세대>`, 세대 1)을 따른다. 상주 트리의
# `tos-paper-critical-input-bootproof-g1` 과 **다른 이름을 쓴다** — 내용이 사본이 아니고
# (세 픽스처 필드 vs 열다섯 tenant 필드), `bootproof` 라는 토큰이 이 문서에 대해
# 거짓이기 때문이다.
policy_id: "tos-paper-cp3-setup-d-long-critical-input-g1"
policy_version: "1.0.0"
policy_generation: 1

# 발행 스냅샷의 귀속 주체(tos.capsule.CriticalInputSnapshot.issuer_principal_id).
# 상주 트리의 같은 칸과 같은 꼴이고, 치환 대상이 아니므로 확정 리터럴이다.
issuer_principal_id: "tos-paper-cp3-setup-d-long-critical-input-issuer-g1"

# --- scope --------------------------------------------------------------
# `environment` — **`paper` 다.** kickoff §5 1 이 그 이유를 적는다: 로더는 이 토큰을
#   `--environment-label` 과 **대조하지 않으므로**(상주 트리 같은 파일 56–62행의 실측)
#   어긋나도 조용히 부팅하고 증거만 틀린 라벨을 단다. 그래서 이 트리의
#   `venue_constraint_policy.yaml::scope.environments` ·
#   `order_construction_policy.yaml` 이 선언한 `paper` 와 **같은 값**을 박는다
#   (compose 의 `_cross_check_scope` 가 그 둘끼리는 대조한다 →
#    `VenuePolicyScopeMismatch`).
#   ⚠ 이 토큰은 발행되는 모든 스냅샷·캡슐의 covered content 로 들어간다.
#   ⚠ 그러므로 `paper` 는 **환경 라벨**이고 tenant 식별자가 아니다 — 상주 세션과 이
#   tenant 는 같은 라벨 아래 **다른 data dir · 다른 설정 트리**로 돈다(결정 3).
#
# `decision_class` / `intended_use` — 상주 트리와 같은 조합(진입 결정).
environment: "paper"
decision_class: "entry"
intended_use: "entry-decision"

# --- admissible fields -------------------------------------------------
# tenant 전략이 읽는 필드와 B1b 러너가 봉마다 발행하는 필드의 합집합 = B1a 의
# `FIELD_ORDER` 열다섯(`tools/tos_cp3/produce_fields.py` FIELD_ORDER). 목록에 없는
# 필드는 커널의 UNKNOWN 바닥이 떨어뜨린다(tos/src/tos/marketfeed/value.py).
#
# 순서는 B1a 의 `FIELD_ORDER` 그대로다(앞 여섯은 봉 자체, 나머지는 파생 Setup D 입력).
#
# unit/scale/multiplier/sign 의 **출처는 B1a 의 필드 lineage** 이고, 그 lineage 는
# 이 파일이 쓰는 모양 그대로 적는다(`produce_fields._field_lineage` 독스트링: 「the
# unit/scale/multiplier triple in the shape `config/tos_runtime/paper/
# critical_input_policy.yaml` uses (a token for `scale`, a number for `multiplier`)」).
# 네 값은 **각각 별개의 안전 필드**이며 하나의 토큰으로 합치지 않는다
# (tos/src/tos/capsule/observation.py Mapping 독스트링).
#
#   * 가격 꼴 여섯(open/high/low/close/vwap/atr14 `_x100`) — unit `index_point` ·
#     scale `hundredths` · multiplier `100` · sign `unsigned`
#     (`produce_fields._price_field`; PRICE_SCALE=100, 양자화 half_up).
#   * `volume` — unit `contract` · scale `unit` · multiplier `1` · sign `unsigned`
#     (같은 파일 `volume` 항목; 이미 정수).
#   * `session_token` — unit `opaque_token` · scale `none` · multiplier `1` ·
#     sign `unsigned` (봉의 KST 날짜. 토큰은 불투명하게 둔다 — 장시간을 읽지 않는다).
#   * `z_x1000` — unit `atr` · scale `thousandths` · multiplier `1000` ·
#     sign **`signed`** (VWAP 괴리는 부호가 있다; 양자화 truncate_toward_zero. 진입
#     임계 `z_entry_max_x1000 = -1800` 이 이 부호·배율에 결속된다 —
#     `strategy_bindings.yaml`).
#   * 불린 여섯(hi_vol/stall_ok/reversal_ok/entry_window/vwap_reverted/eod) —
#     unit `bool` · scale `none` · multiplier `1` · sign `unsigned`
#     (`produce_fields._bool_field`; 양자화 exact).
#
# ⚠ `max_age_ms: 180000` 은 열다섯 **전부 동일**하고, 그 이유도 선언이다: 열다섯이 모두
#   **같은 1분봉에서 같은 라벨 `as_of_ms` 로 한꺼번에 발행된다**(B1a 는 봉마다
#   `FIELD_ORDER` 전부를 한 레코드로 쓴다 — `produce_fields.FieldRecord`). 그러므로 필드별
#   수명 차이가 없고, 다른 값을 주면 같은 발행의 멤버들이 서로 다른 시각에 STALE 이 되는
#   **설명 없는 비대칭**이 된다. 값의 도출·등급·보수 방향은 위 헤더에 있다.
fields:
  # --- the bar itself (what B1b builds a tos.backtest.Bar from) --------------
  - field_key: "open_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "high_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "low_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "close_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "volume"
    unit: "contract"
    scale: "unit"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "session_token"
    unit: "opaque_token"
    scale: "none"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 180000
  # --- derived Setup D inputs ----------------------------------------------
  - field_key: "vwap_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "atr14_x100"
    unit: "index_point"
    scale: "hundredths"
    multiplier: "100"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "z_x1000"
    unit: "atr"
    scale: "thousandths"
    multiplier: "1000"
    sign: "signed"
    max_age_ms: 180000
  - field_key: "hi_vol"
    unit: "bool"
    scale: "none"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "stall_ok"
    unit: "bool"
    scale: "none"
    multiplier: "1"
    sign: "unsigned"
    max_age_ms: 180000
  - field_key: "reversal_ok"
    unit: "bool"
    scale: "none"
