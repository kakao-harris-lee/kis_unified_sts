# =============================================================================
# monitor_coverage.yaml — TOS 배포 승인값 (W-A / A-2)
# =============================================================================
# 승인 출처: operator 2026-09-18 설정값 승인 · 2026-09-23 제안표 채택 확정 ·
#            docs/plans/2026-09-18-tos-config-value-proposal.md §4.3 · §6 5항
#
# 제안표 §0 — 이 파일이 무엇이고 무엇이 아닌가:
#   **이것은 첫 부팅 프로파일이지 운영 안전 태세가 아니다.** 여기 적힌 값들은
#   `run` 이 로컬 헤르메틱 환경에서 구동하도록 만드는 값이다. 구조적으로
#   유효하고 서로 정합하지만, **실 자금·실 주문을 전제한 안전 한도가 아니다.**
#   실 배포 태세는 별도 승인 사안이며, 이 표를 근거로 그 승인을 대신할 수 없다.
#
# 2026-11-13 (S2-a, docs/plans/2026-11-13-tos-code-halving-plan.md): 커널
# `tos.stm` 커버리지 매니페스트와 verify 10 항목이 제거되면서 이 파일은 축소판
# 모니터가 실제로 쓰는 두 경계값만 남겼다. `manifest`/`items` 블록(세 의무의
# `*_present` 운영자 선언)과 `healthy_time_states` 는 삭제했다 —
# 시간 건강은 TRUSTWORTHY_TIME 차원이 이미 판정한다.
#
# 원본 템플릿: tos/runtime/config/monitor_coverage.example.yaml
# 로더: tos_runtime.safety.monitoring.MonitoringService
# =============================================================================
coverage:
  # MONITORING 차원의 `bound_generation` 으로 찍힌다. 제안표 §4.3 식별자 규칙:
  # `*_generation` 은 1.
  coverage_generation: 1
  bounds:
    # 증거 꼬리가 이 시간 넘게 안 움직이면 정체로 본다(제안표 §4.3: 60s).
    max_evidence_tip_stall_ms: 60000
    # 미소비 inbox 행이 이 수를 넘으면 적체로 본다(제안표 §4.3: 100).
    max_inbox_unconsumed: 100
