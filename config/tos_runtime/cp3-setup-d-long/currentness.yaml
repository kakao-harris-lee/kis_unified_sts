# =============================================================================
# currentness.yaml — TOS paper 배포 승인값 (W-A / A-2)
# =============================================================================
# 승인 출처: operator 2026-09-18 설정값 승인 · 2026-09-23 제안표 채택 확정 ·
#            docs/plans/2026-09-18-tos-config-value-proposal.md §2.3 · §6 6항
#
# 제안표 §0 — 이 파일이 무엇이고 무엇이 아닌가:
#   **이것은 첫 부팅 프로파일이지 운영 안전 태세가 아니다.** 여기 적힌 값들은
#   `run` 이 로컬 헤르메틱 환경에서 구동하도록 만드는 값이다. 구조적으로
#   유효하고 서로 정합하지만, **실 자금·실 주문을 전제한 안전 한도가 아니다.**
#   실 배포 태세는 별도 승인 사안이며, 이 표를 근거로 그 승인을 대신할 수 없다.
#
# 원본 템플릿: tos/runtime/config/currentness.example.yaml
# 로더: tos_runtime.currentness.config.load_currentness_config
#       (currentness/config.py:80)
# 호출부: compose/_currentness_wiring.py:205 (무조건)
# =============================================================================

# [A] ⚠ 제안표 §2.3 — VER-002 L301-302 `value_ms: 500`.
#
# ⚠ **이것이 제안표에서 가장 약한 [A] 다.** 그 VER-002 항목은
# `RECHECK: APPROVE after the fenced egress journal and broker transport are
# implemented` 이고 `rationale: "MEASURE"` 다 — **아직 측정되지 않은 값**이다.
# `applicable_scope: non-live-test` 이고 **이 배포가 정확히 non-live-test 다.**
# 그 범위에서 전사하되, 이 값은 「승인된 측정값」이 아니라
# **「측정 대기 중인 잠정값」**으로 기록한다. 펜스된 egress 저널 + 브로커
# 트랜스포트가 구현되면 실측으로 대체한다.
B_capability_claim_to_send: 500

# ==========================================================================
# 운영자 결정 2026-09-23: **「그대로 사용」** — 제안표 §6 6항이 「설계 판단 필요」로
# 남겨 둔 이 키를 **커널 `MANDATED_DIMENSION_FLOOR` 21키 전부를 명시 나열**하는
# 형태로 채운다.
#
# 추천값의 출처(지어낸 값이 아니다):
#   docs/plans/2026-09-12-tos-operator-value-proposals.md §2 `currentness.
#   required_dimensions` 행 — 「커널 `MANDATED_DIMENSION_FLOOR` 의 21 키 전부를
#   명시 나열(`tos/src/tos/cur/vocabulary.py` · `DimensionKey` 22 중 조건부
#   `RESTRICTED_LIVE_TRIAL` 제외 · 적용 시 `python -c "from tos.cur.vocabulary
#   import MANDATED_DIMENSION_FLOOR as F; print(sorted(k.value for k in F))"`
#   출력을 그대로 옮긴다)」 · 등급 C.
#   아래 21줄은 그 명령의 출력을 그대로 옮긴 것이다(2026-09-23 실행).
#   currentness.example.yaml 주석도 같은 형태를 기술한다 — 「a policy may require
#   more, never fewer」.
#
# ⚠ **제안표 §6 6항의 경고는 유효하며 여기 그대로 이월한다**:
#   「21개 MANDATED_DIMENSION_FLOOR 를 그대로 복사하면
#    `policy_covers_mandated_dimensions` 가 **항진명제**가 된다(과거 버그,
#    example 주석에 기록). floor 이상이어야 하되 **의미 있게 독립적으로 편집
#    가능한 선언**이어야 한다 — 설계 판단이 필요.」
#   즉 이 목록이 floor 와 같은 한, 그 술어가 참이라는 사실은 **이 배포가 실제로
#   모든 차원을 지배한다는 증거가 아니다.** 이것이 운영자 선언이라는 점이
#   유일한 의미이고(커널에서 재파생하면 그 의미마저 사라진다 — W3.1 MEDIUM-3),
#   한 줄을 지우면 `policy_covers_mandated_dimensions` 가 **정직하게 거짓**이
#   되어 부팅이 거부된다. 의미 있는 독립 선언(= floor 를 넘는 차원 추가)은
#   여전히 열린 설계 판단이다.
# ==========================================================================
required_dimensions:
  - ACTION_FLOW
  - AGGREGATE_RISK
  - COMMIT_LOG
  - CONSTRAINT
  - CONSTRUCTION
  - CONTEXT
  - CRITICAL_INPUT
  - CURRENTNESS_POLICY
  - DECISION_PROOF_INTENT
  - DEVIATION
  - EGRESS_IDENTITY
  - ENVIRONMENT_SCOPE
  - INCIDENT
  - MONITORING
  - POST_TRADE
  - RECOVERY
  - RELEASE
  - SAFETY_AUTHORITY
  - SAFETY_ENVELOPE_PROFILE
  - TRADING_APPROVAL
  - TRUSTWORTHY_TIME
