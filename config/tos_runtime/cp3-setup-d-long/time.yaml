# --- [A] VER-002 승인 전사 (제안표 §2.1) ---------------------------------
# 전부 tos-spec/src/part-1-foundation/verification/VERIFICATION-PROFILE-002.yaml.
# 승인 주체 operator (Bounds-Approver) · 재검토일 2027-01-29.

MAX_time_source_precision_ms: 50                  # VER-002 L1076 · APPROVED 2026-07-29
MAX_time_transport_and_queue_uncertainty_ms: 50   # VER-002 L1069 · APPROVED 2026-07-29
MAX_time_source_disagreement_ms: 50               # VER-002 L1071 · APPROVED 2026-07-29
MAX_clock_domain_conversion_uncertainty_ms: 50    # VER-002 L1070 · APPROVED 2026-07-29
MAX_future_timestamp_tolerance_ms: 50             # VER-002 L1074 · APPROVED 2026-07-29
MAX_time_source_sequence_gap_ms: 50               # VER-002 L1077 · APPROVED 2026-07-29
MAX_process_suspension_ms: 2000                   # VER-002 L1009 · APPROVED 2026-07-29
MAX_critical_input_consumer_receipt_age_ms: 1000  # VER-002 L1067 · APPROVED 2026-07-29
# VER-002 L1078 · APPROVED **2026-09-04** (UNCHK-024 처분 §4 도출 — Σ 지연 한도
# 200ms 보다 크고, 보수 방향은 LOWER).
MAX_time_conservative_freshness_age_ms: 1000

# --- [O] 운영자 판단 — 상위 원천이 없다 (제안표 §4.2) ---------------------

# VER-002 에 **키가 없다**(grep 0건). 로컬 단일 호스트에는 독립 시계 참조가
# 하나뿐이다 — 2 를 적으면 거짓이다. 실제 구성을 적는다.
# (time.example.yaml 주석: Phase 2 는 reference source KIND 를 정확히 하나
#  구현하며, 1 을 넘기면 이 패키지는 정직하게 TRUSTED 를 관측하지 못한다.)
MIN_time_independent_reference_count: 1

# VER-002 에 키가 없다. MAX_process_suspension_ms(2000, 승인됨)와 같은 자릿수로
# 맞춘다 — 프로세스 정지 한도보다 짧으면 정지 중 전송 결과를 못 기다린다.
MAX_send_result_wait_ms: 2000

# --- 운영값(비 VER-002 정수) ----------------------------------------------

# TIME_HEALTH_SNAPSHOT 증거 행의 **하트비트 간격**. 판정 내용(trust 상태 · 집계
# 결과 · 거절 사유 · 소비자가 읽는 그 밖의 필드)이 바뀌면 간격과 무관하게 즉시
# 쓰고, 바뀌지 않는 동안에는 이 간격마다 한 행만 쓴다.
# 로더: tos_runtime.time.config._resolve_operational (양의 정수만, 0·null 거부).
#
# ⚠ **증거 부피만 제한한다.** 신선도 소비자가 읽는 메모리 안
# evaluate()/snapshot 주기는 호출자 루프(marketfeed pass, 실측 ~408 ms)이고
# 이 값은 거기에 전혀 관여하지 않는다.
#
# 선택 사유(CLAUDE.md R5 — 새 장치는 그것이 막았을 실제 사고를 옆에 적는다):
# 2026-11-13 실측, 살아 있는 증거 저장소 전부
# (~/.local/state/tos/{paper-data,cp3-setup-d-*-data}/*/evidence.sqlite3)에서
# TIME_HEALTH_SNAPSHOT 이 3.45M 행 중 2.9M(84.4%, 8.3 GB)였다 — 엔진 pass
# 사이마다 ~400 ms 간격으로 **같은 판정을 다시 적은** 행이다. 2026-11-10
# 호스트 C: 가 가득 차 돌던 세션들이 LOST 됐다
# (memory/host-disk-c-full-docker-gc.md).
#
# 값 55000: 결정 틱이 1분봉이므로 «그 사이 커널이 계속 돌고 있었다» 를 봉 단위로
# 증명하면서, 행 수를 세션당 약 57,000 → 약 425(0.7%)로 줄인다.
#
# ⚠ **1분이 아니라 55초인 이유 — 닫힌 세션의 평가 간격보다 반드시 짧아야 한다.**
# `marketfeed.yaml::time_evaluate_closed_interval_ms` 는 60000 이고, 닫힌 세션에서는
# 그 주기로만 `evaluate()` 가 돈다. 두 값이 **같으면** 하트비트가 한 번씩 빗나간다:
# pacer 는 자기 단조시계로 `now - last_eval >= 60000` 을 보고(`time_pacer._due`),
# 서비스는 그 뒤 자기 단조시계를 따로 읽으므로(`service.evaluate`) 두 판독 사이
# 간격이 사이클마다 조금씩 다르다. 직전 사이클의 간격이 더 컸으면 서비스가 본
# 차이는 60000 **미만**이 되어 그 행이 빠지고, 다음 행은 약 120 초 뒤가 된다 —
# 건강한 닫힌 세션이 「2분 동안 한 행도 안 늘었다」로 보이고, 그것이 바로 아래
# 런북 §4 점검의 결함 판정 조건이다. 55000 은 그 지터에 5초 여유를 둔다(실측
# 지터는 밀리초대). 장중(열림)에는 패스마다 평가하므로 55초마다 한 행이다.
time_health_snapshot_heartbeat_ms: 55000

# --- 비-bound 식별/버전 문자열 -------------------------------------------
# tos.time.TimeHealthSnapshot 의 _REQUIRED_COVERED 필드. 제안표에 전용 행이
# 없으므로 아래 각 값의 출처를 개별로 적는다 — 셋 다 **측정/전사**이지 새로
# 지어낸 값이 아니다.

# 측정값: 이 호스트의 IANA tzdb (`dpkg -l tzdata` → 2026c-0ubuntu0.24.04.1;
# zoneinfo.TZPATH 의 첫 항목이 /usr/share/zoneinfo 이므로 시스템 tzdata 가
# 유효 원천이다). 호스트 사실이므로 tzdata 가 갱신되면 같이 갱신한다.
tz_db_version: "2026c"

# **강제 일치**: config/tos_runtime/paper/calendar.yaml 의 `calendar_version`
# 과 달라지면 SessionCalendarMismatch 로 부팅이 거부된다
# (calendar/owner.py:170-179 — 둘 다 알려져 있고 다르면 raise).
#
# 개정(운영자 2026-09-24): "krx-2026.09" → "krx-2026.09.1". 캘린더 내용이
# 바뀌었기 때문이다(`calendar.yaml` 의 `futures_expiry.months` 분기 → 매월 ·
# 상세는 그 파일 상단 주석). 이 값 자체에 대한 판단이 아니라 위 강제 일치의
# **귀결**이다 — 캘린더 버전이 오르면 이 값도 같은 커밋에서 같이 오른다.
# 개정(2026-10-25): "krx-2026.09.1" → "krx-2026.10". calendar.yaml 휴장 목록에 2026-12-31(KRX 연말 휴장)
# 추가 — 위 강제 일치의 귀결(상세는 calendar.yaml 「12-31 추가」 주석).
# 개정(2026-11-01 초안 → 2026-11-05 공지 확인, #924): "krx-2026.10" → "krx-2026.11". calendar.yaml 의
# session_overrides 에 2026-11-19(2027학년도 수능 · KRX 2026-11-05 공지값) 항목 추가 — 위 강제 일치의
# 귀결(상세는 calendar.yaml 「11-19 추가」 주석).
trading_calendar_version: "krx-2026.11"

# 전사: VERIFICATION-PROFILE-002.yaml 자신의 `profile_id`(L142) + `version`(L143).
verification_profile_version: "VERIFICATION-PROFILE-002-v2.1"

# 제안표 §4.3 식별자 규칙(`tos-paper-<무엇>-g<세대>`). 이 배포가 부팅하는
# RuntimeSafetyProfile 세대 — config/tos_runtime/paper/safety_profile.yaml 의
# `profile.profile_id` 와 같은 토큰이다. 측정: 런타임에 이 값을 대조하는
# 호출부는 없다(`grep -rn expected_safety_profile_version tos/runtime/src` → 0건;
# tos/src/tos/time/predicates.py:630 이 인자를 선언할 뿐 compose 가 넘기지 않는다).
safety_profile_version: "tos-paper-profile-g1"
