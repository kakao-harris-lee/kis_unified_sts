# =============================================================================
# construction.yaml — TOS paper 배포 **부팅 증명 픽스처** (W-A / A-5)
# =============================================================================
# 부팅 증명 픽스처 — 거래 전략 아님 · 대칭은 전략 제안 경로 착지 후 · 운영자 선택 (가) 2026-09-23
#
# 출처: docs/plans/2026-09-23-tos-paper-coordinates-and-first-boot-design.md §3 선택지 (가)
#       (운영자 선택 2026-09-23) · 상위 계획 §7.8
#       (docs/plans/2026-09-18-tos-config-adoption-and-carryover-plan.md)
#
# 이 파일이 무엇이고 무엇이 아닌가:
#   이것은 `run` 이 **틱을 소비하는지** 만 증명하기 위한 최소 구성이다. 채택 스코프가
#   `SYNTHETIC_FUTURES_ORDER`(브로커 미도달, broker_scopes.yaml)이므로 실주문 0 · 브로커
#   호출 0 이다. **거래 전략이 아니며**, 여기 박힌 방향(LONG)은 이 배포가 롱 전용임을
#   뜻하지 않는다 — 현 설계에서 `DIRECTION` 은 배포 전체에 하나만 줄 수 있고
#   (order_construction_policy.yaml:185-194 · venue/construction_rules.py `ActionClassShape`
#   독스트링), **대칭은 전략 제안 경로가 착지한 뒤** 시도별 조회로 풀린다. 그 사이의
#   증거로 같은 픽스처를 `--direction SHORT` 로도 렌더해 **양방향 모두 부팅됨**을 남긴다.
#
# 원본 템플릿: tos/runtime/config/construction.example.yaml
# 로더: tos_runtime.compose._construction_config.load_construction_config
#       (compose/_construction_config.py:167 · 부재 검사 :104-105)
# 호출부: compose/_run_dispatch.py:94-99 (`dispatch_run` 1단계, 무조건)
#
# 좌표 칸(`account`/`instrument`)은 **커밋되지 않는다.** named-TBD `"TBD"` 로 두고
# `scripts/tos/render_paper_config.py` 가 저장소 밖 렌더 디렉터리에서만 채운다
# (설계 §1 표 · §2). `"TBD"` 는 이 로더가 이름으로 거부하는 형태다
# (`_construction_config.py:_require_str`/`_require_action_class` — `_TBD_STR`).
# =============================================================================

# [좌표] 렌더 시 `.env.mock::KIS_FUTURES_ACCOUNT_NO` 에서 주입(설계 §1 표 1행).
# venue_constraint_policy.yaml:58 `scope.accounts` ·
# order_construction_policy.yaml:88 `scope.accounts` ·
# aggregate_risk_policy.yaml:43 `account_scope` ·
# action_flow_policy.yaml:54 `account_scope` 와 **같은 값이어야 한다**
# (compose/_venue_wiring.py:139-142 · compose/_riskstate_wiring.py:86-89 이 대조한다).
account: "TBD"

# [좌표] 렌더 시 `shared.instruments.futures.get_front_month_code(product="mini")`
# (설계 §1 표 2행 — 근월물은 만기마다 바뀌므로 파일에 고정하지 않는다).
instrument: "TBD"

# LONG 구성의 액션 클래스. order_construction_policy.yaml:93 `scope.action_classes`
# 가 NEW_LONG/NEW_SHORT/CLOSE 를 허용하고, 같은 파일 :104-105
# `direction_side_and_position_effect_rules` 가 "NEW_LONG↔BUY/OPEN" 으로 짝을 고정한다.
# 커널 열거: tos/src/tos/venue/vocabulary.py `ActionClass`.
# `--direction SHORT` 렌더는 이 줄을 NEW_SHORT 로 바꾼다(같은 표의 대칭 행).
action_class: "NEW_LONG"

# 세션 게이트가 읽는 캘린더 클래스 — config/tos_runtime/paper/calendar.yaml:36 이
# 선언하는 두 클래스 중 KRX 지수선물 쪽(CONTINUOUS 08:45-15:45 KST MON-FRI).
# venue_constraint_policy.yaml:71 이 같은 클래스를 대상으로 적는다.
instrument_class: "krx-index-futures"

# order_construction_policy.yaml:203-204 `_runtime.construction.action_class_shape`
# 의 `NEW_LONG → LONG → side` 값 그대로. 게이트웨이가 명령의 파생 SIDE 축과 이
# 값의 일치를 요구한다(tos/src/tos/egressgw/gateway.py:1220).
# `--direction SHORT` 렌더는 :205-206 의 `NEW_SHORT → SHORT → side` 로 바꾼다.
outbound_side: "BUY"

# critical_input_policy.yaml 이 선언하는 `fields[].field_key` 중 하나여야 한다
# (이 로더는 그 파일을 볼 수 없다 — 모듈 독스트링). 이 배포의 부팅 증명 정책은
# close/lower_band/upper_band 세 필드를 선언하고, 전략 규칙이 비교하는 값이 close 다.
price_field_key: "close"
shape_price_field_key: "close"
