# Venue Constraint Policy — CP-3 tenant (Setup D / SHORT) / KRX index futures
#                           (KOSPI200 **mini** `A056xx`)
# =============================================================================
# INSTANCE of tos-spec/src/part-1-foundation/verification/VENUE-CONSTRAINT-POLICY-template.yaml
# (placement + activation per tos-spec/src/decision-records/DR-0002 §2.1/§2.2).
#
# ⚠ TENANT TREE — 상주 `config/tos_runtime/paper/` 의 같은 파일에서 갈라져 나왔다.
#   **런타임이 읽는 값 차이는 `_model_view.shape_constraints` 의 두 곳**
#   — `max_quantity`(null → 10000)와 `tick_size`(5 → 2, 정정 2026-10-09), 둘 다 아래에
#   출처가 있다 — 이고, 그 밖에 **`policy_id` 가 tenant 전용으로 바뀌었다**
#   (아래). 나머지 차이는 그 값의 출처·단서를 적는 주석, 같은 사실을
#   적는 template DATA 산문(`approved_sources` · `price_band_tick_and_lot_rules` ·
#   `residual_risks` — 런타임이 해석하지 않는다, DR-0002 §2.1), 그리고 `approved_by`·
#   `effective_from` 이다. 트리 전체의 범위·무엇이 증명됐고 무엇이 아닌가는 이 트리의
#   `README.md` 에 있다.
#   ⚠ **`policy_id` 를 tenant 전용 이름으로 바꿨다** — `vcp-paper-krx-index-futures` →
#   `vcp-paper-cp3-setup-d-short-krx-index-futures`. 이유: 상주 문서와 **내용이 다르므로
#   `canonical_digest` 도 다른데** 같은 `policy_id`·`policy_generation` 을 들고 있으면
#   활성화 기록의 `(kind, member_id, generation)` 만으로 두 문서를 구별할 수 없다. 세대는
#   **1 그대로** 둔다 — 이것은 상주 정책의 다음 세대가 아니라 **다른 배포의 정책**이다.
#   같은 규칙을 적용해 `critical_input_policy.yaml` 의 id 도 tenant 전용이다. 반대로
#   `order_construction_policy.yaml`(이 트리에서 주석만 다름 → 타입 콘텐츠·digest 동일) ·
#   `aggregate_risk_policy.yaml` · `action_flow_policy.yaml`(바이트 동일)의 id 는
#   **바꾸지 않았다**: 같은 id·세대·digest 는 「같은 문서」라는 참인 진술이고, 거기서
#   이름을 가르면 같은 것을 둘로 보이게 만든다. 즉 기준은 트리가 아니라 **내용이
#   갈렸는가**다.
#   ⚠ 이 트리는 **아직 활성화되지 않았다** — `safety_activation.yaml::members` 는 `null`
#   이고 digest 도입은 부팅 경로(kickoff §5 3 ④)의 일이다. 그래서 이 rename 은 어떤
#   활성화 기록도 무효화하지 않았고, digest 리터럴을 지어내지도 않았다(digest 는 좌표가
#   들어간 뒤 호스트에서 도출된다 — 렌더가 `members:` 에 쓴다).
#
# APPROVAL PROVENANCE (config/tos_runtime/README.md rule — a value without a
# citation does not belong here):
#   * values: docs/plans/2026-09-15-tos-venue-constraint-service-plan.md §6 ②
#     proposal table, adopted by the operator on 2026-09-16 (「추천 방향으로 모두 선택」).
#   * **tick_size 2 = 0.02 index points at the ×100 integer price scale —
#     운영자 승인 2026-10-08 · 시행세칙 제4조의9 제2호 · 등급 R · 브로커 정황 =
#     P-VL band 격자(PR #881).** 정정 5 → 2 는 band 원천 웨이브 계획
#     `docs/plans/2026-10-08-tos-cp3-band-source-wave-plan.md` §3 의 첫 PR 로 착지했다
#     (그 표의 「CP-3 tenant 트리」 행 — 상주 `paper` 트리는 **보류**, paper 채택과 함께).
#     조문은 KRX 파생상품시장 업무규정 시행세칙 **제4조의9 제2호**(미니코스피200선물거래의
#     호가가격단위 0.02 포인트)이므로 등급은 **R**(공표 규정 원문)이고, 종전 이 자리의
#     grade C 로컬 설정 인용은 **보강 정황으로 내려간다**:
#       - 레포 레지스트리 `config/execution.yaml::futures_contract_spec`
#         `tick_size_points: 0.02`(mini) / `0.05`(full) — 규정값과 같은 방향의 LOCAL
#         설정(grade C). **5 는 full 계약 값이었다**: 이 잎은 mini `A056xx` 이므로
#         그 행을 잘못 집었던 것이 정정의 원인이다.
#       - 브로커 측 틱 검증이 P0-2 에서 관측된 기록
#         docs/broker-profiles/KIS-BROKER-CAPABILITY-PROFILE-draft.yaml::
#         capabilities.market_and_instrument_constraints._kis.tick_probe_observations_2026_07_30
#         — 검증이 존재한다는 사실이고 **틱 값의 브로커 QUERY 는 여전히 없다**.
#       - P-VL 모의 실측(PR #881, 증거
#         `docs/broker-profiles/evidence/2026-10-08-cp3-venue-limits/`)에서 관측된
#         price band 경계 네 값이 **0.02 격자에만** 떨어지고 0.05 의 배수가 아니었다 —
#         **브로커 측 정황**이며 그 자체로 틱의 원천은 아니다(설계 §2.0 ⚠ · §8 3단계
#         부수 산출).
#     ⚠ 인용은 전부 **키 경로**다. 2026-10-08 P-VL fold 가 프로파일에 행을 넣어 종전
#     `:853-868` 이 가리키던 broker 측 틱 검증 기록을 밀어냈고, 그 범위는 이제
#     **NOT_MEASURED 인용 부적격 주석**을 가리킨다 — 행 번호 인용은 조용히 썩는다.
#     (시프트 값은 적지 않는다: 델타도 행 번호와 똑같이 썩고, 적는 순간 그 숫자가
#     다음 fold 에서 틀린다. 키 경로가 그 문제를 없애려고 쓰는 것이다.)
#     ⚠ **이 값은 오늘 판정에 닿지 않는다 — 그래도 지금 고친 이유.** band 가 null 인
#     동안 `order_shape_admissible` 은 tick 검사 **전에** step 3 UNKNOWN 으로 끝난다
#     (설계 §1 술어 순서). 즉 5 든 2 든 오늘의 거동은 같다. 지금 고치는 것은 band 가
#     들어오는 순간 **5 가 mini 정상 호가를 전부 INADMISSIBLE 로 만들기** 때문이고,
#     band 와 tick 을 한 웨이브에서 함께 움직이는 것이 그 계획 §3 의 전제 항목이다.
#     ⚠ 이 변경은 이 문서의 `canonical_digest` 를 바꾼다(실측 2026-10-09: VCP 의
#     digest 는 `_model_view.shape_constraints` 를 덮는다 — `tick_size` 만 바꿔도
#     달라진다). 이 트리의 `safety_activation.yaml::members` 는 **`null`** 이므로
#     갱신할 활성화 기록이 없고, digest 리터럴을 지어내지도 않았다 — 활성화는 부팅
#     경로(kickoff §5 3 ④)의 일로 남는다.
#     ⚠ 상주 `paper` 트리의 tick 은 5 그대로다 — 계획 §3 이 **paper 채택과 함께**
#     보류한다. 거기서 옮기면 정책 digest 재도출 + `safety_activation.yaml::members`
#     갱신 + 런북 §7.10 6 의 두 번 부팅 의무가 따라오는데 행동 변화는 0 이다
#     (그 트리의 band 도 null 이다).
#   * lot_size / min_quantity 1 = one contract (official contract unit, grade B;
#     조문 인용 시행세칙 제4조의5제1항·제2항 — 호가수량단위 = 거래수량단위 1 계약,
#     2026-10-08 설계 §3 값 표).
#   * **max_quantity 10000 — 결정 9 (a) · 운영자 채택 2026-10-08 · 별표 17의2 제1호
#     미니코스피200선물거래 행 · 등급 R** (공표 규정 원문; 조문 체인 업무규정 제71조 →
#     시행세칙 제61조제1항 → 별표 17의2 제1호, 증거
#     `docs/broker-profiles/evidence/2026-10-08-krx-venue-limits/`, 설계
#     `docs/plans/2026-10-08-tos-cp3-venue-limit-source-and-probe-design.md` §2.1·§3).
#     **값과 반드시 함께 읽을 단서 셋(설계 §2.2):**
#       (1) **회원(증권사)은 이보다 낮게 정할 수 있다** — 시행세칙 제61조제3항. 10,000 은
#           **venue 상한**이지 KIS 가 받아 준다는 보장이 아니고, **KIS 측 한도는 미확인**이다
#           (GET 으로 관측 불가 — 설계 §4.3; 모의 프로파일 토큰도 그대로
#           `QUANTITY_CAP_RULE_VALUE_BROKER_UNCONFIRMED`).
#       (2) **거래소가 시장관리상 변경할 수 있다** — 제61조제1항 단서 · 제56조제3항.
#           「공표 규정값」이지 불변식이 아니다.
#       (3) **누적호가수량한도는 다른 한도다** — 제61조제2항(회원 자기거래계좌·사후위탁
#           증거금계좌 한정). 위탁계좌인 paper/모의에는 적용되지 않으므로 이 정책에
#           넣지 않는다.
#     ⚠ 이 값은 step 2 의 `quantity constraint is incomplete` DENY 를 없애지만 **송신을
#     열지 않는다**: band 가 null 인 동안 step 3 는 UNKNOWN 이다(설계 §3 「필요조건이지
#     충분조건이 아니다」).
#   * price_min / price_max: NO SOURCE (P0-2
#     `price_band_tick_lot_and_quantity_semantics: UNKNOWN`) → null.
#     2026-10-08 갱신: 그 P0-2 값은 더 이상 UNKNOWN 이 아니다 — 적용 문서(MOCK_VTS)는
#     `BAND_SEMANTICS_L2_STAGE_RECORDED_ONLY__TICK_FROM_REGULATION_NOT_BROKER__QUANTITY_CAP_RULE_VALUE_BROKER_UNCONFIRMED`
#     를 들고 있다(증거 `docs/broker-profiles/evidence/2026-10-08-cp3-venue-limits/`).
#     **그래도 band 두 값은 null 이 맞다**: 관측은 됐지만 **일별 동적 값**이고
#     장중에도 확대될 수 있어(설계 §2.1) 런타임 공급 경로가 없으면 정적 리터럴로
#     쓸 수 없다(2026-10-08 설계 §6 웨이브). 값이 들어오는 조건은 그것이지
#     「조회된 적이 없다」가 아니다. With
#     this file NOTHING is transmitted: the null band makes the
#     kernel's order_shape_admissible UNKNOWN regardless of step 2, which is
#     the intended fail-closed state until a governed band source lands
#     (plan §5 정직 상태 / §6 ⑤; pinned by
#     tos/runtime/tests/compose/test_deploy_policies.py). Never fill by hand.
#   * admitting session phase = the ONE token this tree's own
#     calendar.yaml declares for krx-index-futures (`CONTINUOUS`, 08:45-15:45
#     KST); `CLOSED`/`EXPIRED` admit nothing.
#
# OPERATOR-FILL BEFORE ACTIVATION (the loader refuses "TBD"):
#   1. scope.accounts  — the paper account number (never committed here).
#   2. scope.instruments — the CURRENT front-month contract code (ADR-002-019
#      §11 binds the contract month; a roll is a NEW policy generation).
#   3. run `tos-runtime print-policy-digests --config-dir <dir>` and copy the
#      printed digest into safety_activation.yaml `members:` (kind
#      VENUE_CONSTRAINT_POLICY, member_id, generation, digest, resolved: true,
#      immutable: true). canonical_digest below may stay TBD (derived) or be
#      set to that exact value.
#
# The rule-list keys below are template DATA (preserved, never interpreted by
# the runtime — DR-0002 §2.1); the runtime reads kernel-typed content from
# `_model_view` and runtime-only facts from `_runtime`.
# =============================================================================

