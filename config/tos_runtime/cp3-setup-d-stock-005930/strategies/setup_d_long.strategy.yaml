# CP-3 첫 tenant 전략 콘텐츠 — Setup D VWAP 되돌림, LONG 배포.
#
# ⚠⚠ **이 사본(주식 tenant)은 2026-11-11 부터 LONG 트리의 바이트 사본이 아니다.**
# 아래 R1·R2·R3 뒤에 **R4 = M2 경계 관통 프로브** 규칙이 하나 더 있다(운영자 지시
# 2026-11-11, rescope 계획 `docs/plans/2026-10-22-tos-rescope-plan.md` §2 문장 2 ·
# 마일스톤 M2). R4 는 **Setup D 시그널이 아니다** — 주식 트리의 잎이 11-06 에 태어난 뒤
# R1 은 진입 제안을 **0건** 냈고(다섯 게이트가 거의 동시에 서지 않는다), 그래서
# 「결정 → 승인 → RCL 예약 → verify → kis_mock 전송 → 결과 → finality」경계를 한 번도
# 끝까지 타보지 못했다. R4 는 그 경계를 실제로 태우기 위한 **설정으로 켜고 끄는 프로브**이고,
# 켬/끔은 형제 `strategy_bindings.yaml` 의 `m2_probe_entry_enabled` 한 줄이다
# (M2 달성 뒤 `false` 로 되돌리는 1줄 PR).
# 아래 문단들(B1b 사본과 좌표 칸만 다르다 · 규칙 3개 · 작업 스텝 24)은 **R1~R3 에 대한
# 진술**이었고, R4 가 바꾼 수치는 각 문단에 그대로 적어 두었다.
# B1b↔배포 드리프트 가드(`tos/runtime/cp3/tests/test_cp3_short_strategy_content.py`
# 59-63행)는 `cp3-setup-d-long` · `cp3-setup-d-short` 두 트리만 대조하므로 이 트리는 그
# 가드의 대상이 아니고, 장후 B3 대조도 `config/tos_cp3_b3.yaml::markets: ["futures"]` 라
# 주식 세션에서는 `verdict: "skipped"` 다 — R4 는 B3 증인
# (`shared/decision/setups/vwap_reversion.py`)과 만나지 않는다.
#
# 상위: docs/plans/2026-10-07-tos-cp3-first-tenant-kickoff.md §4 결정 1·4·5·6,
# §5 3. 운영자 승인 2026-10-07(아홉 전부 권고대로).
#
# 이 파일의 콘텐츠 원본은 B1b 실행기 쪽 사본 `tos/runtime/cp3/strategies/
# setup_d_long.strategy.yaml` 이고, 그 파일이 **운영 로더**로 적재·승인되는 것은
# `tos/runtime/cp3/tests/test_cp3_strategy_content.py` 가 증명한다(kickoff §5 3).
# 이 사본과 B1b 사본은 **R1~R3 범위에서 파싱된 YAML 로 좌표 칸(`account`·`instrument`)
# 여섯만 다르다**(2026-11-11 부터 이 사본에는 그 밖에 R4 가 더 있다 — 위 ⚠⚠ 문단)
# — B1b 사본은 백테스트 하네스 리터럴(`account: cp3-b1b-long` · `instrument: 101S6000`,
# parity 데이터셋의 **full** 월물)을 들고 있고, 배포 트리는 그 여섯을 이 트리의 다른 모든
# 좌표 칸과 **같은 named-TBD 토큰** `"TBD"` 로 둔다(계좌·종목은 커밋되지 않는다 — 렌더가
# 저장소 밖에서만 채운다). `"TBD"` 리프는 로더가 **거부한다**
# (`tos_runtime._named_tbd.first_named_tbd_leaf`) — 그 거부가 운영자-채움 게이트다.
# ⚠ **표기까지 같지는 않다(2026-10-10, 렌더 경로 PR-B).** 아래 R1 은 그 두 칸에 YAML 앵커
# (`&account`·`&instrument`)를 달고 R2·R3 는 별칭(`*account`·`*instrument`)으로 참조한다 —
# B1b 사본은 세 번 다 리터럴이다. 그래서 「좌표 칸만 다르다」는 **바이트가 아니라 파싱된
# 값**에 대한 진술이고, 드리프트 가드
# (`tos/runtime/cp3/tests/test_cp3_short_strategy_content.py::
# test_b1b_copy_equals_the_deployed_tenant_strategy_after_normalising_coordinates`)도
# `yaml.safe_load` 뒤를 대조하므로 별칭 표기를 그대로 받는다(별칭은 파싱 시 해석된다).
# ⚠ tenant 상품은 mini `A056xx` 다(결정 2) — full `101S6000` 은 parity 데이터셋 전용이고
# 그래서 여기 들고 오지 않는다.
#
# ✅ **렌더는 이 파일을 채운다 — 2026-10-10(계획 2026-10-09 PR-B).** 2026-10-09 에 적혀
# 있던 두 막힘은 이렇게 풀렸다:
#   (1) `scripts/tos/render_paper_config.py::_STRATEGY_FILE` 상수는 더 이상 렌더가 읽는
#       원천이 아니다 — 슬롯 표가 트리마다 커밋되는 `<tree>/RENDER.yaml` 로 옮겨졌고
#       (PR-A, 계획 §2.1), 이 트리의 매니페스트가 **이 파일 이름**을 적는다.
#   (2) 앵커 **정확히 1회** 규칙(`_apply_rules`)은 **그대로**다 — 바꾼 것은 이 파일이다.
#       R1 의 두 칸에만 YAML 앵커를 달고 R2·R3 는 별칭으로 참조하므로(계획 §2.2)
#       `account: &account "TBD"` 줄은 원문에 **한 번**만 있다. 별칭을 하나 빠뜨리면
#       렌더 뒤에 `"TBD"` 가 남고 로더가 그 리프를 **이름으로 거부한다** — 새 가드가
#       필요 없는 이유다.
#   방향은 **치환하지 않는다**(계획 §2.3). 이 트리는 방향별로 커밋돼 있으므로 매니페스트가
#   `direction.mode: declared` + `value: "LONG"` 을 선언하고, 아래 R1 의 `direction: LONG`
#   은 **검증 전용 슬롯**(치환문 == 앵커, 정확히 1회)이다. `--direction SHORT` 는 이 트리에
#   대해 **거부된다** — SHORT 는 `cp3-setup-d-short` 트리를 렌더한다.
#
# 이 파일은 tos/runtime/src/tos_runtime/strategy/loader.py::load_strategies 가
# 읽는 그 모양 그대로다 — tos/runtime/config/strategies/example.strategy.yaml 의
# 템플릿을 채운 것이다. 미지의 키는 tos.dsl.serialization.parse_strategy 가 거부한다.
#
# ⚠ **배포 사본의 named-TBD 상태는 B1b 사본과 다르다.** B1b 사본
# (`tos/runtime/cp3/strategies/setup_d_long.strategy.yaml`)은 모든 값이 concrete 이고
# (`null` 리프 0 · `"TBD"` 문자열 0) 그래서 그 자리에서 적재·승인된다. **이 배포 사본은
# `"TBD"` 리프를 여덟 개 들고 있다** — 네 규칙(R1·R2·R3·R4)의 target 마다 `account` ·
# `instrument` 두 칸(2026-11-11 R4 가 둘을 더했다). ⚠ **리프는 여덟이지만 원문의 `"TBD"`
# 토큰은 둘뿐이다**(실측 2026-10-10: R1 의 앵커 줄 둘 — 아래 `&account`·`&instrument` —
# 이고, R2·R3·R4 는 별칭이라 파싱 때 같은 값으로 해석된다). 계좌·종목은 커밋되지
# 않으므로(위 문단) 그것이 맞는 상태이고, 로더는 그 리프를 **이름으로 거부한다**
# (`tos_runtime._named_tbd.first_named_tbd_leaf`, `parse` 가 보기 전에). 즉 **이 파일은
# 커밋 상태로는 적재되지 않는다 — 그 거부가 운영자-채움 게이트다.** `null` 리프는
# 여전히 0 이다.
#
# 방향은 **배포(구성)당 하나**다(kickoff §2 — order_construction_policy.yaml
# 194-213행). 이 파일은 LONG 배포용이고, SHORT 는 별도 렌더·별도 파일이다
# (결정 4). 그래서 진입 규칙의 임계는 음수 한쪽(`z_x1000 <= -1800`)만 본다.
#
# 작업 스텝 예산: tos.engine.admission.policy_work_steps =
#   len(rules) + len(compares) + len(operands)
#   = 4 + 9 + 18 = 31 ≤ 64 (이 트리의 engine.yaml `dsl_evaluation_budget_steps`
#   — 상주 트리에서 바이트 그대로 복사된 값). R4 전에는 3 + 7 + 14 = 24 였다.
#   kickoff §2 의 「규칙 3개면 비교 ≤ 20」 도 9 비교로 만족한다.
#
# 지표 수학은 이 파일에 **없다**. DSL 에는 산술·집계·함수가 없으므로(DSL-G1)
# vwap·atr14·z·ATR 백분위·스톨·역전·세션 창은 모두 상류 Critical Input 으로
# 들어온다 — 생산자는 B1a(tools/tos_cp3/produce_fields.py)이고 그 lineage 가
# 각 필드의 unit/scale/multiplier/sign 을 적는다.
#
# 각 Decision.rationale 은 **「<규칙 id>: <왜>」** 꼴이다. 규칙 id 는 이
# 파일이 유일한 출처이고, tos/runtime/cp3/runner.py 가 발화한 규칙을
# trace 에 적을 때 그 토큰을 그대로 쓴다(러너가 규칙을 재평가하지 않는다).

dsl_version: cp3-b1b-dsl-1
config_binding_version: cp3-b1b-bind-1

policy:
  rules:
    # ---------------------------------------------------------------- R1
    # 진입: Setup D 의 다섯 게이트 AND. 전부 상류 필드 비교다.
    #   entry_window  09:00 앵커 기준 valid_minutes_min(15) ≤ 경과 ≤ 345
    #   hi_vol        atr14 ≥ min_atr_ratio(0.9) × 780봉 ATR p90
    #   stall_ok      최근 15봉 자체 레인지 스톨 가드 통과
    #   reversal_ok   직전 봉 대비 VWAP 쪽으로 되돌았고 |z| 가 줄었다
    #   z_x1000       VWAP 괴리가 LONG 쪽 극단(≤ -extreme_atr_mult)
    # 임계 -1800 은 리터럴이 아니라 sibling strategy_bindings.yaml 의
    # `z_entry_max_x1000` 이다(design §7 — 임계는 설정, 하드코딩 금지).
    - all_of:
        - left:
            ref: [capsule, resolved_values, entry_window]
          op: EQ
          right:
            const: true
        - left:
            ref: [capsule, resolved_values, hi_vol]
          op: EQ
          right:
            const: true
        - left:
            ref: [capsule, resolved_values, stall_ok]
          op: EQ
          right:
            const: true
        - left:
            ref: [capsule, resolved_values, reversal_ok]
          op: EQ
          right:
            const: true
        - left:
            ref: [capsule, resolved_values, z_x1000]
          op: LE
          right:
            ref: [config, z_entry_max_x1000]
      decision:
        kind: ACTION
        rationale: >-
          R1-ENTRY-LONG: entry window open, high-volatility regime, stall guard
          clear, reversal confirmed, and the VWAP extension has reached the LONG
          extreme threshold — propose a new long.
        target:
          kind: ACTION
          account: &account "TBD"
          instrument: &instrument "TBD"
          direction: LONG
          position_effect: OPEN
          # 수량은 Proposal 에 숫자 슬롯이 없다(DSL-G5) — basis 만 증거로
          # 싣고, 실제 수량은 OCP 의 정적 SizingBound(1 계약)가 정한다.
          quantity_basis: RISK
          # TargetSpec.rationale 은 **필수**다: ACTION/FLAT 의 Outcome 은
          # tos.dsl.determinism._build_target_proposal 에서 *target* 의
          # rationale 을 싣고(Decision 의 것이 아니다), Proposal 은 빈
          # rationale 을 거부한다(proposal.py 147-155행). 규칙 id 접두가
          # 같아야 trace 가 발화 규칙을 Outcome 에서 되읽을 수 있다.
          rationale: >-
            R1-ENTRY-LONG: open a new long at the LONG-side VWAP extreme with
            every Setup D gate satisfied.
    # ---------------------------------------------------------------- R2
    # 청산 1: 가격이 VWAP 밴드로 되돌아왔다 = 평균회귀 명제 실현.
    # `vwap_reverted` 는 B1a **D3** 의 **밴드 꼴**(abs(z) ≤ 0.2)이다 —
    # (D7 이 아니다: D7 은 측정된 D7 생성기에 관한 항목이고 그 note 자신이
    #  「그 카운트를 밴드의 오차 막대로 읽지 말라」고 적는다.)
    # 레거시 YAML 에 vwap_revert_band_atr_mult 가 없어 B1a 가
    # reversal_confirm_atr_mult 를 폴백으로 썼고, 그 차이는 lineage 의
    # declared_differences 에 등재돼 있다.
    - all_of:
        - left:
            ref: [capsule, resolved_values, vwap_reverted]
          op: EQ
          right:
            const: true
      decision:
        kind: FLAT
        rationale: >-
          R2-EXIT-VWAP-REVERTED: price has returned to the VWAP band — the
          mean-reversion thesis is realized, go flat.
        target:
          kind: FLAT
          account: *account
          instrument: *instrument
          # 롱을 닫는 액션이므로 방향은 반대쪽이다(tos/tests/backtest/
          # _backtest_fixtures.py 의 Explicit-Flat 과 같은 꼴).
          direction: SHORT
          position_effect: CLOSE
          rationale: >-
            R2-EXIT-VWAP-REVERTED: close the long — price is back inside the
            VWAP band.
    # ---------------------------------------------------------------- R3
    # 청산 2: EOD(15:15). kickoff §4 결정 6 — 1차 슬라이스 청산은 이 둘뿐이고
    # ATR 스톱(1.5×)은 의도된 차이로 범위 밖이다.
    - all_of:
        - left:
            ref: [capsule, resolved_values, eod]
          op: EQ
          right:
            const: true
      decision:
        kind: FLAT
        rationale: >-
          R3-EXIT-EOD: the session's EOD close time has arrived — go flat.
        target:
          kind: FLAT
          account: *account
          instrument: *instrument
          direction: SHORT
          position_effect: CLOSE
          rationale: >-
            R3-EXIT-EOD: close the long — the session's EOD close time has
            arrived.
    # ---------------------------------------------------------------- R4
    # **M2 경계 관통 프로브 — Setup D 시그널이 아니다**(운영자 지시 2026-11-11:
    # 「정확한 시그널을 기다리지 말라; 시그널이 완벽하다는 보장도 없다 — 되게 해라」).
    # 왜 여기 있나: 주식 잎이 11-06 에 태어난 뒤 R1 의 진입 제안은 0건이고(다섯 게이트
    # 동시 성립이 드물다), 48건의 FLOW_HALTED 는 잎이 flat 인데 들어온 FLAT 제안이
    # CANDIDATE_COMMAND_CONSTRUCTION 에서 거부된 것이다 — 즉 **경계의 송신 쪽 절반**
    # (승인 → RCL 예약 → verify → kis_mock 전송 → 결과 → finality)이 한 번도 돈 적이 없다.
    # R4 는 그 절반을 1주 1회 태우는 것만을 목적으로 하는 규칙이다.
    #
    # ⚠ **순서가 안전장치다.** tos.dsl.vocabulary.evaluate_policy 는 규칙을 **authored
    # 순서로 보고 처음 발화한 규칙의 Decision 을 돌려준다**(first-match, 그 함수
    # docstring "Rules are tried in order; the first whose guard fires"). R4 가 R2·R3
    # **뒤에** 있으므로 `vwap_reverted` 든 `eod` 든 참이면 청산이 이긴다. R4 를 R1~R3
    # 위로 올리면 청산이 막힌다 — 이 블록은 파일 끝(default 직전)에 있어야 한다.
    #
    # ⚠ **왜 두 비교이고, 왜 `config` 단독 비교가 아닌가.** 커널의 D1↔D4 규칙은
    # outcome-gating 비교마다 **capsule 피연산자 최소 1개**를 요구한다
    # (tos.engine.admission.compare_has_capsule_operand / strategy_admissible 검사 2).
    # 그래서 `config.m2_probe_entry_enabled EQ const 1` 같은 비교는 전략 전체를
    # INADMISSIBLE 로 만든다(실측 2026-11-11: "outcome-gating compare #8 has no
    # capsule-sourced operand") — 부팅이 STRATEGY_REFUSED 로 멈추고 송신은 0 이 된다.
    # 그래서 토글은 **capsule 값과 config 값을 맞대 보는** 두 번째 비교로 쓴다:
    #   ① entry_window EQ true            — 시장 쪽 게이트(세션 창 안인가)
    #   ② entry_window EQ config.<토글>   — 토글이 true 일 때만 ①과 같은 값이 된다
    # 토글이 `false` 면 ②가 `true EQ false` 로 거짓이라 R4 는 **절대 발화하지 않는다**.
    # ⚠ 토글은 **bool** 이어야 한다 — eval_compare 의 EQ 는 `type(left) is type(right)`
    # 를 먼저 보므로(vocabulary.py) 정수 `1` 은 bool `True` 와 같지 않고, 그러면 R4 는
    # 조용히 죽은 규칙이 된다. 형제 strategy_bindings.yaml 의 값이 `true`/`false` 인 이유다.
    #
    # ⚠ **`direction` 을 따옴표로 쓴 이유**(스타일이 아니라 렌더 제약이다).
    # RENDER.yaml 슬롯 17 은 이 파일에서 `          direction: LONG` 줄을 **정확히 1회**
    # 찾아야 한다(render_paper_config.py `_apply_rules` 의 "exactly one anchor match";
    # 이 트리는 direction.mode: declared 라 그 슬롯이 방향 검증 자체를 한다). R4 가 같은
    # 줄을 그대로 또 쓰면 "matched 2 times" 로 렌더가 거부된다. `"LONG"` 은 파싱 결과가
    # 같은 같은 문자열이면서 앵커 줄과는 다른 줄이다. 따옴표를 지우면 렌더가 **거부**로
    # 멈춘다(잘못된 주문이 아니라 실패) — 지우지 말 것.
    - all_of:
        - left:
            ref: [capsule, resolved_values, entry_window]
          op: EQ
          right:
            const: true
        - left:
            ref: [capsule, resolved_values, entry_window]
          op: EQ
          right:
            ref: [config, m2_probe_entry_enabled]
      decision:
        kind: ACTION
        rationale: >-
          R4-M2-PROBE-ENTRY-LONG: M2 boundary probe, NOT a Setup D signal —
          the entry window is open and the operator's M2 probe binding is on,
          so propose one long to exercise the approval/reservation/verify/
          kis_mock send/result/finality boundary end to end.
        target:
          kind: ACTION
          account: *account
          instrument: *instrument
          # 따옴표는 렌더 앵커 때문이다 — 위 ⚠ 문단.
          direction: "LONG"
          position_effect: OPEN
          # R1 과 같은 basis. 실제 수량은 OCP 의 정적 SizingBound(1주)가 정한다.
          quantity_basis: RISK
          rationale: >-
            R4-M2-PROBE-ENTRY-LONG: open one long as the M2 boundary probe —
            this is not a Setup D entry signal.
  # 어떤 규칙도 발화하지 않을 때의 필수 기본값. NO_ACTION 은 1급 결과다.
  default:
    kind: NO_ACTION
    rationale: >-
      R0-DEFAULT-NO-ACTION: no rule fired — hold exposure unchanged.
