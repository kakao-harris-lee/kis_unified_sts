    "INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL":
      scope: "INSTRUMENT"
      dimension: "LONG_SHORT_DELTA_DIRECTIONAL"
  # ── 50 의 도출 (운영자 지시 2026-11-19 · generation 2) ──────────────────────
  # 단위는 SHARES(`_runtime.unit`), 뜻은 「이 잎이 하루 동안 쌓을 수 있는 순 LONG 델타」다.
  #
  # (가) 하루가 낼 수 있는 진입 수의 상한 — 330.
  #      `fields.yaml::entry_window` = between(mso, lo 15, hi 345) 이므로 진입이 가능한
  #      1분봉은 345 − 15 = 330 개다. 전략 파일의 R4 프로브 규칙
  #      `R4-M2-PROBE-ENTRY-LONG` 은 그 창의 **봉마다** OPEN LONG 을 1건 제안하고 수량은
  #      1주 고정(`order_construction_policy.yaml::_runtime.construction.sizing.max_quantity`
  #      = `venue_constraint_policy.yaml::_model_view.shape_constraints.max_quantity` = 1,
  #      운영자 결정 2026-10-22)이다 → 하루 진입 ≤ 330건 → 순 LONG 델타 ≤ 330주.
  #      (같은 셈이 `authority.yaml::standing_approval_max_uses_per_action: 390` = 정규장
  #       09:00–15:30 의 1분봉 수, #1099.)
  #
  # (나) 계좌가 낼 수 있는 진입 수의 상한 — 50. **이쪽이 더 좁아서 이 값이 된다.**
  #      2026-11-19 모의계좌(fingerprint ee1bdb5f1ca2) GET 실측:
  #        inquire-psbl-order(VTTC8908R) `ord_psbl_cash` = 9,905,880 KRW
  #        inquire-balance(VTTC8434R)   `dnca_tot_amt`  = 9,762,041 KRW
  #        005930 현재가(FHKST01010100 `stck_prpr`)      =   194,700 KRW
  #      floor(9,905,880 / 194,700) = floor(50.87…) = **50**.
  #      브로커 자신의 미수 없는 매수가능수량 `nrcvb_buy_qty` 도 같은 50 이다(교차 확인).
  #      현금이 330주(= 64,251,000 KRW)를 대지 못하므로 min(330, 50) = 50 을 쓴다.
  #      50 ≥ 3(지시의 하한)이고, 그 위의 진입은 TOS 가 아니라 계좌 잔고가 막는다.
  #
  # ⚠ 이 값은 **입금되면 다시 도출해야 한다** — (나)가 넓어지면 상한은 (가)의 330 이다.
  effective_limits:
    "INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL": 50
  # `envelope_max` — 6단계 `injected_envelope_max` 상한. 2026-11-13 S2-a 이전까지는
  # `safety_envelope.yaml::envelope.governed_dimensions[].envelope_max` 에 있었다(안전망
  # 제거 전 실측: 네 트리 모두 "1"). 로더는 `dimension_ids` 의 모든 id 에 대해 이 값을
  # 요구한다 — 상한 없는 차원은 부팅 거부. 커널의 `envelope_bound_not_enlarged` 는
  # effective > envelope 일 때 DENY 하므로, 위 effective_limit 과 **같은 값**이어야 한다
  # (도출은 바로 위 블록; 이 트리만 50, 나머지 세 트리는 1 그대로).
  envelope_max:
    "INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL": 50
  required_scenario_kinds: ["ADVERSE_PRICE_SLIPPAGE_GAP_VOL_LIQ"]
  required_scopes: ["INSTRUMENT"]
  applicable_risk_scopes: ["INSTRUMENT"]
