# =============================================================================
# Aggregate Risk Policy — paper / KRX index futures (KOSPI200)
# =============================================================================
# INSTANCE of tos-spec/src/part-1-foundation/verification/AGGREGATE-RISK-POLICY-template.yaml
# (placement + activation per DR-0002 §2.1/§2.2, extended to this policy by
# DR-0003 §2.1). Loaded by tos_runtime.riskstate.load_aggregate_risk_policy.
#
# APPROVAL PROVENANCE: docs/plans/2026-09-16-tos-risk-state-service-plan.md
# §6 ②, adopted by the operator on 2026-09-16 (「1. 채택」).
#   * ONE governed dimension, INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL — in this
#     tree the unit is SHARES and the limit is generation 2's 50, not generation
#     1's 1 (see the generation-2 block below); this is the
#     only dimension the runtime can source today (a single-source fill sum
#     from its own durable evidence, DR-0003 §2.2). No notional / margin
#     dimension: no mark source exists, and a dimension with no source would
#     make every evaluation UNKNOWN.
#   * The ARE ceiling is this file's own `_runtime.envelope_max` since plan S2-a
#     (2026-11-13, docs/plans/2026-11-13-tos-code-halving-plan.md). Before that it
#     was the Hard Safety Envelope's `governed_dimensions[].envelope_max`, checked
#     against this policy at boot by the compose root; `safety_envelope.yaml`, its
#     example and that cross-check are all gone. The VALUE was unchanged by that cut
#     (measured before it: "1" in all four shipped trees; this tree moved to 50 in
#     generation 2, 2026-11-19, below) and so is the refusal —
#     `load_aggregate_risk_policy` requires a ceiling for every id in
#     `dimension_ids`, so an ARE-governed dimension with no declared bound is
#     refused at load instead of at wiring. The kernel's
#     `envelope_bound_not_enlarged` still denies when an effective limit exceeds
#     the ceiling declared below.
#   * required_scenario_kinds = risk.yaml's set (ADVERSE_PRICE_SLIPPAGE_GAP_VOL_LIQ).
#   * The position observation is single-source (no broker witness);
#     all_fields_attributed stays the operator attestation in
#     risk_attestations.yaml (DR-0003 §2.2) — this file never asserts it.
#
# APPROVAL PROVENANCE (generation 2 — 이 트리만, 운영자 지시 2026-11-19:
# 「슬롯 수를 하루 동안의 거래를 차단하지 않는 수로 지정해. 3이나 그 이상.」):
# `_runtime.effective_limits` / `_runtime.envelope_max` 의 한 칸을 1 → 50 으로 올린다
# (도출은 그 두 칸 옆 주석). **한도 값의 변경**이므로 이 문서 자신의
# `invalidation_conditions`(「new policy generation on any change of dimension, limit,
# scenario coverage or scope」)에 따라 새 generation 이고, `aggregate_risk_generation`
# 과 `_model_view.policy_generation` 을 함께 올렸다(로더가 두 값의 동등을 요구한다 —
# `_aggregate_risk_policy_loader._parse_are_model_view`).
#   * 왜 1 이 하루를 막았나: 이 한도는 **in-flight 상한이 아니라 누적 순델타 상한**이다.
#     step 6 의 cell 은 `conservative_current_usage`(= 이 잎의 durable evidence 를 접은
#     `confirmed_net + unknown_*`, tos.position.conservative_current_usage) 에 이번
#     명령의 효과(1주)를 더해 `effective_limit` 과 비교한다
#     (tos.are.records.ProjectedCell.requested_increment/headroom). 체결된 진입 1건이
#     청산되지 않으면 confirmed_net 이 1 이라 그 뒤 모든 진입이 1 + 1 > 1 로 DENY 된다 —
#     그 세션은 거기서 끝난다. 50 이면 미청산 체결 50건까지 열린다.
#   * 바꾸지 않은 것: 주문 1건의 수량(1주 고정, `order_construction_policy.yaml` ·
#     `venue_constraint_policy.yaml` 의 max_quantity 1), 동시 미결제 송신 1건
#     (`engine.yaml::max_unresolved_send_per_scope`, `risk.yaml::max_in_flight`,
#     `action_flow_policy.yaml::_runtime.limits`), 그리고 커널의 no-pyramiding
#     (step 8 `verdict_for_scope` — outstanding reservation 이 있으면 OPEN 거부).
#     한도는 여전히 강제되고, 바뀐 것은 하루 누적 상한 하나뿐이다.
#
# OPERATOR-FILL BEFORE ACTIVATION (the loader refuses "TBD"): account_scope,
# instrument_scope (same values as venue_constraint_policy.yaml). The
# `tos-runtime print-policy-digests --config-dir <dir>` line is a RECORD only since
# plan S2-a: `safety_activation.yaml` is deleted, so there is no `members:` list to
# transcribe the digest into. Boot still records it in the `*_POLICY_BOUND` evidence.
# =============================================================================

