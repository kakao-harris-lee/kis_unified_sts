# =============================================================================
# 승인 출처: operator 2026-09-18 설정값 승인 · 2026-09-23 제안표 채택 확정 ·
#            docs/plans/2026-09-18-tos-config-value-proposal.md §4.2 · §3 · §4.3
#
# 제안표 §0 — 이 파일이 무엇이고 무엇이 아닌가:
#   **이것은 첫 부팅 프로파일이지 운영 안전 태세가 아니다.** 여기 적힌 값들은
#   `run` 이 로컬 헤르메틱 환경에서 구동하도록 만드는 값이다. 구조적으로
#   유효하고 서로 정합하지만, **실 자금·실 주문을 전제한 안전 한도가 아니다.**
#   실 배포 태세는 별도 승인 사안이며, 이 표를 근거로 그 승인을 대신할 수 없다.
#
# 원본 템플릿: tos/runtime/config/authority.example.yaml
# 로더: tos_runtime.authority.epoch.load_authority_config (authority/epoch.py:211)
# 호출부: compose/_wiring.py:427 (무조건)
# =============================================================================

# [O] 제안표 §4.2 — VER-002 에 이 경계를 이름 붙인 키가 **없다**(example 주석이
# 2026-09-08 grep 결과로 명시). 1000(MAX_time_conservative_freshness_age_ms 와 정렬)은
# paper/LONG/SHORT 트리의 값으로 남는다.
#
# ⚠ **이 트리만 90000 — operator approved 2026-10-24: covers the 60 s closed-session
#   evaluation cadence + one pass** (B5, option (A)). 1000 에서는 장 마감 중 시간 평가가
#   60 s(marketfeed.yaml time_evaluate_closed_interval_ms)마다라 08:55 부팅의 증인이 09:00
#   개장 순간 영구히 만료됐다(2026-10-24 드라이런 실측 · 시험
#   tos/runtime/tests/compose/test_authority_heartbeat.py). 같은 결정으로 증인은 이제 매 패스
#   실제 RCL read_linearizable + TRUSTED 시계로 재검증된다(compose/_authority_heartbeat.py) —
#   이 값은 「캐시된 증인의 나이」가 아니라 「연속한 두 성공 온라인 검증 사이의 최대 간격」을
#   묶는다. 위 「신선도 경계와 정렬」 논거는 이 트리에서 이 결정으로 대체된다. 만료 뒤 회복은
#   여전히 없다(재부팅만).
containment_bound_ms: 90000

# ⚠ **[D] 지시를 이름 규칙으로 대체한 자리다 (review-794 MEDIUM-3 — 운영자가 볼 자리).**
# 제안표 §3 4행은 이 키를 **[D] 도출**로 두고 「현재 활성 `TradingApprovalPolicy` 의
# `policy_generation` 을 그대로」를 지시하며, 선행 조건은 「그 정책이 먼저 존재해야
# 함」이다. **이 배포 디렉터리에 그 정책 파일이 없으므로 도출 원천이 없다.**
# 「명령으로 얻는다, 손으로 짓지 않는다」가 붙은 값이 규칙으로 치환된 것이므로 명시한다.
#
# 다만 **지어낸 값은 아니다** — 두 독립 원천이 같은 1 을 가리킨다:
#   (a) docs/plans/2026-09-12-tos-operator-value-proposals.md §2
#       `authority.trading_approval_policy_generation` 행 = **1** · 등급 C ·
#       근거 「현재 로드되는 `TradingApprovalPolicy.policy_generation` 과 일치해야 함
#       (승인 파일 세대 1)」.
#   (b) 제안표 §4.3 「`*_generation` 계열은 전부 1(첫 세대)」.
# IntentRegistry
# .decision_current 는 결정의 자기 세대와 이 값의 **동등 비교만** 한다
# (tos_runtime.authority.iap) — 승인 파일(custody_root/approvals/)이 다른 세대를
# 들고 오면 그 결정은 current 가 아니게 되며, 그것이 의도된 fail-closed 다.
trading_approval_policy_generation: 1
