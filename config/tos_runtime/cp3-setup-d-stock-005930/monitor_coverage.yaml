# =============================================================================
# monitor_coverage.yaml — TOS paper 배포 승인값 (W-A / A-2)
# =============================================================================
# 승인 출처: operator 2026-09-18 설정값 승인 · 2026-09-23 제안표 채택 확정 ·
#            docs/plans/2026-09-18-tos-config-value-proposal.md §4.3 · §6 5항
#
# 제안표 §0 — 이 파일이 무엇이고 무엇이 아닌가:
#   **이것은 첫 부팅 프로파일이지 운영 안전 태세가 아니다.** 여기 적힌 값들은
#   `run` 이 로컬 헤르메틱 환경에서 구동하도록 만드는 값이다. 구조적으로
#   유효하고 서로 정합하지만, **실 자금·실 주문을 전제한 안전 한도가 아니다.**
#   실 배포 태세는 별도 승인 사안이며, 이 표를 근거로 그 승인을 대신할 수 없다.
#
# 원본 템플릿: tos/runtime/config/monitor_coverage.example.yaml
# 로더: tos_runtime.safety.monitoring.MonitoringService (→ tos.stm.MonitorCoverageManifest)
# 호출부: compose/_safety_wiring.py:530 (무조건)
# =============================================================================
#
# `items` 는 **정확히 세 의무**여야 한다 — 이 서비스의 자기관측 코드가 평가할 줄
# 아는 것이 그 셋뿐이다(example 주석): evidence-tip-currency · time-service-health ·
# inbox-backlog.
#
# 항목별 `*_present` 플래그는 **운영자 선언**이다. 서비스의 alert/evidence/
# restrictive-response/currentness 경로는 실제로 존재하지만(그 경로가 곧
# STM_ALERT 발행 · clear() · dimension_report() 다), 플래그 자체는 config 선언이라
# 미래에 의무가 추가돼도 조용히 「예」로 기본값이 잡히지 않는다 — 그래서 여기서
# 명시적으로 `true` 라고 적는다.
#
# **인용 정정 (review-794 LOW-1).** 이 초판은 그 `true` 들을 「제안표 §4.3 의 양의
# 확약 부류」라고 적었는데 **§4.3 에 그런 범주는 없다** — §4.3 이 정하는 것은
# 식별자 명명 규칙 · `*_generation`=1 · `not_expired` · `is_complete`/`is_current` ·
# 이름을 댄 7개 빈 목록뿐이고 `*_present` 5종과 `criticality` 는 다루지 않는다.
# 실제 출처는 **더 이른 운영자 값 제안표**다:
#   docs/plans/2026-09-12-tos-operator-value-proposals.md §4 「coverage manifest」 행 —
#   「`cov-paper-1` · generation 1 · digest = 실 digest · `is_complete: true` ·
#    items 3(evidence-tip-currency, time-service-health, inbox-backlog) 전부
#    `restrictive_response_present/alert_path_present/evidence_path_present/
#     currentness_rule_present/closure_1_to_12_complete: true` · criticality
#    `CRITICAL`」 · 등급 C/M · 근거 「세 항목 모두 실 감지기가 있음(W3.1 stm)」.
# 식별자만 제안표 §4.3 의 최신 명명 규칙(`tos-paper-<무엇>-g<세대>`)으로 바뀌었다.
# =============================================================================

coverage:
  manifest:
    # 제안표 §4.3 식별자 규칙: `tos-paper-<무엇>-g<세대>`, 세대는 1.
    coverage_manifest_id: "tos-paper-coverage-manifest-g1"
    coverage_generation: 1
    # ⚠ **`*_digest` 이름이지만 §0.2 가 「채우지 않는다」고 못박은 그 필드가 아니다**
    # (review-794 LOW-2 — 이름만 보면 §0.2 위반으로 읽힌다).
    #   * §0.2 의 대상은 **정책 문서의 `canonical_digest` 계열**이다
    #     (`check_canonical_digest` 가 `"TBD"` 를 항상 통과시키고, 진짜 엄격 동등이
    #      요구되는 곳은 `safety_activation::members[].digest` 라는 이유로).
    #     이 배포의 18종에 `canonical_digest` 실값은 **0건**이다.
    #   * 아래 둘은 **계산 원천이 아예 없는 불투명 참조 토큰**이다 — 이 서비스는
    #     `.issue()` 를 호출하지 않는다(example 주석: 「An opaque operator-approved
    #     reference token — never computed locally」). `null` 은 로더가 거부하므로
    #     「채우지 않는다」가 선택지가 아니고, 계산할 원천도 없으므로 **이름을 준다.**
    #   * 2026-09-12 §4 는 여기에 「digest = 실 digest(운영자 산출 · `sha256sum`)」를
    #     제안했다(등급 M — 운영자가 파일 확정 후 산출). 그 산출이 아직 없으므로
    #     제안표 §4.3 명명 규칙으로 두고, 운영자가 실 digest 를 넣을 자리로 남긴다.
    coverage_manifest_digest: "tos-paper-coverage-manifest-digest-g1"
    policy_digest: "tos-paper-coverage-policy-digest-g1"
    is_complete: true
  items:
    evidence-tip-currency:
      restrictive_response_present: true
      alert_path_present: true
      evidence_path_present: true
      currentness_rule_present: true
      closure_1_to_12_complete: true
      criticality: "CRITICAL"
    time-service-health:
      restrictive_response_present: true
      alert_path_present: true
      evidence_path_present: true
      currentness_rule_present: true
      closure_1_to_12_complete: true
      criticality: "CRITICAL"
    inbox-backlog:
      restrictive_response_present: true
      alert_path_present: true
      evidence_path_present: true
      currentness_rule_present: true
      closure_1_to_12_complete: true
      criticality: "CRITICAL"
  # ==========================================================================
  # 운영자 결정 2026-09-23: 「확정할 부분 **추천 값이 있으면 활용**」.
  #
  # **제안표 §6 5항의 「상위 원천 미확인」은 재조사로 반증됐다.** 더 이른 운영자
  # 값 제안표가 이 세 값을 정확히 제안하고 있다:
  #   docs/plans/2026-09-12-tos-operator-value-proposals.md §4 「coverage bounds」 행 —
  #   「`max_evidence_tip_stall_ms` **60000** · `healthy_time_states` **[TRUSTED]** ·
  #    `max_inbox_unconsumed` **100**」 · 등급 C ·
  #   근거: 「stall 60s 는 driver 무동작 감지 · 작을수록 보수(오탐 증가) ·
  #         **서버 실측 후 하향**」.
  # 그 §4 는 「paper(합성 transport · KIS MOCK dry_run) 용 최소 보수 문서」를
  # 표제로 달고 있고, 이 세 값은 **런타임 자기관측 임계값**(증거 tip · 시계 건강 ·
  # 인박스 적체)이라 자산군과 무관하다 — SYNTHETIC_FUTURES_ORDER 스코프에 그대로 적용된다.
  #
  # ⚠ 여전히 **등급 C(개발 측 보수 제안)** 이다. 실측 기준선이 아니며, 원 제안이
  # 스스로 「서버 실측 후 하향」을 지시한다. 이 셋은 감시 임계값이라 틀리면
  # 실명(失明)하거나 거짓 경보를 낸다 — 운영 실측이 생기면 갱신할 자리다.
  # ==========================================================================
  bounds:
    # 2026-09-12 §4 · 등급 C. 증거 저장소의 마지막 커밋 seq 가 이 시간 동안
    # 전진하지 않으면 stall 로 판정한다(연속 clear() 호출 간 검출기).
    max_evidence_tip_stall_ms: 60000
    # 2026-09-12 §4 · 등급 C. `tos.time.HealthState` 5개 멤버
    # (UNINITIALIZED/SYNCHRONIZING/TRUSTED/DEGRADED_HOLDOVER/UNTRUSTED) 중
    # 「건강」으로 인정하는 집합 — TRUSTED 하나뿐이 가장 좁은 선언이고,
    # example 주석의 예시(`e.g. ["TRUSTED"]`)와도 일치한다.
    healthy_time_states: ["TRUSTED"]
    # 2026-09-12 §4 · 등급 C. 현재 미소비 엔진 인박스 행 수의 허용 상한.
    max_inbox_unconsumed: 100
