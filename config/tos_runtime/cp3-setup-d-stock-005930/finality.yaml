# [2026-09-23 갱신 — W-A / A-5] 부팅 증명 픽스처 — 승인된 recipe 아님 · 운영자 선택 (가) 2026-09-23
#
# 설계 docs/plans/2026-09-23-tos-paper-coordinates-and-first-boot-design.md 의
# 운영자 결정 3 · §2 5항 · §4 2항이 아래 셋의 처분을 바꿨다. **아래 「[미확정]」
# 블록은 2026-09-23 이전 상태의 기록이며, 두 키는 그 뒤 채워졌다.**
#
#   1. `value_date: "T+1"` — **운영자 결정 2026-09-23**(설계 문서 머리 결정 3):
#      「`finality.yaml::value_date` = `T+1`(선물 일일정산)」. 아래 3항이 남겨둔
#      「운영자 한 줄 확인이 필요한 자리」가 그 한 줄로 닫혔다. 2026-09-12 §5 의
#      `T+2`(KRX **주식** 결제일)는 이 배포의 `SYNTHETIC_FUTURES_ORDER` 스코프와
#      어긋나므로 쓰지 않는다 — 아래 3항의 판단은 유지된다.
#      커널은 이 값을 **불투명 토큰**으로만 다룬다.
#   2. `proof_recipe_id: "tos-paper-proof-recipe-bootproof-g1"` —
#      **부팅 증명 픽스처 · 승인된 recipe 아님.** 아래 1항의 실측(ADR-002-030 §29 는
#      열린 질문이고 승인된 식별자를 하나도 명명하지 않는다)은 **그대로 유효하다.**
#      설계 §2 5항이 그 공백을 부팅 증명 픽스처 규율로 메우기로 했고, 운영자가
#      선택지 (가)를 선택했다: 승인된 recipe 가 존재하지 않으므로 **승인을 주장하지
#      않는 불투명 토큰**을 넣고, 그 사실을 값 옆에 적는다. 승인된 recipe 가
#      등록되면 즉시 교체한다 — 이 토큰은 「이 배포가 무엇으로 증명했다」는 주장이
#      아니라 「아직 승인된 recipe 가 없다」는 표기다.
#   3. `source_revision` — **여전히 null(named-TBD).** 아래 2항 그대로: 자기참조라
#      커밋 파일이 담을 수 없다. 설계 §2 5항에 따라 **렌더 시점에만** 채운다 —
#      `scripts/tos/render_paper_config.py` 가 원본 체크아웃의
#      `git rev-parse HEAD` 를 이 줄에 기입한다. 저장소에는 계속 null 로 남는다.
#
# =============================================================================
# [미확정 — 2026-09-23 이전 기록] 제안표 §6 1·2항 — **셋 다 채우지 않는다.**
# 운영자 결정 2026-09-23 「추천 값이 있으면 활용」에 따라 저장소를 재조사한 결과와
# 그 처분을 키별로 적는다. **셋 다 「추천값 없음」 또는 「범위 불일치」다.**
#
#   1. `proof_recipe_id` — **추천값 없음 (2중 확인).**
#      (a) ADR-002-030 §29 는 절 제목 자체가 "Open Implementation Questions" 이고
#          Q3 은 「Which finality recipes distinguish instruction acceptance,
#          settlement, cash availability, …?」라는 **열린 질문**이다. 그 절은 승인된
#          식별자를 **하나도 명명하지 않는다**(같은 절 말미: "Unresolved questions
#          reduce or prohibit live scope. They never permit a weaker default").
#      (b) docs/plans/2026-09-12-tos-operator-value-proposals.md §5 도 이 키를
#          **등급 M**(운영자·서버에서만 산출)으로 두고 「spec 에서 복사(**문서에
#          리터럴 미고정** — spec PR 로 고정 요청)」라고 적는다. 그 문서 §10:
#          「등급 M 항목은 …… **개발 측 값 제안 없음**」.
#      즉 찾지 못한 것이 아니라 **아직 존재하지 않는다.** 지어내면 「승인된 recipe 로
#      증명했다」는 거짓 주장이 된다.
#
#   2. `source_revision` — **추천값 없음(등급 M).** 2026-09-12 §5 는 「**배포 git
#      SHA**」라는 *산출 방법*을 적되 등급을 **M** 으로 두어 개발 측 값 제안을 하지
#      않는다. 게다가 이 파일을 담은 커밋의 SHA 는 파일을 쓰는 시점에 존재하지
#      않으므로(자기참조) 저작 측이 채울 수 있는 값이 아니다. 운영자/배포 절차가
#      채울 자리다.
#
#   3. `value_date` — ⚠ **추천값은 있으나 이 배포의 범위와 어긋난다 → 적용하지 않음.**
#      2026-09-12 §5 는 「**`T+2`**(토큰 · KRX **주식** 결제일)」 · 등급 B 를 제안한다.
#      그러나 이 배포가 채택한 스코프는 `SYNTHETIC_FUTURES_ORDER`(선물)이고, KRX
#      지수선물은 주식과 결제 주기가 다르다. 커널이 이 값을 **불투명 토큰**으로만
#      다루므로 `T+2` 를 넣어도 로더는 통과하지만, 그것은 **주식 결제일 토큰을 선물
#      스코프에 붙인 틀린 값에 인용을 입힌 것**이 된다. 「추천값 없음」도 아니고
#      「그대로 적용」도 아닌 세 번째 경우라 **운영자 한 줄 확인이 필요한 자리**로
#      남긴다(스코프가 주식으로 바뀌거나 선물 결제 토큰이 승인되면 즉시 채운다).
#
# 로더는 남은 null 을 named-TBD 로 거부한다 — 2026-09-23 갱신 이후 이 파일의 거부 키는
# `'source_revision'` 이다(posttrade/config.py:139-142 의 선언 순서).
# =============================================================================
value_date: "T+1"
source_revision: null
proof_recipe_id: "tos-paper-proof-recipe-bootproof-g1"
