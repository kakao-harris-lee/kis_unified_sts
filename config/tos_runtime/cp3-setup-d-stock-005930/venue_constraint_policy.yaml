# Venue Constraint Policy — CP-3 tenant (Setup D / LONG) / KRX 유가증권시장 주식 005930
# =============================================================================
# INSTANCE of tos-spec/src/part-1-foundation/verification/VENUE-CONSTRAINT-POLICY-template.yaml
# (placement + activation per tos-spec/src/decision-records/DR-0002 §2.1/§2.2).
#
# ⚠ TENANT TREE (rescope M2, 2026-10-22) — `cp3-setup-d-long/` 의 같은 파일에서 갈라졌다.
#   운영자 결정 2026-10-22: 종목 005930 · Setup D LONG 그대로 · 수량 1주 고정 · 주식 정규장
#   09:00~15:30 KST (docs/plans/2026-10-22-tos-rescope-plan.md §3 M2).
#   런타임이 읽는 값 차이(LONG 대비):
#     * `scope.market_segments` KRX_DERIVATIVES → KRX_STOCK
#     * `_model_view.shape_constraints.tick_size` 2 → null, `price_band_ticks` 표 추가 (아래)
#     * `_model_view.shape_constraints.max_quantity` 10000 → 1 (아래)
#     * `_runtime.instrument_class` krx-index-futures → krx-stock (이 트리 calendar.yaml 의
#       `krx-stock` 세션 = CONTINUOUS 09:00-15:30)
#     * `_runtime.quantity_unit` CONTRACTS → SHARES
#     * `_runtime.band_source` — LONG 과 같은 `producer_journal` 블록(PR-3a, 아래). 주식 band 줄은
#       band 프로브가 주식현재가 GET(FHKST01010100)으로 쓴다(PR #930).
#     * `policy_id` 를 이 트리 전용으로 바꿨다(내용이 다르면 id 도 다르다 — LONG 헤더의 규칙).
#
# APPROVAL PROVENANCE:
#   * **호가가격단위 = `_model_view.shape_constraints.price_band_ticks` 표(×100 정수 척도).**
#     KRX 주식 호가가격단위는 **가격대별 사다리**다 — 2023-01-25 시행 개편: 2,000원 미만 1 ·
#     5,000 미만 5 · 20,000 미만 10 · 50,000 미만 50 · 200,000 미만 100 · 500,000 미만 500 ·
#     그 이상 1,000원. 표의 각 행은 그 칸을 ×100 정수로 옮긴 것이다
#     (`band_min`/`band_max` 는 포함 경계, 예: 200,000~499,999.99원 → 20000000~49999999, 틱 50000).
#     1차 출처 — 등급 **R**(공표 규정 원문, 선물 트리 tick 과 같은 등급): 유가증권시장 업무규정
#     제21조 → 같은 시행세칙 제32조(호가단위)제2항제1호(주권) 가~사목, 제177차 판(시행
#     2026-09-14). 7행 모두 일치. 2023-01-25 시행은 같은 세칙 부칙 <제2094호> 제1조.
#     원문 텍스트 · 행 번호: docs/broker-profiles/evidence/2026-10-23-krx-stock-tick-ladder/README.md
#     2차 대조: 한화투자증권 호가가격단위 안내
#     https://www.hanwhawm.com/main/center/info/CS181_3p.cmd — #929 리뷰어가 이 표와
#     1,002,782개 가격에서 대조해 불일치 0건을 확인했다.
#     ⚠ **남은 잔여 위험**: 브로커가 보고하는 `aspr_unit`(주식현재가 GET FHKST01010100 응답의
#       그 시점 칸 호가단위)과의 대조는 band 프로브가 세션마다 하고, 다르면 band 줄을 쓰지
#       않는다(PR #930). 장중 실측 기록은 아직 없다. 커널 `PriceBandTick` 주석은 행이 브로커
#       측정값이라고 적지만, 이 표의 행은 규정에서 왔다 — 그 차이가 이 잔여 위험이다.
#     * 커널은 표가 있으면 표만 읽는다(`tos.venue.predicates._resolved_tick`) — 그래서
#       `tick_size` 는 **null** 이다(둘 다 쓰면 로더가 거부한다: 한 사실에 두 원천).
#     * 맨 위 행은 9,999,999.99원(band_max 999999999, ×100 포함 경계)에서 닫는다. KRX 에 가격
#       상한은 없지만 표는 유한한 정수를 요구한다. 그 위 가격은 어느 행도 덮지 않아 **UNKNOWN**(송신 0)이다 —
#       넓히지 않는다(커널 규칙). 005930 종가는 268,500~276,000원(2026-10-01~08).
#     * 종전(#926) 판은 이 자리에 평평한 `tick_size: 50000`(500원 한 칸)을 썼다. 그 판에서는
#       199,900원(100원 칸의 정상 호가)이 INADMISSIBLE 로 막혔다 — 이 표가 고친 입력이다.
#   * **max_quantity 1 — 운영자 결정 2026-10-22 「수량 1주 고정」.** venue 의 상한이 아니라
#     이 배포의 상한이다(더 좁은 쪽). OCP sizing 의 max 1 과 같다.
#   * lot_size / min_quantity 1 = 1주(주식 매매수량단위 1주).
#   * price_min / price_max: null — 주식 가격제한폭은 **일별 동적 값**(기준가 ±30 %)이라
#     정적 리터럴로 쓸 수 없다. 그래서 둘 다 null 이고 `_runtime.band_source`(producer_journal,
#     PR-3a)가 세션마다 채운다: band 프로브가 주식현재가 GET(FHKST01010100 의 stck_mxpr /
#     stck_llam / stck_sdpr, PR #930)으로 쓴 줄 하나. 줄이 없으면(프로브 실패 · 브로커
#     aspr_unit 이 호가 사다리와 다름) 그 세션의 모든 시도는 step 3 UNKNOWN 으로 끝난다(송신 0).
#   * admitting session phase = 이 트리 calendar.yaml 의 `krx-stock` `CONTINUOUS`.
#
# OPERATOR-FILL BEFORE ACTIVATION (the loader refuses "TBD"):
#   1. scope.accounts  — the **stock** MOCK account (RENDER.yaml `account.env_key`).
#   2. scope.instruments — `005930`.
#   3. digests as in the LONG tree's header (render writes `members:`).
