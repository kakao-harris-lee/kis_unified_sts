# Venue Constraint Policy — CP-3 tenant (Setup D / LONG) / KRX 유가증권시장 주식 005930
# =============================================================================
# INSTANCE of tos-spec/src/part-1-foundation/verification/VENUE-CONSTRAINT-POLICY-template.yaml
# (placement + activation per tos-spec/src/decision-records/DR-0002 §2.1/§2.2).
#
# ⚠ TENANT TREE (rescope M2, 2026-10-22) — `cp3-setup-d-long/` 의 같은 파일에서 갈라졌다.
#   운영자 결정 2026-10-22: 종목 005930 · Setup D LONG 그대로 · 수량 1주 고정 · 주식 정규장
#   09:00~15:30 KST (docs/plans/2026-10-22-tos-rescope-plan.md §3 M2).
#   런타임이 읽는 값 차이(LONG 대비):
#     * `scope.market_segments` KRX_DERIVATIVES → KRX_STOCK
#     * `_model_view.shape_constraints.tick_size` 2 → 50000 (아래)
#     * `_model_view.shape_constraints.max_quantity` 10000 → 1 (아래)
#     * `_runtime.instrument_class` krx-index-futures → krx-stock (이 트리 calendar.yaml 의
#       `krx-stock` 세션 = CONTINUOUS 09:00-15:30)
#     * `_runtime.quantity_unit` CONTRACTS → SHARES
#     * `_runtime.band_source` 삭제 — band 원천 없음(아래). `_runtime.price_scale: 100` 은
#       **남긴다**(PR #927 리뷰 M1): kis-mock 부팅이 `kis_mock_transport.yaml::price_scale`
#       을 이 값과 대조하고, 없거나 다르면 부팅을 거부한다(ORD_UNPR = 가격 / price_scale).
#     * `policy_id` 를 이 트리 전용으로 바꿨다(내용이 다르면 id 도 다르다 — LONG 헤더의 규칙).
#
# APPROVAL PROVENANCE:
#   * **tick_size 50000 = 500원 at the ×100 integer price scale.** KRX 유가증권시장 주식
#     호가가격단위는 **가격대별 사다리**다(2023-01-25 시행 개편 표: 2,000원 미만 1 ·
#     5,000 미만 5 · 20,000 미만 10 · 50,000 미만 50 · 200,000 미만 100 · 500,000 미만 500 ·
#     그 이상 1,000). 이 정책 문서의 `tick_size` 는 **한 칸**만 받고, 커널의 가격대별
#     `price_band_ticks` 표를 런타임이 읽는 경로는 아직 없다(tos_runtime 에 로더 없음).
#     005930 의 최근 종가는 그 사다리의 **200,000~500,000 칸**에 있다(로컬 일봉 Parquet
#     `data/market/stock/daily/code=005930`, 2026-10-01~08 종가 268,500~276,000원) → 500원.
#     등급 **C** — 조문 번호는 인용하지 않았다(확인 안 됨). 운영자 확인 대상.
#     ⚠ **실패 방향은 닫힘이다**: 가격이 200,000원 아래로 내려가면(−26 %) 실제 호가단위가
#       100원이 되어 500 의 배수가 아닌 정상 호가가 INADMISSIBLE 로 막힌다(송신 0).
#       500,000원 이상이면 실제 단위 1,000원의 배수는 모두 500 의 배수라 통과하고,
#       500 의 배수이지만 1,000 의 배수가 아닌 가격은 브로커가 거부한다.
#   * **max_quantity 1 — 운영자 결정 2026-10-22 「수량 1주 고정」.** venue 의 상한이 아니라
#     이 배포의 상한이다(더 좁은 쪽). OCP sizing 의 max 1 과 같다.
#   * lot_size / min_quantity 1 = 1주(주식 매매수량단위 1주).
#   * price_min / price_max: null — 주식 가격제한폭은 **일별 동적 값**(기준가 ±30 %)이라
#     정적 리터럴로 쓸 수 없다. 이 트리에는 **band 원천이 없다**: LONG 트리의 band 원천은
#     선물 band TR(FHMIF10000000) 생산자 경유다. band 프로브는 이제 주식 설정이면 주식현재가
#     GET(FHKST01010100 의 stck_mxpr/stck_llam/stck_sdpr)으로 band 줄을 쓸 수 있지만
#     (tools/tos_cp3/live_producer/band_probe.py), 이 트리는 아직 `_runtime.band_source` 를
#     선언하지 않는다. 그래서 **오늘 이 트리의 모든 시도는 step 3 UNKNOWN 으로 끝난다**
#     (송신 0) — LONG 트리 band 이전과 같은 정직 상태. 이 트리에 band 원천을 켜는 것은
#     M2 의 남은 일이다.
#   * admitting session phase = 이 트리 calendar.yaml 의 `krx-stock` `CONTINUOUS`.
#
# OPERATOR-FILL BEFORE ACTIVATION (the loader refuses "TBD"):
#   1. scope.accounts  — the **stock** MOCK account (RENDER.yaml `account.env_key`).
#   2. scope.instruments — `005930`.
#   3. digests as in the LONG tree's header (render writes `members:`).
#
# The rule-list keys below are template DATA (preserved, never interpreted by
# the runtime — DR-0002 §2.1); the runtime reads kernel-typed content from
# `_model_view` and runtime-only facts from `_runtime`.
# =============================================================================

