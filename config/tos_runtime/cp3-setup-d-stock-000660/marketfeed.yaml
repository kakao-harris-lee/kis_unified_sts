# marketfeed.yaml — TOS paper 배포 **부팅 증명 픽스처** (W-A / A-5)
# 부팅 증명 픽스처 — 거래 전략 아님 · 대칭은 전략 제안 경로 착지 후 · 운영자 선택 (가) 2026-09-23
# 출처: docs/plans/2026-09-23-tos-paper-coordinates-and-first-boot-design.md §4 5항 ·
#       운영자 선택 (가) 2026-09-23 · 상위 계획 §7.8 A-5
#       (「로컬 헤르메틱 틱 원천이 존재하는지는 측정했다: 존재한다.
#         `marketfeed.yaml::intake_kind: journal` 이 그것이고, 구현
#         `tos_runtime/marketfeed/journal.py::JsonLinesObservationJournal` 은
#         json+pathlib 만 쓰며 소켓을 열지 않고 시계도 읽지 않는다」).

instruments: ["TBD"]

instrument_class: "krx-stock"

account: "TBD"

direction: "LONG"
quantity_basis: "RISK"
unit: "SHARES"

intake_kind: "journal"

journal_path: "TBD"

poll_interval_ms: 400

journal_pass_allowance_ms: 100

time_evaluate_closed_interval_ms: 60000

snapshot_age_bound: 20
interval_width: 10

# SAFETY: 이 블록을 끄면 이 트리 전략의 `capsule.position.*` 참조가 부팅에서 거부되고(`tos_runtime/strategy/resolve.py::_refuse_unresolvable_position_refs`), 그 거부마저 없으면 선언한 손절·목표가 매 봉 거짓으로 남아 영영 발화하지 않는다. `bar_interval_ms` 는 이 트리의 봉 주기(1분, `time_evaluate_closed_interval_ms` 와 같은 값)이고 `bars_held` 가 그것으로 나눈다.
position_context:
  enabled: true
  bar_interval_ms: 60000
