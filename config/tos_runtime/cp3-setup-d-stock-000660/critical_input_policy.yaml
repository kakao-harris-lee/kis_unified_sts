# critical_input_policy.yaml — CP-3 tenant (Setup D / LONG) **필드 선언**
# ── `max_age_ms` ×15 = 800 — 「운영자 결정 2026-10-09: 800 ms (= 커널 시간 예산 1000 − Σ지연 200)」 · 등급 A(운영자 결정 2026-10-09) ──
# ── 등급 A(운영자 결정 2026-10-09) ─────────────────────────────────────────────
# 등급 어휘는 `docs/plans/2026-09-12-tos-operator-value-proposals.md:4` 다. **A** 는 「규범
# 문서에 이미 승인된 값(VER-002 `APPROVED`)」이고, 800 을 만드는 **두 항이 모두 그것**이다
# (좌표는 `tos-spec/src/part-1-foundation/verification/VERIFICATION-PROFILE-002.yaml`):
#   * 피감수 **1000** — `MAX_time_conservative_freshness_age_ms`,
#     VERIFICATION-PROFILE-002.yaml:1078 · APPROVED 2026-09-04. 그 항목 자신이 근거로
#     「> Σ delay-class bounds 200 ms, conservative direction LOWER」를 적는다.
#   * 감수 **200** — 런타임이 `delay_bounds` 로 더하는 네 항 × 50:
#     `MAX_time_transport_and_queue_uncertainty_ms` :1069 ·
#     `MAX_clock_domain_conversion_uncertainty_ms` :1070 ·
#     `MAX_time_source_precision_ms` :1076 ·
#     `MAX_time_source_sequence_gap_ms` :1077 — 전부 APPROVED 2026-07-29.
#     네 항의 정본은 `_DELAY_BOUND_FIELDS` 이고 위 좌표는 그 네 이름을 VER-002 에서 찾은
#     것이다. ⚠ **값이 같아 조용히 통과하는 이웃 둘을 섞지 말 것** —
#     `MAX_time_source_disagreement_ms` :1071 은 똑같이 50 이지만 지연 한도가 **아니고**,
#     `MAX_critical_input_consumer_receipt_age_ms` :1067 은 똑같이 1000 이지만 **다른 경계**다
#     (이 저장소는 전자를 이미 한 번 잘못 셌다 — `test_deploy_policies.py` 의
#      `_TIME_DELAY_BOUND_KEYS` 주석).
# 괄호 안 「운영자 결정 2026-10-09」은 같은 표에서 `trading_calendar_version`(:22)이 쓰는
# **A(§11 결정 11)** 과 같은 꼴이다: 값 자체는 규범 승인치이고, 운영자 결정은 **이 키를 그
# 승인치에 결속한다**는 판단이다.
# ⛔ **M 이 아니다.** M 은 「운영자·서버에서만 산출 가능」이고 그 표의 M 행은 전부 호스트·
# 운영자만 아는 사실이다(`tz_db_version` :21 · `verification_profile_version` :23 ·
# `finality.source_revision` :78 · `ACNT_PRDT_CD` :93). 800 은 저장소 안에서 도출되므로
# 그 정의에 해당하지 않는다. (이 PR 의 초판이 M 으로 적었다 — 리뷰 M2 에서 정정.)
# ── 구속 결과: ③ 은 저널 append 시각을 as_of_ms 로 찍어야 한다 ──────────────────
# `max_age_ms` 와 커널 시간 경로는 **같은 양**을 잰다 —
# `tos_runtime/marketfeed/snapshot.py::_derive_field_state` 의 `if now_ms - as_of_ms >
# spec.max_age_ms: return FieldState.UNKNOWN, "stale"` 와 `marketfeed/time_projection.py` 의
# `source_age = wall_clock_now() - as_of`. 그러므로 **현행 B1a 의미론에서는 열다섯 전부
# STALE 이다**: `as_of_ms` 가 봉의 **라벨(OPEN)** 이고(`produce_fields.derive_as_of_ms`
# 독스트링: 「Epoch milliseconds of the bar's LABELLED minute. **The label, not label+60s**」)
# B1a 가 쓰는 봉은 1분이므로(`derive_raw_event_id`: `<symbol>:1m:<...>`) 관측이 가질 수 있는
# **최소** 나이가 60,000 ms 다. 60,000 > 800 이므로 `_derive_field_state` 가 필드마다
# `(UNKNOWN, "stale")` 를 돌려주고, 커널의 ∅/UNKNOWN 바닥이 그 키들을 떨어뜨려
# (`tos/src/tos/marketfeed/value.py`) R1 의 AND 가 거짓 → NO_ACTION, 송신 0 이다(fail-closed).
# → **그러므로 이 값은 ③ 에 대한 요구사항이다**: ③ 실시간 생산자는 상주 저널 수집기처럼
# 저널에 append 하는 시각을 `as_of_ms` 로 찍어야 한다(그 수집기는 「an honest source event
# time」을 찍는다 — `marketfeed/scheduler.py::_finalize_pending`). 라벨 스탬프 생산자는 이
# 트리를 **결코** 결정까지 끌고 가지 못하고, 그것은 한도를 올려서 고칠 수 있는 문제가
# **아니다** — 올리면 커널 시간 경로가 같은 관측을 같은 양으로 재서 STALE 로 거부한다.
# ③ 착지 시 이 셋이 **한 예산을 나눠 쓴다**: 이 키 ×15 · `poll_interval_ms` ·
# `journal_pass_allowance_ms`(저널 pacing 가드가 뒤 둘의 합을 같은 800 ms 에 댄다 —
# `compose/_marketfeed_wiring.py::_load_config_within_freshness_budget`).
# ── 180000 은 폐기됐다 (연혁) ───────────────────────────────────────────────────
# 2026-10-09 초판은 「출처가 없어도 설정이 필요하니 적용」 지시에 대해 **봉 주기에서**
# 3P = 180,000 을 도출해 적었다(등급 C): 라벨 T 의 봉은 T+1P 에 닫히고 T+2P 에 교체되므로
# 2P = 120,000 은 하한(infimum)이고 세 번째 P 가 발행·폴 지연 여유라는 논증이었다.
# **그런데 같은 헤더가 올바른 한도를 이미 지목하고 있었다** — main `bb9a4d4d` 의 이 파일
# :72-74, 축자:
#   「수집기처럼 **append 시각**을 `as_of_ms` 로 찍으면(저널 수집기는 「an honest source
#    event time」을 찍는다 — `marketfeed/scheduler.py::_finalize_pending`) 올바른 한도는
#    180,000 이 아니라 위 800 ms 예산 자리수다.」
# 즉 800 은 개발 측이 **조건부로 이미 지목한 자리수**였고(조건 = ③ 의 append 시각 스탬프),
# 운영자 결정은 그 조건을 **요구사항으로 승격**하면서 값을 그 자리에 박은 것이다.
# ⚠ 이 PR 의 초판은 그 문장을 「현행 ③ 의미론에서는 성립하지 않는 자리수」라고 **오인용**해
# 「개발 측은 800 을 부정했다」는 근거로 썼다(리뷰 M1). 그런 문장은 `bb9a4d4d` 에 **없다** —
# 옛 헤더는 800 을 부정한 것이 아니라 조건부로 **긍정**했다. 그 오인용은 삭제했다.
# **보수 방향 = 작게.** 너무 작으면 필드가 `UNKNOWN` 이 되어 fail-closed 고, 너무 크면
# **진짜로 낡은 필드가 VALID 로 읽힌다** — 그쪽이 fail-OPEN 이다. 800 은 커널 예산을 넘지
# 않는 **가장 큰** 값이므로 이 방향으로 더 키울 수 없다: 키우면 커널이 거부할 관측을 이
# 로더만 VALID 로 읽는 비대칭이 된다.
# 상주 트리의 **600000 은 베껴 오지 않았다**: 그 근거(「렌더가 저널을 부팅 직전에
# 생성하므로 그 여유는 실제로 그 부팅 지연만 덮는다」)는 **배치 저널 부팅**에만 성립하고
# 이 tenant 의 생산자는 다른 모양이다. B1a 의 필드 lineage 도 unit/scale/multiplier/sign 은
# 적지만 `max_age_ms` 는 적지 **않으므로**(kickoff §5 3 ②, 의도된 차이 B1b-D3) 생산자 쪽에도
# 베껴 올 원천이 없다.

