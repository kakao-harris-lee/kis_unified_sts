#   * flow dimension afg.ORDER, hard/runtime/envelope/decision limits all 1 —
#     one broker mutation in flight for this single-scope paper deployment
#     (consistent with risk.yaml max_in_flight 1).
#   * scope_independence (ACCOUNT): DECLARATIONS about this deployment's
#     structure — one account, one broker, one credential/session, one route,
#     one failure domain; the two "basis is only a local counter / scheduler
#     priority" negatives are false. The runtime evidences these as
#     declarations at boot; it never observes them (DR-0003 §2.3).
#   * deployment_facts: concurrent_consumers_share_one_envelope TRUE (the
#     compose root drives exactly one EngineDriver over one inbox — the
#     envelope is shared by construction; tos.afg.amplification_bounded
#     requires this to be positively true), envelope_reset_on_duplicate
#     FALSE, duplicate_event_created_new_allowance FALSE (the inbox rejects
#     duplicates by signature; a rejected duplicate creates no allowance).
#     NOTE: plan §6 ② listed the three as "(False, False, True)" in a
#     different order; the semantics adopted here are the ones the kernel
#     predicate needs and the deployment actually has.
#   * action_class_map: NEW_LONG/NEW_SHORT → NORMAL_NEW_RISK; DECREASE/CLOSE/
#     REDUCE_ONLY → ORDINARY_REDUCE_OR_EXIT (kernel ActionClassKind tokens).
#   * side_tokens BUY/SELL — must be members of venue_constraint_policy.yaml
#     allowed_sides (compose-time cross-check).
#   * HONEST LIMIT: even with this file active, step 7 (ACTION_FLOW_DECISION)
#     is UNKNOWN today — the duplicate-redelivery and failover-replay axes
#     have no durable per-root-cause observation (plan §7) until the
#     inbox-schema counter wave lands.
#
