# =============================================================================
# evidence_cold_backup.yaml — TOS paper 콜드 백업 (증거 증가 대응 계획 §2 A3)
# =============================================================================
# 계획: docs/plans/2026-09-29-tos-evidence-growth-and-purge-plan.md §2 A3 ·
#       운영자 처분 §6.1-1 「트랙 A = A1 · A2 · A3 모두 착수」(2026-09-29)
# 런북: docs/runbooks/tos-evidence-cold-backup.md
# 원본 템플릿: tos/runtime/config/evidence_cold_backup.example.yaml
# 로더: tos_runtime.operations.cold_backup.load_cold_backup_config
# 호출부: compose/cli.py `cold-backup` (운영자 cron · 부팅 경로 아님)
#
# **이 파일의 세 경로는 호스트 좌표라 저장소가 알 수 없다 — null 로 둔다.**
# 다른 paper 설정의 null 과 같은 뜻이다(named-TBD · 운영자 승인 대기). 로더는
# null 을 기본값으로 메우지 않고 **거부**한다: 짐작한 보관 경로는 콜드 백업이
# 없는 것보다 나쁘다. 있는 것처럼 보이기 때문이다.
#
# 채우는 자리는 **렌더된 off-repo 설정 디렉터리**이거나 커스터디 옆에 둔 운영
# 디렉터리다(런북 §2). 절대경로만 쓴다 — `~` 전개도, 상대경로 해석도, 환경변수
# 치환도 하지 않는다. 세 경로 모두 git 워크트리 안 · 라이브 `--data-dir` 안 ·
# 그 위쪽이면 거부된다.
#
# **여기에는 보존(retention) 손잡이가 없다. 누락이 아니라 결정이다.**
# `backup_set` 은 아무것도 지우지 않고(「Never deleted, never overwritten」),
# 아카이브는 추가이며, 검증된 콜드 사본을 지우는 것은 ADR-002-016 §17 이
# 규율하는 **트랙 B** 다(계획 §4 — 전제 다섯 개 전부 미충족). 사본은 하루
# ≈13 MB 로 쌓인다(계획 §1 실측: 원본 ≈200 MB/일 · 압축 14-21 ×).
# `minimum_free_bytes` 는 그것을 **보이게** 하는 장치이고, 경보가 울렸을 때의
# 답은 저장공간이지 삭제 잡이 아니다.
# =============================================================================

# [호스트 좌표] 비압축 gen{N}/ 세대와 매니페스트가 쓰이는 트리.
# `backup-set --dest` 가 쓰고 `run --backup-root` 가 부팅 때 관측하는 그 트리와
# **같은 디렉터리**를 가리킨다 — 세대 번호를 여기서 읽는다.
backup_root: null

# [호스트 좌표] 콜드 보관소. gen{N}.set.tar.xz 와
# gen{N}.cold-backup.report.json 이 여기로 떨어진다. 가능하면 `backup_root` 와
# **다른 매체**에 둔다 — 같은 디스크의 콜드 사본은 중요하지 않은 고장만 견딘다.
archive_dir: null

# [호스트 좌표] 방금 쓴 아카이브를 되읽어 검증할 때 쓰는 스크래치 부모.
# 세대별 자식 디렉터리는 미리 있으면 안 되고, 검증을 통과하면 지워진다.
# 거부되면 **남겨 두고** 거부 메시지가 그 경로를 말한다.
verify_root: null

# [운영자 승인 필요] 용량 경보(계획 §5). `archive_dir` 파일시스템의 여유가 이
# 바이트 수 미만이면 **쓰기 전에** 거부하고, 이 아래로 내려간 채 끝난 실행은
# stderr 로 경고한다. 기본값을 두지 않는다 — 승인되지 않은 한도를 결정된 값처럼
# 적는 것이기 때문이다. 이 호스트의 실제 여유와 위 증가율로 정한다
# (예: 50 GiB = 53687091200).
minimum_free_bytes: null

# [선택] 생략하면 stdlib lzma 기본 preset 6
# (tos_runtime.operations.backup_archive.DEFAULT_XZ_PRESET) — 계획 §1 실측
# 증거 파일 ≈14 ×. 위 넷과 달리 생략이 허용되는 이유: 빠진 압축률에는 이
# 저장소가 이미 이름 붙인 정답이 있지만, 빠진 보관 경로·용량 바닥에는 없다.
# 키를 적고 null 로 두면 거부된다 — 반쯤 채운 파일이 완성된 것처럼 보이면 안 된다.
# xz_preset: 6
