# [O] 제안표 §4.2 — VER-002 에 키가 **없다**(`EngineConfiguration` 독스트링
# 자신이 「key absent from VERIFICATION-PROFILE-002 — provisional」). **벽시계
# 인터럽트가 아니라 정적 작업 수 비교**라 과대 설정의 위험이 낮다. 2026-09-08
# 부터 열려 있던 운영자 결정 항목이다.
dsl_evaluation_budget_steps: 1000

# [A] 제안표 §2.2 — VER-002 L1010 `MAX_unresolved_send_per_scope: 1`
# (「at most one unresolved send per scope」, APPROVED 2026-07-29 operator
# (Bounds-Approver), review_date 2027-01-29). engine.example.yaml 주석이 이
# 참조점을 명시적으로 가리킨다. 엔진은 이 값에 대해 **제한적으로만** 투영하며
# 여유를 만들어내지 않는다(RFC-002 §9.1:558).
max_unresolved_send_per_scope: 1
