# =============================================================================
# authority.yaml — TOS paper 배포 승인값 (W-A / A-2)
# =============================================================================
# 승인 출처: operator 2026-09-18 설정값 승인 · 2026-09-23 제안표 채택 확정 ·
#            docs/plans/2026-09-18-tos-config-value-proposal.md §4.2 · §3 · §4.3
#
# 제안표 §0 — 이 파일이 무엇이고 무엇이 아닌가:
#   **이것은 첫 부팅 프로파일이지 운영 안전 태세가 아니다.** 여기 적힌 값들은
#   `run` 이 로컬 헤르메틱 환경에서 구동하도록 만드는 값이다. 구조적으로
#   유효하고 서로 정합하지만, **실 자금·실 주문을 전제한 안전 한도가 아니다.**
#   실 배포 태세는 별도 승인 사안이며, 이 표를 근거로 그 승인을 대신할 수 없다.
#
# 원본 템플릿: tos/runtime/config/authority.example.yaml
# 로더: tos_runtime.authority.epoch.load_authority_config (authority/epoch.py:211)
# 호출부: compose/_wiring.py:427 (무조건)
# =============================================================================

# [O] 제안표 §4.2 — VER-002 에 이 경계를 이름 붙인 키가 **없다**(example 주석이
# 2026-09-08 grep 결과로 명시). MAX_time_conservative_freshness_age_ms(1000,
# VER-002 L1078 승인됨)와 정렬한다 — 봉쇄 경계가 신선도 경계보다 길면 만료된
# witness 로 봉쇄를 주장하게 된다.
containment_bound_ms: 1000

# [D]/[O] 제안표 §3(4행) + §4.3 — "현재 활성 TradingApprovalPolicy 의
# `policy_generation` 을 그대로". 이 배포에는 선행 세대가 없으므로 제안표 §4.3
# 의 「`*_generation` 계열은 전부 1(첫 세대)」이 그 값이다. IntentRegistry
# .decision_current 는 결정의 자기 세대와 이 값의 **동등 비교만** 한다
# (tos_runtime.authority.iap) — 승인 파일(custody_root/approvals/)이 다른 세대를
# 들고 오면 그 결정은 current 가 아니게 되며, 그것이 의도된 fail-closed 다.
trading_approval_policy_generation: 1
