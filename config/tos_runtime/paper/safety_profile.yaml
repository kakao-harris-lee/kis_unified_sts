# =============================================================================
# safety_profile.yaml — TOS paper 배포 승인값 (W-A / A-2)
# =============================================================================
# 승인 출처: operator 2026-09-18 설정값 승인 · 2026-09-23 제안표 채택 확정 ·
#            docs/plans/2026-09-18-tos-config-value-proposal.md §4.3
#
# 제안표 §0 — 이 파일이 무엇이고 무엇이 아닌가:
#   **이것은 첫 부팅 프로파일이지 운영 안전 태세가 아니다.** 여기 적힌 값들은
#   `run` 이 로컬 헤르메틱 환경에서 구동하도록 만드는 값이다. 구조적으로
#   유효하고 서로 정합하지만, **실 자금·실 주문을 전제한 안전 한도가 아니다.**
#   실 배포 태세는 별도 승인 사안이며, 이 표를 근거로 그 승인을 대신할 수 없다.
#
# 원본 템플릿: tos/runtime/config/safety_profile.example.yaml
# 로더: tos_runtime.safety.profile.SafetyProfileService (model_validate →
#       tos.spg.RuntimeSafetyProfile)
# 호출부: compose/_safety_wiring.py:516 (`build_safety_mesh`, 무조건)
# =============================================================================
#
# `target_envelope_id`/`target_envelope_generation` 은 이 프로파일이 동작하는
# 봉투 세대를 **정확히** 고정한다 — config/tos_runtime/paper/safety_envelope.yaml
# 의 `envelope.envelope_id`/`envelope_generation` 과 같은 값이어야 한다.
#
# `governed_dimensions` 는 봉투의 지배 차원의 **부분집합**이어야 하고 각 최대치
# 이하여야 한다.
#
# [2026-09-23 운영자 승인 — W-A / A-5] 봉투가
# `INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL` 을 `envelope_max = 1` 로 지배하게 되면서
# (config/tos_runtime/paper/safety_envelope.yaml 헤더), 이 프로파일도 **같은 차원을
# 선언해야 한다** — `tos.spg.predicates.profile_within_envelope`
# (`spg/predicates.py:278-283`)는 봉투가 선언한 차원을 프로파일이 **누락**하면 거부한다
# (SPG-INV-001 「omit」 limb). 「부분집합」은 **비어도 된다는 뜻이 아니다.**
# 1차 판의 「봉투가 0개를 선언하므로 여기도 0개가 유일하게 정합」은 그래서 틀렸다:
# 같은 술어 `:274-277` 이 **빈 봉투 자체를 무권한으로 거부**하므로, 그 조합은 정합한
# 것이 아니라 어느 쪽으로도 통과할 수 없는 상태였다.
# =============================================================================

profile:
  # 제안표 §4.3 식별자 규칙: `tos-paper-<무엇>-g<세대>`, 세대는 1.
  # time.yaml 의 `safety_profile_version` 이 이 토큰을 가리킨다.
  profile_id: "tos-paper-profile-g1"
  profile_generation: 1
  profile_version:
    version: "1"
    effective_date: "2026-09-23"
    evidence_package_version: null
    approver_identity: "operator (System Owner) — 2026-09-18 승인 · 2026-09-23 채택"
    expiration_or_revalidation_date: null
    superseded_version_link: null
    change_classification: null
  target_envelope_id: "tos-paper-envelope-g1"
  target_envelope_generation: 1
  # 운영자 승인 2026-09-23 (위 블록). 프로파일 쪽은 `profile_value`(정확한 운영값)를
  # 싣고 `envelope_max` 는 비운다(tos/src/tos/spg/records.py:87-115).
  governed_dimensions:
    - dimension: "INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL"
      # 이 배포의 **정확한 운영값** = 이미 승인된 유효 한도 1
      # (aggregate_risk_policy.yaml:111 `_runtime.effective_limits`, OCP sizing
      #  `max_quantity: 1`). 봉투 최대치와 같고 봉투 경계가 INCLUSIVE 라 within 이다.
      profile_value: "1"
      unit: "CONTRACTS"
      multiplier: "1"
      sign: "POSITIVE"
      precision: "0"
      rounding: "NEAREST"
      boundary: "INCLUSIVE"
  scope: []
  permitted_behaviors: []
  fallback_rules: []
  evidence_package_ref: null
