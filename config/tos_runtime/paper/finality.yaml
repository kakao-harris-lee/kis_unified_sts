# =============================================================================
# [미확정] 제안표 §6 1·2항 — **셋 다 채우지 않는다.**
#
#   1. `proof_recipe_id` — 「ADR-002-030 §29 Q3 의 승인 식별자를 찾지 못했다」
#      **A-2 재확인(2026-09-23)**: ADR-002-030 §29 는 제목 자체가
#      "Open Implementation Questions" 이고 Q3 은 「Which finality recipes
#      distinguish instruction acceptance, settlement, cash availability, …?」
#      라는 **열린 질문**이다. 그 절은 승인된 식별자를 **하나도 명명하지 않는다**
#      (같은 절 말미: "Unresolved questions reduce or prohibit live scope. They
#      never permit a weaker default"). 즉 찾지 못한 것이 아니라 **아직 존재하지
#      않는다.** 지어내면 「승인된 recipe 로 증명했다」는 거짓 주장이 된다.
#
#   2. `value_date` · `source_revision` — 「불투명 주입 토큰」이라 형식은 자유이나
#      **의미 있는 값을 정할 근거가 없다.** example 주석 재확인 결과(A-2):
#      value_date 는 `ObligationLegScope.value_date`(이 패키지는 clock-free 라
#      시계를 읽지 않는다), source_revision 은 「증명을 취한 소스 리비전」이다.
#      둘 다 **이 배포가 무엇을 가리키는지에 대한 결정**이지 형식 문제가 아니다.
#
# 제안표 §6 말미: 「값을 정하기 전에 판단이 더 필요하다. **부팅이 이것들 때문에
# 막히면 그것이 A-5 의 결과물이다.**」 로더는 이 null 들을 named-TBD 로 거부한다.
# =============================================================================
value_date: null
source_revision: null
proof_recipe_id: null
