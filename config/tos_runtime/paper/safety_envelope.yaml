# =============================================================================
# safety_envelope.yaml — TOS paper 배포 승인값 (W-A / A-2)
# =============================================================================
# 승인 출처: operator 2026-09-18 설정값 승인 · 2026-09-23 제안표 채택 확정 ·
#            docs/plans/2026-09-18-tos-config-value-proposal.md §4.3
#
# 제안표 §0 — 이 파일이 무엇이고 무엇이 아닌가:
#   **이것은 첫 부팅 프로파일이지 운영 안전 태세가 아니다.** 여기 적힌 값들은
#   `run` 이 로컬 헤르메틱 환경에서 구동하도록 만드는 값이다. 구조적으로
#   유효하고 서로 정합하지만, **실 자금·실 주문을 전제한 안전 한도가 아니다.**
#   실 배포 태세는 별도 승인 사안이며, 이 표를 근거로 그 승인을 대신할 수 없다.
#
# 원본 템플릿: tos/runtime/config/safety_envelope.example.yaml
# 로더: tos_runtime.safety.profile.SafetyProfileService (model_validate →
#       tos.spg.HardSafetyEnvelope)
# 호출부: compose/_safety_wiring.py:516 (`build_safety_mesh`, 무조건)
# =============================================================================
#
# =============================================================================
# [2026-09-23 운영자 승인 — W-A / A-5] `governed_dimensions` 1건 채택
# =============================================================================
# **운영자 결정 2026-09-23: Hard Safety Envelope 가
# `INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL` 을 `envelope_max = 1`(계약)로 지배한다.**
# 이것은 **승인된 안전 값**이지 부팅 증명 픽스처가 아니다 — 아래 「빈 것이 사실이다」
# 블록은 2026-09-23 승인 **이전** 상태의 기록으로 남긴다.
#
# 승인 근거(요구가 이미 문서에 적혀 있었다):
#   * `aggregate_risk_policy.yaml:74` `compatibility_requirements` —
#     「HSE must govern INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL with envelope_max ≥ 1」
#   * 그 정책 자신의 이미 승인된 유효 한도 = 1
#     (`aggregate_risk_policy.yaml:111` `_runtime.effective_limits`), 그리고 OCP 사이징의
#     `max_quantity: 1`(`order_construction_policy.yaml` `_runtime.construction.sizing`) —
#     즉 1 은 새 판단이 아니라 이 배포가 이미 승인한 「정확히 한 계약」이다.
#   * 이 값이 없으면 compose 가 부팅 전에 거부한다(`compose/_riskstate_wiring.py:101-107`
#     `RiskPolicyScopeMismatch`).
#
# ⚠ **봉투에 차원을 선언하면 프로파일도 같은 차원을 선언해야 한다.**
# `tos.spg.predicates.profile_within_envelope`(`spg/predicates.py:266-296`)는 (a) 지배
# 차원이 0개인 봉투를 **무권한**으로 보고 어떤 프로파일도 지배하지 못하게 하며(:274-277),
# (b) 봉투가 선언한 차원을 프로파일이 **누락**하면 거부한다(:278-283). 그래서
# `safety_profile.yaml` 에 같은 차원의 `profile_value` 를 함께 기입했다 — 그 값은 위와
# 같은 이미 승인된 유효 한도 1 이다. (부수 사실: **2026-09-23 이전의 「둘 다 빈」 상태는
# 이 술어를 통과할 수 없었다** — :274-277 이 빈 봉투를 명시적으로 거부한다.)
#
# ⚠ **`governed_dimensions` 가 비어 있다는 것의 의미** (2026-09-23 승인 이전 기록).
# 제안표 §4.3: 「`governed_dimensions` · `permitted_scope` · `prohibited_fallbacks`
# … — **아직 지배할 차원도, 기록된 승인도, 발생한 이탈·사고도 없다. 빈 것이
# 사실이다.** 있는 척 채우지 않는다.」 이 봉투가 지배하는 차원이 0개라는 것은
# **아무 것도 허용한다는 뜻이 아니다** — 술어들
# (`profile_within_envelope`/`activation_atomic`/`envelope_bounded`)은 선언되지
# 않은/null 차원을 **가장 제한적으로** 취급한다(example 헤더 주석).
#
# config/tos_runtime/README.md 가 기록한 리스크 상태 서비스 웨이브 조건 —
# 「이 배포가 부팅하는 Hard Safety Envelope 가 정책의 차원
# (`INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL`, `envelope_max ≥ 1`)을 지배해야
# 한다」 — 은 **이 파일이 아직 충족하지 않는다.** 그 차원의 구체적 한도는
# 제안표에 행이 없다(승인 대상이 아니라 별도 안전 승인 사안). 첫 부팅 프로파일은
# 차원을 선언하지 않고, 그래서 그 경로는 보수적으로 막힌다 — 이것이 §0 이 말한
# 「운영 안전 태세가 아니다」의 구체적 모습이다.
# =============================================================================

envelope:
  # 제안표 §4.3 식별자 규칙: `tos-paper-<무엇>-g<세대>`, 세대는 1.
  envelope_id: "tos-paper-envelope-g1"
  envelope_generation: 1
  envelope_version:
    version: "1"
    effective_date: "2026-09-23"
    # 증거 패키지가 아직 없다 — 있는 척 채우지 않는다.
    evidence_package_version: null
    approver_identity: "operator (System Owner) — 2026-09-18 승인 · 2026-09-23 채택"
    # 만료/재검증일: 제안표에 행이 없고 spg 는 시간 연산을 하지 않는다
    # (design #12 §3.5). safety_activation.yaml 의 `not_expired` 운영자 확약이
    # 그 자리를 대신한다.
    expiration_or_revalidation_date: null
    superseded_version_link: null
    change_classification: null
  # 운영자 승인 2026-09-23 (위 블록). 필드 의미: tos/src/tos/spg/records.py:87-115
  # `GovernedDimensionLimit` — 봉투 쪽은 `envelope_max` 를 싣고 `profile_value` 는 비운다.
  governed_dimensions:
    # dimension: ARE 의 `_runtime.dimension_ids` 가 쓰는 **합성 id 철자** 그대로
    # (aggregate_risk_policy.yaml:107-110). `compose/_riskstate_wiring.py:101-107` 가
    # 이 철자로 대조한다 — `_model_view.governed_dimensions` 의 무접두 철자가 아니다.
    - dimension: "INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL"
      # 운영자 결정 2026-09-23 — 1 계약.
      envelope_max: "1"
      # aggregate_risk_policy.yaml:105 `_runtime.unit` (1차 판은 `:100` 이라고 적었는데
      # 그 줄은 `governed_scopes` 다 — review-797 2차 LOW-1 정정).
      unit: "CONTRACTS"
      # 이하 4개는 크기와 분리해 보존해야 하는 별개 안전 필드다(records.py:87-104 —
      # 절대 하나의 토큰으로 합치지 않는다). 형태는 이 저장소의 유일한 작동 예제
      # (tos/runtime/tests/compose/conftest.py `_governed_dimension_entry`)를 따른다.
      multiplier: "1"
      sign: "POSITIVE"
      # CONTRACTS 는 정수 계약 수다(venue_constraint_policy.yaml lot_size/min_quantity 1).
      precision: "0"
      rounding: "NEAREST"
      # ⚠ **INCLUSIVE 여야 한다.** `aggregate_risk_policy.yaml:74` 의 요구가
      # 「envelope_max **≥ 1**」이고 이 배포가 거래하는 유일한 수량이 1 계약이다.
      # `_exceeds_envelope_maximum`(spg/predicates.py, 술어 독스트링 :229-232)는
      # EXCLUSIVE 경계에서 `value == max` 를 거부하므로, EXCLUSIVE 로 두면 이 봉투는
      # **아무 것도 허용하지 않는다**.
      boundary: "INCLUSIVE"
  permitted_scope: []
  prohibited_fallbacks: []
  residual_risk_ceiling: null
  evidence_package_ref: null
