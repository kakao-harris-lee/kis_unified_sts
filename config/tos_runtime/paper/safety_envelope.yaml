# =============================================================================
# safety_envelope.yaml — TOS paper 배포 승인값 (W-A / A-2)
# =============================================================================
# 승인 출처: operator 2026-09-18 설정값 승인 · 2026-09-23 제안표 채택 확정 ·
#            docs/plans/2026-09-18-tos-config-value-proposal.md §4.3
#
# 제안표 §0 — 이 파일이 무엇이고 무엇이 아닌가:
#   **이것은 첫 부팅 프로파일이지 운영 안전 태세가 아니다.** 여기 적힌 값들은
#   `run` 이 로컬 헤르메틱 환경에서 구동하도록 만드는 값이다. 구조적으로
#   유효하고 서로 정합하지만, **실 자금·실 주문을 전제한 안전 한도가 아니다.**
#   실 배포 태세는 별도 승인 사안이며, 이 표를 근거로 그 승인을 대신할 수 없다.
#
# 원본 템플릿: tos/runtime/config/safety_envelope.example.yaml
# 로더: tos_runtime.safety.profile.SafetyProfileService (model_validate →
#       tos.spg.HardSafetyEnvelope)
# 호출부: compose/_safety_wiring.py:516 (`build_safety_mesh`, 무조건)
# =============================================================================
#
# ⚠ **`governed_dimensions` 가 비어 있다는 것의 의미.**
# 제안표 §4.3: 「`governed_dimensions` · `permitted_scope` · `prohibited_fallbacks`
# … — **아직 지배할 차원도, 기록된 승인도, 발생한 이탈·사고도 없다. 빈 것이
# 사실이다.** 있는 척 채우지 않는다.」 이 봉투가 지배하는 차원이 0개라는 것은
# **아무 것도 허용한다는 뜻이 아니다** — 술어들
# (`profile_within_envelope`/`activation_atomic`/`envelope_bounded`)은 선언되지
# 않은/null 차원을 **가장 제한적으로** 취급한다(example 헤더 주석).
#
# config/tos_runtime/README.md 가 기록한 리스크 상태 서비스 웨이브 조건 —
# 「이 배포가 부팅하는 Hard Safety Envelope 가 정책의 차원
# (`INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL`, `envelope_max ≥ 1`)을 지배해야
# 한다」 — 은 **이 파일이 아직 충족하지 않는다.** 그 차원의 구체적 한도는
# 제안표에 행이 없다(승인 대상이 아니라 별도 안전 승인 사안). 첫 부팅 프로파일은
# 차원을 선언하지 않고, 그래서 그 경로는 보수적으로 막힌다 — 이것이 §0 이 말한
# 「운영 안전 태세가 아니다」의 구체적 모습이다.
# =============================================================================

envelope:
  # 제안표 §4.3 식별자 규칙: `tos-paper-<무엇>-g<세대>`, 세대는 1.
  envelope_id: "tos-paper-envelope-g1"
  envelope_generation: 1
  envelope_version:
    version: "1"
    effective_date: "2026-09-23"
    # 증거 패키지가 아직 없다 — 있는 척 채우지 않는다.
    evidence_package_version: null
    approver_identity: "operator (System Owner) — 2026-09-18 승인 · 2026-09-23 채택"
    # 만료/재검증일: 제안표에 행이 없고 spg 는 시간 연산을 하지 않는다
    # (design #12 §3.5). safety_activation.yaml 의 `not_expired` 운영자 확약이
    # 그 자리를 대신한다.
    expiration_or_revalidation_date: null
    superseded_version_link: null
    change_classification: null
  # 제안표 §4.3 — 빈 것이 사실이다.
  governed_dimensions: []
  permitted_scope: []
  prohibited_fallbacks: []
  residual_risk_ceiling: null
  evidence_package_ref: null
