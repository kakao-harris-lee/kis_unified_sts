# docs/plans/2026-09-16-tos-ocp-sizing-values-proposal.md §2 proposal table,
# adopted by the operator on 2026-09-16 (disposition block at the top of
# that document: ① risk_budget/per_unit_risk = structural encoding (1/1),
# ② admitted_quantity_bases stays operator-fill "TBD" until the deployed
# strategy file's own quantity_basis is settled, ③ proposal table adopted
# as-is). This is a NEW generation, not an edit to generation 1's content —
# an operational convention this module's loader does NOT mechanically
# enforce: DR-0002 §2.3's coverage table binds the kernel canonical_digest to
# policy_id/policy_generation/policy_version only, never to _runtime content,
# so a content edit under an unchanged policy_generation would pass the
# loader's tamper/stale check silently. The generation bump is a discipline
# kept by hand, not a guarantee the digest verifies (see this document's own
# canonicalization_and_duplicate_field_rules entry).
#
# TRANSPORT BINDING (`_runtime.wire_codec`): the paper compose default is the
# SYNTHETIC transport, for which the loader requires `wire_codec: null`. A
# `--transport kis-mock` deployment must instead declare
#   wire_codec: {kind: "kis-order-cash-v1", wire_fields: [CANO, ACNT_PRDT_CD,
#   PDNO, ORD_DVSN, ORD_QTY, ORD_UNPR, EXCG_ID_DVSN_CD, SLL_TYPE, CNDT_PRIC]}
# (tos_runtime/transport/kis_mock/codec.py KIS_ORDER_CASH_WIRE_FIELDS) — that
# is a further NEW policy generation, not an in-place edit.
#
# OPERATOR-FILL BEFORE ACTIVATION (the loader refuses "TBD"): scope.accounts,
# scope.instruments (same values as venue_constraint_policy.yaml),
# _runtime.construction.sizing.admitted_quantity_bases (deliberately left
# ["TBD"] below — sizing proposal §4 ②, this document does not boot until
# it is filled), then `tos-runtime print-policy-digests --config-dir <dir>`
# → safety_activation.yaml `members:` (kind ORDER_CONSTRUCTION_POLICY).
# =============================================================================

