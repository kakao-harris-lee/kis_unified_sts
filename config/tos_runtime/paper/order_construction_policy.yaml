_runtime:
  canonicalization_version: "ev-l1-provisional-0"
  wire_codec: null
  # (a′) wave — machine-readable form of the direction_side_and_position_effect_rules /
  # price_tick_lot_quantity_and_rounding_rules / unit_multiplier_currency_and_numeric_rules
  # prose above. Values: OCP sizing values proposal §2 (2026-09-16, operator-adopted).
  construction:
    sizing:
      # max_quantity/min_quantity/lot_size: already-approved effective limit — paper trades
      # exactly one contract (aggregate_risk_policy.yaml INSTRUMENT::LONG_SHORT_DELTA_DIRECTIONAL,
      # effective limit 1) and venue_constraint_policy.yaml already carries lot_size/min_quantity 1.
      max_quantity: 1
      min_quantity: 1
      lot_size: 1
      # The only kernel member matching this document's own "no silent rounding" prose
      # (price_tick_lot_quantity_and_rounding_rules above) — FLOOR_TO_LOT would contradict it.
      lot_rounding: "EXACT_MULTIPLE_REQUIRED"
      # Structural encoding of "exactly one contract" (ratio risk_budget/per_unit_risk == 1
      # under lot_rounding=EXACT_MULTIPLE_REQUIRED, lot_size=1) — NOT an economic calibration.
      # No approved stop-distance/contract-multiplier source exists yet (proposal §4 ①); when
      # one lands, it is a new generation, not an edit to this one.
      risk_budget: 1
      per_unit_risk: 1
      # Optional ceiling (egressgw/construction.py:525 guards it `is not None`) — no approved
      # notional source exists; the binding constraint is max_quantity: 1, not a fabricated
      # notional cap (proposal §2 max_notional row).
      max_notional: null
      # OPERATOR-FILL (deliberately unfilled, proposal §4 ②): this document does not boot
      # until the deployed strategy file's own quantity_basis is settled. An empty/"TBD"
      # admitted set authorizes nothing — the same operator-fill gate scope.accounts/
      # scope.instruments are already in, not a new kind of incompleteness.
      admitted_quantity_bases: ["TBD"]
    axes:
      # ENVIRONMENT/ORDER_TYPE are derived from scope.environments/scope.order_types above
      # (never restated here). TIF has no scope.* home, so it is authored directly.
      - axis: "TIF"
        value: "DAY"
    action_class_shape:
      # Machine-readable form of direction_side_and_position_effect_rules above
      # ("long/short symmetric: NEW_LONG↔BUY/OPEN, NEW_SHORT↔SELL/OPEN, CLOSE↔opposite side/CLOSE").
      # Keyed by (ActionClass, direction) — contract amendment 2026-09-16: ActionClass has one
      # CLOSE member for both a long-close and a short-close, so direction (not just the class)
      # disambiguates which side/position_effect apply. Both CLOSE arms are declared below.
      NEW_LONG:
        LONG: {side: "BUY", position_effect: "OPEN"}
      NEW_SHORT:
        SHORT: {side: "SELL", position_effect: "OPEN"}
      CLOSE:
        # closing a long: opposite of NEW_LONG's BUY.
        LONG: {side: "SELL", position_effect: "CLOSE"}
        # closing a short: opposite of NEW_SHORT's SELL.
        SHORT: {side: "BUY", position_effect: "CLOSE"}
    effect_dimensions: []
