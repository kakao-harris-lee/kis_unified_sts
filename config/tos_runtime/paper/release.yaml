#   `_wait_out_the_lock_and_retry` 의 꼬리를 런타임과 같은 문장 모양(`mode = …; return mode`)으로
#   맞춘 것도 포함된다 — 드리프트 핀이 이제 **정규화한 AST** 를 통째로 대조하기 때문이다.
#   이전 값 7ea0d6d4c9c96a9227a670b5fe3c2b295d82e57ec7310ff37d30a16b372dcb47 은 28차 측정치
#   (같은 브랜치 62e6a0c7).
#   `print-digests` 와 `observe_source_tree_digest()` 두 경로가 일치했다(둘 다 9fa70b6c…).
#   `expected_dependency_set_digest` 는 스물아홉 번 모두 바뀌지 않았다 — 같은 배포 호스트 루트
#   `.venv`(python 3.12.12 / sqlite 3.45.1)에서 출력이 커밋된 값과 바이트 동일했다.
#
#   ⚠ **origin/main 머지(32539e07 — #825 프로브 · #826 증거 측정 가드)는 이 값에 영향이 없다** —
#   `git diff --name-only 2b018a27..origin/main` 에 `tos/src/**.py`·`tos/runtime/src/**.py` 가
#   한 건도 없다(전부 `tools/`·`tests/tools/`·`docs/`). **그래도 머지 뒤에 다시 찍어 숫자로
#   확인했다**: 두 경로 모두 9fa70b6c… 그대로다. 「소스를 안 건드렸으니 같을 것」이 아니라
#   「같은 것을 쟀다」로 남긴다(#814 이후 이 파일의 규율).
#
#   실행(위 두 측정 모두 같은 형태):
#     PYTHONPATH=tos/src:tos/runtime/src .venv/bin/python \
#       -c 'import sys;from tos_runtime.compose.cli import main;sys.exit(main(sys.argv[1:]))' print-digests
#
# **두 값의 유효 범위가 서로 다르다 — 갱신 규율도 다르다.**
#   * `expected_code_digest` 는 설치된 `tos`/`tos_runtime` **패키지 트리의
