# CP-3 주식 tenant 005380 전략 콘텐츠 — 실험 B: RSI / Williams %R 되돌림, LONG 배포.
# 출처: docs/plans/2026-11-19-tos-usage-plan.md §4.1 (운영자 결정 2026-11-19 §8-②).
# 임계값·창 길이는 전부 이 트리의 fields.yaml 이 선언한다 — 여기서는 그 bool 관문만 읽는다
# (이유는 fields.yaml 머리 주석).

dsl_version: cp3-b1b-dsl-1
config_binding_version: cp3-b1b-bind-1

policy:
  rules:
    - all_of:
        - left:
            ref: [capsule, resolved_values, entry_window]
          op: EQ
          right:
            const: true
        - left:
            ref: [capsule, resolved_values, rsi_oversold]
          op: EQ
          right:
            const: true
        - left:
            ref: [capsule, resolved_values, wr_oversold]
          op: EQ
          right:
            const: true
      decision:
        kind: ACTION
        rationale: >-
          R1-ENTRY-LONG-RSI-WR: entry window open, RSI(14) at or below its
          oversold line and Williams %R(14) at or below its own — both
          momentum readings say the pullback is stretched, so propose a new
          long.
        target:
          kind: ACTION
          account: &account "TBD"
          instrument: &instrument "TBD"
          direction: LONG
          position_effect: OPEN
          quantity_basis: RISK
          rationale: >-
            R1-ENTRY-LONG-RSI-WR: open a new long while both oversold gates
            are true inside the entry window.
    - all_of:
        - left:
            ref: [capsule, resolved_values, rsi_recovered]
          op: EQ
          right:
            const: true
      decision:
        kind: FLAT
        rationale: >-
          R2-EXIT-RSI-RECOVERED: RSI(14) has climbed back to its midline — the
          mean-reversion thesis is realized, go flat.
        target:
          kind: FLAT
          account: *account
          instrument: *instrument
          direction: SHORT
          position_effect: CLOSE
          rationale: >-
            R2-EXIT-RSI-RECOVERED: close the long — RSI is back at the
            midline.
    - all_of:
        - left:
            ref: [capsule, resolved_values, eod]
          op: EQ
          right:
            const: true
      decision:
        kind: FLAT
        rationale: >-
          R3-EXIT-EOD: the session's EOD close time has arrived — go flat.
        target:
          kind: FLAT
          account: *account
          instrument: *instrument
          direction: SHORT
          position_effect: CLOSE
          rationale: >-
            R3-EXIT-EOD: close the long — the session's EOD close time has
            arrived.
  default:
    kind: NO_ACTION
    rationale: >-
      R0-DEFAULT-NO-ACTION: no rule fired — hold exposure unchanged.
