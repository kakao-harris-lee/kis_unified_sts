# Futures contract / roll-state read-model (shadow, read-only).
#
# Source: docs/plans/2026-07-05-futures-market-context-hedge-risk-hardening.md
# §4.1 / §6. Published by services/futures_contract/main.py as a single Redis
# contract (futures:contract:latest hash + stream:futures.contract) so new
# entry, hedge, and night-capture all read the SAME front/next/night codes and
# roll classification. This lane touches NO order path.
#
# Roll policy (days_to_expiry, KST trade-date basis):
#   dte > pre_roll_days                          -> normal
#   block_front_new_entries_days < dte <= pre    -> pre_roll
#   0 < dte <= block_front_new_entries_days      -> roll_required
#   dte <= 0 (or expiry day if require_roll...)  -> expired
#   night master missing (when required)         -> unknown

futures_contract:
  enabled: true

  # Product whose contract state is published. mini = 미니 KOSPI200 (A05/105),
  # kospi200 = 풀 KOSPI200 (A01/101). Env-overridable for operator switches.
  product: "${FUTURES_TRADING_PRODUCT:mini}"

  roll:
    # Front new-entry begins to warn once inside this many days of expiry.
    pre_roll_days: 5
    # Front new-entry is blocked once inside this many days of expiry.
    block_front_new_entries_days: 2
    # Treat the expiry day itself as expired (block front new-entry + hedge).
    require_roll_on_expiry_day: true
    # Liquidity-based front/next flip (not implemented yet; calendar only).
    liquidity_flip_enabled: false

  night_master:
    # When true, the night front symbol is REQUIRED; a missing/stale night
    # code degrades roll_state to unknown (live fail-closed downstream).
    enabled: true
    # Age (calendar days) after which a manually-set night code is stale.
    stale_after_days: 20
    # Allow operator manual_override of the night symbol.
    manual_override_allowed: true
    # Manually-maintained night front symbol (8-char). Kept in sync with
    # config/night_futures.yaml::night_close_capture.tr_key on contract roll.
    # Empty -> resolved from the night collector config at publish time.
    night_front_symbol: ""
    night_next_symbol: ""

  redis:
    latest_key: "futures:contract:latest"
    latest_ttl_seconds: 86400          # 24h (48h fallback allowed on close/premarket)
    latest_ttl_fallback_seconds: 172800
    stream_key: "stream:futures.contract"
    stream_maxlen: 5000
    stream_ttl_seconds: 86400

# prev_close read-model (futures:daily_reference:{symbol}).
#
# Published by BOTH futures producers through
# shared/streaming/daily_reference.py::prefetch_and_publish_futures_daily_references
# — trader-futures at session start
# (services/trading/orchestrator.py::_prefetch_futures_daily_reference) and
# market-ingest once per trade day (services/market_ingest/main.py::
# _daily_reference_loop) — and read by the decoupled decision-engine
# (services/decision_engine/daily_reference.py), which has no KIS credentials.
# Every setting is read through load_daily_reference_config; a missing key or
# an invalid value logs a WARNING and uses the fallback.
daily_reference:
  # 86400 = this repo's default operational TTL (CLAUDE.md). The TTL only
  # expires the key of a producer that stopped publishing: freshness is the
  # consumer's check that asof_ts falls on the current KST trade date, not
  # this TTL, so there is no second TTL-based bound to keep in sync.
  ttl_seconds: 86400
  # market-ingest publish check interval, which is also the retry interval
  # after a KIS/Redis failure. Values below 60 are rejected (WARNING → 60): a
  # faster retry during a KIS outage spends the REST rate budget. Retries stop
  # at market_schedule.yaml::futures.regular.close; a failing day logs one
  # WARNING on its first failure and one when the window closes, DEBUG between.
  poll_seconds: 60
  # market-ingest publishes from market_schedule.yaml::futures.regular.open
  # minus this many minutes (KST, trading days only). 0 = the open itself,
  # the same moment trader-futures publishes at session start. Raise it only
  # if KIS is confirmed to roll futs_prdy_clpr over before the open — an
  # earlier publish would stamp today's date on the close from two sessions
  # back, and the consumer's date check would accept it.
  open_offset_minutes: 0
