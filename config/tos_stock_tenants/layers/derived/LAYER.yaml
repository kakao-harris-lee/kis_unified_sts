# 레이어 `derived` — 카나리아에서 갈라져 나온 주식 tenant 가 **공통으로** 다른 자리.
# 종목이 아니라 「파생됐다는 사실」이다: VCP 머리말의 유래와 승인 줄·발효일. 실험 A·B 가
# 둘 다 이 레이어를 먼저 깔고(`config/tos_stock_tenants/TENANTS.yaml::roles`) 그 위에
# 자기 전략·필드·바인딩을 올린다.
#
# 앵커는 **종목 치환이 끝난** 줄이다 — 그래서 `{{SYMBOL}}` 을 그대로 적는다. 치환 전
# 원문을 적으면 앵커가 0 회 맞아 렌더가 거부한다.

patches:
  - file: "venue_constraint_policy.yaml"
    key: "header-derived-from"
    anchor: '# ⚠ TENANT TREE (rescope M2, 2026-10-22) — `cp3-setup-d-long/` 의 같은 파일에서 갈라졌다.'
    replacement:
      - '# ⚠ TENANT TREE — `cp3-setup-d-stock-005930/` 의 같은 파일에서 갈라졌다(그 트리는'
      - '#   `cp3-setup-d-long/` 에서 갈라졌고, LONG 대비 차이는 아래 그대로다).'
      - '#   운영자 지시 2026-11-19 「유동성이 큰 대형주들로 최종 모의투자에서 매수/매도가 잘'
      - '#   동작하게 완료해」 (종목당 1 포지션 · 슬롯은 종목 수로 늘린다):'
  - file: "venue_constraint_policy.yaml"
    key: "header-symbol-line"
    anchor: '#   운영자 결정 2026-10-22: 종목 {{SYMBOL}} · Setup D LONG 그대로 · 수량 1주 고정 · 주식 정규장'
    replacement: '#   종목 {{SYMBOL}}({{SYMBOL_NAME}}) · Setup D LONG 그대로 · 수량 1주 고정 · 주식 정규장'
  - file: "venue_constraint_policy.yaml"
    key: "header-upper-decision"
    anchor: '#   09:00~15:30 KST (docs/plans/2026-10-22-tos-rescope-plan.md §3 M2).'
    replacement:
      - '#   09:00~15:30 KST. 상위 결정은 rescope M2(2026-10-22, 005930 ·'
      - '#   docs/plans/2026-10-22-tos-rescope-plan.md §3 M2) 그대로이고, 이 트리는 그 M2 의'
      - '#   규칙·수량·세션을 다른 종목 하나에 그대로 적용한 것이다.'
  - file: "venue_constraint_policy.yaml"
    key: "approved-by"
    anchor: '  - "operator (System Owner) — 2026-10-22, rescope M2 결정 ({{SYMBOL}} · Setup D LONG · 1주 · 정규장)"'
    replacement:
      - '  - "operator (System Owner) — 2026-11-19 지시 「유동성이 큰 대형주들로 최종 모의투자에서 매수/매도가 잘 동작하게 완료해」 ({{SYMBOL}}({{SYMBOL_NAME}}) · Setup D LONG · 1주 · 정규장 · 종목당 1 포지션)"'
      - '  - "operator (System Owner) — 2026-10-22, rescope M2 결정 (규칙 · 수량 · 세션의 상위 근거; 종목만 다르다)"'
  - file: "venue_constraint_policy.yaml"
    key: "effective-from"
    anchor: 'effective_from: "2026-10-22"'
    replacement: 'effective_from: "2026-11-19"'
