# KIS Unified Trading Platform - Docker Compose
# 개발/운영 환경 통합 구성

# NOTE: REDIS_PASSWORD uses ${VAR-default} (no colon) on purpose — an explicitly
# empty REDIS_PASSWORD must pass through as "no auth" (e.g. the paper stack points
# at a password-less host redis via host.docker.internal). With ${VAR:-default} an
# empty value would become "changeme" and AUTH would fail against that server.
# Unset still defaults to changeme. Do NOT re-add the colon.

x-redis-runtime-env: &redis-runtime-env
  REDIS_HOST: "${REDIS_HOST:-redis}"
  REDIS_PORT: "${REDIS_PORT:-6379}"
  REDIS_DB: "${REDIS_DB:-1}"
  REDIS_STOCK_DB: "${REDIS_STOCK_DB:-1}"
  REDIS_FUTURES_DB: "${REDIS_FUTURES_DB:-1}"
  REDIS_SYSTEM_DB: "${REDIS_SYSTEM_DB:-1}"
  REDIS_PASSWORD: "${REDIS_PASSWORD-changeme}"
  REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD-changeme}@redis:6379/1}"
  REDIS_TLS_ENABLED: "${REDIS_TLS_ENABLED:-false}"
  REDIS_TLS_CERT_REQS: "${REDIS_TLS_CERT_REQS:-required}"
  REDIS_TLS_CA_CERTS: "${REDIS_TLS_CA_CERTS:-}"

x-runtime-storage-env: &runtime-storage-env
  ENVIRONMENT: "${ENVIRONMENT:-dev}"
  RUNTIME_STORAGE_BACKEND: "${RUNTIME_STORAGE_BACKEND:-sqlite}"
  RUNTIME_STORAGE_SQLITE_PATH: "${RUNTIME_STORAGE_SQLITE_PATH:-data/runtime/dev/runtime.db}"
  RUNTIME_STORAGE_SQLITE_WAL: "${RUNTIME_STORAGE_SQLITE_WAL:-true}"
  RUNTIME_STORAGE_SQLITE_BUSY_TIMEOUT_MS: "${RUNTIME_STORAGE_SQLITE_BUSY_TIMEOUT_MS:-5000}"
  RUNTIME_STORAGE_SQLITE_SYNCHRONOUS: "${RUNTIME_STORAGE_SQLITE_SYNCHRONOUS:-NORMAL}"
  MARKET_DATA_SOURCE: "${MARKET_DATA_SOURCE:-parquet}"
  MARKET_DATA_PARQUET_ROOT: "${MARKET_DATA_PARQUET_ROOT:-data/market}"
  DASHBOARD_TRADE_STATS_SOURCE: "${DASHBOARD_TRADE_STATS_SOURCE:-runtime_ledger}"

services:
  # =============================================================================
  # 대시보드 API
  # =============================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ${COMPOSE_PROJECT_NAME:-kis}-dashboard
    restart: unless-stopped
    expose:
      - "8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: [*redis-runtime-env, *runtime-storage-env]
      API_KEY: "${API_KEY:-}"
      DASHBOARD_REQUIRE_AUTH: "${DASHBOARD_REQUIRE_AUTH:-true}"
      DASHBOARD_API_KEY: "${DASHBOARD_API_KEY:-}"
      DASHBOARD_DEV_MODE: "${DASHBOARD_DEV_MODE:-false}"
      # The file the dashboard reads INSIDE the container. Its host side is
      # TOS_OPERATOR_PROJECTION_DIR (the mount source under `volumes:` below) —
      # the two are a pair, and one wrong value looks exactly like no value at
      # all (`available=false, reason="projection file absent"`).
      TOS_OPERATOR_PROJECTION_PATH: "${TOS_OPERATOR_PROJECTION_PATH:-/app/data/tos_runtime/operator_projection.json}"
      DASHBOARD_KRX_NAME_FALLBACK: "${DASHBOARD_KRX_NAME_FALLBACK:-true}"
      KRX_API_KEY: "${KRX_API_KEY:-}"
      METRICS_REQUIRE_AUTH: "${METRICS_REQUIRE_AUTH:-false}"
      TRADING_ASSET_CLASS: "${TRADING_ASSET_CLASS:-stock}"
    volumes:
      - ./config:/app/config:ro
      # Builder→paper registration drop point: the only path the dashboard
      # *writes* under /app/config. This nested rw bind overrides the :ro parent
      # for that subtree so POST /api/kis-builder/register-paper (and the
      # enable/unregister endpoints) can materialize built/<id>.yaml. Trading
      # services read it back through their own ./config:ro mount (same host dir).
      - ./config/strategies/built:/app/config/strategies/built
      - ./logs:/app/logs
      - ./reports:/app/reports:ro
      - ./data/runtime:/app/data/runtime
      - ./data/market:/app/data/market:ro
      # Phase 5 W4 e5 (plan §2 decision 9): read-only mount of the
      # tos_runtime-exported operator projection JSON. The dashboard opens
      # it by path only (never imports tos/tos_runtime, never writes here).
      #
      # TOS_OPERATOR_PROJECTION_DIR is the HOST directory the producer writes
      # into; TOS_OPERATOR_PROJECTION_PATH (above) is the file path INSIDE the
      # container. Set both or neither — they are not derived from each other.
      #
      # The fallback `./data/tos_runtime` does NOT exist in this repository
      # (`data/` is gitignored). A recreate without `--env-file` therefore has
      # Docker create a root-owned empty directory here and the page reports
      # "projection file absent" forever. Always recreate with the env file
      # (paper: `scripts/deploy_paper.sh`, which forces `--env-file .env.paper`);
      # the two variables are documented in every `.env*.example`.
      - ${TOS_OPERATOR_PROJECTION_DIR:-./data/tos_runtime}:/app/data/tos_runtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Strategy Builder UI (visual strategy builder, Next.js)
  # =============================================================================
  strategy-builder-ui:
    build:
      context: .
      dockerfile: Dockerfile.strategy_builder_ui
      args:
        NEXT_PUBLIC_API_KEY: "${NEXT_PUBLIC_API_KEY:-${DASHBOARD_API_KEY:-}}"
    container_name: ${COMPOSE_PROJECT_NAME:-kis}-strategy-builder-ui
    restart: unless-stopped
    # External access goes through caddy on DASHBOARD_HOST_PORT. Port 3100
    # is container-internal only and must not be published on the host.
    expose:
      - "3100"
    environment:
      - KIS_BUILDER_API_BASE=http://dashboard:8001
      - KIS_BUILDER_API_KEY=${DASHBOARD_API_KEY:-}
      - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY:-${DASHBOARD_API_KEY:-}}
    depends_on:
      dashboard:
        condition: service_healthy
    # Healthcheck mirrors the Dockerfile so docker-compose can express
    # dependency ordering on it (caddy depends_on service_healthy).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Caddy reverse proxy — single external entry on DASHBOARD_HOST_PORT.
  # STS API → dashboard:8001 (FastAPI, API-only): /api/tos/*, plus /health,
  #   /docs, /openapi.json and /redoc. That is the dashboard's whole surface
  #   after legacy removal L4 — the /api/{kis-builder,trading,signals,trades,
  #   strategies,strategy-lab,strategy-builder,metrics,health}* prefixes,
  #   /metrics and /ws are gone.
  # Everything else → strategy-builder-ui:3100 (Next.js): the /tos page, the /
  #   redirect to it, /_next/* assets, and the catch-all /api proxy, which
  #   resolves /api/tos/projection so `npm run dev` (no Caddy) works too.
  # HTTP-only; expose one host web port mapped to Caddy's internal :5080.
  # =============================================================================
  caddy:
    image: caddy:2
    container_name: ${COMPOSE_PROJECT_NAME:-kis}-caddy
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_PORT:-5081}:5080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      dashboard:
        condition: service_healthy
      strategy-builder-ui:
        condition: service_healthy
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Redis (상태 캐시, 세션)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-kis}-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD-changeme}"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD-changeme}"
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$${REDIS_PASSWORD-changeme} redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  # =============================================================================
  # Prometheus (메트릭 수집)
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ${COMPOSE_PROJECT_NAME:-kis}-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - trading-network

# =============================================================================
# Test runner (profile: test)
#
# Runs the full pytest suite in Docker, mirroring .github/workflows/test.yml
# (parallel non-serial pass + serial pass). Uses an isolated, password-less,
# ephemeral `redis-test` — it never touches the real `redis` service or its
# paper-trading DB 1.
#
#   # Run the whole suite (exit code = pytest result):
#   docker compose --profile test run --rm tests
#
#   # Ad-hoc subset:
#   docker compose --profile test run --rm tests pytest tests/unit/strategy -q
#
#   # Tear down the lingering redis-test afterwards:
#   docker compose --profile test down
#
# `run` starts only `tests` + its dependency `redis-test` (not the default
# stack). KIS_RUN_LIVE_INFRA_TESTS=1 opts into the live-infra tests — safe here
# because that target is the isolated redis-test, not DB 1 on the real server.
# =============================================================================
  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    container_name: ${COMPOSE_PROJECT_NAME:-kis}-redis-test
    # No auth + ephemeral (no volume): matches CI's bare redis:7-alpine and
    # keeps the suite isolated from the real `redis` service's paper DB 1.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - trading-network

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    image: ${COMPOSE_PROJECT_NAME:-kis}-tests
    container_name: ${COMPOSE_PROJECT_NAME:-kis}-tests
    environment:
      ENVIRONMENT: test
      REDIS_URL: "redis://localhost:6379/1"
      # Default off (CI parity). The live-infra tests write real Redis keys, but
      # here that target is the isolated redis-test, so 1 is safe if desired.
      KIS_RUN_LIVE_INFRA_TESTS: "${KIS_RUN_LIVE_INFRA_TESTS:-0}"
    # Share redis-test's network namespace so Redis is reachable at
    # localhost:6379 exactly like CI's runner. NOTE: network_mode forbids a
    # sibling `networks:` key — connectivity is inherited from redis-test.
    network_mode: "service:redis-test"
    depends_on:
      redis-test:
        condition: service_healthy

# =============================================================================
# 네트워크
# =============================================================================
networks:
  trading-network:
    driver: bridge

# =============================================================================
# 볼륨
# =============================================================================
volumes:
  redis-data:
  prometheus-data:
  caddy-data:
  caddy-config:
