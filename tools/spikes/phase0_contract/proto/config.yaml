# floor(e) 는 두 입력에서 파생된다.  둘 다 조작 가능하므로 둘 다 고정한다.
#   ① 픽스처 행이 선언한 레벨 원시값의 (값, 행수) 분포
#   ② 레벨 -> kind 매핑 (kind 여러 개는 `|` 로 구분)
anchor_evidence_level_distribution: EV-L1=1,EV-L0/1=1,EV-L3=1
anchor_level_kinds: 0=REVIEWER,1=PACKAGE|TEST,2=FAULT,3=RUNTIME,4=RUNTIME,5=RUNTIME
