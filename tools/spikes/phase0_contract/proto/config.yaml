# --- 이연 처분 등재 (v2.8, 운영자 처분 B) -----------------------------------
# **미등재 이연은 누락과 구별되지 않는다.**  이연된 처분과 그 owner track 을
# 여기 적고, `SELF-3` 이 ⑴ 대상 노트가 `declared_limit_ids` 에 실제로 등재돼
# 있는지 ⑵ track 이 비어 있지 않은지 ⑶ track 이 `register.classify_owner_track`
# 문법에 맞고 미배정이 아닌지를 fail-closed 로 확인한다 (⑶ 은 v2.9).
#
# **강제 범위** (v2.9 후속 주장 축소): 이 검사가 강제하는 것은 등재 여부·문법·
# 아래 `required_deferrals` 와의 **상호 일치**뿐이다.  **여기 적힌 트랙 값 자체는
# 러너가 고정하지 않는다** — 두 줄을 함께 다른 트랙으로 옮기면 `SELF-3` 은 green
# 이다.  값의 고정은 `.omc/review/` 판정 기록과 운영자 결정에 있다.
#
# `L-EXIT-ROOT` = 최종 exit 판정의 same-process 자기 절단.  해소는 리비전에
# 결속된 **외부 CI/래퍼가 별도 프로세스에서** seeded-red 를 주입하고 비영 종료를
# 검증하는 것뿐이며, 그 작업은 OD-3-D(CI 미편입)와 OD-3-B(D0 아티팩트 생성 금지)
# 경계에 직접 닿아 Phase 0 안에서 처리하면 경계 자체를 재정의하게 된다.
deferred_owner_tracks: L-EXIT-ROOT=Phase 1

# --- **필수** 이연 (v2.9, 심판 v2.8 #5 medium) --------------------------------
# 운영자 처분 B 에서 파생한 이연 map.  `deferred_owner_tracks` 는 "무엇이 이연
# 됐는가" 만 적었고 **무엇이 반드시 이연돼 있어야 하는가** 는 적지 않았다.
# 그래서 `L-EXIT-ROOT` 를 빼고 다른 선언 id 하나를 미끼로 넣어도 `SELF-3` 이
# green 이었다 — 처분이 기록된다는 자기검사가 실재하지 않았다.  `SELF-3` 은
# 이제 이 map 의 각 항이 `deferred_owner_tracks` 에 **같은 값으로** 있는지를
# 본다 — **대체**는 그래서 잡힌다.  키 자체는 `config.REQUIRED_KEYS` 에 있어
# 부재하면 `load_config` 가 중단한다.
#
# **이 map 은 하한이지 정확 집합이 아니다** (v2.9 후속 주장 축소): 필수 항을
# 만족한 채 다른 이연을 **추가로** 등재하면 통과한다.  그리고 **처분 값 자체도
# 강제되지 않는다** — 두 줄을 함께 다른 트랙으로 옮기면 통과한다
# (`L-SELF-VISIBILITY` 범주).  값의 고정은 이 러너 밖에 있다.
#
# 러너의 module docstring·`exit_status` docstring·최종 고지는 이 값을 리터럴로
# 적지 않고 여기서 파생한다 — 선언과 평가가 갈리지 않게 한다.
required_deferrals: L-EXIT-ROOT=Phase 1

