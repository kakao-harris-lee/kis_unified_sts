# 프로토타입 임계값과 앵커 — 러너는 이 파일에서만 읽는다.
#
# 정확히 말하면: **임계값**(폭 상한·phase 범위·개수 앵커)은 전부 여기 있고,
# 목록형 **정책 상수**는 코드에 남되 그 값이 `anchor_policy_values` 에 digest
# 로 결속된다.  어느 이름이 그 정의역에 드는지는 러너의 자동 census 가
# 파생하고, 정의역 밖 잔여도 census 가 열거해 `L-POLICY-ANCHOR` 로 방출한다 —
# **모듈 레벨 비호출 이름이라는 축소된 정의역 안에서만** (v2.9, 심판 v2.8 #4:
# 클래스와 그 속성값은 세 분류 어디에도 들어가지 않는다).
#
# **이 파일을 읽는 경로 자체의 한계**: 러너는 설정을 두 판독기로 읽어 대조하지만
# (`T-80`), 두 판독기 모두 같은 프로세스에 있고 **경로도 같은 이름
# (`config.CONFIG_PATH`)에서 가져간다** — 그 이름을 한 번 재바인딩하면 둘이
# 동시에 같은 파일을 읽는다 (v2.9, 심판 v2.8 #1 · `L-CONFIG-TRUSTPOINT`).
# 그리고 그 대조가 내는 판정도 결국 `exit_status()` 를 경유한다 —
# `L-EXIT-ROOT` 참조.  이 파일의 어떤 주석도
# "설정을 고치지 않고는 통과할 수 없다" 를 절대 명제로 뜻하지 않는다.
#
# CLAUDE.md 는 "thresholds ... belong in YAML/env/config files, not hardcoded
# branches" 를 요구한다.  설계 문서 v2.1 이 폭 상한을 계약문에 리터럴로 써서
# 비협상 위반 판정을 받았으므로, 이 프로토타입은 임계값을 설정에서 읽어
# 그 위반이 해소 가능함을 실증한다.
#
# 형식: `key: value` 한 줄만.  `#` 이후는 주석.  리스트는 콤마 구분.

# --- U-1a owner_track 문법 임계값 -----------------------------------------
owner_track_range_max_width: 3
phase_min: 0
phase_max: 7

# --- 커밋된 앵커 (T-71 / U-9a / T-39 count canary) -------------------------
anchor_classification_checkable: 2
anchor_classification_partial: 3
anchor_classification_nmc: 6
anchor_closable_no_ids: PROTO-UNCHK-007
anchor_enforcement_key_count: 12

