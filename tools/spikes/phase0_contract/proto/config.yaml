# ⒢ **pre-hook 구간** 앵커 (v2.7, 심판 #3 high).
# hook 설치(러너는 `import audit_guard`, 가드는 `sys.addaudithook`) **이전**
# 모듈 본문 전체의 `ast.unparse` digest.  v2.6 의 순서 검사는 정적 `import` 문의
# 행번호만 비교해서 ⑴ hook 이전에 실행되는 문장 ⑵ `__import__`·`importlib`·`exec`
# 로 하는 동적 로드 를 둘 다 보지 못했다.  구간을 통째로 고정하면 새 문장은
# 무엇이든 red 가 되고 그 승인은 이 파일의 diff 로 남는다.
anchor_prehook_runner: 381ab3fbd5532507
anchor_prehook_audit_guard: c4cad468672c494a

# ⒢⒝ **pre-hook 실행문 개수** 핀 (v2.8, 심판 v2.7 #4 high).
# v2.7 은 "두 파일 모두 pre-hook 실행문 0 이 구조 요구사항" 이라고 적었다.
# 그 0 은 러너가 `ast.Assign` 을 **우변과 무관하게** 비실행문으로 세던 분류
# 규약의 산물이었고, 실제로는 `frozenset(...)`·`threading.local()` 처럼 호출을
# 평가하는 대입이 있다.  심판은 그 정의상의 0 을 이용해 `_SNEAK =
# __builtins__['__import__']('proto.register')` 를 실행문 계수와 금지 이름
# 검사 **양쪽에서** 빠뜨렸다.  v2.8 은 우변을 보아 세고, 그 개수를
# 여기 등재해 증감을 red 로 만든다 (동적 로드 이름 검사는 그와 별개로
# subscript 첨자·호출 인자의 문자열 상수까지 확장했다).
# **정의역 축소 (v2.9, 심판 v2.8 #3)**: 이 개수가 정직한 범위는 **최상위 문장의
# 우변·데코레이터·기본 인자**까지다.  `ClassDef` 본문은 import 시 즉시 실행되는데
# 분류기가 그 본문을 걷지 않으므로, pre-hook 구간의 클래스 본문에서 실제 I/O 를
# 해도 이 값은 움직이지 않는다 (실측).  `L-AUDIT-BOOTSTRAP` 참조.
anchor_prehook_executable: test_contracts.py=1,audit_guard.py=11

# ⒣ **인가된 프로브 기록** 앵커 (v2.8, 심판 v2.7 #3 high).
# `토큰=열람:쓰기`.  v2.7 은 `blocked_*` 만 exit 에 실었고 `probe_*` 는 어느
# 채널에도 닿지 않았다 — 그 순간 분류가 곧 exit 결속 여부가 됐고, 창을 여는
# 것만으로 자기 기록을 게이트에서 감출 수 있었다.  v2.8 은 창을 토큰과 고정
# 호출 지점(`audit_guard.PROBE_SITES`)으로 인가하고, 인가된 기록의 개수까지
# 여기 묶는다.  인가되지 않은 창은 여는 것 자체가 findings 다.
# **한계 (v2.9, 심판 v2.8 #2)**: 인가 identity 는 공개 문자열 토큰과
# `basename(co_filename):co_name` 뿐이라 `compile()` 로 사칭할 수 있고, 이 앵커는
# **개수만** 센다 — 같은 개수의 내용 치환은 침묵한다.  `L-AUDIT-PROBE-THREAD` 참조.
anchor_probe_records: t77-audit-battery=6:2,t77-cross-thread=1:0,t77-reentrant=1:0,t77-separation=1:0

# ⒤ **정책값 census 의 의도적 제외** (v2.8, 심판 v2.7 #5 medium).
# v2.7 의 값 앵커 정의역은 손으로 쓴 25 개 **양성 목록**이었고, 심판이 그 목록
# 밖에서 실제로 판정에 쓰이는 값(`boundary._NULLARY_STR_METHODS`)을 찾아냈다 —
# 하드코딩 census 는 신규 항목을 영원히 못 찾는다.  v2.8 은 대상 모듈의 모듈
# 레벨 **비호출** 이름을 구조에서 파생하고, 여기 적힌 것만 제외한다.  선언만
# 있고 실물이 없는 제외(팬텀)도 `T-79` 가 fail-closed 로 잡는다.
# **정의역 축소 (v2.9, 심판 v2.8 #4)**: 호출 가능 객체·모듈 스킵이 이름 등록보다
# 앞이라 **클래스는 targets·residual·phantom 어디에도 나타나지 않는다.**  클래스
# 속성에 놓인 정책 상수의 런타임 대입은 이 앵커가 관측하지 않는다.
#
# 제외 사유: 넷 다 **실행 중 내용이 변하는 관측 버킷**이거나 설치 시점 스냅샷이라
# digest 로 고정할 수 없다.  대신 다른 층이 받는다 — 기록 버킷은 운영 게이트와
# `anchor_probe_records` 가, `_ARMED_SNAPSHOT` 은 `bootstrap_witness()` 가 내용으로
# 판정한다.
policy_value_exclusions: audit_guard._ARMED_SNAPSHOT,audit_guard.blocked_reads,audit_guard.blocked_writes,audit_guard.probe_reads,audit_guard.probe_writes,audit_guard.sanctioned_reads,audit_guard.unsanctioned_windows

# --- SELF-1 L2: 결함 어휘 면제 ---------------------------------------------
# L2 는 결함 어휘를 쓴 노트에 **등재 표면 셋 중 하나**를 요구한다: 등재된
# 갭(`unchk=`) · red Case(`case=`) · 여기 적힌 면제.  면제도 등재 표면이므로
# 코드가 아니라 설정에 두어 diff 로 드러나게 한다.  이유를 id 별로 적는다.
#
#   L-T77-SEAM  — "실물을 만들면 그 자체가 OD-3-B/C 위반"이라는 **반사실**
#                 서술이다.  결함 주장이 아니므로 위양성이다.
#   L-AUDIT-PROBE-THREAD
#               — 두 성분이 섞여 있다.  ⑴ v2.7 의 스레드 전역 창 서술은 **이미
#                 교정된 상태의 기록**이고 교정 후 상태는 `T-77-SEPARATION`·
#                 `T-77-REENTRANT` 가 실물로 관측한다.  ⑵ **v2.9 부터는 현행
#                 잔여 주장도 포함한다** — capability 사칭과 동일 개수 내용 치환
#                 (심판 v2.8 #2).  ⑵ 는 결속할 red Case 가 없다: 그 형태를 대조군
#                 으로 심으면 러너가 자기 게이트를 상시 red 로 만들거나, 반대로
#                 green 대조군에 주차하게 된다.  적절한 등재 갭도 없다(픽스처 행은
#                 피검사 계약의 축이다).  그래서 **닫지 못했음의 등재**로 면제하며,
#                 실측 절차는 노트 본문에 그대로 적었다.
#   L-EXIT-ROOT — 결함 주장이 **맞다**.  다만 그 내용이 "Case 의 red 가 종료
#                 코드에 닿지 못할 수 있다" 이므로, 결속할 red Case 가 원리적으로
#                 존재할 수 없다(그 Case 의 red 역시 같은 지점을 경유한다).
#                 적절한 등재 갭도 없다 — 픽스처 행은 이 러너가 아니라 피검사
#                 계약의 축이다.  주차가 아니라 **닫을 수 없음의 등재**이며,
#                 처분은 `deferred_owner_tracks` 에 owner track 과 함께 적었다.
limit_vocabulary_waivers: L-T77-SEAM,L-AUDIT-PROBE-THREAD,L-EXIT-ROOT

