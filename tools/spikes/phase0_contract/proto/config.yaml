# 이것이 모듈 레벨 데이터·주석·docstring 을 덮는다 — 심판이 `FORBIDDEN_ARTIFACTS`
# 5→1 과 `REQUIRED_METRICS` 4→2 를 앵커 4종 불변으로 통과시킨 구멍이다.
# `config.yaml` 은 앵커 값 자체를 담으므로 **제외**한다(자기참조).
# **이 앵커가 못 보는 것**: 디스크를 건드리지 않는 런타임 대입.  그쪽을 보는 ⒟ 와
# ⒡ `anchor_policy_values` 도 **각자의 최종 직렬화 안에서만** 본다 — ⒟ 는
# **`loaded_code_text()` 문자열(따라서 그 digest)이 바뀌는** 교체를, ⒡ 는
# **target 이름 집합 또는 `policy_digest` 가 바뀌는** 대입을 관측한다.  둘 다
# 어떤 뮤테이션 부류를 잡는지가 아니라 **자기 투영이 무엇인지**로 적은 것이며,
# **투영-프레이밍은 최종 직렬화/digest 까지 내려갈 때만 종결적이다** (v2.10, 심판
# 9 회차 #1).  직전 판은 ⒟ 의 보장을 "수집된 코드 투영(`co_name`·`co_code`·
# `co_names`·문자열/중첩 코드 상수)이 바뀌는 교체" 로 적었는데 수집 항보다 **한
# 단계 위**에서 끊긴 서술이었다.
# **보장 밖 (닫힌 열거가 아니다 — 닫는 것은 위 서술 자체다)**:
#  ⑴ 같은 `__code__` 와 파일 라벨을 쓰되 globals·defaults·closure 만 다른 함수
#     객체로의 교체(직렬화가 불변이다).
#  ⑵ **구분자가 값 안에 들어 항 경계가 사라지는 교체** — ⒟ 의 수집 항은 태그도
#     길이도 없이 `\x1f` 로만 이어지므로, 문자열 상수가 `('a\x1fb',)` 에서
#     `('a','b')` 로 바뀌면 항 목록은 달라도 직렬화는 둘 다 `a\x1fb` 이고
#     digest 는 같다(실측).
#  ⑶ 정규화상 동치인 컨테이너 타입 교체(tuple↔list · set↔frozenset — 이름과
#     digest 를 둘 다 보존한다).
#  ⑷ ⑶ 의 타입 목록 **밖**에서 NUL 평탄화가 접는 값들 — `policy_value_text` 도
#     타입 태그·길이 없이 NUL 하나로 항목을 잇고 중첩을 평탄화하므로 **항목
#     수·항목 내용·항목 경계·중첩 구조가 달라도** 같은 digest 가 된다.  실측:
#     `policy_value_text(('a','b'))` 와 `policy_value_text(('a\x00b',))` 가 둘 다
#     `a\x00b` 다.
#  ⑸ **파일 라벨 위조** — ⒟ 와 `runner.MODULE_BINDINGS` 가 함께 적는 파일 이름은
#     `basename(co_filename)`(컴파일 시 제공되는 라벨) 또는
#     `basename(__file__)`(라이브 객체의 가변 속성)일 뿐이라 검증된 provenance 가
#     아니다.  v2.8 이 없앤 것은 `__module__` 이지 이 라벨이 아니다 (v2.10 철회,
#     심판 9 회차 #2).  러너 노트 `L-SRC-ANCHOR` 가 등재한다.
# `property`·`staticmethod`·`classmethod` 로 감싼 멤버(러너 `L-SRC-ANCHOR`
# 가 6 건 등재)와 클래스 **속성**은 두 투영 어디에도 들지 않아 **양쪽 다
# 침묵한다**.  v2.6 주석은 "런타임 대입은 실행 코드와 값 앵커가 본다"고 적었는데
# 그 서술이 **실제보다 넓었다**: 당시 값 앵커는
# `FORBIDDEN_ARTIFACTS` 와 `REQUIRED_METRICS` 둘에만 배선돼 있었고
# `FIXTURE_CLAUSES`·`FORBIDDEN_SOURCE_TOKENS`·`REQUIRED_KEYS` 등은 어느 앵커에도
# 묶이지 않았다(심판 v2.6 #7).  ⒡ 가 그 정의역을 메우며, ⒡ 밖에 남는 이름 중
# **census 가 이름 등록까지 도달한 것**은 러너의 한계 노트 `L-POLICY-ANCHOR` 가
# 열거한다 — 클래스는 그 앞에서 걸러져 열거되지 않는다 (v2.9, 심판 v2.8 #4).
anchor_source_bytes_digest: 351894b3ff7238af

# ⒡ **런타임 정책값** 앵커 (v2.7, 심판 #7 medium).
# `이름=digest` 쌍.  digest 는 **라이브 모듈에서 읽은 값**에서 파생하므로 디스크를
# 건드리지 않는 런타임 대입도 관측된다 — 다만 관측되는 것은 **target 이름 집합 또는
# `policy_digest` 가 바뀌는** 대입뿐이다.  정규화상 동치인 컨테이너 타입
# 교체(tuple↔list · set↔frozenset)는 이름과 digest 를 둘 다 보존하므로 **보장
# 밖**이다.  **그 타입 목록은 닫혀 있지 않다** (v2.10, 심판 9 회차 #1):
# `policy_value_text` 가 타입 태그도 길이도 없이 NUL(`\x00`) 하나로 항목을 잇고
# 중첩 컨테이너도 같은 구분자로 평탄화하므로, **항목 수·항목 내용·항목 경계·중첩
# 구조가 다른 값도** 같은 digest 로 접힌다 — 실측:
# `policy_value_text(('a','b'))` 와 `policy_value_text(('a\x00b',))` 가 둘 다
# `a\x00b` 다.  그래서 이 앵커의 보장은 "값이 바뀌면" 이 아니라 **`policy_digest`
# 가 바뀌면** 으로만 적는다.  이름이 빠지거나 늘어도 red 이며,
# 항목별 삭제·확장이 전부 digest 를 움직이는지는 `T-79` 방향② 가 전수 확인한다.
# 정의역은 `policy_value_targets()` 이고, 그 **밖**은 `L-POLICY-ANCHOR` 가 적는다.
anchor_policy_values: audit_guard.CORPUS_DIR=aa20e772dae8a720,audit_guard.CORPUS_DIRNAME=1056a6884622c327,audit_guard.PROBE_SITES=3563109d01f3130a,audit_guard.READ_EVENTS=eab29482922c7968,audit_guard.REGISTER_PREFIX=6522668b0f51b912,audit_guard.SAFE_PATH_TYPES=a903e4b9ebd7587f,audit_guard.SPEC_DIR=1056a6884622c327,audit_guard.WRITE_EVENTS=dbce97aff4dadc2d,audit_guard._CORPUS_FOLDED=1056a6884622c327,audit_guard._READ_EVENT_SET=eab29482922c7968,audit_guard._REGISTER_FOLDED=c903de43e7cd9167,audit_guard._SAFE_PATH_TYPES=2efeefc5ae4b794c,audit_guard._WATCHED=173e0cfd6c219a06,audit_guard._WRITE_EVENT_SET=725a4bba5be07241,audit_guard._WRITE_MODE_CHARS=5e977d167400375d,boundary.EXPECTED_RUNNER_RELPATH=80f140c8a109f455,boundary.FORBIDDEN_ARTIFACTS=eb07c75c75b6dfad,boundary.FORBIDDEN_SOURCE_TOKENS=ce1b5151a9026a64,boundary.GIT_DIR_REQUIRED=bc962f1eb4fc4ce6,boundary.GIT_FILE_PREFIX=95623ba1c2ebc152,boundary.GUARDED_ENTRY_POINTS=cdb588e0ee6eb942,boundary.READ_GUARDED_ENTRY_POINTS=f45cafc7ae45f766,boundary.REPO_MARKERS=4d0a4dff1f762e59,boundary.TOKEN_DEFINITION_NAMES=e317f42c9c9eb1a8,boundary.TOKEN_DEFINITION_SITE=1b70260881622652,boundary._CORPUS_DIR=aa20e772dae8a720,boundary._CORPUS_DIRNAME=1056a6884622c327,boundary._NULLARY_STR_METHODS=ff35924357572b8d,boundary._OS_BLOCKED=64df46bf5a1cb045,boundary._PATH_BLOCKED=640e4549e053d2b7,boundary._REGISTER_PREFIX=6522668b0f51b912,boundary._SHUTIL_BLOCKED=ed3f8cc0dfd1172e,boundary._SPEC=1056a6884622c327,boundary._VERIFICATION=105b4f0b8622c1dd,boundary._WRITE_FLAG_CHARS=5e977d167400375d,config.REQUIRED_KEYS=6194a6b4813384ba,floor.FAULT=7d9f5428a7bbd02d,floor.LEVEL_KINDS=48b2aea2e677d062,floor.PACKAGE=19b723bc37c15fb2,floor.PROFILE_DEPENDENT=35cb4afb08ef8227,floor.REVIEWER=60140279fde292b0,floor.RUNTIME=645e4fc5442ea826,floor.SURFACE_KINDS=e77689b675573c05,floor.TEST=94ee059335e587e5,floor.VERIFIABLE_KINDS=45400943c4613875,gates.AUTHORITY=a2c8e30c48417567,gates.BASES=5227aad3790bf3ee,gates.CHECKABLE=8aba329b7b7257af,gates.CLASSIFICATIONS