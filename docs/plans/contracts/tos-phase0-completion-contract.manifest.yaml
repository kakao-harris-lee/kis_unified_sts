# tos Phase-0 완료-계약 — S-25 정본 ① «manifest»
#
# 계약 :3273-3291 (S-25) 이 세운 삼각 구도의 첫 번째 꼭짓점이다:
#   ① manifest  (이 파일 · 계약 문서 «밖» · 커밋)   — **의도**
#   ② 계약 문서                                     — **사실**(계수·좌표)
#   ③ tools/tos_contract_check.py                   — **측정자**(둘 다 신뢰하지 않고 대조만)
#
# ------------------------------------------------------------------------------
# 스키마 규율 (위반하면 이 아크가 이미 겪은 결함이 manifest «안»에서 재발한다)
# ------------------------------------------------------------------------------
#   * 담는 것 = 규칙 ID · 규칙 문언 «앵커»(verbatim 부분문자열) · 우주 «파생 질의» ·
#     소비처 «판별 술어» · census 어휘 «목록» · 기각 마커 어휘 «목록» ·
#     «닫힌 표»의 헤더/닫힘 앵커.
#   * 담지 «않는» 것 = 계수(개수) · 행번호 · 원소 리터럴 목록.
#     「하드코딩 census 는 신규 항목을 영원히 못 찾는다」(코퍼스 리마디에이션 교훈)와
#     「자기 문서를 세는 숫자는 그 문서에 두지 않는다」(6차 ⓑ)가 그 이유다.
#     검사기 스키마가 이 금지를 **기계로 거부**한다 — 산문 규율이 아니다.
#   * census 어휘 «목록»만 예외다.  그것은 «의도»이지 «문서 사실»이 아니다.
#     그러나 어휘 «개수»는 여기에도 적지 않는다(「N어휘」가 stale 의 원천이었다).
#
# 우주·소비처는 **리터럴 열거가 아니라 파생 질의**로 적는다.  질의 이름은 검사기가
# 구현하는 파생의 «이름»이고, 검사기가 모르는 이름은 **fail-closed red** 다
# (모르는 질의를 «검사 없음»으로 접으면 그 규칙이 조용히 사라진다).

schema_version: 1

# ------------------------------------------------------------------------------
# census 어휘 — 10차 ⓑ (A-F2 처분) 가 「목록의 정본은 S-25 manifest」라고 지목한
# 그 정본이 여기다.
#
# [v2.22 에라타 23차 — 팬텀 삭제 · stale 좌표 정정]  이 주석은 10차 ⓑ 가 계약 본문에서
# 그 목록을 «지웠다»고 적어 왔다.  **방향이 반대였다** — git 실측상 10차 ⓑ 는 리터럴을
# «추가»했고(부모 blob 0건 → 10차 1건), 규칙과 그 위반이 같은 hunk 에서 태어났다.
# 본문 리터럴은 **22차가** 제거했다(addendum-6 AF-L2).  그리고 이 주석이 계약을 가리키던
# 행 좌표는 이미 밀려 무관한 행을 가리켰다 — **좌표를 지우고 서술어로 대체**한다
# (16차·22차와 같은 약: 갱신할 값을 두지 않으면 stale 될 값도 없다).
# 계약에 남은 것은 불변식뿐이다:
#   「census 는 «어휘 축 ∪ 구조 축» 둘을 돌고, 그 정본은 manifest 이며,
#    계약은 계수를 진술하지 않는다.」
# ------------------------------------------------------------------------------
census_vocabulary:
  # 어휘 축 — 문서화된 상한이 «이 표기로 쓰였다»를 전제한다.
  # 잔여(가장 약한 고리): 목록 «밖» 표현으로 상한이 문서화되면 census 는 0 을
  # 반환하고 계약은 그것을 «부재»로 읽는다 — 그 극성은 fail-open 이다.
  lexical_axis:
    - "limit"
    - "limits"
    - "limited"
    - "restrict"
    - "no more than"
    - "at most"
    - "the first"
    - "only the"
    - "cap"
  # 구조 축 — 어휘 목록에 의존하지 «않는» 축.  어휘 축의 하드코딩성을
  # **부분 보정**하며 «대체»하지 않는다(명사 목록 자신이 다시 유한 목록이다).
  structural_axis:
    nouns:
      - "result"
      - "results"
      - "item"
      - "items"
      - "entries"
    co_occurrence: "같은 «문장» 안의 «모든» 2~4자리 정수"

# ------------------------------------------------------------------------------
# 기각 마커 어휘 — REF 축(`TOS-CC-REF-REJECTED`) 정본
#
# 왜 여기인가: 29차가 등재한 검사기 공백은 「계약이 «기각된» 설계 문서를 파생 정본으로
# 가리킨 채 한 회차 내내 서 있었는데 어떤 축도 보지 않았다」였다(27차가 초안 2 를 가리켰고
# → 28차가 그 초안을 기각했고 → 29차에 손으로 적발).  그 축이 무엇을 «기각»으로 읽는가는
# 검사기에 리터럴로 박으면 안 되는 «의도»다 — 12차·22차가 census 어휘에 세운 규율과 같다.
#
# 담지 «않는» 것도 같다: 계수를 둘 자리를 만들지 않는다(닫힌 키 집합이 기계로 거부한다).
# 검사기는 이 키가 «부재하면 fail-closed red» 이며, 그 극성은 `RULE-MANIFEST` 와 같다.
#
# 「철회」를 넣지 «않은» 이유(실측 근거): 저장소 마크다운 첫 헤딩 전수 스윕에서 「철회」는
# 2건 일치하는데 둘 다 «이 문서가 기각됐다»가 아니라 «앞선 addendum 을 철회한다»는
# **다른 문서에 대한 서술**이다(U17-PREVENTION-CHECK-V219-ADDENDUM-7/-8).  그 어휘를 넣으면
# 축이 위양성을 낳고, 위양성을 피하려 면제를 넓히면 축 자체가 무력해진다.  아래 목록 중
# 오늘 실제로 발화하는 것은 「기각」 하나이고 나머지는 «의도»다(전수 스윕 일치 0).
# ------------------------------------------------------------------------------
rejected_markers:
  first_heading_tokens:
    - "기각"
    - "폐기"
    - "반려"
    - "부결"
    - "무효"
    - "REJECTED"

# ------------------------------------------------------------------------------
# 규칙 ↔ 소비처 전수 대응 (RULE 축)
#
# 「규칙 신설 = 전수 적용까지가 한 단위」는 이 지점부터 산문이 아니라 게이트다.
# 규칙을 신설하면 여기에 `id` 를 등재해야 하고, 그 «순간» 소비처 누락이 전건 red 다.
# ------------------------------------------------------------------------------
rules:
  - id: CAP-1
    title: "문서화된 상한이 있는 엔드포인트는 열거 규율 ①로 완전성이 증명되지 않는다"
    # 규칙을 «진술하는» 문장의 축자 부분문자열.  문서에서 정확히 1회 일치해야 한다.
    # 0회 = 규칙 문언이 사라졌다 · 2회 이상 = 앵커가 규칙 자리를 특정하지 못한다.
    # 둘 다 red — 앵커가 흔들리면 아래 우주·소비처 대조가 «무엇의» 대조인지 잃는다.
    statement_anchor: "상한이 문서화된 엔드포인트는 ①로 완전성이 증명되지 «않는다»"
    universe:
      derivation: separated_code_spans_in_block
      # 블록은 «행번호»가 아니라 축자 앵커로 지목한다 — 행은 매 회차 밀린다.
      # 앵커를 담은 행은 문서에 **정확히 하나**여야 한다(아니면 fail-closed).
      block_anchor: "(4) 대상 = "
      # 앵커 뒤 원소 도입 '—' 부터 블록 끝까지를 구분자(MIDDLE DOT)로 분해하고
      # 각 조각의 **첫** 코드 스팬을 원소로 삼는다.  괄호 «안»의 코드 스팬
      # (`check_suite_id`·`head_sha` 같은 질의 파라미터)은 첫 스팬이 아니므로
      # 자동으로 제외된다 — 별도 배제 «목록»이 필요 없다.
      description: >-
        (4) 열거 정의 자리의 구분자 분해 · 조각별 첫 코드 스팬.
    consumers:
      derivation: circled_items_in_block
      # 「(4) 열거 N원소에 «문서화된 상한이 있는가»를 전수 적용한 결과」 블록.
      # 앵커에 **계수(N)를 넣지 않는다** — 넣으면 원소가 늘 때마다 앵커가 stale 된다.
      block_anchor: "«문서화된 상한이 있는가»를 전수 적용한 결과"
      # 그 블록에서 **원형숫자 마커 뒤에 «즉시» 붙는** 코드 스팬만 소비처로 읽는다.
      # 「limb ⑤ 와 동일 형상」처럼 코드 스팬이 따라붙지 않는 원형숫자는 소비처가 아니다.
      description: >-
        전수 적용 결과 블록의 원형숫자 마커 + 즉시 후행 코드 스팬.
    element_id:
      # 손으로 부여한 id 는 그 자체가 stale 대상이다.  정체성은 문서 구조에서 파생한다.
      derivation: code_span_verbatim
      description: >-
        엔드포인트 경로 코드 스팬의 축자 문자열 (마크다운 강조 제거 후).

  # ----------------------------------------------------------------------------
  # CAP-2 — 40차 ⓐ 가 신설한 규칙의 «기계 소비자».
  #
  # 40차 재심 F2(high)가 적발한 것: 40차는 세 소비처에 구조 파생 항을 더해 놓고
  # **그 전수 적용을 검사하는 축을 만들지 않았다**.  실측으로 세 항을 각각 지운 변이가
  # 전부 green 이었다(죽은 검사 3/3) — 「규칙 신설 = 전수 적용까지가 한 단위」를
  # 자기 처분에 적용하지 못한 자리다.  이 규칙이 그 소비자다.
  #
  # 우주·소비처를 «같은 파생»에서 뽑고 술어 하나로 가르는 구조다:
  #   우주   = 살아 있는 차단 술어 자리 전부(이력 행 제외)
  #   소비처 = 그중 구조 파생 항(`|X| >= 1000` 형상)을 실제로 가진 자리
  #   MISSING(universe ∖ consumers) = **자기신고 전용으로 남은 차단 자리**
  #
  # 담지 «않는» 것은 여기서도 같다 — 계수·행번호·소비처 리터럴 목록 0.
  # 모집단이 비면(형상 변경·앵커 소실) `TOS-CC-PARSE` 로 **시끄럽게 죽는다**.
  # ----------------------------------------------------------------------------
  - id: CAP-2
    title: "문서화된 상한의 차단 술어는 구조 파생 항을 반드시 포함한다"
    statement_anchor: "차단 술어의 피연산자는 «수집한 원소 수»(구조 파생)를 반드시 포함한다"
    universe:
      derivation: cap_guard_expressions
      # 블록이 아니라 «형상»을 훑는다 — 차단 술어는 한 블록에 모여 있지 않다.
      # 앵커는 그 형상의 판별 토큰이며, 부재하면 fail-closed 다.
      block_anchor: "→ `PREVENTION_UNVERIFIABLE`"
      description: >-
        살아 있는(이력 행 제외) 차단 술어 자리의 정규화된 식.
    consumers:
      derivation: structural_term_guard_expressions
      block_anchor: "→ `PREVENTION_UNVERIFIABLE`"
      description: >-
        그중 구조 파생 항(집합 크기 피연산자)을 실제로 가진 자리.
    element_id:
      derivation: guard_expression_verbatim
      description: >-
        guard 식의 항들을 ∨ 로 이은 축자 문자열.

# ------------------------------------------------------------------------------
# 닫힌 표 — CLOSED-1 축(`TOS-CC-CLOSED-TABLE`) 정본
#
# 27차가 운영자 승인으로 «심사 이력 표»를 닫았다(이후 심사는 그 표에 적지 않는다).
# 그런데 그 «닫힘»을 보는 축이 0개였다 — `is_history_row` 는 그 표의 리터럴을 다른 축에서
# **면제**할 뿐 닫힘을 강제하지 않는다.  28차 자신이 「27차의 표 닫음은 `is_history_row`
# 에 기계 효과가 0」이라 적었고, 그 뒤 적대 레인이 같은 자리를 다시 냈다.
# 소비자 없는 선언은 산문이다(K-10) — 이 키가 그 선언의 소비자가 서는 자리다.
#
# 담지 «않는» 것: **행 수**.  이 파일 머리말의 스키마 규율 그대로이며, 닫힌 키 집합과
# 정수 거부 술어가 그것을 **기계로** 막는다.  계약 본문도 자리가 아니다 — 「자기 문서를
# 세는 숫자는 그 문서에 두지 않는다」(6차 ⓑ).  계수는 `tools/.tos_contract_baseline.json`
# 의 `closed_table_rows` 에 둔다(그 파일이 `unanchored_self_citations` 로 이미 쓰는 자리이고,
# 값 갱신이 «사람의 기록 행위»로 남는다 — 닫힌 표의 행이 정당하게 바뀌는 일은 운영자 결정이다).
#
# 검사기는 이 키가 «부재하면 fail-closed red» 이며, 그 극성은 `RULE-MANIFEST` 와 같다.
# ------------------------------------------------------------------------------
closed_tables:
  # «심사 이력 표» — 27차 운영자 승인으로 닫혔다.
  - header_anchor: "| 대상 | 결과 |"
    closing_anchor: "이 표를 «닫는다»"
