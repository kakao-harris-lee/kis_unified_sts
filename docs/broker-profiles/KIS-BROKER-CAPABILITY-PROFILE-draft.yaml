            >25" 하한**뿐이다. 그리고 **모의 실측은 실전에 상속 금지**
            (§13.14). 실전 주식 페이지(문서값 50)는 실전 주식 주문 없이는
            실측 불가이고 **그런 주문을 인가한 프로브는 없다**.
          status: PENDING_EVIDENCE          # 아래 08-04 재예약 참조
      operator_decisions_2026_08_04:       # `fa145b5a` — 이 문서 소관 3건
