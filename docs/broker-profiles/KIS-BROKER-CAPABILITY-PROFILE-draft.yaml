          카테고리 25건을 색인 확인했으나 **구독 상한 수치·서술은 부재**였다
          (부재 범위: 예제 래퍼 문서면 한정). 양쪽 모두 미확립 ⇒ null 유지.
      quirks_found:
        - id: Q-SESS-1
          severity: HIGH
          text: >-
            WebSocket 이 **평문 ws://** 다(wss:// 아님). 시세 전용이라 주문
            기밀성 문제는 아니나, approval_key 가 평문 경로로 오가며 egress
            보안 차원(ADR-002-013)에서 하중 있는 사실이다.
          evidence: ["shared/kis/websocket.py:433-434"]
        - id: Q-SESS-2
          severity: MEDIUM
          text: >-
            KIS 는 표준 WS ping 에 PONG 하지 않고 자체 PINGPONG(echo)을 쓴다.
            client ping 을 켜면 정상 연결이 ping_timeout 으로 끊긴다. 그래서
            ping_interval=0 으로 비활성화되어 있다(반쪽 연결은 OS TCP keepalive
            + staleness 로만 감지 — 즉 세션 생존성 감지에 공백이 있다).
          evidence: ["config/streaming.yaml:52", "shared/kis/websocket.py:803"]
        - id: Q-SESS-3
          severity: MEDIUM
          text: >-
            무한 재연결이 **KIS 계정 차단**을 유발할 수 있다는 운영 지식이
            circuit breaker 설정으로 코드화되어 있다(연속 6회 실패 → open,
            600초 창 4회 초과 → open). 즉 세션 재연결에 broker 측 제재 위험이
            존재한다 — 정확한 임계는 미측정.
          evidence:
            - "config/streaming.yaml:59-64 (stock_feed breaker)"
            - "config/streaming.yaml:75-78 (futures_feed breaker)"

