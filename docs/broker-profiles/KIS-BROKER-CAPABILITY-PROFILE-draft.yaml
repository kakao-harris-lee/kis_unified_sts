            §8.10 이 말하는 '계좌 집계 의미론' 과 같은 등급의 안전 사실이다.
            그러나 **그 도달 가능성 자체가 아직 미확립**이므로(P-BAL 3런 전건
            `TRUNCATION_RISK_UNESTABLISHED`) 지금 슬롯을 신설하면 값 없는
            이름만 늘어난다.
