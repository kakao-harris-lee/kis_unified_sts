      measurement: OFFICIAL-DOC (숫자 타입·필수/선택) + NEEDS-LIVE-MEASUREMENT
      spec_collation_2026_07_29: >-
        T4-α: 공식 명세는 주문 필드를 **String 으로 전달**할 것을 명시 요구하고
        (시장가/최유리는 가격 `"0"`), 소수점 문자열의 파서 동작은 서술하지 않는다.
        선물 `NMPR_TYPE_CD`·`KRX_NMPR_CNDT_CD` 는 **[필수]**, `CTAC_TLNO`·
        `FUOP_ITEM_DVSN_CD` 는 선택이며 후자만 기본값("공란")이 서술된다. 우리
        클라이언트가 [필수] 2필드를 빈 문자열로 보내는 사실(N-17 §2 소견 2 —
        P0-2 blocker 후보)은 환경에 무관하다. 이 기입은 공식 명세 인용이며 MOCK
