      measurement: OFFICIAL-DOC + CONTROLLED-PRODUCTION-OBSERVATION (GET 전용) + NEEDS-LIVE-MEASUREMENT
      note: "야간세션(18:00-05:00)은 실전에만 존재 — 모의 증거로 대체 불가."
      probe_observations_2026_07_29:      # T4-α · N-18 2차·3차
        contact_class: "GET 조회 전용(probes_real.py::ALLOWLIST 강제) — 주문 호출 0건"
        _credential_provenance_correction_2026_07_30: >-
          ⚠ **T4-β1 소급 정정.** 아래 N-18 관측 전건은 **모의 앱키로 실전
          도메인을 호출**해 얻은 것이다(계좌 지문 `5e175fd232de` = 배포 호스트
          `.env.paper` 모의 선물 계좌 — 캠페인 README §wave-3 배선 검증).
          T4-α 기입 시점에는 이 사실이 알려지지 않았다.
          **관측 자체는 유지된다** — 행 상한 · `SOX` 철자 · 야간 코드 응답은
          전부 **실전 도메인이 실제로 돌려준 응답**이며, 실전 도메인이 시세 TR 에
          한해 모의 앱키에 응답한다는 것이 wave-3 에서 확정된 의미론이다
          (`credentials_and_revocation._kis.environment_separation_observed.
          _wave3_resolution_2026_07_30`).
          **유지되지 않는 것은 "실전 자격증명 실행" 이라는 서술**이다. 모의 앱키
          조건 하의 실전 도메인 응답이 런북 §6.2 인용 적격을 유지하는지는
          **승인 사슬의 판단 사항**이며 여기서 주장하지 않는다. 같은 이유로
          `assurance_sources` 의 `CONTROLLED_PRODUCTION_PROBE` 값도 **바꾸지
          않았다** — 도메인은 production 이었고 자격증명은 mock 이었다는 두 사실을
          이 정정문으로 병기하고, 값의 재분류는 승인 레인에 맡긴다.
        n18a_program_trade_rows:
          request_range_days: 150
          single_call_rows: 101
          reproduced: 2                   # 065224Z · 105609Z 동일
          verdict: >-
            **상한 후보이지 확립 아님.** 아티팩트 자신의 판정 규칙대로, 101 이
            per-call cap 이려면 요청 구간의 **거래일 수가 101 을 명백히 초과**해야
            하는데 150 역일 ≈ 100~103 거래일이라 "상한" 과 "가용 행 전부" 가
            구분되지 않는다. 구간 대조 후에만 cap 으로 기록할 수 있다.
          row_key_family: "arbt_*/nabt_*/whol_* + stck_bsop_date (스키마 포착됨)"
        n18b_overseas_index:
          tr_id: FHKST03030200            # N-17 #14 확정
          path: "/uapi/overseas-price/v1/quotations/inquire-time-indexchartprice"
          refuted_candidate: HHDFC55020100  # 로드맵 :395 후보 — 색인 부재로 반증
          control_leg: {symbol: SPX, rt_cd: "0", msg_cd: MCA00000, row_count: 102}
          sox_legs:
            - {symbol: "SOX", rt_cd: "0", row_count: 102}   # 데이터 반환
            - {symbol: ".SOX", rt_cd: "0", row_count: 0}
            - {symbol: "^SOX", rt_cd: "0", row_count: 0}
          verdict: >-
            컨트롤(SPX)이 정상이므로 TR 자체는 이 자격증명에서 동작한다. 그 위에서
            **`SOX`(접두 없음) 철자가 102행 데이터를 반환**했고 `.SOX`/`^SOX` 는
            `rt_cd: 0` 이면서 0행이었다. 이는 "이 철자가 데이터를 반환했다" 는
            **관측**이지 공식 표기 보증이 아니며, 0행 철자는 "SOX 미제공" 이
            아니라 "이 철자가 거부됨" 으로만 기록한다(아티팩트 caveat 그대로).
        n18c_night_code_rest:
          day_leg: {symbol: "101S6000", rt_cd: "0", futs_prpr: null}
          night_leg: {symbol: "1A01609", rt_cd: "0", futs_prpr: null}
          observed_at_kst: "2026-07-29 19:56 (야간 세션 창)"
          verdict: >-
            ⚠ 두 레그 모두 `rt_cd: 0` 이지만 **가격 필드가 둘 다 null** 이다.
            따라서 "야간 코드가 REST 로 서빙된다" 도 "서빙되지 않는다" 도
            확립되지 않았다 — 정상 응답 봉투만 확인됐다. 야간 캡처 설계
            (WS 전용) 재검토의 입력이며, 그 자체로 판정 근거가 아니다.
        not_established:
          - "instrument 별 broker 선언 제약(가격제한폭·호가단위·수량단위·정지)"
          - "야간 REST 서빙 여부 (가격 필드 null)"
          - "N-18a 101행의 per-call cap 여부 (거래일 수 대조 미수행)"
          - "SOX 공식 표기 (관측된 철자일 뿐)"
