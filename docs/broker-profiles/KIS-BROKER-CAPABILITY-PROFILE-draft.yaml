      nmpr_blank_vs_explicit_probe_2026_07_31:   # T4-β2 · P-NMPR (정본)
        environment: MOCK_VTS
        observed_at_kst: "2026-07-31 10:51"
        artifact_id: P-NMPR-20260731T015139Z
        applicable_scope: >-
          단일 계좌(60******03) · 단일 세션 · asset=futures · mini A05608 ·
          매수 **지정가**(`ORD_DVSN_CD` "01") · 모의투자 한정. 두 arm 을 동시에
          띄워야 해서 mini 를 썼다(계좌가 full 1계약만 감당 — P-2 full arm).
        design: >-
          arm A = 현행 런타임이 파생하는 명시 값(`NMPR_TYPE_CD` "01" ·
          `KRX_NMPR_CNDT_CD` "0"), arm B = `76d43ae9` 이전의 **빈 문자열** 재현.
          두 본문은 이 2필드만 다르다(아티팩트 `differing_fields`). 수락 여부가
          아니라 **조회 echo 대조**가 판정 근거다 — 수락 동등은 의미 동등이
          아니다(아티팩트 `verdict` 문언).
        observed:
          arm_a_explicit: {rt_cd: "0", odno: "0000003120"}
          arm_b_blank: {rt_cd: "0", odno: "0000003122"}
          query_echoes_quote_fields: [nmpr_type_cd]
          arm_a_echo: {nmpr_type_cd: "01", nmpr_type_name: 지정가}
          arm_b_echo: {nmpr_type_cd: "01", nmpr_type_name: 지정가}
          row_field_differences: []         # 27필드 전수 대조에서 차이 0
        established:
          - "**빈 `NMPR_TYPE_CD` 의 broker 암묵 기본값 = `01`(지정가)** — 두 arm 의 조회 행이 27필드 전수에서 동일하다"
          - "따라서 `76d43ae9` 의 명시 전송은 **동작 보존**이었다(계약 위반을 고쳤을 뿐 의미를 바꾸지 않았다)"
        not_established:
          - >-
            ⚠ **TIF 캐리어 `KRX_NMPR_CNDT_CD` 는 echo 되지 않는다.** 조회 행에
            대응 필드가 없으므로 빈 값이 무엇으로 해석됐는지 **알 수 없다**.
            빈 값의 TIF 의미는 UNKNOWN 유지이며, 그 필드에 대해서는 명시 전송의
            동작 보존도 **증명되지 않았다**(수락됐다는 사실뿐).
          - >-
            **지정가(`01`) arm 하나만 시험했다.** 시장가(`02`)·조건부(`03`)·
            최유리(`04`)와 IOC/FOK 결합값(`10`~`15`)에서 빈 값의 기본값이 같은지는
            미확인이다 — `76d43ae9` 커밋 메시지의 "reachable set {01,02,03}"
            주장은 **이 프로브가 검증한 범위를 넘어선다**.
          - "중복 필드·미지 필드 동작은 여전히 시험 0건 — `duplicate_unknown_and_omitted_field_behavior` UNKNOWN 유지"
        why_dimension_fields_stay_unknown: >-
          한 필드의 기본값 확정으로 `required_and_default_field_semantics` 를
          서술하면 나머지 필드(주식 `EXCG_ID_DVSN_CD`·`SLL_TYPE`·`CNDT_PRIC`,
          선물 `KRX_NMPR_CNDT_CD`·`CTAC_TLNO`)의 공백이 값 뒤에 숨는다.
          UNKNOWN 유지.
        n17_finding_2_disposition: >-
          N-17 §2 소견 2("[필수] 빈 값 전송 = P0-2 blocker 후보")는 **코드 수정
          (`76d43ae9`)으로 이미 해소됐고**, 이 프로브는 그 수정이 의미를 바꾸지
          않았음을 `NMPR_TYPE_CD` 축에서 확인했다. `KRX_NMPR_CNDT_CD` 축은
          미확인으로 남는다 — 소견 2 가 지적한 IOC/FOK 위임 위험은
          **여전히 열려 있다**(§4.3 TIF 미충족 경고 유지).
      odno_wire_encoding_2026_07_31:        # T4-β2 · 식별자 인코딩 비대칭
        environment: MOCK_VTS
        source_artifacts:
          - "P-5-20260731T014143Z (정본 — `measurements.odno_wire_format`)"
          - "P-2-20260731T015102Z · P-NMPR-20260731T015139Z · P-FQP-20260731T015653Z (정본, 동일 필드 반복 관측)"
        observation:
          submit_response_field: "output.ODNO"
          submit_response_form: "0 패딩 10자리 — 예: \"0000002674\""
          query_row_field: "output1[].odno (inquire-ccnl)"
          query_row_form: "**공백 패딩** 10자리 · 선행 0 제거 — 예: \"      2674\""
          canonical_key_rule: "양쪽을 strip → 선행 0 제거해야 같은 키가 된다"
        reading: >-
          **같은 주문번호를 두 표면이 다르게 인코딩한다.** 따라서 제출 응답과
          조회 행을 잇는 식별자 비교는 **양쪽을 정규화**해야 한다. `.strip()`
          만으로 비교하면 `"762" == "0000000762"` 를 묻는 셈이라 **모든 주문에
          대해 거짓**이 된다.
        runtime_status: >-
          ✅ **런타임에는 이 결함이 없다.** `shared/execution/executor.py:132-136
          (_normalize_odno)` 가 이미 같은 규칙(strip → lstrip("0"))으로
          정규화하며 `:620`·`:650` 에서 비교에 쓴다. 이번에 드러난 것은
          **측정 하네스**의 결함이었다(아래).
        harness_defect_3: >-
          하네스가 원문 비교를 쓰는 바람에 `P-5-20260731T002112Z` 가 30s 폴링
          후 censored·n=0 이면서 **같은 ODNO 의 정리 취소는 성공**하는 조합을
          냈다 — 이 조합이 진단 지문이다(런북 §5.5 등재). 수정 `55c3d162` 는
          런타임과 **같은 규칙을 미러링**했고(새 규칙을 발명하지 않았다),
          비교만 정규화하며 취소는 broker 가 수락한 0 패딩 원문을 그대로
          보낸다. 이 결함이 P-5·P-2·P-8·P-FQP·P-NMPR **다섯 프로브를 모두**
          같은 방식으로 실패시킬 상태였다.
        scope_limit: >-
          단일 계좌·단일 세션·모의 환경에서 관측된 **인코딩 사실**이며 KIS 의
          일반 보증이 아니다. 실전으로 외삽하지 않는다(§13.14).
        why_no_dimension_field_moves: >-
          이 관측은 식별자 **표현**의 사실이지 `unit_multiplier_currency_and_
          numeric_encoding`(숫자 인코딩 규약)의 명제가 아니다. 해당 필드값은
          바꾸지 않는다.

