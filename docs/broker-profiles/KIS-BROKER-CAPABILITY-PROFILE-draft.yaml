residual_risks:
  - id: RR-REAL-1
    text: >-
      실전 환경의 **주문 계열 측정 0건**. 이 프로파일은 어떤 live scope 도
      권한 부여하지 않으며(CLASS-D), MOCK 프로파일의 어떤 declaration 도
      상속하지 않는다.
      (T4-α 정정: 2026-07-29 에 **GET 조회 전용 프로브 2건**(N-16 · N-18)이 실전
      도메인에 접촉했다 — allowlist 강제로 주문 경로는 구조적으로 부재. 따라서
      "측정 0건" 을 "주문 계열 측정 0건" 으로 정직하게 좁힌다. 조회 관측은
      어떤 capability status 도 승격시키지 않았다.)
      (T4-β1 갱신: 접촉 건수가 **N-16 5회 + N-18 3회**로 늘었고 그중 2회
      (`132547Z`·`132749Z`)는 **실전 자격증명**으로 수행됐다. 전부 GET 이므로
      이 위험의 명제 — 주문 계열 측정 0건 — 는 **그대로 유효**하다.)
    owner: TBD                          # §21:1089 (Patch-0056 신설 슬롯)
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091 — 수용이 없으므로 만료도 없음
  - id: RR-REAL-2                       # T4-α 신설 (N-16 2차 관측)
    text: >-
      야간 잔고 경로(`CTFN6118R`)에 대한 유일한 실전 접촉이 **EGW02004 로
      거부**됐다("실전투자 도메인은 모의투자 앱키로 호출하실 수 없습니다").
      같은 캠페인의 N-18 은 같은 도메인에서 성공했으므로 프로브의 자격증명
      배선이 레그별로 다를 가능성이 있다. 결과적으로 (a) 야간 잔고 응답 스키마는
      **미확립**이고 (b) 실전 접촉 시 어떤 자격증명이 제시되는지에 대한 우리
      쪽 확신이 없다 — 실전 프로브 재개 전 배선 확인이 선행 조건이다.
    owner: TBD                          # §21:1089
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091
    _supersession_2026_07_30: >-         # T4-β1 — 원문 보존, 명제만 정정
      ⚠ 위 본문은 **부분적으로 낡았다.** 삭제하지 않고 여기서 정정한다.
      · 전제 정정: "유일한 실전 접촉" 이 아니다 — 2026-07-29 22:25/22:27 에
        운영자 발급 **실전 선물 앱키**(신규 계좌, 지문 `00bcc5b3a87b`)로 4·5차가
        실행됐다(`N-16-20260729T132547Z`·`...132749Z`).
      · (b) **해소됨.** 배선 불확실성은 남아 있지 않다. EGW02004 의 원인은
        레그별 배선 차이가 아니라 호스트 전역의 실전 선물 앱키 부재였고, 실전
        키 투입으로 EGW02004 가 소멸하는 반사실까지 확보됐다.
      · (a) **범위 축소되어 존속.** 행 스키마는 여전히 미확립이나, 이유가
        바뀌었다: 거부당해서가 아니라 **신규 실전 계좌에 야간 포지션이 없어서**
        다(`rt_cd: 7 KIOK0560`). 빈-잔고 봉투 의미론은 확립됐다(위
        `position_balance_margin._kis.night_balance_probe_wave3_2026_07_29`).
        남은 재개 조건은 데이터뿐 — 실전 계좌가 야간 포지션을 보유한 상태에서
        야간 창(18:00–05:00 KST) 재실행.
    _limitation_2026_08_04: >-           # T4-β3 — 위 재개 조건의 성립 가능성 한정
      ⚠ **위 재개 조건은 배선상 옳지만 정책상 충족될 수 없다.** 운영자
      결정(2026-08-04, 캠페인 README §운영자 결정 2)으로 실전 선물 계좌는
      오거래 방지를 위해 예수금·증거금을 **의도적으로 비워둔다**는 것이
      확정됐다. 야간 포지션 보유는 증거금을 전제하므로 이 데이터는 현 정책
      하에서 **생성되지 않는다**. 따라서 (a) 행 스키마 미확립은 "재실행하면
      해소" 가 아니라 **정직한 영구 공백**이며, `PENDING` 이 아니라
      `NOT_AVAILABLE` 로 읽어야 한다. 재개 조건 문언은 지우지 않고 여기서
      한정한다. ⚠ 이 한정은 입금이나 실주문을 제안·전제하지 **않는다** —
      실선물 무증거금은 프로젝트 규율이고(CLAUDE.md Non-Negotiable Rules)
      실화폐 선물 주문 경로는 정책상 영구 차단이다. 상세:
      `capabilities.position_balance_margin._kis
      .real_futures_account_is_empty_by_design_2026_08_04`.
  - id: RR-REAL-3                       # T4-β1 신설 (호스트 자격증명 census)
    text: >-
      **실전 주문 권한을 가진 자격증명이 자동화 스택의 env 파일에 존재한다.**
      2026-07-29 22:1x 운영자가 실전 선물 앱키를 신규 발급해 배포 호스트
      `.env.paper` 의 `KIS_FUTURES_*` 로 주입했고(신규 실전 계좌, 지문
      `00bcc5b3a87b`), 그 키가 실전 거래 TR 을 통과함이 실측됐다
      (`N-16-20260729T132547Z`: EGW02004 소멸 → 비즈니스 레이어 도달).
      `.env.paper` 는 페이퍼 스택이 소싱하는 파일이므로, 스택 재생성이나
      `KIS_FUTURES_MARKET` 전환이 **실전 주문 경로를 의도치 않게 활성화**할 수
      있는 구성이 되었다. 현재 이를 막는 것은 코드 게이트
      (`config/futures_live.yaml:25 enabled: false`)와 절차뿐이고, 자격증명
      계층에는 non-exportable signer 도 프로세스 경계 봉인도 없다(RR-4 와 동류).
      더욱이 wave-3 가 확정한 의미론상 **모의 앱키는 실전 시세 TR 에 조용히
      응답하므로**, "응답이 온다" 로는 어느 계열의 키가 배선됐는지 판별되지
      않는다 — 오배선이 침묵으로 지나갈 수 있다.
    owner: TBD                          # §21:1089
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091
  - id: RR-REAL-4                       # T4-β3 신설 (wave-4 P-BAL 실측)
    text: >-
      **실전 선물 잔고 조회에서 "조회 실패" 와 "포지션 없음" 이 호출자에게 같은
      값(`[]`)으로 접힌다.** 이 위험은 두 겹이며, **아래 겹 하나는 이미
      수리됐고 다른 하나는 남아 있다** — 섞지 않는다.
      · **겹 1 (필수 파라미터 누락) — 실측됐고 이후 수리됨.**
        2026-07-31 실측: 당시 런타임 파라미터 셋을 정확히 미러한 호출이
        실전에서 `rt_cd: 7 APMP0001 "증거금구분코드은(는) 필수입력
        항목입니다"` 로 거부됐다(`P-BAL-20260731T084304Z`; 필수
        `MGNA_DVSN`·`EXCC_STAT_CD` 누락). 모의는 이 TR 을 서비스하지 않으므로
        (`shared/kis/client.py:1031` NOTE) 그 시점까지 이 요청은 **어느
        브로커에서도 성공한 적이 없었다**. 운영자 결정(2026-07-31 야간)으로
        `docs/known-deferred-execution-risks.md` **D-F** 에 등재됐고,
        **2026-08-03 커밋 `0b2d3962`(PR #635)가 두 필드를 실제로 추가해
        수리했다** — HEAD `670aef6a` 실측: `client.py:1069-1070` 이
        `"MGNA_DVSN"`·`"EXCC_STAT_CD"` 를 전송하고 :1038-1041 docstring 이
        누락 시의 APMP0001 거부와 조용한 `[]` 반환을 명문화한다. 즉 이 겹의
        **코드 명제는 더 이상 참이 아니다.** 다만 배포 반영은 별개다 —
        운영자 결정(2026-08-04)으로 paper 컨테이너 재배포는 **보류**됐다
        (해당 결함은 paper 에서 dormant 라는 판단).
      · **겹 2 (fail-open 접기) — 그대로 남아 있다. 표면은 하나가 아니라
        둘이다** (HEAD `670aef6a` 실측): `client.py:1086-1094` 는
        **HTTP ≠ 200** 이면 로그만 남기고 `[]` 를 반환하고,
        `client.py:1097-1101` 은 **`rt_cd != "0"`** 이면 같은 일을 한다.
        즉 전송 계층 실패(타임아웃·5xx·게이트웨이 거부)와 비즈니스 계층
        오류가 **각각 독립적으로** 빈 잔고로 접힌다. 따라서 **임의의 조회
        오류가 여전히 빈 잔고와 구별되지 않는다.** 게다가 wave-4 가 확립한 의미론상 정상 빈-결과조차
        `rt_cd: "7"` + `KIOK0560` 이므로(주식은 같은 msg_cd 를 `rt_cd: "0"`
        과 짝짓는다), 이 접기는 **정상 빈-셋과 진짜 오류를 양방향으로**
        뭉갠다. `0b2d3962` 는 이 구조를 바꾸지 않았다.
      **소비자가 실재한다**: `services/trading/broker_verification.py` 가
      잔고를 읽고(:80 선물) `remove_redis_only` 가 유효하면 잔고에 없는
      포지션을 `remove_position(reason='broker_absent')` 로 제거한다
      (게이트 :105·:121-127, 제거 :187-190). 따라서 겹 2 는 **전 포지션
      broker_absent 제거**로 이어질 수 있는 구조다.
      ⚠ 그 도달 가능성은 **실증되지 않았다** — 게이트가 실제 배치에서 켜지는지,
      제거가 트리거되는지를 이 캠페인은 시험하지 않았다. 구조적 가능성으로만
      기록한다.
      ⚠ **이 위험은 계좌 자금 상태와 무관하다** — 파라미터/접기 결함이므로
      계좌가 비어 있든 아니든 동일하다. 입금은 처방이 아니며 제안되지도 않는다.
      본 프로파일은 코드를 바꾸지 않는다.
    owner: TBD                          # §21:1089
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091
    _anchor_note: >-
      이 항목의 코드 줄 앵커는 전부 커밋 **`670aef6a`** 기준이며
      `git show <commit>:<path>` 로 재검증됐다 — 작업 트리가 아니다(fold 실행
      중 타 세션이 `tools/broker_probes/` 를 mid-edit 상태로 들고 있었다).
      대조로, 아티팩트 `P-BAL-20260731T084304Z` 가 담은 앵커
      (`client.py:1051-1057`·`:1026`)는 그 실행 시점 커밋 `381a5650` 기준이고
      `670aef6a` 에서는 **드리프트했다**(:1026 은 이제 파라미터 기본값,
      :1051-1057 은 계좌번호 해석부). 아티팩트 앵커를 그대로 옮기지 않고
      재실측한 값으로 대체한 이유다 — T4-β2 의 앵커 규율과 동일.

