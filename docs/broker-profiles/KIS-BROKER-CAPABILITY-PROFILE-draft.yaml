        비활성화 가능 여부·탐지 경로·탐지 시한은 전부 미측정. 아래
        external_activity 와 함께 P0-2 필수 측정 항목.

uncertain_send_policy:
  containment_scope: ACCOUNT
  network_retry: PROHIBITED_UNLESS_PROVEN_IDEMPOTENT
  query_sequence:
    - "inquire-ccnl (선물) — STRT_ODNO 로 대상 주문 조회"
    - "inquire-balance — 포지션 대조"
  final_unresolved_state: QUARANTINED_UNKNOWN
  _kis:
    measurement: CODE-EVIDENCED
    gap: >-
      현행 코드는 `PROHIBITED_UNLESS_PROVEN_IDEMPOTENT` 를 만족하지 못한다
      (Q-IDEMP-1 / Q-IDEMP-2). 또한 미해결 상태를 QUARANTINED_UNKNOWN 으로
      격리하는 경로가 없다 — 타임아웃 후 취소 실패 시 success=False 로
      반환하고 종료한다(executor.py:501-509).
      주식 경로에는 조회 시퀀스 자체가 없다.

external_activity:
  allowed: true
  detection_sources:
    - "inquire-balance 대조 (broker_verification)"
  detection_bound_ms: null
  containment_bound_ms: null
  bound_miss_response: CONTAIN
  _kis:
    measurement: CODE-EVIDENCED (source) + NEEDS-LIVE-MEASUREMENT (bounds)
    note: >-
      외부 활동(HTS/MTS/영업점)은 허용된다고 보아야 한다. 탐지는 시작 시점
      잔고 대조에 의존하며(config/execution.yaml:78-81) **주기적 탐지 시한이
      정의되어 있지 않다** — detection_bound_ms / containment_bound_ms 는
      P0-1 bounds 승인과 P0-2 측정이 함께 필요한 항목이다
      (B_external_activity_detect / _contain — 설계 #10 §9.2 item 3).

final_quantity_proof:
  recipes:
    - recipe_id: FQP-KIS-FUT-CANCEL-THEN-REQUERY-DRAFT
      order_type: FUTURES_LIMIT
      status: DRAFT_NOT_APPROVED
      steps:
        - "1. 취소 요청 송신 (order-rvsecncl, RVSE_CNCL_DVSN_CD=02, RMN_QTY_YN=Y)"
        - "2. 취소 ack 를 최종 수량 근거로 **사용하지 않는다** (§15.3 금지)"
        - "3. inquire-ccnl 재조회로 tot_ccld_qty / qty(잔량) / rjct_qty 확인"
        - "4. 잔량 0 이고 late-event 창 경과까지 변화 없을 때만 최종으로 취급"
      # -- Patch-0056 신설 슬롯: recipes[] 원소 스키마 (아래 _model_view 미러) --
      required_result:                    # §15.2:845-851 — 7 결과 전부 미성립
        broker_order_identity_or_bounded_effect: false
        final_cumulative_filled_quantity: false
        zero_remaining_executable_quantity: false
        corrections_busts_late_events_handled: false
        evidence_source_provenance: false
        within_valid_window: false
        ordering_waiting_rule_satisfied: false
      prohibited_proofs:                  # §15.3:857-863
        - CANCEL_ACKNOWLEDGEMENT
        - ONE_OPEN_ORDER_QUERY_OMISSION
        - LOCAL_TIMEOUT
        - STRATEGY_CANCELLATION_INTENT
        - PROCESS_RESTART
        - ACCOUNT_POSITION_MATCHING_EXPECTED_VALUE
        - OPERATOR_ASSERTION_WITHOUT_BROKER_EVIDENCE
      no_later_change_asserted: null      # §15.4:867 마커 1
      late_event_window_defined: false    # §15.4:867 마커 2
      _model_view:                        # records.py FinalQuantityProofRule:149-152
        order_type: FUTURES_LIMIT
        prohibited_proofs:
          - CANCEL_ACKNOWLEDGEMENT
          - ONE_OPEN_ORDER_QUERY_OMISSION
          - LOCAL_TIMEOUT
          - STRATEGY_CANCELLATION_INTENT
          - PROCESS_RESTART
          - ACCOUNT_POSITION_MATCHING_EXPECTED_VALUE
          - OPERATOR_ASSERTION_WITHOUT_BROKER_EVIDENCE
        no_later_change_asserted: null    # broker 가 "이후 변경 없음" 을 보증하지 않음
        late_event_window_defined: false  # 창이 정의되어 있지 않음
      _adequacy: >-
        ⚠ 이 recipe 는 **현재 상태로는 부적합**이다. §15.4 마커 2개
        (no_later_change_asserted / late_event_window_defined) 중 어느 것도
        참이 아니므로 fqp_adequate 는 통과할 수 없다(설계 #10 §6.3). 또한
        3단계가 Q-OOQ-1(단일 페이지 조회) 결함을 상속한다.
      _evidence:
        - "shared/execution/executor.py:495-520 (취소 후 재조회 — 현행 동작)"
        - "shared/execution/executor.py:580-592 (수량 필드)"
  late_event_window_ms: null              # NEEDS-LIVE-MEASUREMENT (P0-1 bounds 연계)
  correction_policy: TBD
  _kis:
    measurement: NEEDS-LIVE-MEASUREMENT
    stock_gap: "주식 FQP recipe 없음 — 주식 취소/미체결 조회 경로 자체가 부재."

