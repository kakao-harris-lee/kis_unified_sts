          거부를 **무증상 실패**로 흘린다.
        n15_extended_lockout: >-
          같은 캠페인의 N-15 는 4회 전패했다: 1차 `EGW00133`, 2차 tokenP POST 중
          `RemoteDisconnected`, 3차(+266s)·4차(+8.8min) 모두 `EGW00133` 지속.
          공식 문언("1분당 1회")과 달리 **마지막 발급으로부터 8.8분 뒤에도 재발급이
          거부**되는 확대 잠금이 관측됐다. 이는 거부 표면의 보강 증거이지
          창 길이의 측정이 아니다 — `token_blackout_window_ms` 는 null 이다.
        n15_citation_caveat: >-
          N-15 아티팩트 4건은 `errors: []` 를 만족하지 않아 런북 §6.2 상
          **인용 부적격**이다. 위 서술의 근거는 캠페인 README 의 "정직한 음성"
          절이며, **값 확립이 아니라 음성 결과의 기록**으로만 인용한다.
        consequence_for_our_client: >-
          `retry_once_on_token_expiry`(auth.py:64-104) 와 invalidate→재발급 경로
