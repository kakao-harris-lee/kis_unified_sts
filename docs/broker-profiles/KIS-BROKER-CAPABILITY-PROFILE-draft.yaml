        우리 시스템은 체결 **이벤트**를 받지 않는다. 체결은 inquire-ccnl 폴링의
        누적 스냅샷(tot_ccld_qty / qty / rjct_qty)에서 **파생**된다. 따라서
        duplicates_possible / out_of_order_possible 은 broker 측정값이 아니라
        템플릿의 보수적 기본값을 유지한 것이다. replay_supported: false 역시
        측정되지 않은 보수 기본값이다.
      evidence:
        - "shared/execution/executor.py:530-596 (_inquire_futures_fill_status — 폴링)"
        - "shared/execution/executor.py:580-582 (tot_ccld_qty / qty / ord_qty 누적 스냅샷)"
