      evidence_reference: null
      restriction: null
      restriction_approved: null
      fallback_reference: NO_BLIND_RETRY_AND_CONTAIN
      assurance_sources: []
    _kis:
      measurement: CODE-EVIDENCED (our client only) + NEEDS-LIVE-MEASUREMENT (broker side)
      observation: >-
        우리 클라이언트가 KIS 로 보내는 주문 본문에는 **클라이언트 생성 식별자
        필드가 하나도 없다**. 주식 본문 6필드(CANO/ACNT_PRDT_CD/PDNO/ORD_DVSN/
        ORD_QTY/ORD_UNPR), 선물 본문 11필드 모두 broker 정의 필드다. 주문
        식별자 ODNO 는 응답에서 broker 가 부여한다.
      evidence:
        - "shared/execution/executor.py:315-322 (주식 주문 본문 — 클라이언트 id 없음)"
        - "shared/execution/executor.py:386-399 (선물 주문 본문 — 클라이언트 id 없음)"
        - "shared/execution/executor.py:335 (ODNO = broker 부여, 주식)"
        - "shared/execution/executor.py:412 (ODNO = broker 부여, 선물)"
      why_not_unsupported: >-
        "우리가 보내지 않는다" ≠ "broker 가 제공하지 않는다". KIS API 가 클라이언트
        주문번호 필드를 제공하는지 여부는 **미확인**이므로 UNSUPPORTED 가 아니라
        UNKNOWN 이다(anti-phantom: 부재 주장도 실측 필요). BC-INV-001 상
        UNKNOWN 은 어차피 unavailable 로 취급되어 보수적 결과는 동일하다.

  # -- 2/17 · SUBMISSION_IDEMPOTENCY -------------------------------------
  submission_idempotency:
    status: UNKNOWN
    assurance_level: EV-L0
    evidence_refs: []
    deduplication_window_ms: null
    restrictions: []
    restriction_approved: false
    fallback_reference: NO_BLIND_RETRY_AND_CONTAIN
    assurance_sources: []
    _model_view:
      dimension: SUBMISSION_IDEMPOTENCY
      status: UNKNOWN
      assurance_level: LEVEL_0_UNKNOWN
      evidence_reference: null
      restriction: null
      restriction_approved: null
      fallback_reference: NO_BLIND_RETRY_AND_CONTAIN
      assurance_sources: []
    _kis:
      measurement: NEEDS-LIVE-MEASUREMENT
      observation: >-
        중복 제거 창(deduplication window)에 대한 broker 보증은 알려진 바 없다.
        ORDER_IDENTITY 부재와 결합하면 재전송은 **증명 불가능한 중복 위험**이다.
      quirks_found_in_our_client:
        - id: Q-IDEMP-1
          severity: HIGH
          text: >-
            executor.py 의 주문 재시도 루프는 `response.order_no` 가 있을 때만
            재시도를 멈춘다(:225-232). 그러나 **예외 경로**(:238-241 — 타임아웃/
            네트워크 오류)에서는 order_no 를 알 수 없는 채로 최대 max_retries 회
            재전송한다. 전송되었을 수 있는 주문의 blind retry = BC-INV-002/003
            위반 후보.
          evidence:
            - "shared/execution/executor.py:218 (for attempt in range(max_retries))"
            - "shared/execution/executor.py:225-232 (order_no 있으면 재시도 중단)"
            - "shared/execution/executor.py:238-241 (예외 시 재시도 — 미보호)"
            - "config/execution.yaml:3 (max_retries: 3), :4 (retry_delay: 1.0)"
        - id: Q-IDEMP-2
          severity: HIGH
          text: >-
            `_request_json` 은 **모든** KIS 호출(주문 POST 포함)을
            `retry_once_on_token_expiry` 로 감싼다. 토큰 만료로 판정되면 동일
            주문 본문을 1회 재전송한다. 판정은 응답 payload 기반이므로 서버가
            주문을 수락한 뒤 만료 응답을 낸 경우를 배제할 수 없다.
          evidence:
            - "shared/execution/executor.py:403 (주문 POST 가 _request_json 경유)"
            - "shared/execution/executor.py:674+ (_request_json)"
            - "shared/kis/auth.py:64-104 (retry_once_on_token_expiry — 정확히 1회 재전송)"
      probe_proposal: >-
        모의투자에서 동일 본문을 의도적으로 2회 전송하고 inquire-ccnl 로 ODNO
        2건 생성 여부를 확인. 2건이면 dedup 없음(UNSUPPORTED 확정), 1건이면
        창 길이를 이분 탐색. 메모 §5 P-2.

  # -- 3/17 · ACKNOWLEDGEMENT_SEMANTICS ----------------------------------
  acknowledgement_semantics:
    status: DOCUMENTED_NOT_VERIFIED
    assurance_level: EV-L1
    evidence_refs: []
    proven_state: TRANSPORT_RECEIVED_ONLY
    restrictions: []
    restriction_approved: false
    fallback_reference: null
    assurance_sources: [OFFICIAL_SPECIFICATION]
    _model_view:
      dimension: ACKNOWLEDGEMENT_SEMANTICS
      status: DOCUMENTED_NOT_VERIFIED
      assurance_level: LEVEL_1_DOCUMENTED
      evidence_reference: null
      restriction: null
      restriction_approved: null
      fallback_reference: null
      assurance_sources: [OFFICIAL_SPECIFICATION]
    _kis:
      measurement: CODE-EVIDENCED
      observation: >-
        수락 판정은 단일 결합 코드 `rt_cd == "0"` + `msg1` + `output.ODNO` 다.
        ADR-002-004 §8.3 line 331 "If one response code combines these states,
        the weakest safe interpretation applies" 에 따라 proven_state 는
        템플릿의 최약 값 TRANSPORT_RECEIVED_ONLY 를 유지한다.
      observed_but_unverified: >-
        ODNO 가 반환된다는 사실은 BROKER_RECEIVED 이상을 **시사**하지만 검증
        전이므로 승격하지 않는다. AcknowledgementState(vocabulary.py:194-199)
        6멤버 중 ACCEPTED/WORKING 은 rt_cd=0 만으로 증명되지 않는다 — 실제로
        코드가 별도 체결조회 폴링(:420-433, :530-596)을 두는 것 자체가
        "수락 ≠ 작동 중" 을 우리 시스템이 이미 가정한다는 증언이다.
      evidence:
        - "shared/execution/executor.py:332-338 (주식: rt_cd/msg1/ODNO)"
        - "shared/execution/executor.py:404-412 (선물: rt_cd/msg1/ODNO)"
        - "shared/execution/executor.py:420-433 (수락 후 체결 폴링 진입)"

