        ⚠ **실전 도메인이 필수 필드 누락을 실제로 거부하는 것이 처음 관측됐다.**
        선물 잔고 조회 TR `CTFO6118R` 에 `MGNA_DVSN`·`EXCC_STAT_CD` 를 빼고
        보내면 `rt_cd: 7 APMP0001 "증거금구분코드은(는) 필수입력 항목입니다"`
        로 거부된다(`P-BAL-20260731T084304Z`, 2026-07-31 17:43 KST). 관측 원문과
        처분은 `position_balance_margin._kis.balance_pagination_probe_wave4_
        2026_07_31.futures_leg.excluded_runs` 에 있다.
        · **`required_and_default_field_semantics` 는 UNKNOWN 을 유지한다.**
          이 관측이 확립한 것은 **조회 TR 1건**에서의 필수 강제이며, 이 차원의
          명제인 주문 구성 표면의 필수/기본값 의미론이 아니다. 조회 1건에서
          주문 표면으로 일반화하는 것은 근거 없는 확장이다.
        · `evidence_refs[]` 에도 넣지 않는다 — 그 아티팩트는 `NOT_MEASURED`
          이고(런북 §6.2 불통과), 동반 정본 `114344Z` 는 스스로
          `targets.instance_fields` 에 이 차원을 지목하지 않는다.
        · 다만 방향은 RR-8 과 **정반대의 신호**다: 모의가 관대하게 수락한
          누락 필드를 실전은 거부한다는 첫 실측이 이 계열에서 나왔다. RR-8 의
          명제("모의 수락은 실전 수용성의 증거가 아니다")를 강화한다.

