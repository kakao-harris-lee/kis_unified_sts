        source: "https://github.com/koreainvestment/open-trading-api/blob/main/README.md"
        measurement: OFFICIAL-DOC
        consequence: >-
          토큰 무효화 후 즉시 재발급이 **broker 측에서 거부될 수 있다**. 우리
          코드의 invalidate→retry 경로(auth.py:396-410, :64-104)는 이 1분 창을
          알지 못한다 — 만료 재시도가 재발급 실패로 이어지는 구간이 존재한다.
      token_validity:
        expires_in_default_used_by_our_client: 86400
        evidence: "shared/kis/auth.py:472, :583"
        measurement: CODE-EVIDENCED (우리 클라이언트의 fallback 기본값)
        note: >-
          86400 은 응답에 expires_in 이 없을 때의 **우리 기본값**이다. 실제
          만료는 응답 값이 지배한다. 공식 문서상 토큰은 1일 1회 발급 원칙.
        renewal_buffer_seconds: 600
        renewal_buffer_evidence: "config/kis/auth.yaml:17"
      credential_storage:
        token_cache_file: ".kis_token_{suffix}"
        evidence: "shared/kis/auth.py:161"
        secure_write: "shared/kis/auth.py:218 (_save_token_cache_secure)"
      revocation:
        broker_revocation_api: UNKNOWN
        revocation_bound_ms: null
        measurement: NEEDS-LIVE-MEASUREMENT
        note: >-
          자격증명 폐기 API/절차와 그 전파 시한은 알려지지 않았다. 로컬
          invalidate(auth.py:396-410)는 **캐시 삭제**일 뿐 broker 측 폐기가 아니다.
      quirks_found:
        - id: Q-CRED-1
          severity: HIGH
          text: >-
            템플릿의 `direct_worker_access_prohibited: true` 는 현행 시스템에서
            **성립하지 않는다**. 모든 워커 프로세스가 환경변수로 raw app_key /
            app_secret 을 직접 보유한다. 사실대로 false 로 기재했다 — 정책
            희망값을 기재하면 프로파일이 거짓 보증을 하게 된다.
          evidence:
            - "config/kis/auth.yaml:7-8 (${KIS_APP_KEY}/${KIS_APP_SECRET})"
            - "shared/execution/mock_mirror.py:31-33 (os.getenv 로 직접 취득)"
        - id: Q-CRED-2
          severity: MEDIUM
          text: >-
            circuit breaker 가 인증 계층에 있다(연속 5회 실패 → 60초 차단,
            half-open 3회). 자격증명 오류와 인프라 오류가 같은 차단기를 공유한다.
          evidence: ["config/kis/auth.yaml:20-24", "shared/kis/auth.py:656"]

