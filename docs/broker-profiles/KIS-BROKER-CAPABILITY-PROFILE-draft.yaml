      워커 프로세스가 raw 자격증명을 보유(Q-CRED-1)하고 non-exportable signer
      가 없어, egress 권한이 프로세스 경계로 봉인되지 않는다.
    owner: TBD                          # §21:1089 (Patch-0056 신설 슬롯)
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091 — 수용이 없으므로 만료도 없음
  - id: RR-5
    text: >-
      MOCK 환경에는 야간세션 TR 이 없어(Q-MIC-1) 야간 관련 어떤 capability 도
      모의에서 검증할 수 없다 — MOCK→REAL 외삽 금지의 구체적 근거.
      (T4-α: 근거가 repo TR 표 관측에서 **공식 명세 구조**로 격상 — N-17 #13.)
    owner: TBD                          # §21:1089 (Patch-0056 신설 슬롯)
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091 — 수용이 없으므로 만료도 없음
  - id: RR-6                            # T4-α 신설 (P-15 · N-15 실측 기반)
    text: >-
      토큰 재발급 거부가 (a) HTTP 403 + **비표준 오류 봉투**(`error_code`/
      `error_description`)로 오고 (b) 마지막 발급으로부터 **8.8분 뒤에도 지속**
      되는 확대 잠금이 관측됐다. 우리 만료 재시도 경로(auth.py:64-104, :396-410)는
      이 거부를 만료로 인식하지 못하고 재시도가 잠금을 연장시킬 수 있다 —
      즉 **자격증명 계층의 자기 유발 가용성 손실** 위험이다. 창 길이는 미확립
      (`token_blackout_window_ms: null`)이므로 회복 시점을 예측할 수 없다.
    owner: TBD                          # §21:1089
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091
  - id: RR-7                            # T4-α 신설 (N-17 #4 확정 · §2 소견 1)
    text: >-
      주문유형 폴백 `"01"` 이 자산군에 따라 의미가 반대임이 공식 명세로 확정됐다
      (주식=시장가 / 선물=지정가). 따라서 미지 주문유형이 **주식 경로에서 조용히
      시장가 주문으로 변환**된다 — 가격 통제를 잃는 방향의 fail-open 이며
      permissive-repair 금지(order_construction_binding) 위반이다.
      처방은 폴백 제거(fail-closed 거부)이고 이는 코드 수정 후보다.
    owner: TBD                          # §21:1089
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091
  - id: RR-8                            # T4-β1 신설 (wave-3 주문 계열 세션)
    text: >-
      **모의의 관대함이 계약 위반을 가린다.** 2026-07-30 세션에서 모의 broker 가
      공식 [필수] 3필드(`EXCG_ID_DVSN_CD`·`SLL_TYPE`·`CNDT_PRIC`)가 빠진 주식
      주문 본문을 `rt_cd: 0` 으로 수락했다. 선물 경로에도 같은 계열의 위반이
      있다([필수] `NMPR_TYPE_CD`·`KRX_NMPR_CNDT_CD` 를 빈 문자열로 전송 —
      Q-WIRE-1 인접 관측). 따라서 **모의에서의 주문 수락은 실전 수용성의 증거가
      아니며**, 거래소 라우팅·매도유형·조건가격이 broker 의 암묵 기본값에
      위임된 채로 남는다. 실전 도메인이 같은 본문을 거부할지 수락할지는
      미확립이고(§13.14 로 외삽 금지), 수락한다면 그것대로 통제 상실이다.
    owner: TBD                          # §21:1089
    acceptance: TBD                     # §21:1090 — TBD = 미수용
    expiry: null                        # §21:1091

