          evidence: ["config/streaming.yaml:52", "shared/kis/websocket.py:803"]
        - id: Q-SESS-3
          severity: MEDIUM
          text: >-
            무한 재연결이 **KIS 계정 차단**을 유발할 수 있다는 운영 지식이
            circuit breaker 설정으로 코드화되어 있다(연속 6회 실패 → open,
            600초 창 4회 초과 → open). 즉 세션 재연결에 broker 측 제재 위험이
            존재한다 — 정확한 임계는 미측정.
          evidence:
            - "config/streaming.yaml:59-64 (stock_feed breaker)"
            - "config/streaming.yaml:75-78 (futures_feed breaker)"

  # -- 15/17 · CREDENTIALS_AUTHORIZATION ---------------------------------
  credentials_and_revocation:
