      observation: >-
        중복 제거 창(deduplication window)에 대한 broker 보증은 알려진 바 없다.
        ORDER_IDENTITY 부재와 결합하면 재전송은 **증명 불가능한 중복 위험**이다.
      quirks_found_in_our_client:
        - id: Q-IDEMP-1
          severity: HIGH
          text: >-
            executor.py 의 주문 재시도 루프는 `response.order_no` 가 있을 때만
            재시도를 멈춘다(:225-232). 그러나 **예외 경로**(:238-241 — 타임아웃/
            네트워크 오류)에서는 order_no 를 알 수 없는 채로 최대 max_retries 회
            재전송한다. 전송되었을 수 있는 주문의 blind retry = BC-INV-002/003
            위반 후보.
          evidence:
            - "shared/execution/executor.py:218 (for attempt in range(max_retries))"
            - "shared/execution/executor.py:225-232 (order_no 있으면 재시도 중단)"
            - "shared/execution/executor.py:238-241 (예외 시 재시도 — 미보호)"
            - "config/execution.yaml:3 (max_retries: 3), :4 (retry_delay: 1.0)"
        - id: Q-IDEMP-2
          severity: HIGH
          text: >-
            `_request_json` 은 **모든** KIS 호출(주문 POST 포함)을
            `retry_once_on_token_expiry` 로 감싼다. 토큰 만료로 판정되면 동일
            주문 본문을 1회 재전송한다. 판정은 응답 payload 기반이므로 서버가
            주문을 수락한 뒤 만료 응답을 낸 경우를 배제할 수 없다.
          evidence:
            - "shared/execution/executor.py:403 (주문 POST 가 _request_json 경유)"
            - "shared/execution/executor.py:674+ (_request_json)"
            - "shared/kis/auth.py:64-104 (retry_once_on_token_expiry — 정확히 1회 재전송)"
      probe_proposal: >-
        모의투자에서 동일 본문을 의도적으로 2회 전송하고 inquire-ccnl 로 ODNO
        2건 생성 여부를 확인. 2건이면 dedup 없음(UNSUPPORTED 확정), 1건이면
        창 길이를 이분 탐색. 메모 §5 P-2.
      probe_proposal_decision_rule_SUPERSEDED_2026_07_31: >-
        ⚠ 위 제안의 판정 규칙 "**2건이면 UNSUPPORTED 확정**" 은 **너무 강하다** —
        원문은 남기고 여기서 정정한다. 2건은 "그 간격에서 dedup 되지 않았다" 만
        말한다. 프로브는 `--pace-s` 로 하한이 잡힌 간격에서만 보낼 수 있으므로
        (아래 `effective_gap_semantics`) 그보다 짧은 창은 **관측 대상 밖**이고,
        아티팩트 자신의 `window_semantics` 도 "가장 작은 비-dedup 간격 = 창의
        **상한**" 이라고 명시한다. 부재를 확정하려면 0 까지 좁힌 간격에서의
        비-dedup 이 필요하다. 실행 결과의 처분은 아래 블록이다.
      dedup_probe_2026_07_31:               # T4-β2 · wave-3b (인용 적격 정본)
        environment: MOCK_VTS
        observed_at_kst: "2026-07-31 10:51"
        artifact_id: P-2-20260731T015102Z
        applicable_scope: >-
          단일 계좌(60******03, 지문 5e175fd232de) · 단일 세션 · asset=futures ·
          mini 근월물 A05608 · 매수 지정가 · 모의투자 한정.
        method: "완전 동일 본문(11필드, `UNIT_PRICE` 902.38 포함) 2회 전송"
        observed:
          submit_1: {rt_cd: "0", msg1: "모의투자 매수주문이 완료 되었습니다."}
          submit_2: {rt_cd: "0", msg1: "모의투자 매수주문이 완료 되었습니다."}
          distinct_odno_count: 2
          odno_confirmed_in_query: ["3093", "3095"]   # 조회로 2건 모두 실재 확인
          verdict_field: NO_DEDUP
        effective_gap_semantics: >-
          `gap_ms: 1100.0` 은 요청값이 아니라 **실효값**이다. `--pace-s 1.1` 이
          `--gap-ms` 를 바닥에서 올려버리므로 1100ms 보다 짧은 간격은 **와이어에
          도달한 적이 없다**. 더 짧은 간격을 시험하려면 페이싱을 낮춰야 하고,
          그것은 P-13 이 관측한 유량 거부를 되살린다(구조적 상충).
        licensed_claim: >-
          **"dedup 창의 상한 < 1100ms"** — 이것 하나뿐이다. 0 이라는 뜻이 아니며
          (캠페인 README §8.4 동일 문언), 따라서 `deduplication_window_ms` 는
          null 을 유지한다.
        why_status_stays_unknown: >-
          `UNSUPPORTED` 는 "broker 가 제출 멱등성을 제공하지 않는다" 는 차원
          전체의 명제다. 이 관측은 **1100ms 이상 간격**에 대해서만 그것을
          보이며, 그보다 짧은 창의 존재를 배제하지 못한다. 게다가 우리 재시도
          경로의 지연은 `retry_delay: 1.0`(config/execution.yaml:4) 로 **1100ms
          미만이 실제로 도달 가능한 영역**이다 — 즉 미관측 구간이 운영상
          도달 가능하다. 부재를 확정하지 못한 채 UNSUPPORTED 를 쓰면 캠페인
          자신의 "0 이라는 뜻 아님" 판단을 값으로 뒤집는 것이 된다. UNKNOWN 유지.
          (BC-INV-001 상 UNKNOWN·UNSUPPORTED 모두 unavailable 이므로 이 보류는
          권한을 넓히지도 좁히지도 않는다 — 정확성만의 문제다.)
        what_it_does_establish:
          - "동일 본문 2회 전송이 **서로 다른 주문 2건**으로 성립할 수 있다(조회 확인)"
          - "따라서 Q-IDEMP-1/2 의 blind retry 위험은 가설이 아니라 **실현 가능**하다"
        what_it_does_not_establish:
