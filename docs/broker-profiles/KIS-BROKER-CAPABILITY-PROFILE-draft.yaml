          KRX_NMPR_CNDT_CD: REQUIRED        # 동상 — TIF 캐리어
          CTAC_TLNO: OPTIONAL               # 생략 시 broker 기본값 **미확인**
          FUOP_ITEM_DVSN_CD: OPTIONAL       # 기본값 서술 존재: "공란(Default)"
        our_client_delta:
          finding: >-
            ⚠ 우리 클라이언트는 위 **[필수] 2필드(NMPR_TYPE_CD·KRX_NMPR_CNDT_CD)를
            빈 문자열로 전송**한다(executor.py:386-399). 공식 래퍼는 같은 입력에서
            호출 자체를 ValueError 로 막는다. 이는 "생략 시 기본값" 문제가 아니라
            **필수 필드 계약 위반 후보**이며, `KRX_NMPR_CNDT_CD` 는 TIF 캐리어이므로
            IOC/FOK 의미론이 broker 측 암묵 기본값에 위임되고 있다는 뜻이다.
          disposition: >-
            N-17 §2 소견 2 는 이를 **P0-2 blocker 후보**로 올릴 것을 제안한다.
            값 확정 없이도 "빈 값 전송 금지" 는 판정 가능하다. 본 프로파일은
            사실만 기록하고 코드를 바꾸지 않는다.
          evidence:
            - "shared/execution/executor.py:386-399 (빈 문자열 4필드)"
            - "docs/plans/2026-07-29-tos-p02-n17-spec-collation.md:87-98 (§2 소견 2)"
        stock_excg_id_dvsn_cd_note: >-
          공식 명세에서 주식 주문의 `EXCG_ID_DVSN_CD` 는 **[필수]** 인데 P-1 이
          실측한 우리 주식 본문 6필드에는 없다(N-17 §2 부수 관측과 일치). 주식
          주문 경로 자체가 미사용이라 즉시 영향은 없으나, 주식 경로 활성화 시
          선행 확인 항목이다.
      omitted_required_field_acceptance_2026_07_30:  # T4-β1 · wave-3
        citation_eligibility: >-
          ⚠ 출처 `P-11-20260730T002715Z` 는 `provenance_class: NOT_MEASURED`
          (censored) 라 런북 §6.2 를 통과하지 못한다 — `evidence_refs[]` 에 쓰지
          않고 여기 관측으로만 보존한다. 보존 경로:
          docs/broker-profiles/evidence/2026-07-29-p02-t2-campaign/
          P-11-20260730T002715Z.json (MOCK_VTS, 2026-07-30 09:27 KST).
        observed_request_body_6:            # 아티팩트 observations[0].order_body
          [CANO, ACNT_PRDT_CD, PDNO, ORD_DVSN, ORD_QTY, ORD_UNPR]
        broker_verdict: "http 200 · rt_cd `0` · 모의투자 매수주문이 완료 되었습니다. · ODNO 0000008686"
        finding: >-
          공식 명세가 주식 주문 [필수] 로 규정한 9필드 중 **3필드
          (`EXCG_ID_DVSN_CD`·`SLL_TYPE`·`CNDT_PRIC`)가 빠진 본문**을 모의
          broker 가 **수락**했다. 즉 이 환경에서 "필수" 는 게이트로 강제되지
          않는다.
        provenance_caveat: >-
          ⚠ 이 6필드는 **프로브 하네스가 구성한 본문**이지
          `shared/execution/executor.py:315-322` 의 런타임 본문이 아니다. 또한
          아티팩트가 담은 것은 프로브 측 dict 기록이지 **실제 송출 바이트의
          캡처가 아니다** — `actual_outbound_observability` 는 UNKNOWN 유지.
          다만 broker 의 `rt_cd: 0` 은 그 본문을 조건으로 한 **broker 측 사실**
          이다.
        why_field_stays_unknown: >-
          `duplicate_unknown_and_omitted_field_behavior` 는 **UNKNOWN 을
          유지**한다. 관측된 것은 "수락됐다" 뿐이고, broker 가 생략된
          `EXCG_ID_DVSN_CD` 를 **무엇으로 기본 처리했는지**(KRX? SOR?)는
          응답에서 확인되지 않았다. 수락은 올바른 처리의 증명이 아니다 —
          거래소 라우팅이 암묵 기본값에 위임됐다는 사실만 남는다. 중복 필드·
          미지 필드 동작은 여전히 시험 0건이다.
        cross_reference: >-
          같은 defect class 가 선물 경로에도 있다(위 `our_client_delta`:
          [필수] 2필드를 빈 문자열로 전송). 모의가 이를 통과시킨다는 이번 관측은
          **모의 관대함이 계약 위반을 가린다**는 뜻이며, 실전 도메인의 검증
          강도에 대해서는 아무것도 말하지 않는다(§13.14). 잔여 위험 RR-8 참조.
        evidence_refs:
          - "docs/plans/2026-07-29-tos-p02-n17-spec-collation.md:45 (N-17 #1)"
          - "docs/plans/2026-07-29-tos-p02-n17-spec-collation.md:50 (N-17 #6)"
          - "P-1-20260729T062925Z (repo 측 전송 필드 전수)"

