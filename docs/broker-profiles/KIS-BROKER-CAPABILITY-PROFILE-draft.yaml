          - "dedup 키(본문 해시? 계좌+종목+가격+수량?)의 정체 — 시험 0건"
          - "n=1 쌍. 반복 시행 없음 — 확률적/상태 의존 dedup 은 배제되지 않았다"
        confounded_companion_arm:           # 같은 세션 full 계약 arm
          artifact_id: P-2-20260731T014957Z
          citation_eligibility: >-
            ⚠ 이 아티팩트는 `MEASURED` · `errors: []` 로 **런북 §6.2 를 통과한다**
            — 그런데도 이 차원의 `evidence_refs[]` 에 넣지 않는다. 사유는 적격이
