#   Broker Capability Profile, not guessed" — IMPLEMENTATION-PLAN-002 §1:34;
#   VERIFICATION-PROFILE-002:9-10) is closed **only** by an operator /
#   designated authority approval act. Authoring this file does not close it.
#   Gate row: docs/plans/2026-07-29-tos-phase0-human-gate-register.md:50 (P0-2).
#   Companion memo (per-field provenance + open items):
#   docs/plans/2026-07-29-tos-broker-capability-profile-kis-draft.md
#
# DOCUMENT STATUS (규범성): **NON-NORMATIVE INSTANCE**.
#   - tos-spec normative text (RFC / ADR / VER / templates) names no concrete
#     broker (project memory `tos-spec-broker-agnostic`; ADR-002-004 line 798;
#     design #10 §0.1 / header:17). A concrete broker's values live ONLY in a
#     non-normative Profile INSTANCE (ADR-002-004 §21; design #10 :1217-1220).
#   - This file MUST NOT be moved into tos-spec/ and MUST NOT be cited as
#     normative by any RFC/ADR/VER.
#
# SCHEMA SPINE: tos-spec/src/part-1-foundation/verification/
#               BROKER-CAPABILITY-PROFILE-template.yaml (key names verbatim).
# MODEL AUTHORITY: tos/src/tos/brokercap/records.py (BrokerCapabilityProfile,
#               CapabilityDeclaration, ProfileKey, ProfileVersion, LiveScope,
#               FinalQuantityProofRule) + tos/src/tos/brokercap/vocabulary.py
#               (CapabilityStatus:49-55, CapabilityDimension:70-86,
#               AssuranceLevel:106-110, ConformanceClass:143-146,
#               AssuranceSource:168-175, AcknowledgementState:194-199,
#               ReplaceSemantics:218-222).
#   Template↔model divergences are recorded in the memo §6 and are NOT
#   "fixed" here — the template keys are reproduced verbatim, and the
#   brokercap-model view is carried alongside in the `_model_view` annotation.
#
# PATCH-0056 SHAPE SYNC (2026-07-29). The template gained the slots the
#   brokercap model requires but the template lacked: per capability
#   `restrictions` / `restriction_approved` / `fallback_reference` /
#   `assurance_sources` (records.py:103-110); `profile_identity`
#   `evidence_package_version` / `superseded_version_link` / `change_reason`
#   (ADR §7.2:264-270); `live_scope.reduced_off_unattended_partition_protection`
#   (§13.15:796); the `final_quantity_proof.recipes[]` element schema
#   (§15.2:845-851 + §15.4:867); and the `residual_risks[]` 4 attributes
#   (§21:1087-1091). This file is synchronized to that shape:
#     - `fallback:` was RENAMED to `fallback_reference:` (model spelling); every
#       value is byte-preserved.
#     - New slots take the conservative default, EXCEPT `fallback_reference` and
#       `assurance_sources`, which MIRROR the value already recorded in the same
#       block's own `_model_view`. Nothing is invented; the `_model_view`
#       annotations are left byte-identical so every lift is auditable in place.
#     - No existing value changed. In particular the vocabulary divergences the
#       memo §6 records (`assurance_level: EV-L0`, `conformance_class: CLASS-D`,
#       `proven_state: TRANSPORT_RECEIVED_ONLY`, `residual_risks[].text` vs the
#       §21 `description`) are UNTOUCHED here: Patch-0056 aligned the template's
#       vocabulary to the code enums, and re-spelling INSTANCE values is an
#       instance-authoring act owed to the P0-2 track, not a template patch.
#
# PATCH-0057 SHAPE SYNC (2026-07-29). The measurement track
#   (`docs/runbooks/kis-capability-probes.md` §9.1) found 8 probe outputs with
#   nowhere to be written. Six became template slots and are mirrored here at
#   their conservative default in BOTH documents: `sessions.subscription_limit`
#   (null), `credentials_and_revocation.reissue_rejection_semantics` (UNKNOWN)
#   and `.token_blackout_window_ms` (null), `broker_time.skew_bound_ms` (null),
#   `replace_semantics.value_set` ([]), and
#   `market_and_instrument_constraints.instrument_coverage` (UNKNOWN).
#   **Nothing is mirrored from the annotations this time** — unlike PATCH-0056,
#   every source annotation for these six is `NEEDS-LIVE-MEASUREMENT`, and
#   `sessions._kis.subscription_limit.note` explicitly forbids promoting its own
#   "41" to a value. Filling a new slot from an annotation that says "not a
#   value" would launder a claim into a profile.
#   The other two outputs got NO new slot because existing keys already carry
#   them: a night-balance response-schema capture belongs in
#   `position_balance_margin.evidence_refs`, and the order-request field
#   inventory belongs in
#   `command_construction_and_wire_semantics.required_and_default_field_semantics`
#   (with `.duplicate_unknown_and_omitted_field_behavior` and
#   `.unit_multiplier_currency_and_numeric_encoding`). No value changed here.
#
# ANNOTATION CONVENTION: every key beginning with `_` (e.g. `_model_view`,
#   `_kis`) is an INSTANCE-LOCAL annotation, not part of the template schema.
#   Nothing in the repo parses this file today (verified absence: no loader
#   references `BROKER-CAPABILITY-PROFILE` outside tos-spec — grep over
#   tos/ shared/ services/ returns only unrelated field-name matches).
#
# MEASUREMENT STATUS VOCABULARY (`_kis.measurement`), 3-way, per the P0-2
# "MEASURED, not guessed" rule. This is an authoring-provenance axis and is
# DISTINCT from `status` (CapabilityStatus) and `assurance_level`
# (AssuranceLevel) — a CODE-EVIDENCED fact about *our integration* is still
# `UNKNOWN` as a *broker capability* until the broker side is verified:
#   CODE-EVIDENCED          measured from this repo's code/config (file:line
#                           cited). Evidences what OUR client does/does not do.
#   OFFICIAL-DOC            from the official 한국투자증권 source
#                           (github.com/koreainvestment/open-trading-api,
#                           apiportal.koreainvestment.com). URL cited.
#   NEEDS-LIVE-MEASUREMENT  not determinable locally; a 모의투자/실전 probe is
#                           required. A probe procedure is proposed in the memo.
#
# ENVIRONMENT SEPARATION: the template carries a single scalar
#   `profile_identity.environment` (and ProfileKey.environment,
#   records.py:63), so environments are separated by INSTANCE, not by a scope
#   field. This file therefore holds TWO YAML documents:
#     doc 1 → environment: MOCK_VTS   (모의투자, openapivts:29443)
#     doc 2 → environment: REAL_PROD  (실전,     openapi:9443)
#   ADR-002-004 §13.14 / BC-INV-009 (design #10 §6.4): sandbox evidence does
#   NOT by itself establish live capability. Doc 2 therefore inherits NOTHING
#   from doc 1 — it is all-UNKNOWN by construction, not by omission.
# =============================================================================

