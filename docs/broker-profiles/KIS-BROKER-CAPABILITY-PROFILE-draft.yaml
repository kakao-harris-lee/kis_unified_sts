      writing_surface_gap_2026_08_06:       # T4-β3 · 런북 §9.4 **처분**
        what_the_runbook_asked: >-
          런북 §9.4 는 "P-BAL 전용 기입면 부재 — **미처분**" 으로 남겨두고 두
          갈래를 제시했다: (a) `position_balance_margin` 에
          `.completeness`/`.pagination` 을 **신설**한다, (b) 절단 판정을
          `consistency_model` 로 **흡수**한다. 판정 권한은 런북이 아니라
          `docs/broker-profiles/` 와 tos-spec 템플릿 트랙에 있다고 명시했다.
        disposition: NEITHER__NO_KEY_INVENTED
        environment_independence: >-
          이 항목은 broker 관측이 아니라 **스키마 형상**에 대한 판정이므로
          환경 무관하다. 문서 2 는 같은 판정을 인용만 하며(포인터), 이는
          §13.14 가 금지하는 capability 상속이 **아니다**.
        grounds_measured_not_asserted:
          - "템플릿 실측: `BROKER-CAPABILITY-PROFILE-template.yaml:272-280` 의 `position_balance_margin` 은 8키(status·assurance_level·evidence_refs·consistency_model·restrictions·restriction_approved·fallback_reference·assurance_sources)뿐이며 `.completeness`·`.pagination` 이 **둘 다 없다**."
          - "차등 부재: 같은 템플릿의 `open_order_query`(:208-218)는 `completeness`·`eventual_consistency_bound_ms`·`pagination` 을 **가지고**, `order_history_query`(:219-228)는 `retention`·`pagination` 을 가진다. 즉 이 부재는 전면적 누락이 아니라 **차원별 차등**이다."
          - "규범 원전: ADR-002-004 §8.10:408-417 이 이 차원에 요구하는 8개 진술(일관성·신선도 / 장중 대 결제 수량 / 미결제 처리 / 증거금 산정 시점 / 통화 환산 시점 / 정정 거동 / 계좌 집계 / 수동·제3자 활동 가시성)에 **페이지네이션도 완전성도 절단도 없다**. 반면 §8.5:348-357 은 open-order query 에 대해 'completeness; pagination behavior; … maximum result size and truncation behavior' 를 **명시 요구**한다. 템플릿 형상은 이 차이를 정확히 반영한다."
          - "모델: `tos/src/tos/brokercap/records.py:103-110` 의 `CapabilityDeclaration` 에는 **어떤 차원에 대해서도** pagination/completeness 필드가 없다 — 그 두 키는 템플릿 차원별 슬롯이지 모델 필드가 아니다. INSTANCE 에만 신설하면 모델 대응이 없는 키가 생긴다."
          - "선례: 템플릿 헤더 :158-165 가 같은 계열의 판단을 이미 내렸다 — N-16 응답 스키마 포착은 신설 없이 `evidence_refs` 로 갔고, 그 근거는 '한 사실에 이름 둘을 만드는 것은 편의가 아니라 결함' 이다."
        why_not_absorb_into_consistency_model: >-
          런북의 (b) 안도 채택하지 않는다. `consistency_model` 은 §8.10 의
          '일관성·신선도' 진술이고 절단 위험은 **질의 표면의 완전성**이다 —
          다른 사실이다. 흡수하면 (1) 서로 다른 두 사실이 한 이름을 공유하고,
          (2) 이 캠페인이 **하지 않은** 일관성 측정을 한 것처럼 보이게 된다.
          두 번째가 특히 나쁘다: 지금 `consistency_model: UNKNOWN` 은 정직한
          0-측정 표시인데, 여기에 절단 판정을 적으면 UNKNOWN 이 아닌 무언가로
          읽힌다.
        where_the_p_bal_verdicts_live: >-
          MEASURED 아티팩트는 `evidence_refs[]` 로, 판정값(page_size ·
          page_size_lower_bound · truncation_verdict · 연속조회 형상)은 이
          `_kis` 관측면에 축자 보존한다.
        deviation_from_9_4_declared: >-
          ⚠ **이것은 §9.4 보다 보존적인 것이 아니라 §9.4 로부터의 명시적
          이탈이다.** 방향을 정확히 적는다. §9.4 의 마지막 문장은 "판정 전까지
          P-BAL 의 판정값은 `evidence_refs` 가 가리키는 **아티팩트 안에만**
          존재하고 INSTANCE 본문에는 올라가지 않는다" 로, 판정값의 INSTANCE
          상승 자체를 금지했다. 본 fold 는 스키마 필드(`status` ·
          `consistency_model` · 신설 키)는 **건드리지 않았지만**, `_kis`
          비스키마 주석면에는 §9.4 가 허용한 것보다 **더 많은 값**을 적었다.
          근거는 §9.4 자신이 그 조치의 목적으로 밝힌 **anti-evaporation**
          이다 — 판정값이 gitignored 결과 디렉터리가 아닌 증거 패키지에
          보존돼 있긴 하나, 그 값이 어느 차원에 걸리는지를 INSTANCE 가 전혀
          말하지 않으면 다음 저작자가 그것을 다시 찾지 못한다(§9.1 이 지목한
          "표현 불가능한 판단이 조용히 증발" 의 인접 형태). 이탈이므로
          **승인 사슬이 되돌릴 수 있도록** 여기 선언한다: 되돌리려면 이
          `_kis` 하위 판정값 블록을 삭제하면 되고, `evidence_refs[]` 와
          스키마 필드는 그대로 §9.4 준수 상태로 남는다.
        spec_patch_candidate:               # ← tos-spec 트랙 입력물 (본 파일 권한 밖)
          status: CANDIDATE_ONLY__NOT_PROPOSED_AS_APPROVED
