    review_date: "2027-01-29"
  B_critical_input_invalid_to_authority:
    value_ms: 500   # RECHECK: APPROVE after Context Generation distribution to issuers is implemented
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed material Critical Input invalidation to denial at every affected approval and new-risk authority issuer (ADR-002-018 §§15-17). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: context_generation_approval_and_authority_trace
    failure_response: HALT_OR_CONTAIN
