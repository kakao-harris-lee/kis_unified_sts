  B_currentness_gap_to_local_deny:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from a final egress detecting credible currentness loss or authenticated restriction to its Local Restrictive Latch reaching DENY_LATCHED (ADR-002-024 §§11, 14). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-H]"
    measurement_source: restrictive_ingress_and_local_egress_latch_trace
    failure_response: LATCH_LOCAL_HALT_AND_ESCALATE
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_restrictive_fence_commit:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative owner restriction to committed Restrictive Fence Record over the complete dependency scope (ADR-002-024 §§10-11). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: owner_restriction_and_currentness_ordering_trace
    failure_response: KEEP_LOCAL_DENY_AND_HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_currentness_fence_to_egress:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed Restrictive Fence Record to denial of later affected claims and sends at every final egress (ADR-002-024 §§11-15). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: restrictive_fence_and_egress_admission_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_currentness_proof_issue:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval to validate one complete vector and atomically create its single-use Egress Currentness Proof with capability claim and SEND_STARTED (ADR-002-024 §§12-13). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-H]"
    measurement_source: currentness_vector_claim_and_proof_trace
    failure_response: DENY_NEW_RISK
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_currentness_generation_fence:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from commitment of a newer currentness, restore, writer, or egress generation to proven inability of every predecessor to create or consume a current vector or proof (ADR-002-024 §§15, 19). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-F]"
    measurement_source: currentness_generation_and_hard_fence_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_trial_abort_to_authority_revoke:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative ADR-002-025 Trial Abort Trigger detection to revocation or restrictive fencing of every affected unconsumed trial authorization and capability. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: trial_abort_authority_and_capability_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_trial_abort_to_egress_deny:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative Trial Abort Trigger detection or committed abort generation to denial of every later affected trial transmission at final egress. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: trial_abort_generation_and_egress_boundary_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_trial_evidence_gap_to_containment:
    value_ms: 1000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative material trial-evidence gap detection to completed new-risk denial and required containment over the complete possibly affected scope. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-D]"
    measurement_source: trial_evidence_gap_authority_rcl_and_egress_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_scope_promotion_generation_fence:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from commitment of a newer Promotion Generation to proven inability of predecessor plans, runs, evidence packages, promotion decisions, authorization requests, and egress consumers to create or widen permission. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-F]"
    measurement_source: promotion_generation_registry_authority_and_egress_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_deviation_revoke_to_authority:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative ADR-002-026 deviation expiry, revocation, compensating-control loss, evidence invalidation, or scope conflict to revocation or restrictive fencing of every affected unconsumed approval and new-risk authority. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: deviation_generation_control_authority_and_currentness_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_deviation_revoke_to_egress:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative deviation restriction or committed Deviation Generation to denial of every later affected new-risk transmission at final egress; permissive caches and absence of a revocation event are not currentness proof. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: deviation_restriction_generation_and_egress_boundary_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_deviation_generation_fence:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from commitment of a newer Deviation Generation to proven inability of predecessor policy, evaluator, decision, Active Deviation Set, configuration, authority, and egress consumers to create or use dependent permission. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-F]"
    measurement_source: deviation_generation_registry_configuration_authority_and_egress_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_incident_signal_to_authority_restrict:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from an authoritative material safety signal to committed denial, HALT, demotion, or restrictive fencing at every affected new-risk authority owner under ADR-002-027. Administrative confirmation cannot hide inside this bound. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: incident_signal_classifier_authority_and_fence_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_incident_signal_to_egress_deny:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from an authoritative material safety signal to denial of later dependent new-risk transmission at every affected final egress. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: incident_signal_generation_and_egress_boundary_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_incident_scope_expansion_to_egress_deny:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative incident dependency-scope expansion to denial at every newly affected final egress; unknown closure expands rather than narrows scope. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: incident_scope_active_set_and_egress_trace
    failure_response: EXPAND_CONTAINMENT_AND_HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_incident_generation_fence:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from commitment of a newer Incident Generation to proven inability of stale coordinators, records, active sets, plans, closure decisions, authority requests, and egress consumers to create or use permission. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-F]"
    measurement_source: incident_generation_registry_owner_authority_and_egress_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_controlled_shutdown_hard_fence:
    value_ms: 1000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from controlled-shutdown restriction commit to proof that every former principal, credential, signer, session, proxy, queue, and route cannot create a broker-accepted mutation. Cooperative process stop is not proof. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-G]"
    measurement_source: incident_shutdown_egress_identity_route_session_and_broker_trace
    failure_response: REMAIN_HALTED_UNTIL_PROVEN_FENCED
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_incident_handoff_to_recovery_barrier:
    value_ms: 1000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed incident recovery-handoff intent to exact package acceptance by a current Recovery Session behind a closed Recovery Barrier; incomplete handoff transfers no obligation. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-E]"
    measurement_source: incident_handoff_and_recovery_session_acceptance_trace
    failure_response: CLOSE_BARRIER_AND_HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_safety_telemetry_loss_detect:
    value_ms: 2000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from required Critical Telemetry loss, continuity break, semantic invalidation, or coverage failure to a committed Monitoring Gap for the greatest credible dependent scope (ADR-002-028 §§8-13). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-C]"
    measurement_source: telemetry_source_continuity_manifest_and_gap_trace
    failure_response: STOP_NEW_RISK_AND_DECLARE_GAP
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_monitoring_gap_to_authority_restrict:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed Monitoring Gap to denial at every dependent new-risk authority issuer; alert delivery and acknowledgement cannot extend this bound (ADR-002-028 §§13, 17). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: monitoring_gap_authority_and_restrictive_ingress_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_monitoring_gap_to_egress_deny:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed Monitoring Gap to denial at every dependent final egress under active currentness; cache, heartbeat, dashboard state, and absence of alert are not proof (ADR-002-028 §18). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: monitoring_gap_currentness_and_egress_boundary_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_critical_alert_delivery:
    value_ms: 5000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from Critical alert commit to independently verifiable delivery or explicit delivery-gap escalation. This detective path runs in parallel and cannot delay restriction or egress denial (ADR-002-028 §16). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-H range 5000-30000, conservative low end]"
    measurement_source: safety_alert_delivery_and_gap_trace
    failure_response: KEEP_RESTRICTED_AND_ALTERNATE_ESCALATE
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_alert_escalation:
    value_ms: 30000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from missed delivery or acknowledgement deadline to the next required independent escalation stage without resetting the original safety deadline (ADR-002-028 §16). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-H]"
    measurement_source: alert_escalation_ordering_and_effective_principal_trace
    failure_response: INCIDENT_REMAINS_OPEN_AND_ESCALATE
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_monitoring_generation_fence:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from a new policy, manifest, gap, owner, restore, or Monitor Generation to rejection of superseded publishers and snapshots at every dependent consumer, authority issuer, and final egress (ADR-002-028 §§12, 18, 24). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-F]"
    measurement_source: monitor_generation_writer_consumer_and_egress_fence_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_supply_chain_compromise_detect:
    value_ms: 2000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from source, builder, dependency, toolchain, signer, registry, admission, deployment, or runtime-artifact compromise or contradiction to a committed release restriction for the greatest credible affected scope (ADR-002-029). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-C range 2000-30000, conservative low end]"
    measurement_source: source_build_dependency_signer_registry_admission_and_runtime_trace
    failure_response: STOP_NEW_RISK_AND_RESTRICT_RELEASE_SCOPE
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_release_restriction_to_authority_restrict:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed release restriction to denial at every dependent new-risk authority issuer; scan, alert, deployment, or operator acknowledgement cannot extend this preventive bound (ADR-002-029). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: release_restriction_authority_and_currentness_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_release_restriction_to_egress_deny:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed release restriction to denial at every dependent final egress under active artifact currentness; cached admission, tags, health, or absence of revocation are not proof (ADR-002-029). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: release_restriction_generation_runtime_attestation_and_egress_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_release_generation_fence:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from Release Generation advance, restore, rollback, revocation, or set replacement to rejection of superseded publishers, deployments, consumers, and runtime attestations (ADR-002-029). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-F]"
    measurement_source: release_generation_registry_deployment_runtime_and_consumer_fence_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_runtime_artifact_drift_detect:
    value_ms: 2000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from actual executable, image, plugin, sidecar, proxy, signer, SDK, or dynamically loaded artifact divergence to restrictive detection and runtime fencing (ADR-002-029). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-C]"
    measurement_source: expected_release_manifest_and_actual_runtime_artifact_attestation_trace
    failure_response: HALT_AND_FENCE_RUNTIME
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_post_trade_effect_to_obligation_commit:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from a possible external economic effect to durable PTOL obligation identity and conservative RCL coverage; expiry or missing evidence never releases capacity (ADR-002-030). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: broker_effect_ptol_commit_and_rcl_capacity_trace
    failure_response: STOP_NEW_RISK_AND_QUARANTINE_CAPACITY
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_post_trade_change_detect:
    value_ms: 2000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from a material settlement, cash, collateral, borrow, custody, statement, break, correction, or finality change to detection over the greatest credible dependency closure (ADR-002-030). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-C range 2000-30000, conservative low end]"
    measurement_source: post_trade_source_statement_break_and_correction_trace
    failure_response: STOP_NEW_RISK_AND_MARK_UNKNOWN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_post_trade_break_to_restrict:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from a confirmed or suspected post-trade break to restrictive authority and conservative capacity treatment; workflow or operator acknowledgement cannot extend it (ADR-002-030). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-B]"
    measurement_source: post_trade_break_ptol_rcl_and_authority_trace
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_post_trade_invalid_to_egress_deny:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from invalid or stale post-trade state to denial of dependent future external-economic sends at final egress without permissive cache (ADR-002-030). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: post_trade_generation_finality_break_and_egress_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_post_trade_generation_fence:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from Post-Trade Obligation Generation advance, restore, correction, or owner replacement to rejection of stale PTOL writers, consumers, proofs, authorities, RCL commands, and egress attempts (ADR-002-030). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-F]"
    measurement_source: ptol_generation_writer_consumer_rcl_authority_and_egress_fence_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_statement_coverage_gap_detect:
    value_ms: 2000
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval to detect incomplete, truncated, stale, conflicting, preliminary, or common-mode statement coverage for the applicable source and obligation scope (ADR-002-030). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-C range 2000-30000, conservative low end]"
    measurement_source: statement_pagination_cutoff_revision_and_coverage_trace
    failure_response: STOP_NEW_RISK_AND_MARK_UNKNOWN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_final_quantity_proof:
    value_ms: null   # MEASURE per broker/order type
    semantics: broker_specific
    owner: TBD
    rationale: "MEASURE. Time within which Final Quantity Proof (final filled qty + zero remaining) can be established for a given broker and order type; drives how long capacity stays RELEASE_PENDING_PROOF (ADR-002-002 §16)."
    measurement_source: broker_capability_profile
    failure_response: QUARANTINE_UNKNOWN
    applicable_scope: per broker/order type
    review_date: null
  B_late_fill_observation:
    value_ms: null   # MEASURE
    semantics: broker_specific
    owner: TBD
    rationale: "MEASURE. Maximum credible interval in which a late fill may still arrive after a claimed terminal state; a late fill inside this window must not have caused early capacity release (ADR-002-002 §16.4)."
    measurement_source: broker_capability_profile
    failure_response: PROFILE_CONTRADICTORY
    applicable_scope: per approved Broker Capability Profile (ADR-002-004)
    review_date: null
  B_protective_request_start:
    value_ms: 1000
    semantics: hard_maximum
    owner: operator
    rationale: "PROPOSED. Time from degraded-mode entry to first bounded protective request being started, using reserved protective capacity (ADR-002-001). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §9 reconfirmed]"
    measurement_source: protective_controller_log
    failure_response: CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_protective_request_complete:
    value_ms: null   # MEASURE
    semantics: broker_specific
    owner: TBD
    rationale: "MEASURE. Broker-dependent completion time for a protective action; informs protection-gap bounding (ADR-002-001 §12)."
    measurement_source: broker_capability_profile
    failure_response: CONTAIN
    applicable_scope: per approved Broker Capability Profile (ADR-002-004)
    review_date: null
  B_broker_query_consistency:
    value_ms: null   # MEASURE
    semantics: broker_specific
    owner: TBD
    rationale: "MEASURE. Interval over which broker query sources are expected to converge; absence within it is not proof of non-existence (ADR-002-004)."
    measurement_source: broker_capability_profile
    failure_response: CONSERVATIVE_UNKNOWN
    applicable_scope: per approved Broker Capability Profile (ADR-002-004)
    review_date: null
  B_rate_limit_recovery:
    value_ms: null   # MEASURE per broker, account, session, and endpoint class
    semantics: broker_specific
    owner: TBD
    rationale: "MEASURE. Recovery time after hitting the applicable broker account or session rate limit; protective/reconciliation traffic budget must survive this (ADR-002-001 §7.5)."
    measurement_source: broker_capability_profile
    failure_response: RESTRICT_OR_CONTAIN
    applicable_scope: per broker, account, session, and endpoint class
    review_date: null
  B_failure_domain_detect:
    value_ms: 2000   # RECHECK: APPROVE per concrete Failure-Domain Allocation Matrix
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from a safety-critical dependency failure or isolation-assumption breach to authoritative detection for the affected Safety Cell (ADR-002-009). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-C]"
    measurement_source: failure_domain_and_authority_log
    failure_response: STOP_NEW_RISK
    applicable_scope: per concrete Failure-Domain Allocation Matrix
    review_date: "2027-01-29"
  B_failure_domain_contain:
    value_ms: 1000   # RECHECK: APPROVE per concrete deployment profile
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative failure-domain detection to completed denial or broader HALT at every affected final egress (ADR-002-009). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-D]"
    measurement_source: failure_domain_and_egress_log
    failure_response: HALT
    applicable_scope: per concrete deployment profile
    review_date: "2027-01-29"
  B_protection_gap:
    value_ms: null   # APPROVE per broker/order/replacement profile
    semantics: broker_specific
    owner: TBD
    rationale: "MEASURE. Maximum permitted interval without sufficient protection during an explicitly approved cancel-first replacement; an unknown or exceeded gap is containment (ADR-002-011)."
    measurement_source: protective_replacement_and_broker_log
    failure_response: CONTAIN
    applicable_scope: per broker/order/replacement profile
    review_date: null
  B_protection_overlap:
    value_ms: null   # APPROVE per broker/order/replacement profile
    semantics: broker_specific
    owner: TBD
    rationale: "MEASURE. Maximum permitted interval in which old and new protective orders may both execute while worst-case reversal risk remains capacity-covered (ADR-002-011)."
    measurement_source: protective_replacement_and_broker_log
    failure_response: CONTAIN
    applicable_scope: per broker/order/replacement profile
    review_date: null
  B_protective_replacement_contain:
    value_ms: 1000   # RECHECK: APPROVE after replacement workflow and fallback are selected
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from replacement deviation or proof failure to authoritative containment of further transmission and new risk (ADR-002-011). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-D]"
    measurement_source: protective_controller_ledger_and_egress_log
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
