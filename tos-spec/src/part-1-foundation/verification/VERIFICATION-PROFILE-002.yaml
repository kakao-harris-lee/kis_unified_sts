# ---------------------------------------------------------------------------
# Bounds. `semantics: hard_maximum` = must be met every time (pass/fail gate).
# All values PROPOSED; rationale states the engineering basis for review.
# ---------------------------------------------------------------------------
bounds:
  B_authority_partition_detect:
    value_ms: 2000
    semantics: hard_maximum
    owner: operator
    rationale: "PROPOSED. Loss of verifiable Safety-Authority contact detected within a small multiple of the heartbeat interval; assumes ~500ms heartbeat x 3 missed. Confirm against chosen heartbeat design (ADR-002-003). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §9 reconfirmed]"
    measurement_source: harness_clock_on_execution_path
    failure_response: CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_risk_increase_revoke:
    value_ms: 500
    semantics: hard_maximum
    owner: operator
    rationale: "PROPOSED. After a loss condition is detected, the authoritative new-risk permission is revoked within this bound. Final egress denial then follows within B_revocation_to_egress; neither interval may be hidden in cache or retry delay. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §9 reconfirmed]"
    measurement_source: egress_decision_log
    failure_response: HALT_OR_CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_revocation_to_egress:
    value_ms: 500   # RECHECK: APPROVE after the selected currentness protocol is implemented and measured
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed authoritative revocation/restriction generation to denial at every final egress (ADR-002-007 §§9, 16). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: authority_and_egress_generation_log
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_halt_to_egress:
    value_ms: 500   # RECHECK: APPROVE after HALT generation propagation and fenced-send design are selected
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative HALT commit, or a final egress's locally verified acceptance of the same restrictive command, to denial of later risk-increasing transmissions at every affected final egress (ADR-002-007 §§16-17; ADR-002-015 §15). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: halt_and_egress_boundary_log
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_human_halt_to_commit:
    value_ms: 1000   # RECHECK: APPROVE after the independent human HALT ingress, local latch, and authoritative commit path are implemented
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from acceptance of a current authenticated Human HALT Command to an authoritative monotonic HALT commit or a proven local restrictive egress latch. It precedes or overlaps B_halt_to_egress but cannot be hidden inside it (ADR-002-015 §15). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-H]"
    measurement_source: human_halt_ingress_local_latch_and_safety_commit_log
    failure_response: LATCH_LOCAL_HALT_AND_ESCALATE
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_time_health_to_egress:
    value_ms: 500   # RECHECK: APPROVE after Time Health currentness distribution is selected
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from a less-trusted Time Health generation to rejection of dependent transmission at every final egress (ADR-002-008 §§8, 14.6). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: time_health_and_egress_generation_log
    failure_response: STOP_NEW_RISK
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_capability_claim_to_send:
    value_ms: 500   # RECHECK: APPROVE after the fenced egress journal and broker transport are implemented
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from durable single-use capability claim and SEND_STARTED persistence to transmission of the first broker-directed byte. Expiry or inability to prove this interval denies the send; post-claim ambiguity remains potentially live and capacity-covered (ADR-002-007 §§9.4-9.5). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-G]"
    measurement_source: egress_journal_and_broker_transport_trace
    failure_response: QUARANTINE_UNKNOWN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_egress_hard_fence:
    value_ms: 1000   # RECHECK: APPROVE after credential, session, signer, route, and broker fence mechanisms are selected and measured
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from an authoritative egress-generation invalidation or credential-compromise containment trigger to proof that the superseded principal cannot create a broker-accepted order mutation (ADR-002-013 §§13-16). Unknown completion keeps replacement authority non-live. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-G]"
    measurement_source: egress_identity_route_session_and_broker_denial_log
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_stale_epoch_reject:
    value_ms: 0
    semantics: hard_maximum
    owner: operator
    rationale: "PROPOSED. Rejection of a stale ledger/authority epoch is synchronous at the ledger transition and final egress (compare-and-set); 0 = no time window in which a stale epoch may mutate or transmit (ADR-002-002 INV-008, ADR-002-003). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §9 reconfirmed]"
    measurement_source: ledger_and_egress_decision_log
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_external_activity_detect:
    value_ms: null   # MEASURE: bounded by the broker account-event/poll cadence
    semantics: hard_maximum
    owner: TBD
    rationale: "MEASURE from Broker Capability Profile. For a poll-only broker this is bounded by the poll interval; new-action size must be constrained so plausible external activity in this window cannot breach the Hard Safety Envelope (ADR-002-002 §23.4)."
    measurement_source: broker_capability_profile
    failure_response: CONTAIN
    applicable_scope: per approved Broker Capability Profile (ADR-002-004)
    review_date: null
  B_external_activity_contain:
    value_ms: 1000
    semantics: hard_maximum
    owner: operator
    rationale: "PROPOSED. Once unattributed external activity is detected, new-risk authority suspended and reconciliation begun within this bound. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §9 reconfirmed]"
    measurement_source: reconciliation_log
    failure_response: CONTAIN
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_startup_reconciliation:
    value_ms: 60000
    semantics: operational_target_and_hard_gate
    owner: operator
    rationale: "PROPOSED target. No new risk before reconciliation completes (hard gate). 60s is an operational target; exceeding it triggers escalation, not relaxation of the gate. [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §9 reconfirmed]"
    measurement_source: recovery_coordinator_log
    failure_response: REMAIN_HALTED
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_recovery_trigger_to_barrier:
    value_ms: 1000   # RECHECK: APPROVE after trigger classification and ordered barrier commit are implemented
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from authoritative detection of a recovery trigger to committed barrier closure or a proven local hard fence for the complete affected scope (ADR-002-017 §§8-9). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-E]"
    measurement_source: recovery_trigger_barrier_commit_and_local_fence_trace
    failure_response: HARD_FENCE_AND_HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_recovery_barrier_to_egress:
    value_ms: 500   # RECHECK: APPROVE after Recovery Generation distribution and egress rejection are implemented
    semantics: hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from committed Recovery Generation/barrier closure to denial of stale readiness, authorization, capability, and new-risk transmission at every affected final egress (ADR-002-017 §§9, 18). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
    measurement_source: recovery_generation_and_egress_boundary_trace
    failure_response: HALT
    applicable_scope: non-live-test
    review_date: "2027-01-29"
  B_critical_input_loss_detect:
    value_ms: 2000   # RECHECK: APPROVE per source class and continuity protocol
    semantics: source_specific_hard_maximum
    owner: operator
    rationale: "MEASURE. Maximum interval from source loss, continuity break, sequence gap, or material trust degradation to authoritative Critical Input invalidation for the complete affected dependency scope (ADR-002-018 §§9, 14, 17). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-C]"
    measurement_source: source_continuity_admission_and_context_invalidation_trace
    failure_response: STOP_NEW_RISK
