# VERIFICATION-PROFILE-002 — APPROVED (scope-limited; 17 null keys remain
# key-level UNAPPROVED and fail-closed)
#
# STATUS: APPROVED at profile level (operator, 2026-07-29) for the 146 keys
# carrying approved values. Per VER-002-001 §6 the key-level rule is unchanged:
# an unapproved or placeholder bound is not an approved bound — the 17 null
# keys (10 broker bounds pending P0-2 measurement, 6 instance/architecture
# limits, MIN_evidence_retention_ms) remain unapproved and fail-closed.
#
# Rules for ratification (all required before status -> APPROVED):
#   - each `value_ms` is confirmed or replaced by the accountable owner;
#   - broker_specific bounds are MEASURED from an approved Broker Capability
#     Profile (ADR-002-004), not guessed;
#   - `approved_by` lists the accountable authority (separation of duties:
#     the identity approving bounds SHALL NOT also arm live trading);
#   - `effective_from` / `review_due` are set.
# Values still marked MEASURE that remain null are deliberately left null pending
# broker-specific measurement (P0-2) or a pending instance/architecture decision.
# PATCH-0054 registered previously absent keys (2 bounds, 24 limits) with null values
# and owner TBD so the completion gap is visible to the Bounds-Approver; registering a
# key approves nothing and creates no bound.
# PATCH-0055 added the two remaining VER-002-001 §6 per-bound attributes
# (`applicable_scope`, `review_date`) to every bound here and in the template,
# completing the seven-attribute per-bound shape; adding a field approves nothing.
#
# 2026-07-29 Bounds-Approver decision (operator; project record
# `docs/plans/2026-07-29-tos-phase0-bounds-draft-package.md`, commit d6babce9):
#   - 146 of the 163 numeric keys (74 bounds + 72 limits) now carry an approved value,
#     `owner: operator` (bounds) and `review_date: 2027-01-29`;
#   - 17 keys stay null and fail-closed: 10 broker bounds (P0-2 measurement),
#     6 instance/architecture limits, and MIN_evidence_retention_ms;
#   - because null keys remain, `status` stays PROPOSED and `approved_by` stays empty
#     per the ratification rules above; `review_due` is set, which those rules require
#     before any future APPROVED transition.
#   - scope.environment stays non-live-test: these are EV-L1..L3 harness ceilings,
#     not live calibration.
#
# 2026-07-29 P0-1 profile-level approval (operator directive, session C record):
#   - The operator, as Bounds-Approver, APPROVES the profile at profile level.
#     This is a SCOPE-LIMITED approval: it covers exactly the 146 keys carrying
#     approved values above; the strict all-keys reading of the ratification
#     rules is amended by this decision to "every key carrying a value is
#     confirmed by the accountable owner; null keys remain key-level unapproved
#     and fail-closed until P0-2 measurement or the pending instance decision".
#   - Effect: the "bounds were measured / approved Profile" precondition for
#     non-broker EV rows (e.g. SPG-EV-002) is discharged for the keys they
#     consume; broker rows remain blocked on P0-2. No live calibration implied
#     (scope.environment stays non-live-test). Approving bounds does not arm
#     live trading (separation of duties preserved; Live-Armer unassigned).

