    owner: operator
    rationale: "MEASURE. Maximum interval from committed material Critical Input invalidation to denial of the stale Capsule and dependent request at every affected final egress (ADR-002-018 §16). [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §5-A]"
