  MAX_critical_input_source_production_delay_ms: 50    # APPROVE per Critical Input source class; source production delay is a delay class separate from snapshot age and is not folded into it (ADR-002-018 §14; source: 2026-07-20 capsule design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
  MAX_critical_input_transport_and_queue_delay_ms: 50  # APPROVE per Critical Input source and transport class; unknown or unbounded transport denies dependent new risk (ADR-002-018 §14; source: 2026-07-20 capsule design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
  MAX_critical_input_consumer_receipt_age_ms: 1000     # APPROVE per consumer and dependency scope; consumer-local receipt age is distinct from issuer-side production and snapshot age (ADR-002-018 §14; source: 2026-07-20 capsule design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L1] owner=operator; review_date=2027-01-29
  MAX_critical_input_correction_horizon_ms: 86400000   # APPROVE per source and record class; the correction and late-revision horizon does not shrink because no correction has arrived (ADR-002-018 §14; source: 2026-07-20 capsule design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 horizon may be long; conservative direction is LONGER, 1 day] owner=operator; review_date=2027-01-29
  MAX_time_transport_and_queue_uncertainty_ms: 50      # APPROVE per Time Health distribution path; transport, queueing, buffering, replay, and batching uncertainty is additive to snapshot age and not folded into it (ADR-002-008 §§8-9; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
  MAX_clock_domain_conversion_uncertainty_ms: 50       # APPROVE per continuity-identity pair; a consumer not sharing the issuer's continuity identity adds this bound instead of subtracting clocks (ADR-002-008 §§8-9; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
  MAX_time_source_disagreement_ms: 50                  # APPROVE per reference-source set; disagreement beyond this tolerance denies TRUSTED time, which drift alone does not express (ADR-002-008 §§7, 13; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
  MAX_clock_offset_ms: 50                              # APPROVE per reference-source class; offset is a separate approved bound from MAX_clock_drift_ppm (ADR-002-008 §§7-8; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
  MIN_time_stabilization_interval_ms: 5000             # APPROVE per recovery scope; synchronization and disagreement checks must pass for at least this interval before time is trusted again, and a shorter interval proves no stability (ADR-002-008 §16; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-F floor range 1000-5000+, conservative HIGH end] owner=operator; review_date=2027-01-29
  MAX_future_timestamp_tolerance_ms: 50                # APPROVE per source class; a timestamp from the future outside this tolerance is rejected and never coerced to zero (ADR-002-008 §9; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
  MIN_holdover_safety_margin_ms: 2000                  # APPROVE per lease class; the margin subtracted when deriving conservative usable lifetime, distinct from the MAX_degraded_lease_holdover_ms total budget (ADR-002-008 §11.2; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-F floor range 100s ms-seconds, conservative high end that keeps holdover usable] owner=operator; review_date=2027-01-29
  MAX_time_source_precision_ms: 50                     # APPROVE per reference-source class; source timestamp precision and uncertainty enter the conservative freshness upper bound (ADR-002-008 §9; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
  MAX_time_source_sequence_gap_ms: 50                  # APPROVE per reference-source class; an unknown or unbounded source sequence gap denies TRUSTED time (ADR-002-008 §9; source: 2026-07-21 trustworthy-time design §8) -- [APPROVED 2026-07-29 operator (Bounds-Approver); draft d6babce9 §6-L4 range ~50-500, conservative low end] owner=operator; review_date=2027-01-29
