# =============================================================================
# BROKER CAPABILITY PROFILE — TEMPLATE (shape canon; authorizes nothing)
# =============================================================================
#
# NORMATIVE BASIS
#   ADR-002-004 "Broker Capability Requirements and Fallbacks" §21:1039-1097
#   ("Every broker profile SHALL contain at least: ...") is the minimum content
#   this template realizes. §7.1:243-258 fixes the profile key, §7.2:262-270 the
#   profile version block, §5.3:132-146 the per-dimension status rule,
#   §8:293-512 the 17 dimensions, §9:516-540 the assurance levels, §10:544-584
#   the conformance classes, §15:835-867 the Final Quantity Proof, and
#   §21:1087-1091 the residual-risk attributes.
#
# THIS FILE IS A TEMPLATE, NOT A PROFILE
#   It carries **shape**, not values. `status: DRAFT`, `approvers: []`, and
#   `conformance_class: CLASS_D_NON_LIVE` are the fail-closed defaults a copy
#   starts from; a profile becomes active only through the six conditions of
#   ADR §7.3:272-281. Copying this file authorizes no live behavior.
#
# BROKER-AGNOSTIC — NO CONCRETE BROKER APPEARS HERE, EVER
#   ADR line 798: facts about a specific broker "belong to a non-normative Broker
#   Capability Profile instance produced on the implementation track (§21)". A
#   filled INSTANCE therefore lives outside tos-spec/ and is never cited as
#   normative by any RFC/ADR/VER.
#
# VOCABULARY BINDING
#   Enumerated values are spelled exactly as the corresponding member of
#   tos/src/tos/brokercap/vocabulary.py — CapabilityStatus, CapabilityDimension,
#   AssuranceLevel, ConformanceClass, AssuranceSource, AcknowledgementState,
#   ReplaceSemantics, ProhibitedProof — and the per-dimension declaration fields
#   are those of CapabilityDeclaration in tos/src/tos/brokercap/records.py:103-110.
#   Where ADR prose spells a token differently (§10 headings read "CLASS-D",
#   §9 headings read "Level 0 — Unknown"), the code spelling is authoritative in
#   this file and the ADR spelling is noted inline.
#   `assurance_level` is the §9 `LEVEL_n_*` axis and is a DIFFERENT coordinate
#   from the corpus evidence levels `EV-L0..EV-L5`; the two never share a string.
#   Seven tokens below are defined by NEITHER an enum NOR any ADR-002-004 line
#   (measured: 0 exact-word hits each) — `NO_BLIND_RETRY_AND_CONTAIN`,
#   `PROHIBIT_AFFECTED_COMMAND_SCOPE`, `PROHIBITED_UNLESS_PROVEN_IDEMPOTENT`,
#   `QUARANTINED_UNKNOWN`, `CONTAIN`, `ACCOUNT`, `UNAVAILABLE`. They are
#   template-coined shorthand for ADR prose (BC-INV-002:193-195, §8.17:512,
#   §12.4:639-646, §14:802-806, §13.10:746-750) and are left as they stand:
#   naming a token is a deliberate act, not an editorial one. Do not read them
#   as vocabulary until an ADR names them.
#
# FILL CONVENTION — four markers, every one fail-closed
#   TBD      A value is OWED. The slot exists; no approved decision has filled
#            it. TBD is never a defined policy, recipe, mechanism, or bound.
#   null     Explicitly ABSENT / not defined. Also the model default
#            (records.py: every scalar is `X | None = None`), so a consuming
#            predicate fails closed on it.
#   UNKNOWN  A vocabulary VALUE, not a placeholder — CapabilityStatus.UNKNOWN and
#            the per-dimension "unknown semantics" values. BC-INV-001:191: a
#            property not present and current in the approved profile is treated
#            as unavailable, so UNKNOWN authorizes nothing.
#   conservative default
#            A boolean already at its restrictive setting: `false` for anything
#            that would grant or relax (`restriction_approved`,
#            `reduced_off_unattended_partition_protection`, `identity_aware`,
#            `priority_alone_is_reservation`, ...) and `true` for anything that
#            prohibits (`permissive_cache_prohibited`,
#            `direct_worker_access_prohibited`, ...). Flipping one is an approval
#            act carrying evidence, never an editorial one.
#
# PROFILE KEY (ADR §7.1:243-256)
#   A profile is keyed by the 10 coordinates below — broker_id, api_product,
#   api_version, environment, account_type, market, instrument_class,
#   order_type, session_type, credential_scope. One profile = one coordinate
#   tuple. §7.1:258: "Broader profiles are permitted only when evidence proves
#   semantic equivalence across the broader scope", and §13.14:784-790 /
#   BC-INV-009:221 forbid inheriting capability status across environments — so a
#   second environment, account type, or session type is a SEPARATE profile
#   document, never a widened one.
# =============================================================================

