# =============================================================================
# final_quantity_proof — ADR §15:835-867
#
# §15.1:839 "Every supported order type SHALL define an approved Final Quantity
# Proof recipe", so `recipes` carries ONE element per supported order type.
#
# recipes[] ELEMENT SCHEMA (Patch-0056). Ten fields, all fail-closed:
#
#   - order_type: TBD                # §15.1 — the order type this recipe covers
#                                    #   (records.py FinalQuantityProofRule:149)
#     required_result:               # §15.2:843-851 — "The recipe SHALL establish:"
#                                    #   the seven conjuncts. Each is bool|null;
#                                    #   null/false => the recipe does not establish
#                                    #   it => the proof is inadequate. Observed
#                                    #   values are supplied at evaluation time by
#                                    #   the injected FinalQuantityEvidence
#                                    #   (records.py:272-279); the recipe states
#                                    #   which ones it claims to establish.
#       broker_order_identity_or_bounded_effect: false   # §15.2:845
#       final_cumulative_filled_quantity: false          # §15.2:846
#       zero_remaining_executable_quantity: false        # §15.2:847
#       corrections_busts_late_events_handled: false     # §15.2:848
#       evidence_source_provenance: false                # §15.2:849
#       within_valid_window: false                       # §15.2:850
#       ordering_waiting_rule_satisfied: false           # §15.2:851
#     prohibited_proofs: []          # §15.3:857-863 — ProhibitedProof members this
#                                    #   recipe names as insufficient ALONE
#                                    #   (records.py:150). Seven members exist:
#                                    #   CANCEL_ACKNOWLEDGEMENT,
#                                    #   ONE_OPEN_ORDER_QUERY_OMISSION,
#                                    #   LOCAL_TIMEOUT, STRATEGY_CANCELLATION_INTENT,
#                                    #   PROCESS_RESTART,
#                                    #   ACCOUNT_POSITION_MATCHING_EXPECTED_VALUE,
#                                    #   OPERATOR_ASSERTION_WITHOUT_BROKER_EVIDENCE.
#     no_later_change_asserted: false   # §15.4:867 marker 1 — the profile states
#                                    #   that no crossing fill or correction can
#                                    #   later change final quantity
#                                    #   (records.py:151)
#     late_event_window_defined: false  # §15.4:867 marker 2 — bounded correction
#                                    #   handling is defined (records.py:152)
#
# §15.4 admits a stronger broker-specific terminal event only when its semantics
# are verified AND at least one of the two markers is true. Both false/null =>
# no stronger proof is claimed and the recipe rests on §15.2 alone.
# =============================================================================
final_quantity_proof:
  recipes: []
  late_event_window_ms: null
  correction_policy: TBD

