# =============================================================================
# capabilities — per-dimension declarations (ADR §5.3:132-146; §8:293; §21 Matrix)
#
# COMMON FIELD BLOCK — every capability key carries all seven, no exceptions
# (Patch-0056; model: records.py CapabilityDeclaration:103-110):
#     status                 CapabilityStatus  (§5.3:136-144)
#     assurance_level        AssuranceLevel    (§9:520-538)
#     evidence_refs          list              (§21:1060 "evidence reference")
#     restrictions           list              (§5.3 the restriction a
#                                              VERIFIED_WITH_RESTRICTION carries)
#     restriction_approved   bool              (§5.3:146 — see below)
#     fallback_reference     scalar            (§13 approved conservative fallback;
#                                              §11:604 gate 13 requires one for
#                                              every unavailable capability)
#     assurance_sources      list              (§5.4:152-159, 8 values)
# Dimension-specific fields follow the common ones inside each key.
#
# §5.3:146 verbatim: "Only `VERIFIED` and explicitly approved
# `VERIFIED_WITH_RESTRICTION` may authorize live behavior." `restriction_approved`
# IS that explicit approval, and it is a different fact from `restrictions` (which
# states WHAT the restriction is). It stays `false` until an accountable approver
# sets it; `false`/null fails closed.
#
# DIMENSION-SPECIFIC SLOTS ADDED BY PATCH-0057 (6): `sessions.subscription_limit`,
# `credentials_and_revocation.reissue_rejection_semantics` and
# `.token_blackout_window_ms`, `broker_time.skew_bound_ms`,
# `replace_semantics.value_set`,
# `market_and_instrument_constraints.instrument_coverage`. Each carries its ADR
# anchor inline. They exist so a measured fact HAS somewhere to be written; every
# one is at a fail-closed default and none is filled here. Two further measured
# outputs were NOT given slots because existing keys already carry them — a
# response-schema capture belongs in the dimension's own `evidence_refs`, and an
# order-request field inventory belongs in
# `command_construction_and_wire_semantics.required_and_default_field_semantics`
# (with `.duplicate_unknown_and_omitted_field_behavior` and
# `.unit_multiplier_currency_and_numeric_encoding`). Two names for one fact is a
# defect, not a convenience.
# =============================================================================
