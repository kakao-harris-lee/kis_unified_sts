adr_002_021_section_11_full_coverage: NOT_MET

unpopulated_trading_scenario_groups:
  common_reason: >-
    The declared scope has no fill, no cancel/amend, no price/slippage, no
    correlation/hedge, no margin/settlement, and no external trade activity: the
    restart pilot crashes a persisted state and reconstructs it conservatively;
    it executes no trade. Populating these groups would require inventing
    scenarios with no executed referent, which the pilot design forbids (design
    §0.5-4). Emptiness here is a declared scope limitation, NOT a dominance proof
    and NOT a claim the omitted paths are harmless (ADR-002-021 §11 line 301:
    "Scenario reduction or pruning SHALL be policy-governed and prove dominance").
  populated_groups_caveat: >-
    execution_path_scenarios and venue_broker_partition_and_recovery_scenarios are
    populated with the restart-reconstruction sub-axis ONLY. They do NOT establish
    full ADR-002-021 §11 coverage of those groups: the real broker-network / real
    partition sub-axis is deferred (R-N), and no fill/price/margin facet is
    exercised. `full_trading_scenario_coverage: NOT_CLAIMED` on every populated
    entry.
  groups:
    - group: partial_fill_and_ordering_scenarios
      adr_anchor: "ADR-002-021 §11 line 291 (fill prefixes, out-of-order fill sequence)"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: cancel_amend_replace_retry_and_overlap_scenarios
      adr_anchor: "ADR-002-021 §11 line 292 (original, cancel, amend, replace, split-child, retry overlap)"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: price_slippage_gap_volatility_and_liquidity_scenarios
      adr_anchor: "ADR-002-021 §11 line 295"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: correlation_basis_and_hedge_failure_scenarios
      adr_anchor: "ADR-002-021 §11 line 296"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: margin_collateral_borrow_and_currency_scenarios
      adr_anchor: "ADR-002-021 §11 line 297"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: exercise_assignment_delivery_and_settlement_scenarios
      adr_anchor: "ADR-002-021 §11 line 297"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: external_trapped_non_trade_and_concurrent_scenarios
      adr_anchor: "ADR-002-021 §11 line 298"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
  partially_populated_groups:
    - group: execution_path_scenarios
      adr_anchor: "ADR-002-021 §11 lines 293-294"
      disposition: PARTIALLY_POPULATED_RESTART_RECONSTRUCTION_ONLY
      deferred_sub_axis: "real broker-network receipt (R-N)"
    - group: venue_broker_partition_and_recovery_scenarios
      adr_anchor: "ADR-002-021 §11 line 299"
      disposition: PARTIALLY_POPULATED_RECOVERY_SUB_AXIS_ONLY
      deferred_sub_axis: "real broker/session partition (R-N)"

# --- The scenarios this set actually carries -----------------------------------
# Derivation rule: every entry below corresponds 1:1 to a crash cell in the
# ratified design §4 catalogue (docs/plans/2026-08-06-tos-ev-l3-pilot-design.md).
# No entry is hypothetical, and no entry is observed: the run has not executed.
# Classification rule: an entry is an ADVERSARIAL COMBINATION when the crash holds
# two or more factors simultaneously; otherwise it is a single-factor BOUNDARY
# VALUE of one governed dimension's crash boundary.
ev_l3_pilot_coverage_scenarios:
  self_referentiality_caveat: >-
    This set is derived from the ratified design catalogue, so by construction it
    cannot reveal a crash scenario the catalogue missed. It argues coverage of the
    declared restart axis only. It is authored PRE-EXECUTION: it specifies the
    adverse set the STATE-EV-004 EV-L3 run must cover and records no observed
    disposition (all `outcome: PENDING_EXECUTION`). Axes outside it are recorded
    under `dominance_and_pruning_proofs`, `unbounded_credible_effects`, or the
    residual references — never as silently covered.

  oracle_independence_note: >-
    The design places the Expected reconstruction as a hand-derived hardcoded
    anchor in an outside test that structurally cannot `import tos` (firewall
    reverse rule; design §5.3, O-3). So unlike the EV-L2 sibling's ASS-CM-04
    ("guards under test are also the oracles"), each Expected here is NOT the
    implementation's own `reconstruct_conservative` output. This structurally
    offsets — it does not fully remove — the guard-is-oracle common mode (see
    common_mode_dependencies ASS-CM-04).

  committed_composite_cpl_legality: >-
    The pinned committed composites for L3-01..L3-06 are not all in ADR-002-005
    §14's enumerated examples. Per the ratified design §4 "committed composite CPL
    legality" clause (delta-review observation), the run SHALL confirm
    coupling_violations() == empty on each pinned committed composite before the
    crash, so a CPL-illegal committed state fails loudly at construction rather
    than silently seeding a defect.

  governed_dimensions:
    referent: "tos.orthostate.records.CompositeState (tos/src/tos/orthostate/records.py:39-102); projection tos.orthostate.predicates.reconstruct_conservative (predicates.py:688-742)"
    dimensions:
      - name: intent_state
        directly_exercised: false
        disposition: "preserved across restart (intent_identity carried, predicates.py:735); structural-identity argument, not a mutated dimension (see ASS-DOM-05)"
      - name: transmission_attempt_state
        directly_exercised: true
        cells: ["L3-01 (SEND_STARTED)", "L3-02 (SENT_UNCONFIRMED)", "L3-07 (ACK_OBSERVED)"]
      - name: broker_order_state
        directly_exercised: true
        cells: ["L3-04 (non-terminal -> UNKNOWN)", "L3-07 (FILLED preserved)"]
      - name: knowledge_state
        directly_exercised: true
        cells: ["L3-03 (UNOBSERVED preserved)", "L3-06 (stale RECONCILED ignored)", "L3-07 (RECONCILED/CONSISTENT -> CONFLICTED)"]
      - name: capacity_state
        directly_exercised: true
        cells: ["L3-01 / L3-02 (raised to at least POTENTIALLY_LIVE via CPL-1, predicates.py:714-719)"]
    directly_exercised_ratio: "4 of the 5 ADR-002-005 §14 dimensions (intent_state via preservation argument)"

  boundary_value_scenarios:
    - scenario_id: ASS-EVL3-B-01
      row: STATE-EV-004
      design_cell: L3-01
      governed_dimension: transmission_attempt_state
      committed_5tuple: "Intent=ACTIVE Attempt=SEND_STARTED Broker=UNKNOWN Knowledge=UNOBSERVED Capacity=POTENTIALLY_LIVE"
      crash_boundary: "after durable SEND_STARTED, before broker receipt"
      expected: "Attempt=SEND_STARTED; Broker=UNKNOWN; Knowledge=UNOBSERVED (preserved, not in downgrade set); Capacity>=POTENTIALLY_LIVE"
      two_layer_invariant: "Knowledge NOT IN {RECONCILED, CONSISTENT} AND Capacity at-least-as-conservative-as POTENTIALLY_LIVE AND Broker=UNKNOWN"
      observed: "<runtime-observed — STATE-EV-004 EV-L3 run not yet executed>"
      outcome: PENDING_EXECUTION
      normative_anchor: "ADR-002-005 §13 line 198; predicates.py:659-668, 715-719, 731-732"
      evidence_ref: "docs/plans/2026-08-06-tos-ev-l3-pilot-design.md §4 row L3-01; run package <pending>"
    - scenario_id: ASS-EVL3-B-02
      row: STATE-EV-004
      design_cell: L3-02
      governed_dimension: transmission_attempt_state
      committed_5tuple: "Intent=ACTIVE Attempt=SENT_UNCONFIRMED Broker=UNKNOWN Knowledge=UNOBSERVED Capacity=POTENTIALLY_LIVE"
      crash_boundary: "after modeled network transmission (VirtualBroker marker)"
      expected: "Attempt=SENT_UNCONFIRMED; Broker=UNKNOWN; Knowledge=UNOBSERVED (preserved); Capacity>=POTENTIALLY_LIVE"
      two_layer_invariant: "Knowledge NOT IN {RECONCILED, CONSISTENT} AND Capacity>=POTENTIALLY_LIVE AND Broker=UNKNOWN"
      observed: "<runtime-observed — run not yet executed>"
      outcome: PENDING_EXECUTION
      normative_anchor: "ADR-002-005 §13 line 198; STATE-EV-004 Injection VER:1045 'after network transmission'"
      evidence_ref: "design §4 row L3-02; run package <pending>"
    - scenario_id: ASS-EVL3-B-03
      row: STATE-EV-004
      design_cell: L3-04
      governed_dimension: broker_order_state
      committed_5tuple: "Intent=ACTIVE Attempt=SENT_UNCONFIRMED Broker=<non-terminal member, implementation enum pin> Knowledge=UNOBSERVED Capacity=POTENTIALLY_LIVE"
      crash_boundary: "crash at a non-terminal broker-order boundary"
      expected: "Broker -> UNKNOWN (non-terminal reconstructed); Knowledge=UNOBSERVED (preserved)"
      two_layer_invariant: "Broker=UNKNOWN (for the non-terminal committed state) AND Capacity>=POTENTIALLY_LIVE"
      observed: "<runtime-observed — run not yet executed>"
      outcome: PENDING_EXECUTION
      normative_anchor: "ADR-002-005 §13 line 198; predicates.py:672-679 (_BROKER_STRUCTURALLY_TERMINAL)"
      evidence_ref: "design §4 row L3-04; run package <pending>"
    - scenario_id: ASS-EVL3-B-04
      row: STATE-EV-001
      design_cell: L3-08
      governed_dimension: "durability round-trip (all five dimensions)"
      committed_5tuple: "Intent=ACTIVE Attempt=SENT_UNCONFIRMED Broker=UNKNOWN Knowledge=CONFLICTED Capacity=POTENTIALLY_LIVE (ADR-002-005 §14 line 208; already conservative => reconstruct is identity)"
      crash_boundary: "normal complete commit -> crash -> reload"
      expected: "reloaded 5-tuple == committed 5-tuple (lossless durable round-trip)"
      two_layer_invariant: "reload(store) == committed (field-identical)"
      observed: "<runtime-observed — run not yet executed>"
      outcome: PENDING_EXECUTION
      normative_anchor: "ADR-002-005 §13 line 197 'durable and reconstructable'; AC-005-1 line 237 'representable and persisted'; §14 line 208"
      evidence_ref: "design §4 row L3-08; run package <pending>"
      note: >-
        This is the R-1 durable-limb boundary cell (consumer STATE-EV-001). Per
        design §4 point (4) and §7.1, L3-08 is a durability MECHANISM cell; the
        R-1 discharge is the durability property over the enumerated §14 composite
        + boundary set (VER §2.7 coverage), not this single cell.

  adversarial_combination_scenarios:
    - scenario_id: ASS-EVL3-C-01
      row: STATE-EV-004
      design_cell: L3-03
      sub_case_count: 1
      factors:
        - "the attempt reached SEND_STARTED and an ACK was observed in memory"
        - "the crash occurred before that evidence was durably persisted, so the durable store holds only the pre-ACK state"
      governed_dimension: knowledge_state
      committed_5tuple: "Intent=ACTIVE Attempt=SEND_STARTED Broker=UNKNOWN Knowledge=UNOBSERVED Capacity=POTENTIALLY_LIVE (durable = pre-ACK)"
      expected: "the lost ACK does NOT resurrect as RECONCILED; Knowledge=UNOBSERVED (preserved); Broker=UNKNOWN"
      two_layer_invariant: "Knowledge NOT IN {RECONCILED, CONSISTENT}  (load-bearing; VER:1046 'never ... RECONCILED')"
      observed: "<runtime-observed — run not yet executed>"
      outcome: PENDING_EXECUTION
      normative_anchor: "ADR-002-005 §13 line 199; STATE-EV-004 Expected VER:1046"
      evidence_ref: "design §4 row L3-03; run package <pending>"
    - scenario_id: ASS-EVL3-C-02
      row: STATE-EV-004
      design_cell: L3-05
      sub_case_count: 1
      factors:
        - "one dimension (Attempt=SEND_STARTED) is durably committed"
        - "a neighbouring dimension is uncommitted/absent (inter-transaction crash) — an incomplete store"
      governed_dimension: "reconstruction from incomplete store"
      committed_5tuple: "Attempt=SEND_STARTED committed; Broker and Knowledge absent (not committed)"
      expected: "S-2 conservative fill: absent Knowledge -> UNOBSERVED, absent Broker -> UNKNOWN; no optimistic fill"
