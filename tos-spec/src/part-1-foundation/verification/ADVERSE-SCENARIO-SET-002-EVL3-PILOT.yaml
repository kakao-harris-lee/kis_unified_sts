  - coverage_scenario_ref: ASS-EVL3-B-03
    design_cell: "L3-04"
    ad_002_021_facet: "position-effect mismatch / order-state ambiguity (§11 line 294)"
    restart_reconstruction_sub_axis: "crash at non-terminal broker-order boundary (reconstruct broker as UNKNOWN)"
    modeled_transmission: true
    real_network_sub_axis: DEFERRED_R_N
    full_trading_scenario_coverage: NOT_CLAIMED
  - coverage_scenario_ref: ASS-EVL3-C-04
