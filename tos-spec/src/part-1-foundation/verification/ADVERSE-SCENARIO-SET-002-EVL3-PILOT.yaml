dominance_and_pruning_proofs:
  - id: ASS-DOM-01
    subject: "the seven empty ADR-002-021 §11 trading-scenario groups"
    pruning_basis: SCOPE_DECLARATION_NOT_DOMINANCE
    argument: >-
      See unpopulated_trading_scenario_groups. No dominance is claimed; the groups
      (fill, cancel/amend, price/slippage, correlation, margin, settlement,
      external) have no referent at a restart-reconstruction, non-live-test scope.
  - id: ASS-DOM-02
    subject: "real broker-network / real partition sub-axis of the two populated groups"
    pruning_basis: DEFERRED_TO_RESIDUAL_NOT_DOMINANCE
    argument: >-
      The crash-point transmission is a modeled VirtualBroker marker and the
      pilot emits zero real broker orders (design §0). Real receipt ambiguity and
      real partition are not pruned by dominance; they are a declared residual
      (R-N). ADR-002-021 §11 line 301 forbids pruning without a dominance proof,
      and none is offered here.
  - id: ASS-DOM-03
    subject: "power-loss / torn-sector durability"
    pruning_basis: NOT_PRUNED_UNRESOLVED
    argument: >-
      os._exit models an application process crash faithfully (design §2.4,
      §4), but not kernel page-cache loss, power loss, or torn-sector writes,
      which need filesystem fault injection. Carried as residual R-D. The
      "incomplete stores" facet (VER:1045) IS exercised via an inter-transaction
      crash (L3-05); intra-transaction torn sectors are the R-D residual.
  - id: ASS-DOM-04
    subject: "intent_state and capacity_state as directly mutated inputs"
    pruning_basis: STRUCTURAL_IDENTITY_ARGUED_NOT_EXECUTED
    argument: >-
      intent_state is carried unchanged across restart (intent_identity,
      predicates.py:735) and capacity_state is exercised only through the CPL-1
      raise, not as an independently mutated crash input. The argument that these
      behave correctly across the full input space is structural, NOT a separately
      executed crash mutation. A future run that varies them directly would
      discharge it.
    honesty_flag: >-
      ADR-002-021 §11 line 301 requires pruning to be policy-governed and prove
      dominance. No Aggregate Risk Policy exists to govern this, so this entry is
      an argument on the record, not a discharged proof.

unbounded_credible_effects:
  - id: ASS-UNB-01
    subject: "real broker-network receipt and partition (the R-N deferred sub-axis)"
    statement: >-
      The economic effect of a real broker transmission cannot be bounded at this
      scope because no real transmission occurs (zero real orders) and no approved
      Broker Capability Profile bound exists (STATE-EV-004 broker_capability_
      profile_version = TBD in EVIDENCE-REGISTER-002.csv line 94). Per ADR-002-021
      §11 line 303, an unbounded credible effect is DENY or UNKNOWN, never a
      convenient finite value.
    present_effect: "None. The pilot emits zero real broker orders; no economic effect can be produced today."
    registered_as: "RESIDUAL-RISK-REGISTER-002.yaml entry R-N (see residual_risk_references — NOT YET registered)"

common_mode_dependencies:
  - id: ASS-CM-01
    dependency: "single evaluator"
    detail: >-
      The planned run will execute under one harness (tools/tos_evidence_run.py
      EV-L3 stage), one interpreter, and one baseline commit. ADR-002-021 §22
      requires independent reproduction and parser/model/library differential
      results; none is planned in this pilot.
  - id: ASS-CM-02
    dependency: "single seed / deterministic crash schedule"
    detail: >-
      seed=0 with PYTHONHASHSEED=0 for the pure reconstruction property, and
      parametrized deterministic os._exit crash points for the integration matrix
      (design §4, O-2). Determinism is established by construction; input-space
      diversity is not.
  - id: ASS-CM-03
    dependency: "single authoring lane"
    detail: >-
      The design catalogue, the implementation (in progress), this scenario set,
      and the forthcoming evidence were/are produced in the same AI-orchestrated
      authoring lane. VER-002-001 §2.6 (line 75) independent review is NOT_SIGNED,
      so no independent principal has yet reviewed these scenarios or their
      sufficiency.
  - id: ASS-CM-04
    dependency: "the guards under test are also the oracles — STRUCTURALLY OFFSET at EV-L3"
    detail: >-
      In the EV-L2 sibling each Expected was the validator's own verdict, an
      unmitigated common mode. At EV-L3 the design places each Expected as a
      hand-derived hardcoded anchor in an outside test that cannot import tos
      (firewall reverse rule; design §5.3, O-3), so a defect shared between the
      reconstruction guard and the expectation would be caught. This structurally
      OFFSETS the common mode; it does not fully remove it (the hand-derived
      anchors and the §13 norm share a human author). The mutation-canary
      discipline (design §8.3, mutants A-E KILLED) further offsets it.
  - id: ASS-CM-05
    dependency: "pre-execution authoring (temporal)"
    detail: >-
      This instance is authored BEFORE the run. Every outcome is
      PENDING_EXECUTION. A scenario whose Expected proves unreachable or wrong at
      run time SHALL be corrected and the correction traced (VER §2.2); this
      instance is not evidence that the scenarios passed, only that they are the
      specified adverse set.

