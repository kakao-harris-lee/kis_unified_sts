authorization_notice: >-
  This PROPOSED instance grants nothing and is not yet approved. It specifies the
  adversarial-combination leg of the VER-002-001 §2.7 coverage argument for the
  RESTART axis of exactly two evidence rows (STATE-EV-004 primary; STATE-EV-001
  R-1 durable limb) at a non-live-test scope that emits zero real broker orders.
  Seven of the nine ADR-002-021 §11 trading-scenario groups are empty and the two
  populated groups carry the restart-reconstruction sub-axis only, with the real
  broker-network / partition sub-axis deferred to residual R-N. It is not
  policy-bound (`aggregate_risk_policy_id` is null), so it establishes no maximum
  credible effect and SHALL NOT be consumed by any aggregate-risk evaluation. Its
  `canonical_digest` is null because no approved canonicalization scheme exists for
  spec-layer YAML instances (ADR-002-021 §28 question 1, line 698, is open); a null
  digest is not a digest, and a consumer that requires digest binding SHALL treat
  this set as unbound. It is authored PRE-EXECUTION: every scenario outcome is
  PENDING_EXECUTION and this file is not evidence that any scenario passed.
  Approving this instance does not accept ADR-002-021, which remains `Proposed`
  (§29 line 719), and does not move any evidence row to PASS: STATE-EV-004 stays
  NOT_IMPLEMENTED, STATE-EV-001 stays READY, and the pilot's remaining gates
  (independent review signature per VER §9.5 and §2.6, VER §3 complete baseline,
  residuals R-N/R-I/R-D registration, and the OQ-1 §4-persistence adjudication for
  R-1) are untouched by this file.
