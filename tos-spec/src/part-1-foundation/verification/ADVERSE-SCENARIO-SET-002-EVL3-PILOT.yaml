  - coverage_scenario_ref: ASS-EVL3-B-01
    design_cell: "L3-01"
    ad_002_021_facet: "broker receipt ambiguity (§11 line 293)"
    restart_reconstruction_sub_axis: "crash after durable SEND_STARTED, before broker receipt"
    modeled_transmission: true
    real_network_sub_axis: DEFERRED_R_N
    full_trading_scenario_coverage: NOT_CLAIMED
  - coverage_scenario_ref: ASS-EVL3-B-02
    design_cell: "L3-02"
    ad_002_021_facet: "broker receipt ambiguity (§11 line 293)"
    restart_reconstruction_sub_axis: "crash after modeled network transmission (SENT_UNCONFIRMED)"
    modeled_transmission: true
    real_network_sub_axis: DEFERRED_R_N
    full_trading_scenario_coverage: NOT_CLAIMED
  - coverage_scenario_ref: ASS-EVL3-C-01
    design_cell: "L3-03"
    ad_002_021_facet: "missing acknowledgement (§11 line 293)"
    restart_reconstruction_sub_axis: "crash before evidence persistence; in-memory positive knowledge lost"
