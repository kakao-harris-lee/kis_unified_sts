    ad_002_021_facet: "position-effect known, knowledge must re-derive (§11 line 294)"
    restart_reconstruction_sub_axis: "terminal broker FILLED preserved; positive Knowledge downgraded on restart"
    modeled_transmission: true
    real_network_sub_axis: DEFERRED_R_N
    full_trading_scenario_coverage: NOT_CLAIMED

