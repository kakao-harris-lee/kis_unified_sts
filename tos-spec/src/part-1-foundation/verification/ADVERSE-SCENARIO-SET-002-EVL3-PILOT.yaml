# ADVERSE-SCENARIO-SET-002-EVL3-PILOT — PROPOSED (pre-execution; operator approval pending)
#
# WHAT THIS IS
#   An Adverse Scenario Set INSTANCE created for exactly one purpose: the
#   VER-002-001 §2.7 (line 79) coverage argument's ADVERSARIAL-COMBINATION leg
#   for the RESTART axis of the EV-L3 pilot (STATE-EV-004 "Conservative Restart
#   Reconstruction"). §2.7 requires, at minimum, "the boundary values of each
#   governed dimension and the adversarial combinations of the approved Adverse
#   Scenario Set (ADR-002-021)". This file supplies that second leg for the
#   restart axis and nothing else. It is the sibling of
#   ADVERSE-SCENARIO-SET-002-EVL2-PILOT.yaml and inherits its structure
#   homomorphically (§11 groups, SoD, self_referentiality_caveat, consumer rows,
#   empty-with-declared-reason pattern).
#
# WHAT IS DIFFERENT FROM THE EV-L2 SIBLING (two structural differences)
#   1. PRE-EXECUTION. The EV-L2 instance was authored AFTER its faults executed,
#      so its scenarios carried `outcome: MET` and pointed to landed run
#      packages. This EV-L3 instance is authored from the RATIFIED DESIGN CATALOG
#      (docs/plans/2026-08-06-tos-ev-l3-pilot-design.md §4, design #39, ratified
#      commit 2b455dd9) BEFORE the STATE-EV-004 EV-L3 run executes. Every
#      scenario therefore carries `outcome: PENDING_EXECUTION` and
#      `observed: <runtime-observed — run not yet executed>`. It SPECIFIES the
#      adverse set the run must cover; it records no observation it does not have
#      (VER §2.2 negative-results discipline; no fabricated observation).
#   2. TWO §11 GROUPS ARE POPULATED (restart-reconstruction contact only). The
#      EV-L2 instance kept all nine ADR-002-021 §11 trading-scenario groups empty
#      (pure model, no execution path). At EV-L3 the restart pilot genuinely
#      reaches two of them — `execution_path_scenarios` (§11 lines 293-294:
#      missing acknowledgement, receipt ambiguity, position-effect) and
#      `venue_broker_partition_and_recovery_scenarios` (§11 line 299: recovery
#      uncertainty). Those two are POPULATED with pointer entries bound 1:1 to the
#      §4 catalogue's eight crash cells. The other seven groups stay empty with a
#      declared reason. See OQ-6 disposition below.
#
# OQ-6 DISPOSITION (ratified SOUND; design §11 OQ-6; over-claim forbidden)
#   The two populated groups carry ONLY the restart-reconstruction sub-axis, not
#   full trading-scenario coverage. Each populated entry declares
#   `full_trading_scenario_coverage: NOT_CLAIMED`, `modeled_transmission: true`
#   (the crash-point transmission is a capability-class VirtualBroker marker, not
#   a real broker send — design §0, §2.4), and `real_network_sub_axis:
#   DEFERRED_R_N`. The real broker-network / real partition sub-axis is a
#   declared residual (R-N), never silently covered.
#     `adr_002_021_section_11_full_coverage: NOT_MET` (seven empty + two
#     restart-reconstruction-only).
#
# WHAT THIS IS NOT
#   - It is NOT an ADR-002-021 §5.4 (line 127) Adverse Scenario Set in the full
#     sense. §5.4 defines a "policy-bound set ... used to establish maximum
#     credible effects"; no Aggregate Risk Policy exists (ADR-002-021 §28
#     question 1, line 698, is open), so `aggregate_risk_policy_id` is null and
#     this set is NOT policy-bound. It establishes no maximum credible economic
#     effect and SHALL NOT be consumed by any aggregate-risk evaluation.
#   - It does NOT satisfy ADR-002-021 §11 (lines 289-299) full coverage: seven of
#     the nine mandated groups are empty and the two populated ones carry the
#     restart-reconstruction sub-axis only.
#   - Approving this instance does NOT accept ADR-002-021. That ADR stays
#     `Proposed` (ADR-002-021 §29 line 719) and its §29 Approval Gate
#     (lines 717-735) is untouched. An instance approval is not an ADR acceptance.
#   - It moves no EVIDENCE-REGISTER-002 row to PASS. STATE-EV-004 stays
#     NOT_IMPLEMENTED and STATE-EV-001 stays READY; the other §9 gates of the
#     EV-L3 pilot design (independent review signature, VER §3 complete baseline,
#     R-N/R-I residuals, OQ-1 §4-persistence adjudication) remain open
#     independently of this file.
#
# SHAPE DEVIATIONS FROM ADVERSE-SCENARIO-SET-template.yaml (declared, additive)
#   1. `result` carries `PROPOSED_PENDING_EXECUTION_AND_APPROVAL`. The template
#      ships `result: INVALID` beside `status: DRAFT`. Plain `INVALID` would not
#      convey that the set is ratified-design-derived and awaiting a run; the
#      extended value states both facts (proposed, and pending execution +
#      operator approval).
#   2. Additive fields mirroring the EV-L2 sibling plus EV-L3-specific ones:
#      `adr_002_021_section_11_full_coverage`, `unpopulated_trading_scenario_groups`,
#      `ev_l3_pilot_coverage_scenarios`, `authorization_notice`, and the per-entry
#      `restart_reconstruction_sub_axis` / `modeled_transmission` /
#      `real_network_sub_axis` / `full_trading_scenario_coverage` /
#      `outcome: PENDING_EXECUTION` fields.
#   3. `canonical_digest`, `aggregate_risk_policy_id`, `aggregate_risk_generation`
#      are null rather than `TBD`: the referents do not exist. A null digest is
#      not a digest — see `authorization_notice`.
#   4. `approved_by: []` and `effective_from`/`review_due: null`: this instance is
#      PROPOSED, not APPROVED. Operator approval is a human gate (see APPROVAL
#      RECORD).
#
# APPROVAL RECORD (PENDING — human gate)
#   Status PROPOSED. approved_by is empty. The ADR-002 series delegated
#   auto-ratification (operator 2026-07-25, extended 2026-07-29) applies to the
#   DESIGN CONTRACT ratification only (design #39, commit 2b455dd9). Approval of
#   THIS scenario-set instance is a SEPARATE operator human gate, deliberately
#   left unsigned. When approved, the approver identity `operator` = the D1 role
#   scheme System owner / Bounds-Approver (docs/plans/2026-07-29-tos-phase0-role-
#   scheme-and-disposition.md §1). Separation of duties (VER-002-001 §2.6 line 75:
#   Critical evidence "SHALL be reviewed by a principal who did not implement the
#   tested mechanism and did not approve the relevant residual-risk exception"):
#   the approving identity SHALL NOT be the independent reviewer of the pilot
#   evidence, and SHALL NOT also arm live trading (Live-Armer unassigned).

artifact_type: ADVERSE_SCENARIO_SET
schema_version: "1.0-DRAFT"
scenario_set_id: ADVERSE-SCENARIO-SET-002-EVL3-PILOT
scenario_set_version: "1.0"
aggregate_risk_generation: null      # no Aggregate Risk Generation exists
canonical_digest: null               # no approved canonicalization scheme for spec-layer YAML
status: PROPOSED
result: PROPOSED_PENDING_EXECUTION_AND_APPROVAL
aggregate_risk_policy_id: null       # no Aggregate Risk Policy exists (ADR-002-021 §28 Q1, line 698, open)

scope:
  - kind: consumer
    value: "VER-002-001 §2.7 (line 79) coverage argument, adversarial-combination leg, RESTART axis"
    detail: >-
      Consumable by exactly two evidence rows. PRIMARY consumer: STATE-EV-004
      (Conservative Restart Reconstruction, minimum level EV-L3, VER:1043;
      Supports ADR-002-005 AC-005-4, VER:1044). SECONDARY consumer: STATE-EV-001
      (Orthogonal Composite Persistence, minimum level EV-L1/EV-L2, VER:1022) for
      the R-1 durable-limb discharge only — the crash-restart run's durability
      property (design §7.1, §9). Any other consumer is out of scope.
  - kind: environment
    value: non-live-test
    detail: >-
      No real broker session, no account, no instrument, no live authorization,
      and ZERO real broker orders. The "after network transmission" crash point
      (STATE-EV-004 Injection, VER:1045) is realized by a modeled capability-class
      VirtualBroker marker (design §0, §2.4). Real persistence (on-disk sqlite3
      WAL) and a real OS process boundary ARE used (design §2, §3). Consistent
      with VERIFICATION-PROFILE-002.yaml scope.environment (line 59), which
      declares these EV-L1..L3 harness ceilings non-live-test.
  - kind: evidence_baseline
    value: "PENDING — STATE-EV-004 EV-L3 run not yet executed"
    detail: >-
      This instance is authored from the ratified design catalogue (docs/plans/
      2026-08-06-tos-ev-l3-pilot-design.md §4, design #39, ratified commit
      2b455dd9) BEFORE the run. Each scenario's evidence baseline is the future
      STATE-EV-004 EV-L3 run's baseline; it does not exist yet. `outcome` is
      PENDING_EXECUTION for every scenario and no observation is recorded that was
      not made (VER §2.2).
  - kind: exclusion
    value: aggregate-risk evaluation
    detail: >-
      SHALL NOT be used as the Adverse Scenario Set of an Aggregate Risk Decision,
      a Projected Aggregate State, or an Adverse Increment Vector (ADR-002-021 §1
      line 15, §12 lines 309-330). It proves no maximum credible effect for any
      trading action.

