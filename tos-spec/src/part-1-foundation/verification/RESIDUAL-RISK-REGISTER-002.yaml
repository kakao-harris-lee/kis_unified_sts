        MAX_trial_authorized_economic_effect and
        MAX_trial_concurrent_potential_effect are null and key-level unapproved
        (VERIFICATION-PROFILE-002.yaml lines 942-943), and no approved Broker
        Capability Profile bound exists for this row
        (`broker_capability_profile_version` is `N/A` on the STATE-EV-004 row of
        EVIDENCE-REGISTER-002.csv — measured 2026-08-06). Per ADR-002-021 §11 an
        unbounded credible effect is DENY or UNKNOWN, never a convenient finite
        value; ADVERSE-SCENARIO-SET-002-EVL3-PILOT.yaml
        `unbounded_credible_effects` ASS-UNB-01 records the same refusal.
      statement: "No present economic effect; future effect unbounded-by-record until those keys are approved."
    existing_controls:
      - "In-band declaration at the evidence: the run manifest records integration_boundary.modeled_axes[0] as axis=network, disposition=MODELED, with modeled_axis_residual_declared: true, and a modeled_axes_note stating that VER §5 defines EV-L3 by real persistence, identity and network boundaries while this run realizes persistence, the process boundary and logical identity re-derivation only."
      - "coverage_argument.unexercised_residual_ref in the same manifest names 'R-N — STATE-EV-004 real-network-boundary axis unexercised' with its cause."
