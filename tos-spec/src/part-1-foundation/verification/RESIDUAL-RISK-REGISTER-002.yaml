  - risk_identity: >-
      R-D — power-loss and torn-sector durability are undischarged. The crash
      injector is `os._exit`, which models an application process death
      faithfully but leaves the operating system's page cache intact. It
      therefore cannot model power loss, host loss, or a torn-sector write. What
      the executed evidence supports is PROCESS-CRASH durability; it does not
      support power-loss durability, and the distinction is load-bearing because
      the two failure classes have different recovery consequences.
    affected_requirement_and_adr:
      requirement: >-
        VER-002-001 STATE-EV-004 Injection (line 1046), "then restart with
        incomplete stores and stale caches" — the INTER-transaction
        incomplete-store facet IS exercised (design #39 §4 cell L3-05, scenario
        ASS-EVL3-C-02: a crash between two dimension-marker transactions leaves a
        legitimately incomplete store); INTRA-transaction torn writes and
        page-cache loss are not. Also VER-002-001 STATE-EV-001 Expected (line
        1026), the word "durable", in exactly the scope in which R-1's evidence
        limb was discharged on 2026-08-06.
      adr: >-
        ADR-002-005 §13 (line 197): "All five dimensions SHALL be durable and
        reconstructable after crash, restart, or failover." Of the three named
        events, "crash" and "restart" are modeled by this pilot; "failover" and
        the power-loss class beneath it are not. AC-005-1 (line 237) requires the
        §14 composites to be "representable and persisted".
      measured_gap: >-
        Recorded as an errata of the ratified design (docs/plans/
        2026-08-06-tos-ev-l3-pilot-design.md §2.4, errata v1.2) after
        implementation measurement: under an `os._exit` crash model the
        `synchronous=FULL` pragma is UNFALSIFIABLE — `synchronous=OFF` is an
        EQUIVALENT mutant, measured as mutant E during the mutation-canary pass
        and reported EQUIVALENT rather than KILLED. `os._exit` does not evict the
        OS page cache, so every write the pilot issued survives regardless of the
        pragma. The pragma's REAL PRESENCE is nevertheless pinned by a separate
        structural check — AST inspection of the executed source's real
        `execute(...)` arguments plus a `PRAGMA synchronous` read-back — so a
        docstring or comment naming the pragma cannot satisfy it (manifest
        `integration_boundary.persistence.substrate_check.executed_pragmas`:
        journal_mode WAL, synchronous FULL). Presence is measured; behaviour
        under power loss is not.
      criticality_note: >-
        The affected requirements are Critical, so VER-002-001 line 132 offers no
        WAIVED_WITH_RESIDUAL_RISK route here either. See `blocking_effect` for
        what this entry does and does not block — its scope is narrower than
        R-N's or R-I's, and stating it precisely is the point of the field.
      blocking_effect: >-
        ADDITIVE, and the narrowest in this register. STATED EXACTLY: this entry
        blocks a POWER-LOSS / HOST-LOSS / TORN-SECTOR DURABILITY CLAIM, and only
        that. It does NOT block (a) the process-crash durability claim actually
        made by STATE-EV-004 run `20260806T015632Z-12dd4077`, which is what was
        executed and is fully supported; (b) the STATE-EV-001 PASS recorded
        2026-08-06, whose durable-limb citation is scoped to that process-crash
        claim; (c) STATE-EV-004's READY state or any evidence it did execute.
        STATE-EV-004's own PASS is blocked by R-N and R-I — not by this entry. A
        consumer who reads R-D as invalidating the 2026-08-06 evidence has
        widened it beyond what it says; a consumer who cites that evidence for
        power-loss durability has ignored it.
    broker_account_instrument_scope:
      brokers: []
      accounts: []
      instruments: []
      statement: >-
        Non-live-test only; the affected artifact is the pilot store at
        tos/src/tos/staterestore/store.py (a local on-disk sqlite3 database in
        WAL journal mode) and the reconstruction that reads it. No broker,
        account, or instrument is in scope, and no broker limitation is invoked
        or implied (VER-002-001 line 3312).
    credible_failure_sequence: >-
      (1) The host loses power, or the filesystem tears a write mid-sector, at a
      moment when a dimension marker is in the page cache but not yet on stable
      media. (2) On restart the store is missing a marker whose transaction had
      already returned, or holds a physically damaged page — a state the
      `os._exit` model never produces, because it preserves the page cache and so
      makes every issued write survive regardless of the durability pragma.
      (3) Reconstruction then either loses a potentially-live attempt entirely —
      the dangerous direction, since absence reads as "no attempt was made" —
      or fails to open the store at all. (4) A reader who takes "durable and
      reconstructable after crash, restart, or failover" (ADR-002-005 §13 line
      197) as fully evidenced by this pilot arms the conservative-resume barrier
      on a record a power event can silently truncate. (5) The defect stays
      invisible until a real power or hardware event — that is, until exactly the
      moment the recovery path is what stands between the system and an untracked
      live order.
    maximum_economic_effect:
      present: >-
        None. Non-live-test scope; no order path exists to carry a mis-reconstructed
        state into a broker command.
      path_to_economic_effect: >-
        Evidence-chain contamination, and narrower than R-N's or R-I's: only a
        claim that reaches BEYOND process-crash durability is contaminated. The
        contaminating artefact would be a citation of the STATE-EV-001 durable
        limb, or of STATE-EV-004's persistence axis, phrased without its
        process-crash qualifier — because ADR-002-005 §13 line 197 says "crash,
        restart, or failover" and an unqualified citation silently claims the
        third. Any later live-scope decision resting on it inherits the same
        unbounded-by-record ceiling as R-1, R-N, and R-I
        (MAX_trial_authorized_economic_effect and
        MAX_trial_concurrent_potential_effect null,
        VERIFICATION-PROFILE-002.yaml lines 942-943).
      statement: "No present economic effect; future effect unbounded-by-record, and reachable only through a citation that drops the process-crash qualifier."
    existing_controls:
      - "The claim is scoped in-band at three independent places: the design's §2.4 errata v1.2 states the pilot discharges process-crash durability only; the run manifest scopes the persistence technology as PILOT-SCOPE; and ADVERSE-SCENARIO-SET-002-EVL3-PILOT.yaml ASS-DOM-03 records power-loss/torn-sector as pruning_basis NOT_PRUNED_UNRESOLVED, explicitly refusing a dominance argument."
      - "The residual is genuinely narrowed rather than merely declared: the inter-transaction incomplete-store facet of VER line 1046 IS exercised (design cell L3-05 / scenario ASS-EVL3-C-02), so what remains is intra-transaction torn writes and page-cache loss, not 'incomplete stores' as a class."
      - "The pragma's real presence is structurally pinned (AST inspection of real execute(...) arguments plus a PRAGMA read-back, hardened so a docstring token cannot satisfy the check), so the unfalsifiable setting is at least proven present rather than asserted in prose."
      - "synchronous=FULL is the conservative setting even though this crash model cannot falsify it: the residual is an evidence gap, not a known-bad configuration."
      - "Equivalent-mutant honesty: mutant E was reported EQUIVALENT rather than KILLED, so the mutation-canary coverage claim was not inflated by a mutant the model cannot kill."
      - "Residual after those controls: nothing exercises stable-media durability. Every control above scopes or discloses the gap; none closes it."
    detection_and_containment_bound:
      detection: >-
        NOT_ESTABLISHED at the harness layer, and not trivially establishable:
        detecting this class requires filesystem or block-layer fault injection,
        while the import firewall forbids `subprocess` and `ctypes` outright
        (2026-07-20 boundary-and-import-firewall design, allowlist lines
        186-187), so the usual in-corpus injection mechanisms are unavailable and
        an out-of-corpus harness would be needed. Detection today is
        document-gate only.
      containment: >-
        Claim-level. The executed claim is confined to process-crash durability
        wherever it is cited, and this entry's `required_scope_reduction` makes
        that confinement explicit rather than conventional. There is no runtime
        containment because there is no runtime at this scope.
      resolution_path: >-
        An FS-fault-injection class extension: a filesystem or block-layer fault
        injector — torn write, page-cache loss, delayed or reordered writes, and
        a genuine power-cut equivalent — driven against the same store at EV-L3
        or above, with the reconstruction's Expected re-derived for each injected
        fault. It is NOT resolvable by adding further `os._exit` cells: those are
        equivalent by construction, which is precisely what mutant E measured.
      time_bound: "None claimed. A gate reviewed at most every 180 days is not a time-to-detect bound."
    owner: operator
    approver:
      identity: operator
      basis: >-
        Operator directive 2026-08-06, verbatim: "R-N/R-I/R-D 등재 승인", recorded
