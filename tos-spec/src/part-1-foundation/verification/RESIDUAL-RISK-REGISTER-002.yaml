authorization_notice: >-
  This register records unresolved limitations; it accepts none of them and
  grants nothing. Registration is disclosure, not acceptance: an entry here does
  not become an approved deviation, does not permit the affected evidence item to
  be marked PASS, and does not authorise any live, restricted-live, or production
  scope. R-1 in particular cannot be accepted at all while the requirement is
