    Pure model layer at commit eb92ea467cb55d923b5c9eb4307b65491b14fe26. No
    broker session, no account, no instrument, no order path, no live
    authorization. Matches VERIFICATION-PROFILE-002.yaml scope.environment
    (line 60).
  covered_rows: [STATE-EV-001, SPG-EV-002]
  # DATED ADDITION 2026-08-06 (v1.1): covered_rows extends to STATE-EV-004 with
  # the registration of R-N and R-I. The rows covered by this register are now
  # STATE-EV-001, SPG-EV-002, and STATE-EV-004. The scope statement above
  # remains exactly correct for entries R-1/R-2/R-3, whose affected artifacts
  # sit at commit eb92ea46; the 2026-08-06 entries are scoped to the executed
  # EV-L3 baseline instead — commit 12dd40778b0237ea6992a3b0a9ecadb10f865f0f —
  # where the run does use a real on-disk sqlite3 WAL substrate and a real OS
  # process boundary, and still has no broker session, no account, no
  # instrument, no order path, and no live authorization. Both scopes remain
  # inside VERIFICATION-PROFILE-002.yaml scope.environment `non-live-test`
  # (line 59), which declares the EV-L1..L3 harness ceilings non-live-test.
  covered_rows_2026_08_06: [STATE-EV-001, SPG-EV-002, STATE-EV-004]

union_prohibition: >-
  Per VER-002-001 §378 line 3308 these entries SHALL NOT be unioned at a
  consumer. Each is registered independently with its own scope, controls,
  bound, owner, approver, review date, and required scope reduction.
  DATED ADDITION 2026-08-06 (v1.1): the prohibition covers all six entries
  (R-1, R-2, R-3, R-N, R-I, R-D) with no sub-grouping. The measured anchor for
  the non-union sentence in the current VER revision is line 3310 (the citation
  of 3308 above was correct for the 2026-07-29 revision — see ANCHOR DRIFT
  NOTE in the header).

deviation_binding_applicability: >-
  NOT_APPLICABLE — no entry claims an RFC-001 permitted deviation, so the §378
  line 3308 ADR-002-026 binding requirements (request, decision, Active Deviation
  Set, reduced configuration scope, independently verified compensating controls,
  Deviation Generation, hard expiry, review interval, non-PASS evidence status)
  do not attach. R-1 is additionally ineligible for that route (VER:130).
  DATED ADDITION 2026-08-06 (v1.1): still NOT_APPLICABLE after the three new
  registrations. R-N and R-I are additionally ineligible for that route on the
  same ground as R-1 — STATE-EV-004 is a Critical row, and VER line 132
  (measured 2026-08-06) forbids WAIVED_WITH_RESIDUAL_RISK for a Critical
  requirement. R-D is likewise not claimed as a deviation.

