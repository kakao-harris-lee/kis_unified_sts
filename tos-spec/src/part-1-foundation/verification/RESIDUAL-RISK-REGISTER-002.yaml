# RESIDUAL-RISK-REGISTER-002 — the VER-002-001 §378 (line 3291-3310) register
#
# WHAT THIS IS
#   The §378 Residual Risk Register instance for the ADR-002 evidence track.
#   §378 line 3293: "Every unresolved limitation SHALL record:" followed by
#   twelve items. Each entry below carries all twelve under those names.
#
# SHAPE
#   No template exists for this artifact (measured: verification/ ships
#   RESIDUAL-RISK-ACCEPTANCE-RECORD-template.yaml, which is the ADR-002-026
#   deviation-acceptance record — a different artifact with a different
#   authority). The shape here is derived directly from VER §378's twelve SHALL
#   items, in the specification's own order and wording.
#
# THIS IS NOT A DEVIATION ACCEPTANCE
#   §378 line 3308 adds binding requirements "Where RFC-001 permits a deviation".
#   None of the three entries claims a deviation: no ADR-002-026 request, no
#   decision, no Active Deviation Set, no compensating-control acceptance, no
#   Deviation Generation. Entry R-1 in particular CANNOT be accepted that way —
#   VER:130 forbids WAIVED_WITH_RESIDUAL_RISK for a Critical requirement. These
#   are recorded gaps that block, not accepted risks that release.
#   ADDED 2026-08-06 (v1.1): the statement above extends verbatim to the three
#   entries registered on 2026-08-06 (R-N, R-I, R-D). None claims a deviation,
#   and R-N and R-I are additionally ineligible for that route on the same
#   ground as R-1 — STATE-EV-004 is a Critical row.
#
# NON-UNION RULE
#   §378 line 3308: "Separate residual risks SHALL NOT be unioned at a consumer;
#   combined risk requires one canonical reviewed set." R-1, R-2, and R-3 are
#   three independent entries. A consumer SHALL cite them individually and SHALL
#   NOT summarise them as one aggregate residual.
#   ADDED 2026-08-06 (v1.1): the register now holds SIX independent entries —
#   R-1, R-2, R-3, R-N, R-I, R-D. The non-union rule applies across all six with
#   no exception and no sub-grouping. In particular R-1 (a STATE-EV-001 limb,
#   whose evidence half is discharged as of this version) SHALL NOT be merged
#   with R-N/R-I (which block STATE-EV-004's own PASS) or with R-D (whose
#   blocking scope is narrower than either — a power-loss durability claim only).
#   The measured anchor for the non-union sentence in the current VER revision
#   is line 3310; see ANCHOR DRIFT NOTE.
#
# ANCHOR DRIFT NOTE (added 2026-08-06 with v1.1)
#   The VER-002-001 `line NNNN` citations in the 2026-07-29 entries (R-1, R-2,
#   R-3) were measured against the VER revision current on that date. Two dated
#   "Currency Correction" bullets have since been added to that document's
#   header (2026-08-04 and 2026-08-06), shifting every subsequent line by +2.
#   Re-measured 2026-08-06: §378 heading = 3293, "Every unresolved limitation
#   SHALL record:" = 3295, the non-union sentence = 3310, the broker-limitation
#   sentence = 3312, the WAIVED_WITH_RESIDUAL_RISK prohibition = 132,
#   STATE-EV-001 Expected = 1026, STATE-EV-004 Minimum Level = 1044.
#   The 2026-07-29 entries are NOT rewritten (their citations are correct for
#   the revision they were measured against and rewriting them would erase that
#   fact); the entries registered on 2026-08-06 carry re-measured anchors and
#   say so. A consumer resolving an anchor SHALL re-measure rather than trust
#   either set. ADR-002-005 and VERIFICATION-PROFILE-002.yaml anchors were also
#   re-measured 2026-08-06 and are unchanged (61, 197, 237, 240; 942, 943, 949).
#
# "BROKER LIMITATION" PROHIBITION
#   §378 line 3310: "Broker limitation" is not a sufficient residual-risk
#   description. No entry below invokes one; the scope is broker-free.
#
# APPROVAL RECORD
#   Operator directive 2026-07-29 ("§378 Residual Risk Register 생성: 승인");
#   session C record. Approver identity `operator` = D1 role scheme System owner /
#   Bounds-Approver (docs/plans/2026-07-29-tos-phase0-role-scheme-and-disposition.md
#   lines 15-16). Separation of duties preserved: this identity is not the
#   Live-Armer (unassigned), and per VER §2.6 the independent reviewer of the
#   affected evidence SHALL NOT be the identity that approved these residuals.
#
# APPROVAL RECORD — v1.1 AMENDMENT (2026-08-06)
#   Three operator directives were issued in one session on 2026-08-06 and are
#   recorded verbatim in
#   `tos-evidence/STATE-EV-004/review/20260806-operator-countersign.md`
#   (companion-directives section). Each is quoted here exactly as issued:
#     1. "R-N/R-I/R-D 등재 승인"
#        — authorises registration of the three new entries below.
#     2. "OQ-1: (A) 채택"
#        — adjudicates the open question that gated R-1's evidence limb; see
#          entry R-1 `dated_disposition_2026_08_06`.
#     3. "ASS-EVL3-PILOT 승인"
#        — approves ADVERSE-SCENARIO-SET-002-EVL3-PILOT.yaml (a sibling
#          artifact, not this register); recorded here only because the R-N/R-I
#          coverage statements cite that set.
#   The countersign statement issued in the same session, verbatim:
#     "STATE-EV-004 EV-L3 + STATE-EV-001/SPG-EV-002 EV-L1/L2 stage evidence at
#      baseline 12dd4077 countersigned — operator, 2026-08-06"
#   Approver identity `operator` = the same D1 role scheme System owner /
#   Bounds-Approver as the 2026-07-29 record. Separation of duties preserved and
#   re-measured: this identity is not the Live-Armer (still unassigned), and it
#   is not either independent reviewer of the affected evidence — both review
#   legs for the 12dd4077 generation are AI reviewers (attempt 1 same-family,
#   attempt 2 decorrelated-family), per the D1 mixed scheme
#   `ai-review(decorrelated)+operator-countersign`
#   (docs/plans/2026-07-29-tos-phase0-role-scheme-and-disposition.md line 19).
#   Registration is disclosure, not acceptance: none of these directives waives
#   a residual, moves a register row by itself, or creates any authority.

