  STATE-EV-004 run manifest's `integration_boundary.modeled_axes`, and
  registered here on operator directive "R-N/R-I/R-D 등재 승인". The ASS-DOM-05
  candidate above is UNCHANGED by this amendment: it is still not registered as
  R-4 and is still an open operator decision — the 2026-08-06 directive named
  R-N, R-I, and R-D only, and no entry is invented beyond what it named.

entries:

  - risk_identity: >-
      R-1 — STATE-EV-001 durable/persisted limb is unevidenced. The EV-L2 pilot
      covers the representability and no-silent-derivation axes of the row's
      Expected; the "durable" half of that same Expected has no evidence at all,
      because no persisted authoritative record exists to fault.
    affected_requirement_and_adr:
      requirement: >-
        VER-002-001 STATE-EV-001 Expected (line 1024): "Every valid composite
        remains representable and durable; no dimension is silently derived from
        another except through an explicit CPL invariant and owned transition."
        Minimum level EV-L1/EV-L2 (line 1021).
      adr: >-
        ADR-002-005 §13 (line 197): "All five dimensions SHALL be durable and
        reconstructable after crash, restart, or failover." AC-005-1 (line 237):
        the composite states "are all representable and persisted". The durable
        referent's own row, STATE-EV-004, is minimum level EV-L3 (line 1042).
      criticality_note: >-
        The requirement is Critical, so VER:130 makes
        WAIVED_WITH_RESIDUAL_RISK unavailable. This is a blocking gap, not an
        acceptable one.
    broker_account_instrument_scope:
      brokers: []
      accounts: []
      instruments: []
      statement: >-
        Non-live-test only; the affected artifact is the in-memory
        tos.orthostate.records.CompositeState at commit eb92ea46. No broker,
        account, or instrument is in scope, and no broker limitation is invoked
        or implied (VER:3310).
    credible_failure_sequence: >-
      (1) A durability or reconstruction defect exists in whatever persistence is
      later chosen — a write that is not durable at the claimed point, or a
      reconstruction that resolves a dimension differently after crash. (2) The
      defect is invisible at the model layer, so the EV-L2 pilot cannot fail on
      it. (3) A reader of the pilot evidence treats STATE-EV-001 as covering the
      row's whole Expected and builds restart, recovery-barrier, or reconciliation
      logic on "durable and reconstructable" as an established premise. (4) The
      defect first surfaces at a real crash-restart, when a composite state is
      reconstructed with a different capacity_state or knowledge_state than the
      one that was committed. (5) The conservative-resume barrier is then armed
      from a false premise, which is exactly the condition ADR-002-005 §13 exists
      to prevent.
    maximum_economic_effect:
      present: >-
        None. The declared scope has no broker route, no account, and no order
        path, so no economic effect can be produced by this residual today.
      path_to_economic_effect: >-
        The credible economic path is evidence-chain contamination, not direct
        loss: a coverage or PASS claim resting on this row could later be cited
        as a satisfied precondition in a live-authorization or scope-promotion
        decision. The effect would then be bounded by whatever live scope that
        later decision opens — which is presently unbounded on the record,
        because MAX_trial_authorized_economic_effect and
        MAX_trial_concurrent_potential_effect are null and key-level unapproved
        in VERIFICATION-PROFILE-002.yaml (lines 942-943).
      statement: "No present economic effect; future effect unbounded-by-record until those keys are approved."
    existing_controls:
      - "The run manifest's claim.covered_axis names the exclusion in-band: 'representability + non-derivation ONLY (NOT durable)'."
      - "coverage_argument.discharged is false in the same manifest; unexercised_residual_ref carries the durable limb with its anchors."
      - "claim.closes_evidence_item and claim.register_status_moved_by_this_run are both false, so no register row moved."
      - "VER:130 structurally forbids waiving a Critical requirement, so no acceptance route can quietly close this."
      - "The durable referent has its own higher-level row (STATE-EV-004, EV-L3), so the gap has a named destination."
    detection_and_containment_bound:
      detection: >-
        NOT_ESTABLISHED. There is no runtime detector because there is no durable
        substrate to monitor — ADR-002-005 §4 (line 61) leaves the persistence
        technology undecided. Detection today is document-gate only: review of the
        evidence package's covered_axis and coverage_argument fields.
      containment: >-
        Gate-level only. The row cannot reach PASS while the coverage argument is
        undischarged, and no automated fence exists (none can, absent a substrate).
      time_bound: "None claimed. A gate reviewed at most every 180 days is not a time-to-detect bound."
    owner: operator
    approver:
      identity: operator
      basis: "Operator directive 2026-07-29 (§378 register creation approved); session C record. D1 role scheme System owner."
      separation_of_duties: "Not the Live-Armer (unassigned). Per VER §2.6 this identity SHALL NOT also be the independent reviewer of the affected evidence."
    expiration_or_review_date:
      review_date: "2027-01-25"
      basis: "MAX_residual_risk_review_interval_ms = 15552000000 ms = 180 days from 2026-07-29 (VERIFICATION-PROFILE-002.yaml line 949)."
      expiry_semantics: >-
        This entry does not expire into acceptance. A missed or unproven review
        restricts scope and never auto-renews; the underlying requirement stays
        Critical and unwaivable regardless of the date.
    required_scope_reduction:
      - "STATE-EV-001 SHALL NOT be marked PASS on the strength of the EV-L2 pilot."
      - "No live scope, restricted-live trial, or production authorization may cite STATE-EV-001 as evidence of durability."
      - "Any consumer needing the durable limb SHALL cite STATE-EV-004 at EV-L3 with a real persistence substrate, not this row."
      - "Resolution prerequisite: the persistence technology decision deferred by ADR-002-005 §4 (line 61) must be made first; an EV-L3 crash/restart fault run then discharges the limb."
    dated_disposition_2026_08_06:
      # ADDITIVE field introduced with register_version 1.1. It records a dated
      # disposition; it removes, replaces, or overrides no field above. Every
      # twelve-SHALL field of this entry stands exactly as approved 2026-07-29.
      disposition: EVIDENCE_LIMB_DISCHARGED_DECISION_GATE_RESOLVED_ENTRY_RETAINED
      operator_directive_verbatim: "OQ-1: (A) 채택"
      directive_date: "2026-08-06"
      directive_record: "tos-evidence/STATE-EV-004/review/20260806-operator-countersign.md (companion-directives section)"
      what_the_directive_decided: >-
        Option (A) of open question OQ-1 (docs/plans/2026-08-06-tos-ev-l3-pilot-design.md
        §3.3, §11): the PILOT-SCOPE persistence decision recorded in design §3 —
        stdlib sqlite3 in WAL journal mode with synchronous=FULL — satisfies the
        "decision first" prerequisite stated in this entry's
        required_scope_reduction item 4 (the line-177 clause). The operator
        adjudicated the sufficiency question that the design deliberately left
        open; the design did not decide it and did not claim to.
      evidence_limb_status: >-
        DISCHARGED (substrate-class) by STATE-EV-004 run
        `20260806T015632Z-12dd4077`. The durable half of the STATE-EV-001
        Expected was executed against a REAL on-disk substrate across a REAL OS
        process boundary — not modelled, not argued. Substrate-class means: what
        was verified is the model's durable-restart property on a substrate that
        provides ACID durability, over the ADR-002-005 §14 composite set plus the
        boundary combinations (the VER §2.7 coverage argument), not a claim about
        one specific production technology. A different §4 production choice that
        is also ACID does not retroactively invalidate this discharge; it is the
        subject of a separate production-acceptance EV-L3 (design #39 §7.1).
      project_persistence_decision: >-
        The ADR-002-005 §4 (line 61) project persistence-technology decision is
        NOT made by this directive and is NOT made by the pilot. It continues as
        a separate architecture track. As of this dated disposition it no longer
        blocks this entry: the operator adjudicated that the pilot-scope decision
        satisfies the line-177 prerequisite for the EVIDENCE limb. It remains an
        open architecture gate on its own track.
      required_scope_reduction_item_by_item:
        # The four items above are re-read against this disposition. None is
        # deleted; each is given its current standing.
        item_1_state_ev_001_shall_not_pass_on_the_ev_l2_pilot: >-
          STILL TRUE, read in its own terms. Item 1 says STATE-EV-001 SHALL NOT
          be marked PASS "on the strength of the EV-L2 pilot" — that is, the
          EV-L2 pilot ALONE never suffices, and it did not. The PASS recorded on
          2026-08-06 does not rest on it alone: its basis is the EV-L1 and EV-L2
          stages re-executed at baseline 12dd4077, PLUS citation of the
          STATE-EV-004 EV-L3 run for the durable limb, PLUS the VER §9.5
          signature chain (two independent review legs and the operator
          countersign). Item 1 is satisfied, not overridden.
        item_2_no_live_scope_may_cite_this_row_for_durability: >-
          UNCHANGED and still binding. No live, restricted-live, or production
          authorization may cite STATE-EV-001 as evidence of durability. A PASS
          is an evidence fact at a registered scope; it is not permission.
        item_3_consumers_needing_the_durable_limb_cite_state_ev_004: >-
          UNCHANGED and still binding — it is the STANDING CITATION RULE, and the
          2026-08-06 PASS complies with it rather than being excused from it. Any
          consumer needing the durable limb cites STATE-EV-004 at EV-L3 with a
          real persistence substrate. That is exactly the citation the PASS
          makes. This item does not expire with the discharge; it is how the
          discharge is consumed.
        item_4_persistence_decision_prerequisite: >-
          SATISFIED as of 2026-08-06 by operator directive "OQ-1: (A) 채택" —
          the pilot-scope persistence decision (design §3) is adjudicated
          sufficient for the line-177 prerequisite, and the EV-L3 crash/restart
          fault run then discharged the limb, in that order.
      entry_retained_and_why: >-
        This entry is NOT closed and NOT deleted. Two things remain true. (a) The
        requirement is Critical, so it can never be waived (VER line 132,
        measured 2026-08-06) and this register never accepts it. (b) The
        substrate-class caveat and the open ADR-002-005 §4 architecture track are
        facts a future consumer must be able to read. A discharged evidence limb
        is a recorded fact about what was executed, not an erasure of the entry
        that demanded it.
      non_union_reminder: >-
        R-1 SHALL NOT be unioned with R-N, R-I, or R-D (VER §378, non-union
        sentence measured at line 3310). Their blocking scopes differ: R-1's
        evidence limb is discharged; R-N and R-I block STATE-EV-004's own PASS;
        R-D blocks a power-loss durability claim only and blocks neither PASS.
      what_this_disposition_does_not_do: >-
        It creates no authority, no live or restricted-live scope, no ADR
        acceptance, and no broker scope. It does not close this entry, does not
        make the requirement waivable, does not decide ADR-002-005 §4, and does
        not extend to R-2 or R-3 (SPG scope, untouched).
    # DATED FACT NOTE — 2026-08-06: design #39 §7.1 conditional dual-record — evidence
    # limb executed (substrate-class); the §4 project-persistence decision gate and
    # substrate-class caveat remain OPEN pending OQ-1 operator adjudication; entry status
    # and required_scope_reduction unchanged (transitions on this operator-approved
    # register are the operator's act).
    # SUPERSEDED IN PART, 2026-08-06 (v1.1): the note above was written while OQ-1
