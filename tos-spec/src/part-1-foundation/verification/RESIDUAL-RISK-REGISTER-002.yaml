  - risk_identity: >-
      R-I — STATE-EV-004's credential / service-identity boundary is
      undischarged. VER §5 requires an EV-L3 test to cross real IDENTITY
      boundaries (line 154). The executed run re-derives the LOGICAL state
      identity across a real OS process boundary — writer process dies, reader
      process reconstructs — but exercises no real credential, no service
      principal, and no cross-host authentication. Logical identity
      re-derivation and a credential boundary are different things, and only the
      first was executed.
    affected_requirement_and_adr:
      requirement: >-
        VER-002-001 STATE-EV-004 Minimum Level EV-L3 (line 1044), read against
        the VER §5 definition of that level (line 154): "real persistence,
        identity, and network boundaries". The row that owns this axis at its
        own level is STATE-EV-005 — Dimension Transition Ownership, Minimum Level
        "EV-L2/EV-L3 plus security assessment" (line 1051), which is
        NOT_IMPLEMENTED in EVIDENCE-REGISTER-002.csv.
      adr: >-
        ADR-002-005 AC-005-5 — Ownership (line 241): "an attempt to transition a
        dimension by a non-owner is rejected and evidenced (`STATE-EV-005`)". The
        restart obligation this run does serve is AC-005-4 (line 240); the
        identity half of the EV-L3 level definition points at AC-005-5's row, not
        at this one.
      measured_gap: >-
        Measured in the executed evidence, not argued: the run manifest records
        `integration_boundary.modeled_axes[1]` as axis `credential_identity`,
        disposition DEFERRED, note "logical identity re-derivation executed; real
        credential/cross-host auth deferred to STATE-EV-005 (+Security)". The
        writer and reader processes run as the same OS user, on the same host,
        against a store path the run itself creates; no credential appears
        anywhere in the path, so there is nothing for a credential defect to
        attach to.
      criticality_note: >-
        STATE-EV-004 is a Critical requirement, so VER-002-001 line 132
        (re-measured 2026-08-06) makes WAIVED_WITH_RESIDUAL_RISK unavailable.
        This is a blocking gap, not an acceptable one.
      blocking_effect: >-
        ADDITIVE, and deliberately narrow. This entry blocks STATE-EV-004's OWN
        PASS, and nothing else. It does NOT block the STATE-EV-001 PASS recorded
        2026-08-06, whose minimum level is EV-L1/EV-L2 (line 1023) and whose
        durable-limb citation is a persistence property, not an identity one.
    broker_account_instrument_scope:
      brokers: []
      accounts: []
      instruments: []
      statement: >-
        Non-live-test only, and additionally credential-free by construction: the
        pilot store is a local on-disk sqlite3 file created by the run, opened by
        processes of one OS user on one host. No broker, account, or instrument
        is in scope, and no broker limitation is invoked or implied
        (VER-002-001 line 3312).
    credible_failure_sequence: >-
      (1) In a real deployment the writer and the reader are distinct service
      principals — different credentials, plausibly different hosts — and the
      authoritative store is reached through an authenticated path. (2) A
      credential expires, a secret is rotated, a principal is misconfigured, or a
      namespace/tenant qualifier is wrong. (3) The pilot cannot fail on any of
      it: writer and reader share one OS user, one host, and one filesystem path,
      with no credential in the path at all, so every authentication outcome is
      vacuously correct. (4) At restart the reader either cannot reach the
      authoritative store — and, if an absent store is treated as an empty one,
      reconstructs "no attempt" while a potentially-live attempt sits in the
      store it failed to open — or reaches a DIFFERENT store it should not have
      been able to read, and reconstructs a stale or foreign composite as
      authoritative. (5) The conservative-resume barrier is then armed from a
      record that was never authoritatively identified, and the failure direction
      is not guaranteed conservative: the second case can supply an optimistic
      value the real store never held.
    maximum_economic_effect:
      present: >-
        None. Non-live-test scope, no credential in the executed path, no order
        path, no account.
      path_to_economic_effect: >-
        The evidence-chain path shared with R-1 and R-N: a coverage or PASS claim
        over STATE-EV-004's Expected that reads as covering the EV-L3 identity
        boundary would be the artefact a later live-scope or promotion decision
        cites. That decision's ceiling is unbounded on the record while
        MAX_trial_authorized_economic_effect and
        MAX_trial_concurrent_potential_effect are null
        (VERIFICATION-PROFILE-002.yaml lines 942-943). Specific to this entry:
        the effect of reading a WRONG authoritative store is not bounded by this
        deployment's own exposure at all — it is bounded by whatever exposure the
        misidentified store governs, which no key in the approved profile
        describes.
      statement: "No present economic effect; future effect unbounded-by-record, and not bounded by this deployment's own scope in the wrong-store case."
