# RESIDUAL-RISK-REGISTER-002 — the VER-002-001 §378 (line 3291-3310) register
#
# WHAT THIS IS
#   The §378 Residual Risk Register instance for the ADR-002 evidence track.
#   §378 line 3293: "Every unresolved limitation SHALL record:" followed by
#   twelve items. Each entry below carries all twelve under those names.
#
# SHAPE
#   No template exists for this artifact (measured: verification/ ships
#   RESIDUAL-RISK-ACCEPTANCE-RECORD-template.yaml, which is the ADR-002-026
#   deviation-acceptance record — a different artifact with a different
#   authority). The shape here is derived directly from VER §378's twelve SHALL
#   items, in the specification's own order and wording.
#
# THIS IS NOT A DEVIATION ACCEPTANCE
#   §378 line 3308 adds binding requirements "Where RFC-001 permits a deviation".
#   None of the three entries claims a deviation: no ADR-002-026 request, no
#   decision, no Active Deviation Set, no compensating-control acceptance, no
#   Deviation Generation. Entry R-1 in particular CANNOT be accepted that way —
#   VER:130 forbids WAIVED_WITH_RESIDUAL_RISK for a Critical requirement. These
#   are recorded gaps that block, not accepted risks that release.
#
# NON-UNION RULE
#   §378 line 3308: "Separate residual risks SHALL NOT be unioned at a consumer;
#   combined risk requires one canonical reviewed set." R-1, R-2, and R-3 are
#   three independent entries. A consumer SHALL cite them individually and SHALL
#   NOT summarise them as one aggregate residual.
#
# "BROKER LIMITATION" PROHIBITION
#   §378 line 3310: "Broker limitation" is not a sufficient residual-risk
#   description. No entry below invokes one; the scope is broker-free.
#
# APPROVAL RECORD
#   Operator directive 2026-07-29 ("§378 Residual Risk Register 생성: 승인");
#   session C record. Approver identity `operator` = D1 role scheme System owner /
#   Bounds-Approver (docs/plans/2026-07-29-tos-phase0-role-scheme-and-disposition.md
#   lines 15-16). Separation of duties preserved: this identity is not the
#   Live-Armer (unassigned), and per VER §2.6 the independent reviewer of the
#   affected evidence SHALL NOT be the identity that approved these residuals.

