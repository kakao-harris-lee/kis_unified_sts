  - risk_identity: >-
      R-N — STATE-EV-004's real-network-boundary axis is undischarged. VER §5
      defines EV-L3 as an integrated test with "real persistence, identity, and
      network boundaries" (line 154). The executed EV-L3 run realized the
      persistence boundary (a real on-disk sqlite3 WAL store) and a real OS
      process boundary, and re-derived logical state identity across it; but the
      transmission at every crash point is a capability-class VirtualBroker
      marker held inside the process, not a real broker send. The row whose
      minimum level IS EV-L3 therefore has one of its three defining boundaries
      modeled rather than exercised.
    affected_requirement_and_adr:
      requirement: >-
        VER-002-001 STATE-EV-004 — Conservative Restart Reconstruction: Minimum
        Level EV-L3 (line 1044); Injection (line 1046) "Crash at each attempt and
        broker-order boundary, including after durable `SEND_STARTED`, AFTER
        NETWORK TRANSMISSION, and before evidence persistence"; Expected (line
        1047). The level definition the row must meet is VER §5 EV-L3 (line 154):
        "Multiple live-path components are tested together with real persistence,
        identity, and network boundaries."
      adr: >-
        ADR-002-005 AC-005-4 — Restart (line 240): "post-restart,
        `SEND_STARTED`/non-terminal orders are `POTENTIALLY_LIVE`/`UNKNOWN`;
        knowledge is never `RECONCILED` without re-derivation". §13 (line 198-199)
        carries the same obligation normatively. The named destination for a real
        network boundary is VER §5 EV-L4 — Broker Sandbox or Certified Test
        Environment (line 156) — or a +Broker-scoped level above it.
      criticality_note: >-
        STATE-EV-004 is a Critical requirement, so VER-002-001 line 132
        (re-measured 2026-08-06) makes WAIVED_WITH_RESIDUAL_RISK unavailable.
        This is a blocking gap, not an acceptable one.
      blocking_effect: >-
        ADDITIVE, and deliberately narrow. This entry blocks STATE-EV-004's OWN
        PASS, and nothing else. It does NOT block the STATE-EV-001 PASS recorded
        2026-08-06: that row's minimum level is EV-L1/EV-L2 (line 1023), its own
        axes were executed at those levels, and it consumes the EV-L3 run only by
        citing the durable limb under R-1's standing consumer rule — a
        persistence property that traverses no network boundary. A consumer who
        reads this entry as invalidating the STATE-EV-001 PASS has widened it
        beyond what it says.
    broker_account_instrument_scope:
      brokers: []
      accounts: []
      instruments: []
      statement: >-
        Non-live-test only, with ZERO real broker order bytes emitted — measured,
        not asserted: the run manifest records
        `integration_boundary.modeled_axes[0]` as axis `network`, disposition
        MODELED, and the transmission at each crash point is a capability-class
        VirtualBroker marker (design #39 §0, §2.4). No broker, account, or
        instrument is in scope. This description is NOT a "broker limitation"
        (VER-002-001 line 3312, re-measured): it is a declared absence of an
        exercised boundary inside this project's own test scope. The
        project-side reason the real futures order path cannot be exercised at
        all is an operator policy of this deployment — the real futures account
        is never funded and real-money futures order paths are permanently
        blocked (CLAUDE.md, Non-Negotiable Rules) — which is a constraint on this
        operator's configuration, not a capability limit of any broker.
    credible_failure_sequence: >-
      (1) A defect exists at the real transmission boundary — a send the
      transport acknowledges but the broker never receives, a connection reset
      part-way through a write, a receipt whose ambiguity has no in-process
      analogue, or a duplicate delivery on retry. (2) The modeled marker cannot
      express it: the VirtualBroker marker transitions deterministically, never
      leaves the process, and has no failure mode that is not authored, so the
      EV-L3 run cannot fail on it. (3) A reader treats STATE-EV-004's executed
      EV-L3 stage as covering the row's whole Expected and builds restart,
      recovery-barrier, or reconciliation logic on "after network transmission"
      being an exercised crash boundary. (4) The defect first surfaces against a
      real broker, at precisely the boundary where a potentially-live order can
      exist with no local record that it does. (5) Conservative reconstruction is
      then armed from a false premise — an attempt reconstructed as not-live
      while the broker holds it live — which is the exact condition AC-005-4
      exists to prevent.
    maximum_economic_effect:
      present: >-
        None, and structurally so at this scope: the run emits zero real broker
        order bytes, and no live authorization, account, or order path exists.
      path_to_economic_effect: >-
        Evidence-chain contamination, as with R-1 — a coverage or PASS claim
        resting on STATE-EV-004's EV-L3 stage could later be cited as a satisfied
        precondition in a live-authorization or scope-promotion decision. The
        effect would then be bounded by whatever live scope that later decision
