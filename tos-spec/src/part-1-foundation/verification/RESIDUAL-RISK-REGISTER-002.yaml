  intent_state and capacity_state were never directly mutated; their coverage
  rests on a structural-identity argument, not an executed one). Registering it
  as R-4 is an open operator decision.
  DATED ADDITION 2026-08-06 (v1.1): the register now holds SIX entries. The
  three above, plus R-N, R-I, and R-D — proposed by the EV-L3 pilot design
  (docs/plans/2026-08-06-tos-ev-l3-pilot-design.md §2.4), carried in-band by
