dominance_and_pruning_proofs:
  - id: ASS-DOM-01
    subject: "SPG-07 overflow / underflow"
    pruning_basis: NOT_PRUNED_UNRESOLVED
    argument: >-
      Not excluded by a dominance proof. The Expected is bound-dependent and no
      approved bound defines a safe magnitude range, so a falsifiable Expected
      cannot be written (design §0.5-4 / §4). Carried as an unbounded credible
      effect below and registered independently as R-2 in
      RESIDUAL-RISK-REGISTER-002.yaml.
  - id: ASS-DOM-02
    subject: "SPG-04 currency"
    pruning_basis: NOT_PRUNED_UNRESOLVED
    argument: >-
      Not excluded by a dominance proof. GovernedDimensionLimit has no currency
      field, so currency cannot be mutated independently of unit at this layer.
      Registered independently as R-3.
  - id: ASS-DOM-03
    subject: "SPG-12 duplicate / unknown / deprecated / extension FIELD bypass"
    pruning_basis: SCOPE_ASSIGNMENT_NOT_DOMINANCE
    argument: >-
      Excluded because it belongs to a different evidence row: ADR-002-014 §11
      step 12 (:313) maps to SPG-EV-003 (minimum level EV-L1/EV-L2 plus security
      assessment, VER:1553; Injection VER:1555 names "duplicate"). This is a
      scope assignment, not a claim of harmlessness, and SPG-EV-003 remains
      unexecuted.
  - id: ASS-DOM-04
    subject: "ST-10 silent-derivation probe"
    pruning_basis: MERGED_OBSERVATION_FACE
    argument: >-
      Merged into ST-01 (design M6): "the dropped dimension is not derived from
      its neighbours" is the observation face of the missing-mandatory-field
      case, so the merged fault dominates the separate one. This is a genuine
      dominance argument and the merged case was executed (ASS-EVL2-C-01).
  - id: ASS-DOM-05
    subject: "intent_state and capacity_state (STATE-EV-001 dimensions not directly mutated)"
    pruning_basis: STRUCTURAL_IDENTITY_ARGUED_NOT_EXECUTED
    argument: >-
      All five ADR-002-005 §14 dimensions are declared identically as
      non-optional StrEnum-typed fields at records.py:94-98, and the three
      exercised dimensions cover all three mutation modes (missing, null-for-NONE,
      cross-dimension value, out-of-enum token). The argument that the two
      unexercised dimensions behave identically is structural, NOT executed.
    honesty_flag: >-
      ADR-002-021 §11 (:301) requires pruning to be policy-governed and to prove
      dominance. No Aggregate Risk Policy exists to govern this pruning, so this
      entry is an argument on the record, not a discharged proof. A future run
      that mutates intent_state and capacity_state directly would discharge it;
      until then it is a candidate §378 register entry (see the register's
      `entries_scope_note`).
  - id: ASS-DOM-06
    subject: "The nine ADR-002-021 §11 trading-scenario groups"
    pruning_basis: SCOPE_DECLARATION_NOT_DOMINANCE
    argument: >-
      See `unpopulated_trading_scenario_groups`. No dominance is claimed; the
      groups have no referent at a pure-model, non-live-test scope.

unbounded_credible_effects:
  - id: ASS-UNB-01
    subject: "governed-dimension magnitude safe range (overflow / underflow, ADR-002-014 §11 step 3 :304)"
    statement: >-
      The effect of an out-of-safe-range magnitude cannot be numerically bounded
      at this scope, because no approved bound defines the range. Measured:
      VERIFICATION-PROFILE-002.yaml (P0-1 approved 2026-07-29 for 146 of 163
      numeric keys) contains NO governed-dimension magnitude or safe-range key at
      all — a grep over the file for magnitude / overflow / underflow / safe_range
      / scale matches only MAX_time_source_precision_ms (:985) and
      MIN_capacity_domain_voter_quorum (:988), neither of which is a magnitude
      range. Per ADR-002-021 §11 (:303) an unbounded credible effect is DENY or
      UNKNOWN, never a conveniently chosen finite value.
    consequence: "SPG-EV-002's coverage argument SHALL NOT claim the step-3 overflow/underflow limb."
    registered_as: "RESIDUAL-RISK-REGISTER-002.yaml entry R-2"

common_mode_dependencies:
  - id: ASS-CM-01
    dependency: "single evaluator"
    detail: >-
      Every scenario was executed by one harness (tools/tos_evidence_run.py) under
      one interpreter and one pydantic version, at one baseline commit
      (eb92ea467cb55d923b5c9eb4307b65491b14fe26). ADR-002-021 §22 (:513) requires
      "independent reproduction and parser/model/library differential results";
      none was performed.
  - id: ASS-CM-02
    dependency: "single seed"
    detail: "seed=0 with PYTHONHASHSEED=0 for both runs. Determinism is established; input-space diversity is not."
  - id: ASS-CM-03
    dependency: "single authoring lane"
    detail: >-
      The catalogue, the implementation, the fault suite, and this scenario set
      were produced in the same AI-orchestrated authoring lane. VER-002-001 §2.6
      independent review is NOT_SIGNED for both runs, so no independent principal
      has yet reviewed the scenarios or their sufficiency.
  - id: ASS-CM-04
    dependency: "the guards under test are also the oracles"
    detail: >-
      Each Expected disposition is the validator's own verdict. A defect shared
      between the guard and the expectation (for example an enum whose members
      are wrong in both) would not be detected by these scenarios. The pilot's
      mutation-canary discipline (design §8.4) partially offsets this; it does not
      remove it.

