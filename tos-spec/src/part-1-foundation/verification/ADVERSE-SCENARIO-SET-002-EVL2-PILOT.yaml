# ADVERSE-SCENARIO-SET-002-EVL2-PILOT — APPROVED (scope-limited)
#
# WHAT THIS IS
#   An Adverse Scenario Set INSTANCE created for exactly one consumer: the
#   VER-002-001 §2.7 (line 76-78) coverage argument of the two EV-L2 pilot rows
#   STATE-EV-001 and SPG-EV-002. §2.7 requires, at minimum, "the boundary values
#   of each governed dimension and the adversarial combinations of the approved
#   Adverse Scenario Set (ADR-002-021)". This file supplies that second leg for
#   those two rows and nothing else.
#
# WHAT THIS IS NOT
#   - It is NOT an ADR-002-021 §5.4 (line 128) Adverse Scenario Set in the full
#     sense. §5.4 defines a "policy-bound set ... used to establish maximum
#     credible effects"; no Aggregate Risk Policy exists (ADR-002-021 §28 Q1 is
#     open), so `aggregate_risk_policy_id` is null and this set is NOT policy-
#     bound. It establishes no maximum credible economic effect and SHALL NOT be
#     consumed by any aggregate-risk evaluation, projection, or allocation.
#   - It does NOT satisfy ADR-002-021 §11 (line 289-299): all nine mandated
#     trading-scenario groups are empty, recorded below with per-group reasons.
#     `adr_002_021_section_11_full_coverage: NOT_MET`.
#   - Approving this instance does NOT accept ADR-002-021. That ADR stays
#     `Proposed` (ADR-002-021 line 3) and its §29 Approval Gate (line 719-735)
#     is untouched by this approval. An instance approval is not an ADR
#     acceptance.
#   - It moves no EVIDENCE-REGISTER-002 row to PASS. The two pilot runs record
#     `register_status_moved_by_this_run: false`, and the other §9 gates of the
#     pilot design (STATE durable residual, independent review signature,
#     VER §3 complete baseline) remain open independently of this file.
#
# SHAPE DEVIATIONS FROM ADVERSE-SCENARIO-SET-template.yaml (declared, additive)
#   1. `result` carries `VALID_FOR_DECLARED_SCOPE_ONLY`. Neither ADR-002-021 nor
#      the template defines a result vocabulary; the template ships
#      `result: INVALID` beside `status: DRAFT`. Plain `VALID` would overclaim
#      (the §11 groups are empty), plain `INVALID` would contradict the operator's
#      approval for the declared use. The extended value states both facts.
#   2. Four additive fields, none of which removes or renames a template field:
#      `adr_002_021_section_11_full_coverage`,
#      `unpopulated_trading_scenario_groups`, `ev_l2_pilot_coverage_scenarios`,
#      `authorization_notice` (the last mirrors the sibling
#      RESIDUAL-RISK-ACCEPTANCE-RECORD-template.yaml field name).
#   3. `canonical_digest`, `aggregate_risk_policy_id`, `aggregate_risk_generation`
#      are null rather than `TBD`: the referents do not exist. A null digest is
#      not a digest — see `authorization_notice`.
#
# APPROVAL RECORD
#   Operator directive 2026-07-29, option (a) ("Adverse Scenario Set 인스턴스
#   승인"); session C record. Approver identity `operator` = the D1 role scheme
#   System owner / Bounds-Approver (docs/plans/2026-07-29-tos-phase0-role-scheme-
#   and-disposition.md lines 15-16). Separation of duties: the approving identity
#   SHALL NOT also arm live trading (Live-Armer unassigned), and per VER-002-001
#   §2.6 the independent reviewer of the pilot evidence SHALL NOT be this
#   approving identity — that review is still NOT_SIGNED.

artifact_type: ADVERSE_SCENARIO_SET
schema_version: "1.0-DRAFT"
scenario_set_id: ADVERSE-SCENARIO-SET-002-EVL2-PILOT
scenario_set_version: "1.0"
aggregate_risk_generation: null      # no Aggregate Risk Generation exists
canonical_digest: null               # no approved canonicalization scheme for spec-layer YAML
status: APPROVED
result: VALID_FOR_DECLARED_SCOPE_ONLY
aggregate_risk_policy_id: null       # no Aggregate Risk Policy exists (ADR-002-021 §28 Q1 open)

scope:
  - kind: consumer
    value: "VER-002-001 §2.7 (line 76-78) coverage argument, adversarial-combination leg"
    detail: >-
      Consumable by exactly two evidence rows: STATE-EV-001 (minimum level
      EV-L1/EV-L2, VER:1021) and SPG-EV-002 (minimum level EV-L1/EV-L2,
      VER:1546). Any other consumer is out of scope.
  - kind: environment
    value: non-live-test
    detail: >-
      Pure model layer. No broker session, no account, no instrument, no order
      path, no market data, no live authorization. Consistent with
      VERIFICATION-PROFILE-002.yaml scope.environment (line 60).
  - kind: evidence_baseline
    value: "commit eb92ea467cb55d923b5c9eb4307b65491b14fe26"
    detail: >-
      Every scenario below is derived from a fault executed at this baseline and
      recorded in the two landed run packages (see `evidence_ref` per entry).
  - kind: exclusion
    value: aggregate-risk evaluation
    detail: >-
      SHALL NOT be used as the Adverse Scenario Set of an Aggregate Risk
      Decision, a Projected Aggregate State, or an Adverse Increment Vector
      (ADR-002-021 §1 line 15, §12 line 309-330). It proves no maximum credible
      effect for any trading action.

# --- ADR-002-021 §11 mandated trading-scenario groups: all empty at this scope ---
# Template shape preserved (each stays a list). The per-group disposition is in
# `unpopulated_trading_scenario_groups` below so it survives YAML parsing.
execution_path_scenarios: []
partial_fill_and_ordering_scenarios: []
cancel_amend_replace_retry_and_overlap_scenarios: []
price_slippage_gap_volatility_and_liquidity_scenarios: []
correlation_basis_and_hedge_failure_scenarios: []
margin_collateral_borrow_and_currency_scenarios: []
exercise_assignment_delivery_and_settlement_scenarios: []
external_trapped_non_trade_and_concurrent_scenarios: []
venue_broker_partition_and_recovery_scenarios: []

adr_002_021_section_11_full_coverage: NOT_MET

unpopulated_trading_scenario_groups:
  common_reason: >-
    The declared scope contains no trading action, no broker command, no fill,
    no position, no margin, no settlement, and no venue session. Populating
    these groups would require inventing scenarios with no executed referent,
    which the pilot design forbids (design §0.5-4: a fault whose Expected is not
    deterministic and falsifiable is excluded from the catalogue). Emptiness here
    is a declared scope limitation, NOT a dominance proof and NOT a claim that
    the omitted paths are harmless (ADR-002-021 §5.4 line 128: "Absence from the
    set is not proof that a credible adverse path can be ignored").
  groups:
    - group: execution_path_scenarios
      adr_anchor: "ADR-002-021 §11 lines 293-294 (missing acknowledgement, receipt ambiguity, zero crossing, reversal, reduce-only failure, position-effect mismatch)"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: partial_fill_and_ordering_scenarios
      adr_anchor: "ADR-002-021 §11 line 291 (fill prefixes, out-of-order fill sequence)"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: cancel_amend_replace_retry_and_overlap_scenarios
      adr_anchor: "ADR-002-021 §11 line 292 (original, cancel, amend, replace, split-child, retry overlap)"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: price_slippage_gap_volatility_and_liquidity_scenarios
      adr_anchor: "ADR-002-021 §11 line 295"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: correlation_basis_and_hedge_failure_scenarios
      adr_anchor: "ADR-002-021 §11 line 296"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: margin_collateral_borrow_and_currency_scenarios
      adr_anchor: "ADR-002-021 §11 line 297"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
      note: >-
        The currency limb has a model-layer counterpart that IS unresolved and is
        registered independently as R-3 in RESIDUAL-RISK-REGISTER-002.yaml
        (GovernedDimensionLimit carries no currency field). That residual is about
        representability at the safety-profile layer, not about FX risk.
    - group: exercise_assignment_delivery_and_settlement_scenarios
      adr_anchor: "ADR-002-021 §11 line 297"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: external_trapped_non_trade_and_concurrent_scenarios
      adr_anchor: "ADR-002-021 §11 line 298"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE
    - group: venue_broker_partition_and_recovery_scenarios
      adr_anchor: "ADR-002-021 §11 line 299"
      disposition: NOT_APPLICABLE_AT_THIS_SCOPE

# --- The scenarios this set actually carries -------------------------------
# Derivation rule (invention minimised): every entry below corresponds 1:1 to a
# fault executed in one of the two landed EV-L2 run packages. No entry is
# hypothetical. Classification rule, measured from each row's `fault_kind` in
# fault-timeline.jsonl: an entry is an ADVERSARIAL COMBINATION when the fault
# holds two or more factors simultaneously (typically one mutated factor and one
# held-invariant factor); otherwise it is a single-factor BOUNDARY VALUE of one
# governed dimension.
ev_l2_pilot_coverage_scenarios:
  self_referentiality_caveat: >-
    This set is derived from the executed catalogue, so by construction it cannot
    reveal a scenario the catalogue missed. It argues coverage of the declared
    axes only. Axes outside it are recorded under `dominance_and_pruning_proofs`,
    `unbounded_credible_effects`, or RESIDUAL-RISK-REGISTER-002.yaml — never as
    silently covered.

  governed_dimensions:
    STATE-EV-001:
      referent: "tos.orthostate.records.CompositeState (tos/src/tos/orthostate/records.py:39-102)"
      dimensions_declared:
        - name: intent_state
          declaration: "records.py:94"
          directly_exercised: false
        - name: transmission_attempt_state
          declaration: "records.py:95"
          directly_exercised: true
        - name: broker_order_state
          declaration: "records.py:96"
          directly_exercised: true
        - name: knowledge_state
          declaration: "records.py:97"
          directly_exercised: true
        - name: capacity_state
          declaration: "records.py:98"
          directly_exercised: false
      binding_axes_exercised:
        - "covered-content / digest binding (tos/src/tos/canonical/_base.py:211)"
        - "canonicalization_version registration (tos/src/tos/canonical/canonicalization.py:255)"
        - "artifact lifecycle status vs digest (tos/src/tos/canonical/_base.py:205)"
        - "record-pair identity vs bytes (tos/src/tos/canonical/record_pair.py:96)"
        - "self-excluded ledger-placement meta (records.py:102)"
      directly_exercised_ratio: "3 of the 5 ADR-002-005 §14 dimensions"
      undirected_dimensions_disposition: >-
        intent_state and capacity_state were not directly mutated. Their coverage
        rests on a structural-identity argument recorded in
        `dominance_and_pruning_proofs` (id ASS-DOM-05), which is an ARGUED, not an
        EXECUTED, dominance.
    SPG-EV-002:
      referent: "tos.spg.records.GovernedDimensionLimit (tos/src/tos/spg/records.py:87-114) consumed by tos.spg.predicates.semantic_validation and profile_within_envelope"
      dimensions_exercised: [qty, notional, latency]
      per_dimension_metadata_axes: [unit, multiplier, sign, precision, rounding, boundary]
      magnitude_carriers: [envelope_max, profile_value]
      note: >-
        `currency` is NOT among the metadata axes — the model has no such field
        (negative grep over tos/src/tos/spg/: the only occurrence of "currency" is
        a docstring at predicates.py:438, not a field). Registered as R-3.

