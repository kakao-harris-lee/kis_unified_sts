authorization_notice: >-
  This APPROVED instance grants nothing. It supplies the adversarial-combination
  leg of the VER-002-001 §2.7 coverage argument for exactly two evidence rows at
  a non-live-test, pure-model scope, and it does so with the nine ADR-002-021 §11
  trading-scenario groups empty and declared as such. It is not policy-bound
  (`aggregate_risk_policy_id` is null), so it establishes no maximum credible
  effect and SHALL NOT be consumed by any aggregate-risk evaluation. Its
  `canonical_digest` is null because no approved canonicalization scheme exists
  for spec-layer YAML instances (ADR-002-021 §28 question 1 is open); a null
  digest is not a digest, and a consumer that requires digest binding SHALL treat
  this set as unbound. Approving this instance does not accept ADR-002-021, which
  remains `Proposed`, and does not move any evidence row to PASS: the pilot's
  remaining gates (STATE durable residual R-1, independent review signature per
  VER §9.5, VER §3 complete baseline) are untouched by this file.
