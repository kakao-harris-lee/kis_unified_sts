# tos import-firewall — enforcement layer ③ (design §3.3-③).
#
# Runs the full firewall on EVERY pull request and every push to main, with NO
# path gating: the checks are cheap and path-gating would leave an evasion gap
# (a PR that edits both tos/ and the gate could skip enforcement). Steps mirror
# the three enforcement layers:
#   1. python tools/tos_firewall_check.py  — layer ① (default-deny AST gate)
#   2. lint-imports                        — layer ② (transitive forbidden-pkg)
#   3. pytest tos/tests                     — hermetic package tests (§2.4)
#
# tos/runtime/ (design #40 D1.3, ratified by the operator 2026-09-08): the
# runtime-scope allowlist split lives INSIDE
# tools/tos_firewall_check.py's single forward scan (rules a-d apply the R1
# allowlist per-file via scope_for_tos_path) — layer ① above already covers
# BOTH tos/ scopes in its one invocation, no extra firewall step is added
# here. Only two things are new: installing the tos-runtime distribution
# editable (so lint-imports's static analysis can resolve `tos_runtime` as a
# root package for the transitive contracts in .importlinter, and so its own
# hermetic test suite is importable) and running that suite as its own step.
#
# NOTE: marking this job a *required* check is a GitHub branch-protection
# setting and is NOT configured here — see the handoff report.
name: tos-firewall

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tos-firewall:
    runs-on: ubuntu-latest
    # 10 → 30: the tos governance test batteries (last step) took ~6.5 min
    # locally (subprocess-heavy git-repo fixtures in test_u17_verify.py and
    # tests/tos_l3); with the firewall + checker steps that already ran here
    # the old 10-minute backstop would name the batteries as "hung" on a slow
    # hosted runner. Still a hard fail-fast, just sized to the job's new content.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # **전체 이력이 필요하다** — 아래 Layer 4 검사기의 `C2UP`(측정 출처 검증)은
          # 래칫 기준선이 기록한 커밋에서 `git show <commit>:<path>` 로 blob 을 **다시
          # 재어** 기준선이 그 내용에서 나왔음을 확인한다.  기본 `fetch-depth: 1` 은
          # 얕은 클론이라 그 커밋이 없고, 검사기는 재측정 실패를 **fail-closed** 로
          # 처분한다(rc=128 → `TOS-CC-C2UP` red).
          #
          # 에라타 32차가 `--full-history` lockstep 을 하네스·정본 블록·live sha 핀에
          # 걸쳐 이행했으나 **검사기를 «실행하는» 이 체크아웃에는 닿지 않았다.**
          # 로컬은 전체 이력을 갖고 있어 영원히 green 이었고, 게이트가 CI 에서 처음
          # 실행된 PR #637 에서야 관측됐다 — `tos-gate.yml` 은 같은 이유로 이미
          # `fetch-depth: 0` 이다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal dependencies
        # Deliberately minimal — the heavy runtime stack (talib/mlflow/...) is
        # NOT needed:
        #   * tos + its 4 pinned third parties + pytest/hypothesis, via the
        #     tos package's own [test] extra.
        #   * import-linter (+ grimp) for layer ②.
        #   * the repo-root package installed with --no-deps so grimp can LOCATE
        #     shared/services/cli (it analyses them statically via AST and never
        #     executes them, so their runtime deps are unnecessary).
        run: |
          python -m pip install --upgrade pip
          pip install -e "./tos[test]"
          # tos-runtime (design #40 D1.3 item 5, ratified by the operator 2026-09-08) — installed AFTER
          # the kernel above, editable, with --no-deps. Reproduced 2026-09-08
          # (independent review finding, MEDIUM) in a throwaway venv: WITHOUT
          # --no-deps, `pip install -e "./tos/runtime[test]"` resolves
          # tos/runtime/pyproject.toml's `tos @ {root:uri}/../` dependency
          # itself, which pip treats as "(re)install this requirement" —
          # SILENTLY REPLACING the kernel's editable install from the step
          # above with a non-editable, built wheel (`pip list --editable`
          # afterward showed `tos-runtime` only, `tos` gone). --no-deps skips
          # that resolution entirely, so the kernel's prior editable install
          # is left untouched (`pip list --editable` then shows BOTH `tos`
          # and `tos-runtime`, verified in the same throwaway-venv
          # reproduction). The `[test]` extra (pytest/hypothesis) is NOT
          # requested here — it is not needed: both are already installed,
          # pinned to the SAME versions, by the kernel's own `[test]` extra
          # one line above (verified: `pytest tos/runtime/tests` imports and
          # runs cleanly with no separate test-extra install).
          pip install -e "./tos/runtime" --no-deps
          pip install import-linter
          pip install -e . --no-deps
          # Layer 4 의 RULE 축은 S-25 manifest(YAML)를 읽는다.  루트 프로젝트는
          # `pyyaml>=6.0` 를 의존으로 선언하지만 위 설치는 `--no-deps` 라 딸려오지
          # 않는다.  **부재 시 검사기는 조용히 건너뛰지 않고 `TOS-CC-RULE-MANIFEST`
          # 로 red 를 낸다**(fail-closed) — 그래서 여기서 명시 설치한다.
          # (`tos` 패키지의 §3.2 서드파티 allowlist 와는 무관하다 — `tools/` 의
          #  저장소 도구가 쓰는 것이지 `tos` 패키지가 임포트하는 것이 아니다.)
          pip install "pyyaml>=6.0"
          # Black/mypy — Phase 1 작업 7 (계획 §2 표 7행). 로컬 .venv 와 정확히
          # 같은 버전으로 핀 — CI 만 다른 버전에서 다른 판정을 내는 것을 막는다.
          pip install "black==26.5.1" "mypy==2.3.1"

      - name: Pin mikefarah yq v4.48.1 (WFCANON M-4 parser gate)
        # tools/wfcanon-v222.py [M-4] pins the judgment parser to
        # `yq (mikefarah) v4.48.x` (YQ_FLAVOR/YQ_MAJMIN) and fails closed
        # (WF-P0 PREVENTION_UNVERIFIABLE) on any other version. ubuntu-latest
        # preinstalls a newer yq at /usr/bin/yq, and
        # tests/tools/test_u17_verify.py::_run_script drives tools/u17-verify.sh
        # (which shells out to wfcanon-v222.py) under a from-scratch,
        # non-inherited env with a literal PATH where /usr/bin is FIRST — so
        # the pin must overwrite /usr/bin/yq itself (installing to
        # /usr/local/bin would be shadowed). Condensed from the identical
        # rationale in .github/workflows/test.yml (source of this step, now
        # moved here with tests/tools/test_u17_verify.py — see below).
        run: |
          set -euo pipefail
          curl -sL -o /tmp/yq_linux_amd64 \
            https://github.com/mikefarah/yq/releases/download/v4.48.1/yq_linux_amd64
          echo "99df6047f5b577a9d25f969f7c3823ada3488de2e2115b30a0abb10d9324fd9f  /tmp/yq_linux_amd64" | sha256sum -c -
          sudo install -m 0755 /tmp/yq_linux_amd64 /usr/bin/yq
          yq --version

      - name: Layer 1 — custom AST firewall (default-deny)
        run: python tools/tos_firewall_check.py

      - name: Layer 2 — import-linter (transitive forbidden-package defense)
        run: lint-imports

      - name: tos hermetic package tests
        run: pytest tos/tests

      # design #40 D1.3 item 5 (ratified by the operator 2026-09-08) — the runtime shell's own hermetic
      # suite (D1.4: zero external network/ambient env/writes outside
      # tmp_path — tos/runtime/tests/conftest.py's autouse socket guard).
      # Isolated rootdir via tos/runtime/pyproject.toml's own
      # [tool.pytest.ini_options], same pattern as the kernel step above.
      - name: tos-runtime hermetic package tests
        run: pytest tos/runtime/tests

      # Phase 1 작업 7 (계획 §2 표 7행) — 같은 잡의 스텝으로 추가한다(필수 체크
      # 이름을 늘리지 않는다는 위 헤더 규율). 두 스텝의 실행 위치가 다르다 —
      # (독립 리뷰 Low-4, 2026-09-07: 이전 주석은 «둘 다 `cd tos`」로 실행한다고 잘못
      # 적었으나 실제로는 mypy만 그렇다):
      #   * Black 은 **저장소 루트**에서 실행하며, 루트 `pyproject.toml` 의
      #     `[tool.black]` 설정을 읽는다(로컬 §1 기준선 측정 명령과 동일한 호출).
      #     대상은 `tos/src tos/tests` 에 더해 **정확히** 이 잡이 소유하는 저장소
      #     레벨 파일 둘 — `tools/tos_size_budget.py`·
      #     `tests/tools/test_tos_size_budget.py` — 만 명시로 얹는다(독립 리뷰
      #     Low-4 후속, 2026-09-07: 이 둘은 이전엔 이 스텝의 게이트 밖이었다).
      #     `tools/`·`tests/tools/` 전체로 넓히지 않는다 — 그 아래 다른 파일들이
      #     Black-clean 이라는 보장이 없다.
      #   * mypy 는 `cd tos` 로 이동해 `src` 를 검사하며, `tos/pyproject.toml` 에
      #     `[tool.mypy]` 섹션이 없어 상위로 올라가 루트 `pyproject.toml` 을 읽는다
      #     (로컬 실행 시 "../pyproject.toml: note: unused section(s)" 로 실측 확인).
      # Scope note (PR #742 follow-up). This step used to check `tos/src tos/tests`
      # plus exactly one tool and its test, leaving `tos/runtime/src`,
      # `tos/runtime/tests` and the rest of the tos governance tooling unformatted-
      # by-nobody — the same shape of hole as the mypy one #742 closed, in the same
      # job. The audit that found it also measured the cost of closing it: all 421
      # newly covered files were ALREADY clean (406 under tos/runtime, 15 across the
      # tooling), so this widening required no reformatting commit and cannot be
      # carrying a silent reformat. Checked file totals: 845 before, 1266 after.
      # (421, not the 423 first written here: the globs below match 17 tooling files,
      # but two of them — tos_size_budget.py and its test — were already named
      # explicitly by the old command, so they are not new coverage. Counting glob
      # matches as "new" is the same shape of slip this step's other note exists to
      # correct; an independent review caught it by diffing the two file SETS with
      # `git ls-files` instead of trusting either total.)
      - name: Black (tos)
        run: >-
          black --check tos/src tos/tests tos/runtime/src tos/runtime/tests
          tools/tos_*.py tests/tools/test_tos_*.py tests/tools/test_u17_verify.py

      - name: mypy (tos kernel)
        run: cd tos && mypy src --ignore-missing-imports

      # tos/src/tos/py.typed (PEP 561 marker, added alongside this step) makes
      # the kernel's own types visible to this check instead of resolving as
      # `Any` — without it, every tos_runtime call into a kernel function/
      # predicate/artifact silently typed as `Any`, masking real errors here.
      - name: mypy (tos runtime)
        run: mypy tos/runtime/src --ignore-missing-imports

      # The two TEST trees, added after PR #737: a type defect in a test HELPER
      # (`example_integrity.py` reassigning one name at two types, which can mask a
      # broken assertion) survived three review rounds and three green CI runs
      # precisely because the two steps above check `src` only.
      #
      # Both trees carry ~1.9k pre-existing errors, so they cannot simply be added.
      # Two rejected shapes and why:
      #   * a per-FILE exception list — that is the "registry with an unpinned
      #     satellite" class this repo has already been bitten by; a new file joins
      #     silently uncovered.
      #   * a baseline error COUNT ratchet — a fingerprint, which the review
      #     convention §5 forbids on purpose.
      # So the deferral is per ERROR CODE instead. That list is finite, it does not
      # rot as files are added (a new file is checked for every enabled code from the
      # moment it exists), and it only ever shrinks. Enabled today are thirteen codes:
      # the original nine that flag a real mismatch rather than a missing annotation
      # (measured to 0 in both trees by the commit that added this step), plus four
      # more added by the test-tree mypy ratchet plan's stage 1
      # (`docs/plans/2026-09-18-tos-test-tree-mypy-ratchet-plan.md` §3.1) — `misc`,
      # `index`, `operator`, `union-attr` — fixed by adding real None-checks/type
      # narrowing at each call site, never by loosening a type or an assertion.
      #
      # Stage 2 (same plan, §3.2) added a fourteenth code: `no-any-return` — 55 hits
      # (37 kernel + 18 runtime; `mypy --version` must read 2.3.1, the CI pin), fixed
      # by assigning the Any-typed expression to a variable and adding a real
      # `assert isinstance(...)` before the return, never a `cast`. Two recurring
      # shapes: 37 of the 55 were the same `mp.Queue.get()` result in the
      # `*_import_closure.py` helpers (one instance per package, not deduplicated —
      # see the registry-with-unpinned-satellite note above; this stage left the
      # duplication in place on purpose, scoped to the error-code fix only), and 9
      # were `connection.execute(...).fetchone()[0]` SQLite count helpers (against
      # `SqliteEvidenceStore.connection`), which also gained a `row is not None`
      # check the bare `[0]` indexing had been skipping silently.
      #
      # Stage 2b (same plan, §5) added a fifteenth code: `return-value` — 116 hits
      # (105 kernel + 11 runtime). 108 of those (94 `DigestBoundArtifact.issue()` +
      # 14 `IdDerivedArtifact.issue()` call sites) were one root cause: both
      # `@classmethod issue()` methods in `tos/src/tos/canonical/_base.py` declared
      # their return type as the base class instead of `Self`, so every subclass
      # override (`Proposal.issue()`, `AuthoredStrategy.issue()`, ...) looked like it
      # returned the base type to callers. Fixed by declaring both `-> Self`
      # (`requires-python >= 3.11`, no `typing_extensions` needed); this also made 7
      # `# type: ignore[return-value]` comments genuinely dead (confirmed by running
      # the kernel gate with each removed and checking no error reappears at that
      # line), removed alongside. The remaining 8 were judged individually, never by
      # widening an ignore's label to also cover `return-value`:
      # `tos/tests/afg/test_afg_{void_canaries,truthy_sentinel}.py` returned
      # `ActionFlowDecision.result` (`ActionFlowResult | None`) from a helper typed
      # to return `ActionFlowResult`; `result` is also in `_REQUIRED_COVERED`, so any
      # decision built via `.issue()` (the only path these helpers use) already fails
      # construction if `result` is `None` — a redundant `assert is not None` at the
      # call site would be dead code (the `assert row is not None` lesson from the
      # `no-any-return` stage), so the fix instead added a real
      # `ActionFlowDecision.issued_result` property to
      # `tos/src/tos/afg/records.py` that performs that one narrowing at its actual
      # invariant boundary. Five `tos/runtime/tests/**/conftest.py` (+
      # `calendar/test_owner.py`) `FixedKeyProvider` doubles were missing
      # `KeyProvider.key_for()` — a real Protocol-conformance gap, not a mislabeled
      # ignore, fixed by adding `key_for` to match the idiom already used by the
      # sibling doubles in `riskstate/conftest.py` / `venue/conftest.py`. The last,
      # `compose/test_rcl_tip_generation_provider.py`, returned `AppendReceipt.seq`
      # (`int | None`); unlike the `ActionFlowDecision` case, nothing validates
      # `AppendReceipt` at construction, so `assert receipt.seq is not None` is a
      # live, reachable check (and the same pattern the kernel itself uses at e.g.
      # `tos_runtime/nontrade/latch.py:139` and `tos_runtime/engine/driver.py:642`).
      #
      # The `Self` fix also surfaced two errors NOT counted in the 116 (both were
      # previously masked by `attr-defined`, which stays deferred): a genuinely
      # redundant `cast(ApprovalSetConsumptionRecord, ...)` in
      # `tos/tests/hag/test_hag_void_canaries.py` — a sibling `.issue()` call two
      # lines below it was never cast, proving the cast only existed to paper over
      # the base-type return — deleted along with the then-unused `cast` import; and
      # 3 `operator` errors (an enabled code) in
      # `tos/tests/authority/test_authority_required_covered.py`, where
      # `record.new_epoch > record.old_epoch` had type-checked against `Any` (via
      # `attr-defined`) before `Self` let mypy resolve the real `int | None` fields.
      # Both epochs are `_REQUIRED_COVERED` AND re-checked by a dedicated
      # `_epoch_strictly_increasing` model validator, so — same reasoning as
      # `ActionFlowDecision.issued_result` — an inline `assert is not None` would be
      # dead; fixed with `AuthorityEpochTransitionRecord.issued_old_epoch` /
      # `.issued_new_epoch` properties in `tos/src/tos/authority/records.py`. Both
      # kernel properties raise `ArtifactIntegrityError` on the `None` branch rather
      # than asserting — verified NOT dead by constructing an ISSUED-status instance
      # via `model_construct()` (which bypasses the validator; this repo already
      # treats that as a real threat model, e.g. `tos/tests/test_required_covered.py`
      # module docstring) and confirming the raise actually fires.
      #
      # A full-tree, zero-disable mypy sweep after the `Self` fix (looking for any
      # OTHER now-dead ignore this ratchet's own scope wouldn't otherwise catch)
      # found 6 more genuinely-dead `# type: ignore[return-value]` comments on
      # direct `Cls.issue(...)` calls, same root cause as the kernel's 7:
      # `tos/tests/marketfeed/_marketfeed_fixtures.py:150,178`,
      # `tos/tests/dsl/test_dsl_context_value.py:75,152`, and
      # `tos/runtime/tests/marketfeed/_store_fixtures.py:100,128` — removed. The
      # same sweep for a now-redundant `cast(...)` around an `.issue()` call found
      # none beyond the one already listed above.
      #
      # `unused-ignore` was named in PR #742 as the next code to enable, on the
      # strength of 53 hits under FULL checking. That is wrong while any code is
      # deferred, and the correction is the useful part of this note: measured back
      # when nine codes were enabled and ten deferred, exactly the flags below minus
      # the `unused-ignore` deferral gave 283 (183 kernel + 100 runtime), not 53. The
      # extra 230 are ignores that stop being "used" once the deferrals are applied:
      # 228 name a deferred code directly (`# type: ignore[arg-type]` reads as
      # "unused" only because `arg-type` is off right now), and 2 name `call-arg` —
      # an ENABLED code — where turning the nine off removes the error at that line by
      # cascade, so the mechanism there is interaction between deferred codes rather
      # than the ignore's own code being off. An independent review measured that
      # split; the one-to-one story was too strong, and the practical conclusion
      # holds either way. Deleting them to go green would quietly remove the
      # suppressions that the deferred codes need the moment they are enabled, i.e.
      # it would make this gate harder to ratchet, not easier. So `unused-ignore` is
      # enabled LAST, after every code it interacts with — it measures the others, it
      # does not lead them. Stage 1 separately removed the 53 genuinely dead ignores
      # (unused regardless of deferral state) while leaving the 230 deferral-dependent
      # ones in place.
      #
      # `attr-defined` enabled (2026-09-18, 2-stage-2 third/last PR): 108 errors / 46
      # files at measurement time, five subject shapes: `"type"` (36), `"object"`
      # (36), `"AST"` (23), `"FixtureFunctionDefinition"` (10), `"ModelMetaclass"`
      # (2), plus one `Module has no attribute` outlier. Every one was a root-cause
      # fix, not a per-line suppression:
      #
      # - `"type"` (36): a shared `_ARTIFACTS: list[tuple[type, ...]]`-shaped
      #   collection (or a bare `model: type` / `cls: type` test-function parameter)
      #   erased the real artifact base, so `._REQUIRED_COVERED` / `._ID_FIELD` /
      #   `._COVERED_FIELDS` / `.issue()` / pydantic's own `.model_fields` /
      #   `.model_config` all read as missing. Annotating with the real common base
      #   (`type[DigestBoundArtifact]`, `type[IndependentIdArtifact]`, or
      #   `type[pydantic.BaseModel]` for the two dict/list literals whose values
      #   don't share a digest-bound base) fixed every instance; two `enum_cls: type`
      #   parameters that iterate an Enum class needed `type[Enum]` instead.
      # - `"object"` (36): a helper's declared return type (or a `dict[str, object]`
      #   mutable box closing over a composed runtime) was strictly weaker than what
      #   it actually produced — e.g. `tos_runtime/tests/marketfeed/test_scheduler
      #   .py`'s `_decide()` was annotated `-> object` while wrapping `decide_tick()`,
      #   which actually returns `TickDecision` (21 of the 36 errors, one fix).
      #   Fixed by annotating each helper with its real return type
      #   (`TickDecision`, `ComposedRuntime`, `EngineCore`, `VenueServiceStage`) —
      #   the last two needed `if TYPE_CHECKING:` imports to avoid a runtime import
      #   at module scope, mirroring this file's existing local-import style. Two
      #   remaining `object` cases were mypy inference quirks rather than missing
      #   annotations: a `sorted(FROZENSET, key=lambda i: i.value)` expression
      #   inline inside `@pytest.mark.parametrize(...)` had its lambda parameter
      #   widened to `object` by parametrize's own dynamically-typed `argvalues`
      #   context (verified: the identical `sorted()` call type-checks cleanly once
      #   hoisted to an explicitly annotated module-level constant) — fixed by that
      #   hoist in `test_egressgw_applicability.py`; and a heterogeneous tuple of
      #   five `set[SomeStrEnum]` literals (`test_replacement_vocabulary.py`) joined
      #   to plain `object` on iteration since the five enum types share no common
      #   base narrower than `Enum` — fixed with an explicit
      #   `tuple[set[StrEnum], ...]` annotation.
      # - `"AST"` (23, operator directive: type-narrow, no exception lane): every
      #   instance was the same shape — an `isinstance(node, ast.Import)` /
      #   `ast.ImportFrom` (or `ast.If`/`ast.Assign`/...) branch narrows `node`
      #   correctly, but `node.lineno` was read AFTER the if/elif chain, where
      #   `node`'s type has widened back to the bare `ast.AST` `ast.walk()` yields.
      #   Fixed in all 22 files (20 near-identical `test_*_import_closure.py`
      #   sibling-import scanners + `test_stm_truthy_sentinel.py` +
      #   `test_sir_void_canaries.py`) the same way: capture `node.lineno` (or
      #   `(name, node.lineno)` / `(target, node.lineno)` pairs) INSIDE each
      #   narrowed branch instead of reading it from the widened loop variable
      #   afterward. No `isinstance` narrowing was removed or weakened.
      # - `"FixtureFunctionDefinition"` (10, 3 files): `config_dir.__wrapped__(root)`
      #   — pytest's own documented escape hatch for calling the plain function a
      #   `@pytest.fixture` wraps, used identically in `test_symmetry.py` (3),
      #   `test_riskstate_wiring.py` (4), and `test_venue_wiring.py` (3) — reaches an
      #   attribute pytest's typed `FixtureFunctionDefinition` deliberately does not
      #   expose (calling a fixture directly is unsupported API). Consolidated into
      #   one new `call_wrapped_fixture()` helper in `compose/conftest.py` with a
      #   single documented `# type: ignore[attr-defined]` plus a real
      #   `isinstance(result, Path)` runtime guard (needed to avoid trading the
      #   attr-defined error for a `no-any-return` one on the SAME enabled code) —
      #   ten call sites now import and call the shared helper instead of each
      #   carrying its own gap.
      # - `"ModelMetaclass"` (2): the same collapse-to-metaclass shape as `"type"`
      #   above, on an unannotated `list`/`dict` literal of different pydantic model
      #   classes (`_RECON_MODELS`, `_TEMPLATE_MODELS`) — fixed with an explicit
      #   `list[type[pydantic.BaseModel]]` / `dict[str, type[pydantic.BaseModel]]`
      #   annotation.
      # - `Module has no attribute "engine"` (1): `sys.modules["tos_runtime"].engine
      #   = ...` (restoring a package attribute a cold-cache-eviction test popped)
      #   is dynamic module-attribute assignment mypy cannot model on `ModuleType` —
      #   switched to `setattr(sys.modules["tos_runtime"], "engine", ...)`, same
      #   runtime behavior, no attribute access for mypy to reject.
      #
      # `tos/tests/sci/test_sci_truthy_sentinel.py:48` was the one line flagged in
      # advance (§2.1's "not covered by" case, PR #747): `# type: ignore[index]` on
      # `member is type(member)[member.name]` covered a real `[index]` error (mypy
      # not knowing `type[object]` supports subscripting) while the SAME line's
      # `member.name` attr-defined error went uncovered, because the surrounding
      # three test functions all took `member: object`. Retyping the parameter to
      # `member: StrEnum` fixed the attr-defined AND, as a side effect, made mypy's
      # enum-aware handling of `type[StrEnum].__getitem__` type-check the subscript
      # too — so the `[index]` ignore became genuinely unused and was removed, not
      # merely widened to `[index, attr-defined]`. Confirmed by re-running with the
      # label removed: zero errors on that line, `unused-ignore` clean.
      #
      # Dead-suppression sweep (a zero-disable, whole-tree mypy run, not just this
      # PR's own touched files): baseline was 18 `# type: ignore[attr-defined]`
      # comments tree-wide (`git grep -c` against pre-PR `main`); 12 became
      # dead/removed by the root-cause fixes above (10 replaced by the
      # `call_wrapped_fixture()` consolidation losing their per-call-site ignore,
      # 2 in `test_evidence_required_covered.py`/`test_orthostate_composite.py`-
      # style `_ARTIFACTS` files whose `cls._REQUIRED_COVERED` / `cls.issue(...)`
      # ignores became unused once `cls` carried a real base type) — 6 remain, all
      # confirmed live by the same zero-disable sweep (zero `unused-ignore` hits
      # tree-wide): `test_slice_gaps.py:192` (`.fget` on a property descriptor
      # reached via the class, not an instance), `test_sci_records.py:85,87`
      # (`left`/`right: object` parameters deliberately kept untyped beyond
      # `.canonical_digest`), `test_stm_authority.py:85`, the new
      # `call_wrapped_fixture()` helper itself (documented above), and
      # `test_parity_and_resubmit.py:229` — none of these five pre-existing ones
      # were touched by this PR.
      #
      # Stage 3 (2026-09-23, docs/plans/2026-09-22-tos-test-tree-mypy-ratchet-
      # stage3-plan.md) enabled `arg-type`: 773 errors (499 kernel + 274
      # runtime) at plan time (main `29f39fe6`), closed across six PRs, each a
      # root-cause fix, never a per-line suppression:
      #   - #778 (`362b047b`, buckets E + B, 158): producer helpers annotated
      #     with their real return type instead of `object`; genuinely Optional
      #     values narrowed at the call site or via a non-Optional accessor on
      #     the producer, same discipline as stage 2's `issued_result`.
      #   - #782 (`782920f3`, bucket A, `test_brokercap_routing.py` alone, 96):
      #     the file the later A-shaped PRs pattern off of.
      #   - #783 (`d58b7d7a`, buckets A-fn + A-issue, 113): `dict` kwargs
      #     splats into keyword-only kernel predicates replaced by a test-side
      #     `TypedDict` matching the signature 1:1; `issue(**content)` calls
      #     pulled `scheme`/`status` out of the dict into explicit keywords.
      #   - #784 (`d1c56cf3`, buckets A-pyd + A-rt, 236): pydantic-model
      #     builders switched from dict-splat construction to
      #     `Model.model_validate({**base, **overrides})` (still validates, so
      #     an illegal override still raises) plus the same TypedDict treatment
      #     for runtime dataclass/class builders.
      #   - #786 (`7aba8a0d`, buckets D + C-prime + Z + residual E/B, 166, plus
      #     12 new runtime Protocol ports): test doubles fixed to satisfy their
      #     Protocol or concrete base (missing members added, or the double
      #     subclassed where the callee uses a wide surface); where a narrow
      #     surface was all a caller needed, a Protocol port was introduced in
      #     `tos_runtime` instead — one time service had accreted five
      #     different double shapes, which a port narrows rather than widens.
      #   - #785 (`70ca43a1`, kernel type hygiene): two defects this surfaced
      #     (a `_FileCustodyKwargs` TypedDict needed a required/optional split)
      #     fixed the same way, not suppressed.
      #   Rule enforced across all six: a call site exercising an illegal input
      #   keeps its `pytest.raises` and gets a `cast(...)` at the illegal
      #   value, never a `# type: ignore`; no Protocol member and no
      #   kernel/runtime signature was widened just to make a double or a
      #   builder fit.
      #   CI blind spot found while landing #786: the two TEST-tree steps below
      #   do not surface body errors inside `tos_runtime/src` reached via
      #   import from a runtime test — only the separate `mypy (tos runtime)`
      #   SOURCE step above does. That is why all four mypy steps in this job
      #   stay independent rather than collapsing a source check into the
      #   matching test-tree one.
      #   Deliberately left deferred: `no-untyped-def` only (parent plan §6 (1),
      #   an operator decision out of this stage's scope; `check_untyped_defs =
      #   true` already checks these bodies, so annotating them gains little
      #   detection power). `unused-ignore` was measured at 8 hits under this
      #   stage's new flags (5 kernel + 3 runtime, down from 187 under the old
      #   arg-type-still-deferred flags on the same tree) and enabled by
      #   docs/plans/2026-09-23-tos-test-tree-mypy-ratchet-final-unused-ignore-
      #   plan.md: all eight were dead `# type: ignore[no-untyped-def]` comments
      #   suppressing a code this job already disables, so the comments were
      #   deleted rather than the flag kept — CI's `warn_unused_ignores = true`
      #   declaration (`pyproject.toml`) now matches what the gate enforces.
      #
      # Two steps, never one: `mypy tos/tests tos/runtime/tests` in a single
      # invocation aborts with `Duplicate module named "tests"` and checks almost
      # nothing.
      - name: mypy (tos kernel tests)
        run: >-
          mypy tos/tests --ignore-missing-imports
          --disable-error-code=no-untyped-def

      - name: mypy (tos runtime tests)
        run: >-
          mypy tos/runtime/tests --ignore-missing-imports
          --disable-error-code=no-untyped-def

      - name: tos size budget
        # config/tos_size_budget.yaml exceptions register — Phase 1 작업 6.
        run: python tools/tos_size_budget.py --check

      # tos-spec/book.toml is a byte-empty file (0 bytes) — mdbook defaults apply
      # and the build was verified locally to succeed with them (homebrew mdbook
      # v0.5.4, same tag as pinned below): rc=0, two "unclosed HTML tag" warnings
      # + one "search index is very large" warning, none of which fail the build.
      # rust-lang/mdbook publishes no separate .sha256 asset for this release, so
      # the digest below is a locally-computed pin against the official GitHub
      # release tarball (same pattern as the yq pin above — download once, verify
      # forever), not an independently-published checksum.
      - name: Pin mdBook v0.5.4 (tos-spec build)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  /tmp/mdbook.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          sudo install -m 0755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version

      - name: mdBook build (tos-spec)
        run: mdbook build tos-spec --dest-dir /tmp/tos-spec-book

      # §12.2 (완료 계약 F-9): 코퍼스 무결성 검사기와 완료 계약 검사기를 CI 에
      # 편입한다 — Phase 1 로 미루면 Phase 0 산출물이 회귀 방어 없이 병합된다.
      # 두 검사기의 git-이력 파생(U-12 트리거·U-15 조상성·U-16 진 조상)은 얕은
      # 클론에서 전부 PROVENANCE_UNVERIFIABLE 로 떨어지므로 위 checkout 의
      # `fetch-depth: 0` 이 전제다 (§12.2 체크아웃 깊이 행).
      - name: tos-spec corpus integrity (tos_spec_status --check)
        run: python tools/tos_spec_status.py --check

      - name: phase0 completion contract checks (tos_completion_status --check)
        run: python tools/tos_completion_status.py --check

      # Layer 4 — Phase 0 완료 계약의 «자기참조 stale» 게이트.
      #
      # 별도 잡·별도 워크플로가 아니라 이 잡의 «스텝»이다: 별도 잡이면 브랜치
      # 보호의 필수 체크 «이름»이 하나 늘고, 이 아크의 통증이 바로 그 설정
      # 표면이다.  이 워크플로는 이미 경로 게이팅 없이 모든 PR·main push 에서
      # 돌므로(위 헤더 주석) 계약 문서만 고치는 PR 도 반드시 통과한다.
      #
      # 근거: 레인 B 재심 R-F3/R-F4 — 「규칙 신설 = 전수 적용까지가 한 단위」가
      # 이 아크에서 다섯 번 깨졌고, 그때마다 문서 내 «수동 census» 였다.
      # 산문 선언은 소비자가 없으면 산문이다(K-10).
      - name: Layer 4 — phase0 contract self-reference gate
        run: python tools/tos_contract_check.py

      # 검사기 자신이 «죽은 검사»가 아님을 매 실행 증명한다.  9차의
      # 「(4) 열거 7==7」 불변식이 세 자리 중 둘만 보고 green 을 낸 것이
      # addendum-5 A-F5 였다 — 통과하는 검사와 «지고 있는» 검사는 다르다.
      - name: Layer 4 self-test — mutation battery (dead-check 0)
        run: python tools/tos_contract_check.py --self-test

      # tos governance test batteries — these test the checker scripts run as
      # steps above (tools/tos_completion_status.py, tools/tos_contract_check.py,
      # tools/tos_spec_status.py, tools/tos_firewall_check.py) plus
      # tools/u17-verify.sh (needs the yq pin above) and the EV-L3 crash/restart
      # battery under tests/tos_l3/. They need no runtime stack (imports are
      # stdlib + pytest + pyyaml only — already installed above) and no Redis,
      # so they live here rather than in the legacy `test` job in
      # .github/workflows/test.yml, which is now path-gated away from tos/doc
      # changes and would otherwise be the only thing gating a tos-only PR.
      - name: tos governance test batteries
        run: |
          pytest tests/tools/test_tos_*.py tests/tools/test_u17_verify.py \
            tests/tos_l3 -q -p no:cacheprovider
