# tos import-firewall — enforcement layer ③ (design §3.3-③).
#
# Runs the full firewall on EVERY pull request and every push to main, with NO
# path gating: the checks are cheap and path-gating would leave an evasion gap
# (a PR that edits both tos/ and the gate could skip enforcement). Steps mirror
# the three enforcement layers:
#   1. python tools/tos_firewall_check.py  — layer ① (default-deny AST gate)
#   2. lint-imports                        — layer ② (transitive forbidden-pkg)
#   3. pytest tos/tests                     — hermetic package tests (§2.4)
#
# tos/runtime/ (design #40 D1.3, ratified by the operator 2026-09-08): the
# runtime-scope allowlist split lives INSIDE
# tools/tos_firewall_check.py's single forward scan (rules a-d apply the R1
# allowlist per-file via scope_for_tos_path) — layer ① above already covers
# BOTH tos/ scopes in its one invocation, no extra firewall step is added
# here. Only two things are new: installing the tos-runtime distribution
# editable (so lint-imports's static analysis can resolve `tos_runtime` as a
# root package for the transitive contracts in .importlinter, and so its own
# hermetic test suite is importable) and running that suite as its own step.
#
# NOTE: marking this job a *required* check is a GitHub branch-protection
# setting and is NOT configured here — see the handoff report.
name: tos-firewall

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tos-firewall:
    runs-on: ubuntu-latest
    # 10 → 30: the tos governance test batteries (last step) took ~6.5 min
    # locally (subprocess-heavy git-repo fixtures in test_u17_verify.py and
    # tests/tos_l3); with the firewall + checker steps that already ran here
    # the old 10-minute backstop would name the batteries as "hung" on a slow
    # hosted runner. Still a hard fail-fast, just sized to the job's new content.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # **전체 이력이 필요하다** — 아래 Layer 4 검사기의 `C2UP`(측정 출처 검증)은
          # 래칫 기준선이 기록한 커밋에서 `git show <commit>:<path>` 로 blob 을 **다시
          # 재어** 기준선이 그 내용에서 나왔음을 확인한다.  기본 `fetch-depth: 1` 은
          # 얕은 클론이라 그 커밋이 없고, 검사기는 재측정 실패를 **fail-closed** 로
          # 처분한다(rc=128 → `TOS-CC-C2UP` red).
          #
          # 에라타 32차가 `--full-history` lockstep 을 하네스·정본 블록·live sha 핀에
          # 걸쳐 이행했으나 **검사기를 «실행하는» 이 체크아웃에는 닿지 않았다.**
          # 로컬은 전체 이력을 갖고 있어 영원히 green 이었고, 게이트가 CI 에서 처음
          # 실행된 PR #637 에서야 관측됐다 — `tos-gate.yml` 은 같은 이유로 이미
          # `fetch-depth: 0` 이다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal dependencies
        # Deliberately minimal — the heavy runtime stack (talib/mlflow/...) is
        # NOT needed:
        #   * tos + its 4 pinned third parties + pytest/hypothesis, via the
        #     tos package's own [test] extra.
        #   * import-linter (+ grimp) for layer ②.
        #   * the repo-root package installed with --no-deps so grimp can LOCATE
        #     shared/services/cli (it analyses them statically via AST and never
        #     executes them, so their runtime deps are unnecessary).
        run: |
          python -m pip install --upgrade pip
          pip install -e "./tos[test]"
          # tos-runtime (design #40 D1.3 item 5, ratified by the operator 2026-09-08) — installed AFTER
          # the kernel above, editable, with --no-deps. Reproduced 2026-09-08
          # (independent review finding, MEDIUM) in a throwaway venv: WITHOUT
          # --no-deps, `pip install -e "./tos/runtime[test]"` resolves
          # tos/runtime/pyproject.toml's `tos @ {root:uri}/../` dependency
          # itself, which pip treats as "(re)install this requirement" —
          # SILENTLY REPLACING the kernel's editable install from the step
          # above with a non-editable, built wheel (`pip list --editable`
          # afterward showed `tos-runtime` only, `tos` gone). --no-deps skips
          # that resolution entirely, so the kernel's prior editable install
          # is left untouched (`pip list --editable` then shows BOTH `tos`
          # and `tos-runtime`, verified in the same throwaway-venv
          # reproduction). The `[test]` extra (pytest/hypothesis) is NOT
          # requested here — it is not needed: both are already installed,
          # pinned to the SAME versions, by the kernel's own `[test]` extra
          # one line above (verified: `pytest tos/runtime/tests` imports and
          # runs cleanly with no separate test-extra install).
          pip install -e "./tos/runtime" --no-deps
          pip install import-linter
          pip install -e . --no-deps
          # Layer 4 의 RULE 축은 S-25 manifest(YAML)를 읽는다.  루트 프로젝트는
          # `pyyaml>=6.0` 를 의존으로 선언하지만 위 설치는 `--no-deps` 라 딸려오지
          # 않는다.  **부재 시 검사기는 조용히 건너뛰지 않고 `TOS-CC-RULE-MANIFEST`
          # 로 red 를 낸다**(fail-closed) — 그래서 여기서 명시 설치한다.
          # (`tos` 패키지의 §3.2 서드파티 allowlist 와는 무관하다 — `tools/` 의
          #  저장소 도구가 쓰는 것이지 `tos` 패키지가 임포트하는 것이 아니다.)
          pip install "pyyaml>=6.0"
          # Black/mypy — Phase 1 작업 7 (계획 §2 표 7행). 로컬 .venv 와 정확히
          # 같은 버전으로 핀 — CI 만 다른 버전에서 다른 판정을 내는 것을 막는다.
          pip install "black==26.5.1" "mypy==2.3.1"

      - name: Pin mikefarah yq v4.48.1 (WFCANON M-4 parser gate)
        # tools/wfcanon-v222.py [M-4] pins the judgment parser to
        # `yq (mikefarah) v4.48.x` (YQ_FLAVOR/YQ_MAJMIN) and fails closed
        # (WF-P0 PREVENTION_UNVERIFIABLE) on any other version. ubuntu-latest
        # preinstalls a newer yq at /usr/bin/yq, and
        # tests/tools/test_u17_verify.py::_run_script drives tools/u17-verify.sh
        # (which shells out to wfcanon-v222.py) under a from-scratch,
        # non-inherited env with a literal PATH where /usr/bin is FIRST — so
        # the pin must overwrite /usr/bin/yq itself (installing to
        # /usr/local/bin would be shadowed). Condensed from the identical
        # rationale in .github/workflows/test.yml (source of this step, now
        # moved here with tests/tools/test_u17_verify.py — see below).
        run: |
          set -euo pipefail
          curl -sL -o /tmp/yq_linux_amd64 \
            https://github.com/mikefarah/yq/releases/download/v4.48.1/yq_linux_amd64
          echo "99df6047f5b577a9d25f969f7c3823ada3488de2e2115b30a0abb10d9324fd9f  /tmp/yq_linux_amd64" | sha256sum -c -
          sudo install -m 0755 /tmp/yq_linux_amd64 /usr/bin/yq
          yq --version

      - name: Layer 1 — custom AST firewall (default-deny)
        run: python tools/tos_firewall_check.py

      - name: Layer 2 — import-linter (transitive forbidden-package defense)
        run: lint-imports

      - name: tos hermetic package tests
        run: pytest tos/tests

      # design #40 D1.3 item 5 (ratified by the operator 2026-09-08) — the runtime shell's own hermetic
      # suite (D1.4: zero external network/ambient env/writes outside
      # tmp_path — tos/runtime/tests/conftest.py's autouse socket guard).
      # Isolated rootdir via tos/runtime/pyproject.toml's own
      # [tool.pytest.ini_options], same pattern as the kernel step above.
      - name: tos-runtime hermetic package tests
        run: pytest tos/runtime/tests

      # Phase 1 작업 7 (계획 §2 표 7행) — 같은 잡의 스텝으로 추가한다(필수 체크
      # 이름을 늘리지 않는다는 위 헤더 규율). Black/mypy 는 `cd tos` 로 실행해
      # 로컬 검증(§1 기준선 측정 명령)과 정확히 동일한 호출을 재현한다 — mypy 는
      # `tos/pyproject.toml` 에 `[tool.mypy]` 섹션이 없어 상위로 올라가 루트
      # `pyproject.toml` 을 읽는다(로컬 실행 시
      # "../pyproject.toml: note: unused section(s)" 로 실측 확인).
      - name: Black (tos)
        run: black --check tos/src tos/tests

      - name: mypy (tos kernel)
        run: cd tos && mypy src --ignore-missing-imports

      # tos/src/tos/py.typed (PEP 561 marker, added alongside this step) makes
      # the kernel's own types visible to this check instead of resolving as
      # `Any` — without it, every tos_runtime call into a kernel function/
      # predicate/artifact silently typed as `Any`, masking real errors here.
      - name: mypy (tos runtime)
        run: mypy tos/runtime/src --ignore-missing-imports

      - name: tos size budget
        # config/tos_size_budget.yaml exceptions register — Phase 1 작업 6.
        run: python tools/tos_size_budget.py --check

      # tos-spec/book.toml is a byte-empty file (0 bytes) — mdbook defaults apply
      # and the build was verified locally to succeed with them (homebrew mdbook
      # v0.5.4, same tag as pinned below): rc=0, two "unclosed HTML tag" warnings
      # + one "search index is very large" warning, none of which fail the build.
      # rust-lang/mdbook publishes no separate .sha256 asset for this release, so
      # the digest below is a locally-computed pin against the official GitHub
      # release tarball (same pattern as the yq pin above — download once, verify
      # forever), not an independently-published checksum.
      - name: Pin mdBook v0.5.4 (tos-spec build)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  /tmp/mdbook.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          sudo install -m 0755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version

      - name: mdBook build (tos-spec)
        run: mdbook build tos-spec --dest-dir /tmp/tos-spec-book

      # §12.2 (완료 계약 F-9): 코퍼스 무결성 검사기와 완료 계약 검사기를 CI 에
      # 편입한다 — Phase 1 로 미루면 Phase 0 산출물이 회귀 방어 없이 병합된다.
      # 두 검사기의 git-이력 파생(U-12 트리거·U-15 조상성·U-16 진 조상)은 얕은
      # 클론에서 전부 PROVENANCE_UNVERIFIABLE 로 떨어지므로 위 checkout 의
      # `fetch-depth: 0` 이 전제다 (§12.2 체크아웃 깊이 행).
      - name: tos-spec corpus integrity (tos_spec_status --check)
        run: python tools/tos_spec_status.py --check

      - name: phase0 completion contract checks (tos_completion_status --check)
        run: python tools/tos_completion_status.py --check

      # Layer 4 — Phase 0 완료 계약의 «자기참조 stale» 게이트.
      #
      # 별도 잡·별도 워크플로가 아니라 이 잡의 «스텝»이다: 별도 잡이면 브랜치
      # 보호의 필수 체크 «이름»이 하나 늘고, 이 아크의 통증이 바로 그 설정
      # 표면이다.  이 워크플로는 이미 경로 게이팅 없이 모든 PR·main push 에서
      # 돌므로(위 헤더 주석) 계약 문서만 고치는 PR 도 반드시 통과한다.
      #
      # 근거: 레인 B 재심 R-F3/R-F4 — 「규칙 신설 = 전수 적용까지가 한 단위」가
      # 이 아크에서 다섯 번 깨졌고, 그때마다 문서 내 «수동 census» 였다.
      # 산문 선언은 소비자가 없으면 산문이다(K-10).
      - name: Layer 4 — phase0 contract self-reference gate
        run: python tools/tos_contract_check.py

      # 검사기 자신이 «죽은 검사»가 아님을 매 실행 증명한다.  9차의
      # 「(4) 열거 7==7」 불변식이 세 자리 중 둘만 보고 green 을 낸 것이
      # addendum-5 A-F5 였다 — 통과하는 검사와 «지고 있는» 검사는 다르다.
      - name: Layer 4 self-test — mutation battery (dead-check 0)
        run: python tools/tos_contract_check.py --self-test

      # tos governance test batteries — these test the checker scripts run as
      # steps above (tools/tos_completion_status.py, tools/tos_contract_check.py,
      # tools/tos_spec_status.py, tools/tos_firewall_check.py) plus
      # tools/u17-verify.sh (needs the yq pin above) and the EV-L3 crash/restart
      # battery under tests/tos_l3/. They need no runtime stack (imports are
      # stdlib + pytest + pyyaml only — already installed above) and no Redis,
      # so they live here rather than in the legacy `test` job in
      # .github/workflows/test.yml, which is now path-gated away from tos/doc
      # changes and would otherwise be the only thing gating a tos-only PR.
      - name: tos governance test batteries
        run: |
          pytest tests/tools/test_tos_*.py tests/tools/test_u17_verify.py \
            tests/tos_l3 -q -p no:cacheprovider
