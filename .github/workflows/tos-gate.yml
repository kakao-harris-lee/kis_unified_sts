# tos-gate — the check name the repository ruleset (id 21886181) requires.
#
# 2026-11-12 (docs/plans/2026-11-12-phase0-retirement-plan.md §2): this job used
# to run `tools/tos_entry_harness.sh`, the U-15 pre-D0-A entry harness of the
# Phase-0 completion contract. The contract, its index tool and its checkers
# were retired with that plan — Phase 0 closed on 2026-10-22 (#920) and the
# completion criterion is now `TOS_PAPER_READY`.
#
# THE FILE IS NOT DELETED AND THE JOB IS NOT RENAMED. `tos-gate` is a required
# check in the ruleset, so removing it would leave every PR waiting forever on
# a check that never arrives. The name stays and the content becomes a LIVE
# gate: `tools/tos_redigest.py --check` re-derives `release.yaml`'s
# `expected_code_digest` from the two installed package roots and fails if any
# tenant tree's pin is stale — the pin whose staleness ABORTs the resident
# paper session at the next 08:45 (PR #814). It also runs as a step in
# `tos-firewall`; running it here too is deliberate, so the required check
# means something on its own rather than being a tautology.
name: tos-gate
on: [pull_request]
permissions:
  contents: read
jobs:
  tos-gate:
    name: tos-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Default depth (shallow). The harness this replaced derived ancestry
        # from git history and needed `fetch-depth: 0`; `tos_redigest --check`
        # reads only the working tree.
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install the two source distributions
        # `tos_redigest` never reimplements the digest: it shells out to the
        # runtime's own `print-digests` CLI, so both packages must import. Same
        # install discipline as tos-firewall's `install` anchor — kernel first
        # with its pinned third parties, then the runtime with --no-deps so pip
        # does not silently replace the kernel's editable install.
        run: |
          python -m pip install --upgrade pip
          pip install -e "./tos"
          pip install -e "./tos/runtime" --no-deps
      - name: expected_code_digest is current (tos_redigest --check)
        run: python tools/tos_redigest.py --check
