# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run performance tests weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard backstop: a hung test (e.g. a blocking Redis read on an empty stream
    # under xdist) must not stall the job for the 6h default. With the per-test
    # --timeout below this should rarely be hit, but it guarantees fail-fast.
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history — tests/tools/test_u17_verify.py::* and other
          # tests/tools ancestry-derivation checkers (U-12/U-15/U-16-class:
          # `git show <commit>:<path>` blob re-measurement, parent-commit
          # provenance) fail-closed to PROVENANCE_UNVERIFIABLE under the
          # default `fetch-depth: 1` shallow clone — see the identical
          # rationale + real-CI-observed failure at
          # .github/workflows/tos-firewall.yml:28-40 (PR #637/#638).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install prometheus-client

      - name: Pin mikefarah yq v4.48.1 (WFCANON M-4 parser gate)
        # tools/wfcanon-v222.py [M-4] pins the judgment parser to
        # `yq (mikefarah) v4.48.x` (YQ_FLAVOR/YQ_MAJMIN) and fails closed
        # (WF-P0 PREVENTION_UNVERIFIABLE) on any other version — including
        # a newer mikefarah release — so it never silently trusts an
        # unpinned parser on an arbitrary PATH. ubuntu-latest preinstalls a
        # newer yq (v4.53.6 as of this writing) at /usr/bin/yq
        # (github/actions/runner-images images/ubuntu/scripts/build/install-yq.sh
        # installs to /usr/bin/yq).
        #
        # tests/tools/test_u17_verify.py::_run_script drives tools/u17-verify.sh
        # (which shells out to wfcanon-v222.py) under a from-scratch,
        # non-inherited env with a literal PATH:
        #   /usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin
        # `/usr/bin` is FIRST in that literal, `/usr/local/bin` LAST — so
        # installing the pin to /usr/local/bin (the naive choice, since it's
        # the conventional "override the system copy" location) would be
        # shadowed by the preinstalled /usr/bin/yq for this test's subprocess
        # and the fix would silently no-op. The pin must overwrite
        # /usr/bin/yq itself. Nothing on the runner's real job PATH (used by
        # any other in-job "yq" lookup) installs a yq ahead of /usr/bin
        # either, so this one install satisfies both call sites.
        run: |
          set -euo pipefail
          curl -sL -o /tmp/yq_linux_amd64 \
            https://github.com/mikefarah/yq/releases/download/v4.48.1/yq_linux_amd64
          # sha256 of the raw `yq_linux_amd64` binary (not the .tar.gz), taken
          # from the `SHA256 (yq_linux_amd64) = ...` line of the release's
          # checksums-bsd file:
          # https://github.com/mikefarah/yq/releases/download/v4.48.1/checksums-bsd
          echo "99df6047f5b577a9d25f969f7c3823ada3488de2e2115b30a0abb10d9324fd9f  /tmp/yq_linux_amd64" | sha256sum -c -
          sudo install -m 0755 /tmp/yq_linux_amd64 /usr/bin/yq
          yq --version

      - name: Run tests
        # Two passes:
        #  1. Parallel (pytest-xdist `-n auto`) over everything NOT marked
        #     `serial` — the bulk of the suite, ~3-4x faster than serial.
        #  2. Serial over `serial`-marked tests (timing- or shared-external-
        #     state-sensitive: real Redis DB 1 keys, uncontended wall-clock
        #     assertions — see the `serial` marker in pyproject.toml). Running
        #     them with no concurrent workers removes the cross-worker races.
        # `&&` fails the step if the parallel pass fails; coverage from the
        # parallel pass is appended to by the serial pass before reporting.
        # tests/performance/ is excluded here; the dedicated `performance` job
        # below runs it with its own Redis isolation and regression baseline.
        #
        # --timeout=180 --timeout-method=thread: if any single test exceeds 180s
        # (no legit test runs that long), pytest-timeout dumps all thread stacks
        # and fails — NAMING the hung test instead of stalling the job. `thread`
        # is the xdist-safe method (works inside parallel workers).
        run: |
          pytest tests/ --ignore=tests/performance -n auto -m "not serial" \
            --timeout=180 --timeout-method=thread \
            -q --cov=shared --cov=services --cov-report= && \
          pytest tests/ --ignore=tests/performance -m serial \
            --timeout=180 --timeout-method=thread \
            -q --cov=shared --cov=services --cov-append \
            --cov-report=xml --cov-report=term-missing
        env:
          REDIS_URL: redis://localhost:6379/1
          ENVIRONMENT: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install ruff black

      - name: Run ruff
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Check formatting with black
        run: black --check --diff .
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy types-redis types-requests

      - name: Run mypy
        run: mypy shared/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  backtest-extra:
    # Advisory (non-gating): verifies the optional vectorbt stack (.[backtest],
    # WS-A4/P3 vectorbt engine work) still resolves and imports alongside the
    # runtime deps. Heavy transitive deps (numba/plotly) stay out of the
    # gating `test` job on purpose.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backtest extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtest]"

      - name: Import smoke
        run: |
          python -c "import talib; import vectorbt; print('vectorbt', vectorbt.__version__)"

      - name: Vectorbt parity suites (P3-a/b/d + engine selector)
        run: |
          pytest tests/unit/backtest/test_vbt_runner.py \
            tests/unit/backtest/test_vbt_harness_runner.py \
            tests/unit/backtest/test_harness_engine.py -q

  performance:
    runs-on: ubuntu-latest
    # Run on PRs to main and weekly schedule
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.base_ref == 'main')

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install prometheus-client pytest-json-report

      - name: Run performance tests
        run: |
          pytest tests/performance/ -v -s --json-report --json-report-file=tests/performance/current.json
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: Check for performance regressions
        # Thresholds tuned for shared GitHub-hosted runner variance: only a
        # >=2x slowdown fails the build; 1.5x-2x is an informational warning
        # (non-fatal); tests under 50ms are exempt (their wall-clock ratios are
        # noise-dominated). Baseline is regenerated on ubuntu-latest hardware.
        run: |
          python scripts/performance/check_regression.py \
            --baseline tests/performance/baselines.json \
            --current tests/performance/current.json \
            --warning-threshold 1.5 \
            --error-threshold 2.0 \
            --min-duration 0.05
        continue-on-error: false

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: tests/performance/current.json
          retention-days: 30
