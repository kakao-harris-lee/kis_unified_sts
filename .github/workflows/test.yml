# .github/workflows/test.yml
name: Tests

# Path filter below (push + pull_request only — schedule is unaffected and
# always runs the full weekly performance sweep): the tos governance test
# batteries (tests/tools/test_tos_*.py, tests/tools/test_u17_verify.py,
# tests/tos_l3/) moved to .github/workflows/tos-firewall.yml, which already
# runs on every PR/push with no path gating. This job carries the heavy
# runtime stack (Redis service, full `.[dev]` install, ~25min) and gates
# nothing tos-specific, so a PR that only touches tos/tos-spec/docs/config
# no longer needs to pay for it.
#
# Why `paths` with `!` and not `paths-ignore`: one directory inside an
# otherwise-excluded tree must still run this job, and `paths` and
# `paths-ignore` cannot both filter one event. Every former `paths-ignore`
# entry is carried over verbatim as a `!` pattern, so the exclusion set is
# unchanged; the final positive line re-includes the one directory.
#
# GitHub semantics this relies on, quoted from
# github/docs content/actions/reference/workflows-and-actions/workflow-syntax.md
# ("Patterns to match file paths" table) and
# content/actions/how-tos/write-workflows/choose-when-workflows-run/
# trigger-a-workflow.md ("Example: Including and excluding paths"):
#   - "The `**` wildcard matches any character including slash (`/`). This is
#     the default behavior when you don't use a `path` filter."  ← so the
#     leading '**' is exactly today's unfiltered reach, dotfiles included.
#   - "Patterns are checked sequentially. A pattern that negates a previous
#     pattern will re-include file paths."  ← so the last line wins over the
#     '!tos/**' above it, and ORDER IS LOAD-BEARING: the re-include must stay
#     last.
#   - "If you define a path with the `!` character, you must also define at
#     least one path without the `!` character."  ← the leading '**'.
#   - "You cannot use both the `paths` and `paths-ignore` filters for the same
#     event in a workflow."
#
# The re-included directory holds the operator-projection contract fixtures,
# which `tests/unit/dashboard/test_tos_projection.py` asserts against the
# dashboard DTO. tos-firewall's own fixture test cannot stand in for that: it
# injects the fixture's own groups as the projection's readers, and
# `OperatorProjection.build` does not validate reader return values, so group
# content there is a pure echo (measured: deleting
# `protective_classification_digest` from the fixture leaves tos-firewall
# green). Without the re-include a fixture-only PR is tos-only, skips this
# job, and ships a fixture that contradicts the DTO.
on:
  push:
    branches: [main, develop]
    paths: &paths
      # Everything, i.e. this job's reach before any filter existed.
      - '**'
      # The former paths-ignore set, carried over verbatim as negations.
      - '!tos/**'
      - '!tos-spec/**'
      - '!tos-evidence/**'
      - '!docs/**'
      - '!**.md'
      - '!.claude/**'
      - '!config/tos_completion.yaml'
      - '!tools/tos_*'
      - '!tools/u17-verify.sh'
      - '!tools/wfcanon-v222.py'
      - '!tests/tools/test_tos_*'
      - '!tests/tools/test_u17_verify.py'
      - '!tests/tos_l3/**'
      - '!.github/workflows/tos-*.yml'
      # MUST STAY LAST — patterns are checked sequentially and the last match
      # wins, so this re-include only beats '!tos/**' while it is below it.
      - 'tos/runtime/tests/fixtures/**'
  pull_request:
    branches: [main]
    paths: *paths
  schedule:
    # Run performance tests weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  # ===========================================================================
  # The suite, split three ways across runners (2026-10-22).
  #
  # Measured on run 39619902863 (push to main, green): the old single `test`
  # job took 973s, 874s of which was ONE step running two pytest passes back to
  # back — the parallel pass 667s (≈80s of per-worker collection over 11,540
  # tests, then ≈588s of execution on 4 workers) and the serial pass 204s. The
  # two passes have no data dependency: the second one re-collects the same
  # tree and runs a disjoint set of tests (`-m serial` vs `-m "not serial"`).
  #
  # So: the parallel pass is sharded across two runners, and the serial pass is
  # a third job beside them. The partition is exact, by construction, in both
  # directions, which matters more here than the balance:
  #   * marker axis — `-m "not serial"` ∪ `-m serial` is every collected test,
  #     with no third bucket to forget.
  #   * path axis   — shard `a` runs exactly `SHARD_A_PATHS`; shard `b` runs
  #     `tests/` with each of those SAME paths passed as `--ignore`. One list,
  #     read twice, so the two halves cannot drift apart as directories are
  #     added: a new test directory is in neither list, therefore in shard b.
  #     A directory that is renamed or deleted makes shard `a` exit 4 with
  #     "file or directory not found" — loud, not silent.
  # The balance is by measured time, not file count, and is the only part of
  # this that is a judgement call; re-tune SHARD_A_PATHS from a run's job
  # durations if the two halves drift apart.
  # ===========================================================================
  test-shard:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 coreutils `timeout` exits 124 not 143 when SIGTERMed (bootproof stop path, see #967)
    # Hard backstop: a hung test (e.g. a blocking Redis read on an empty stream
    # under xdist) must not stall the job for the 6h default. With the per-test
    # --timeout below this should rarely be hit, but it guarantees fail-fast.
    # 25 -> 20: each shard now carries about half the old job's work.
    timeout-minutes: 20

    strategy:
      # One shard failing must not cancel the other: a red CI that shows only
      # half the failures costs a whole extra round trip to see the rest.
      fail-fast: false
      matrix:
        include:
          # `dist` is per shard and is NOT a style choice — see the measurement
          # in the step below. Shard a is long-tailed and wants work stealing;
          # shard b is ~9,900 mostly-sub-second tests, the shape where the
          # stealing round-trips can cost more than the idling they remove.
          - shard: a
            dist: worksteal
          - shard: b
            dist: load

    env:
      # THE shard boundary. Shard a runs these paths; shard b runs `tests/`
      # with each of them --ignore'd.
      #
      # Balanced on MEASURED TIME, from a local `--durations=0` profile of this
      # exact parallel pass (11,416 passed, 1,075s of summed call+setup+teardown
      # across 34,378 phase records). Balancing on test count would have been
      # worthless here, and that is the whole reason this is one line and not a
      # tidy half-the-alphabet split:
      #
      #   tests/tools            1,561 tests    637.9s   59.3% of the time
      #   tests/unit             9,569 tests    366.0s   34.0%
      #   tests/integration        187 tests     71.0s    6.6%
      #   everything else           ~30 tests      0.2s    0.0%
      #
      # i.e. 14% of the tests are 59% of the time, and the 83% of tests under
      # tests/unit are 34% of it.
      #
      # One FILE, tests/tools/test_cp3_bootproof.py, is 558.3s of that 637.9s,
      # and one test inside it (`test_red_a_sigkilled_runner_still_leaves_the_
      # child_a_deadline`) is 136.1s on its own — these are deadline/retry
      # tests that wait on the wall clock rather than burn CPU. So `tests/tools`
      # alone is one half of the work (637.9s) and everything else is the other
      # (437.2s) — the closest two-way cut any whole-directory split can make.
      #
      # Checked, not assumed, that the cut is a partition: collecting shard a,
      # shard b and the unsharded command gave 1,561 + 9,917 = 11,478 tests in
      # 25 + 711 = 736 files, with 0 files in both, 0 files in neither, and 0
      # per-file count mismatches.
      #
      # Re-tune from the two shards' job durations if they drift apart; the
      # correctness of the split does not depend on this list being right, only
      # its usefulness does.
      SHARD_A_PATHS: >-
        tests/tools

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - &checkout
        name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history — tests/tools/test_u17_verify.py::* and other
          # tests/tools ancestry-derivation checkers (U-12/U-15/U-16-class:
          # `git show <commit>:<path>` blob re-measurement, parent-commit
          # provenance) fail-closed to PROVENANCE_UNVERIFIABLE under the
          # default `fetch-depth: 1` shallow clone — see the identical
          # rationale + real-CI-observed failure at
          # .github/workflows/tos-firewall.yml (PR #637/#638).
          fetch-depth: 0

      - &setup-python
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # pip's HTTP/wheel cache, keyed by setup-python on the hash of the
          # dependency files it finds (pyproject.toml). Verified hitting on
          # run 39619902863: "Cache hit occurred on the primary key
          # setup-python-Linux-x64-24.04-Ubuntu-python-3.11.17-pip-15b9a55…".
          cache: 'pip'

      - &install
        name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install prometheus-client

      - name: Run tests (parallel pass — shard ${{ matrix.shard }})
        # Pass 1 of 2 for the suite as a whole: everything NOT marked `serial`,
        # under pytest-xdist `-n auto`. Pass 2 is the `test-serial` job below,
        # which now runs AT THE SAME TIME as these two instead of after them.
        #
        # tests/performance/ is excluded here; the dedicated `performance` job
        # below runs it with its own Redis isolation and regression baseline.
        #
        # tests/tools/test_tos_*.py, tests/tools/test_u17_verify.py, and
        # tests/tos_l3/ are also excluded — they moved to the
        # tos-firewall.yml `tos-firewall-tests` job (no runtime stack needed,
        # no path gating there) so this path-gated, runtime-heavy job doesn't
        # also run them. The `--ignore` flags below are what keep them out,
        # and they are load-bearing, not belt-and-braces: the `on.paths`
        # filter at the top of this file excludes tos with `!tos/**` but
        # re-includes `tos/runtime/tests/fixtures/**` on its last line, so a
        # fixture-only tos PR DOES run this job — and every PR touching both
        # tos/ and non-excluded paths always did.
        #
        # --timeout=180 --timeout-method=thread: if any single test exceeds 180s
        # (no legit test runs that long), pytest-timeout dumps all thread stacks
        # and fails — NAMING the hung test instead of stalling the job. `thread`
        # is the xdist-safe method (works inside parallel workers). NOTE the
        # headroom here is thinner than it looks: the slowest single test in
        # this pass, tests/tools/test_cp3_bootproof.py::test_red_a_sigkilled_
        # runner_still_leaves_the_child_a_deadline, measures 136s.
        #
        # `--cov-report=term-missing` is gone (it was on the old single job):
        # a per-shard terminal report lists everything the OTHER shard covers
        # as missing, which is worse than no report. The xml goes to Codecov,
        # which merges the three partial reports into the real one.
        #
        # --dist (matrix.dist): xdist's default `load` hands each worker a chunk
        # of the queue up front, so the worker that draws a 136s sleeper finishes
        # long after the other three have gone idle. That is not a work problem,
        # it is a scheduling tail, and it is measurable: on this tree, at -n 4,
        #
        #   tests/tools, --dist load        425s   (re-measured 426s — stable)
        #   tests/tools, --dist worksteal   239s   (-44%)
        #   bootproof alone                 168s   } 226s if the two halves
        #   tests/tools minus bootproof      58s   } could overlap perfectly
        #
        # i.e. `load` was spending 200s idling and `worksteal` recovers nearly
        # all of it. Shard b keeps `load` on purpose: the one A/B that pointed
        # the other way was a ~990-test battery of mostly short tests where
        # worksteal measured SLOWER, and shard b is that shape at ten times the
        # size. Flag applied where it was measured, not everywhere.
        run: |
          set -euo pipefail
          if [ "${{ matrix.shard }}" = "a" ]; then
            TARGETS="$SHARD_A_PATHS"
            SHARD_IGNORES=""
          else
            TARGETS="tests/"
            SHARD_IGNORES=""
            for p in $SHARD_A_PATHS; do
              SHARD_IGNORES="$SHARD_IGNORES --ignore=$p"
            done
          fi
          echo "shard ${{ matrix.shard }} targets: $TARGETS"
          echo "shard ${{ matrix.shard }} ignores: $SHARD_IGNORES"
          # shellcheck disable=SC2086  # word splitting is the point here
          pytest $TARGETS $SHARD_IGNORES \
            --ignore=tests/performance \
            --ignore-glob='tests/tools/test_tos_*.py' \
            --ignore=tests/tools/test_u17_verify.py \
            --ignore=tests/tos_l3 \
            -n auto --dist ${{ matrix.dist }} -m "not serial" \
            --timeout=180 --timeout-method=thread \
            -q --cov=shared --cov=services --cov-report=xml
        env:
          REDIS_URL: redis://localhost:6379/1
          ENVIRONMENT: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          # Distinct per upload so Codecov merges the three partial reports
          # (two shards + the serial job) for one commit instead of treating a
          # later one as a replacement.
          name: codecov-shard-${{ matrix.shard }}
          fail_ci_if_error: false

  # ===========================================================================
  # Pass 2: the `serial`-marked tests, with no concurrent worker to race them.
  # Was the second half of the old `test` job's one step (204s of its 874s).
  # ===========================================================================
  test-serial:
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 coreutils `timeout` exits 124 not 143 when SIGTERMed (bootproof stop path, see #967)
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - *checkout
      - *setup-python
      - *install

      - name: Run tests (serial pass)
        # `serial`-marked tests are timing- or shared-external-state-sensitive
        # (real Redis DB 1 keys, uncontended wall-clock assertions — see the
        # `serial` marker in pyproject.toml). Running them with no concurrent
        # workers removes the cross-worker races; running them in their OWN JOB
        # additionally gives them a Redis service container that no parallel
        # pass has been writing to, which is strictly more isolation than the
        # old same-job second pass had.
        #
        # The whole tree is the target (no shard paths): the marker is the
        # partition here, and restricting the paths as well would make a
        # newly-marked serial test outside the listed directories silently
        # stop running.
        #
        # The ignores mirror the parallel pass exactly, for the same reasons.
        run: |
          pytest tests/ \
            --ignore=tests/performance \
            --ignore-glob='tests/tools/test_tos_*.py' \
            --ignore=tests/tools/test_u17_verify.py \
            --ignore=tests/tos_l3 \
            -m serial \
            --timeout=180 --timeout-method=thread \
            -q --cov=shared --cov=services --cov-report=xml
        env:
          REDIS_URL: redis://localhost:6379/1
          ENVIRONMENT: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          name: codecov-serial
          fail_ci_if_error: false

  # ===========================================================================
  # The check context that means "the suite passed". Same role (and the same
  # fail-closed shape) as the `tos-firewall` aggregator: splitting the work
  # across runners must not split the NAME that says the work passed.
  # ===========================================================================
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 coreutils `timeout` exits 124 not 143 when SIGTERMed (bootproof stop path, see #967)
    needs: [test-shard, test-serial]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Every test job must have succeeded
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a test job did not succeed ($results)"
              exit 1
            fi
          done
          echo "all test jobs succeeded"

  lint:
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 coreutils `timeout` exits 124 not 143 when SIGTERMed (bootproof stop path, see #967)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No `cache: 'pip'` here on purpose: this job installs exactly one wheel
      # (black) and the install step measures 2s, less than the cache restore
      # it would add. Every job below that installs the dependency tree does
      # have it.
      - name: Install linters
        run: |
          pip install black

      # ruff moved to .github/workflows/ruff.yml (2026-09-06 operator decision
      # 2a): that workflow has no path gating so it can be a required check.
      # black/mypy stay advisory (continue-on-error) because the formatting/
      # typing debt (~400 files / ~650 errors) is tracked separately.
      - name: Check formatting with black
        run: black --check --diff .
        continue-on-error: true

  type-check:
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 coreutils `timeout` exits 124 not 143 when SIGTERMed (bootproof stop path, see #967)
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy types-redis types-requests

      - name: Run mypy
        run: mypy shared/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  backtest-extra:
    # Advisory (non-gating): verifies the optional vectorbt stack (.[backtest],
    # WS-A4/P3 vectorbt engine work) still resolves and imports alongside the
    # runtime deps. Heavy transitive deps (numba/plotly) stay out of the
    # gating `test` job on purpose.
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 coreutils `timeout` exits 124 not 143 when SIGTERMed (bootproof stop path, see #967)
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backtest extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtest]"

      - name: Import smoke
        run: |
          python -c "import talib; import vectorbt; print('vectorbt', vectorbt.__version__)"

      - name: Vectorbt parity suites (P3-a/b/d + engine selector)
        run: |
          pytest tests/unit/backtest/test_vbt_runner.py \
            tests/unit/backtest/test_vbt_harness_runner.py \
            tests/unit/backtest/test_harness_engine.py -q

  performance:
    runs-on: ubuntu-24.04  # pinned: ubuntu-26.04 coreutils `timeout` exits 124 not 143 when SIGTERMed (bootproof stop path, see #967)
    # Run on PRs to main and weekly schedule
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    # Backstop so a hung round cannot burn the 6h default. Measured on run
    # 36953158113: the whole 5-round loop takes ~8s (round 1 ~3.1s cold, rounds
    # 2-5 ~1.3s each), and the job end to end takes 92s including install.
    timeout-minutes: 20

    env:
      # Each benchmark is measured PERF_ROUNDS times and the MEDIAN is compared,
      # because one sample of this suite is not a measurement: re-running the
      # job 10x on a fixed head gave test_entry_path_100_symbols a 3.1x spread
      # (min 0.1217s / median 0.2755s / max 0.3800s) and 3 reds with identical
      # code (#768). Almost all of that spread is the cold first round's setup
      # phase, which the median drops. Raising this costs ~1.3s per extra round
      # and shrinks only the within-job noise — all rounds share one runner.
      PERF_ROUNDS: '5'
      # Single source for the thresholds, so they are not copied between this
      # job, the baseline workflow and the docs.
      PERF_WARNING_THRESHOLD: '1.5'
      PERF_ERROR_THRESHOLD: '2.0'
      PERF_MIN_DURATION: '0.05'
      # On a pull_request event github.sha is the ephemeral refs/pull/N/merge
      # commit, which is garbage-collected after the merge. Provenance has to
      # name a commit that still exists.
      PERF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install prometheus-client pytest-json-report

      - name: Run performance tests (${{ env.PERF_ROUNDS }} rounds)
        # One pytest process per round: separate processes keep per-round state
        # (import caches, allocator arenas) from making later rounds look faster
        # than earlier ones, which would bias the median.
        #
        # A failing round does NOT stop the loop. Running N rounds multiplies the
        # chance of hitting a flaky assertion by N, and a failure in round 3 must
        # not throw away the measurement from rounds 1, 2, 4 and 5. The verdict
        # on those failures belongs to the checker, which counts them per
        # benchmark: a minority of failing rounds is a warning (one noisy sample
        # of a timing assertion — the subject of #768), a majority is an error.
        run: |
          set -uo pipefail
          mkdir -p tests/performance/rounds || exit 1
          for round in $(seq 1 "$PERF_ROUNDS"); do
            echo "::group::performance round $round/$PERF_ROUNDS"
            pytest tests/performance/ -q -s \
              --json-report \
              --json-report-file="tests/performance/rounds/round-$round.json" \
              || echo "::warning::performance round $round had a test failure"
            echo "::endgroup::"
          done
          produced=$(ls tests/performance/rounds/round-*.json 2>/dev/null | wc -l)
          echo "rounds with a report: $produced of $PERF_ROUNDS"
          # pytest-json-report writes a report on every normal exit, collection
          # errors included, so a MISSING file means the process died (OOM,
          # segfault, timeout). That is a broken measurement, not a slow one.
          # A report that exists but records an aborted session is caught by the
          # checker, which reads pytest's exitcode and collectors.
          if [ "$produced" -lt "$PERF_ROUNDS" ]; then
            echo "only $produced of $PERF_ROUNDS rounds produced a report —"
            echo "a round died before writing one; the measurement is incomplete"
            exit 1
          fi
        env:
          # The twelve benchmarks in tests/performance/test_redis_load.py and
          # test_websocket_load.py are gated on this opt-in (tests/conftest.py
          # and tests/support/live_infra.py). Without it they skipped, the
          # checker reported twelve non-fatal "Test not found" warnings, and
          # the job measured 13 of 25 benchmarks while going green — for four
          # months (#768 / #796 / #679). The flag is safe HERE and nowhere
          # else by default: the gate exists because the deploy host's paper
          # runtime shares Redis DB 1 with the suite, and these tests write
          # runtime-shaped keys (trading:{asset}:positions). This runner's
          # Redis is a throwaway service container.
          #
          # Neither module reaches a KIS endpoint. test_websocket_load.py is
          # named for what the Redis Streams it measures carry, not for a KIS
          # WebSocket connection — nothing in tests/performance/ needs network
          # access beyond this container.
          KIS_RUN_LIVE_INFRA_TESTS: '1'
          # shared/streaming/client.py::RedisClient reads these three. It does
          # NOT read REDIS_URL, so the previous `REDIS_URL: ...:6379/0` set
          # nothing on this path (the client defaulted to DB 1 regardless).
          # REDIS_URL is kept, corrected to DB 1, for anything else that reads
          # it; DB 1 is the project default (CLAUDE.md).
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          REDIS_DB: '1'
          REDIS_URL: redis://localhost:6379/1
          ENVIRONMENT: test

      - name: Check for performance regressions
        # Thresholds tuned for shared GitHub-hosted runner variance and set in
        # this job's env above: PERF_ERROR_THRESHOLD fails the build,
        # PERF_WARNING_THRESHOLD is an informational warning (non-fatal), and a
        # benchmark whose baseline median is below PERF_MIN_DURATION is exempt
        # because its wall-clock ratio is noise-dominated. Exit 2 also covers a session that never ran: the
        # checker reads each round report's pytest exitcode and collectors, so a
        # collection error that writes `tests: []` in every round fails here
        # instead of reporting 25 "Test not found" warnings and going green.
        # The comparison is MEDIAN of PERF_ROUNDS rounds
        # against the median of the baseline's rounds; --write-samples emits the
        # aggregated sample arrays (n/median/min/max/sd + provenance) that the
        # upload step publishes and that --write-baseline consumes.
        run: |
          python scripts/performance/check_regression.py \
            --baseline tests/performance/baselines.json \
            --current tests/performance/rounds/round-*.json \
            --write-samples tests/performance/current.json \
            --markdown-summary "$GITHUB_STEP_SUMMARY" \
            --warning-threshold "$PERF_WARNING_THRESHOLD" \
            --error-threshold "$PERF_ERROR_THRESHOLD" \
            --min-duration "$PERF_MIN_DURATION"
        continue-on-error: false

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          # current.json is the aggregated samples file; rounds/ holds the raw
          # per-round pytest reports it was built from. Feed current.json to
          # `check_regression.py --write-baseline` to propose a new baseline.
          path: |
            tests/performance/current.json
            tests/performance/rounds/
          retention-days: 30
