# KIS 모의투자(paper) stock-order transport config example
# (tos_runtime.transport.kis_mock.config).
#
# Loader: tos_runtime.transport.kis_mock.config.load_kis_mock_transport_config
# (consumed by tos_runtime.transport.kis_mock.adapter.KisMockTransport's constructor,
# via a KisMockHttpClient built from this same config — T2's compose root wires both).
#
# ── Host seal (plan §2 결정 5) ──────────────────────────────────────────────
# `endpoint_rest_base` must byte-exact match the INSTANCE MOCK_VTS document's own
# `_kis.endpoints.rest_base` literal (docs/broker-profiles/KIS-BROKER-CAPABILITY-
# PROFILE-draft.yaml, measured "https://openapivts.koreainvestment.com:29443") and
# must NOT equal the INSTANCE REAL_PROD document's own rest_base
# ("https://openapi.koreainvestment.com:9443") — the loader refuses to start either
# way. A config value cannot re-point this transport at a live host, no matter what
# an operator (or an attacker with write access to this file) sets it to; this is a
# structural guard, not merely documentation.
#
# ── `V`-prefix rule (plan §2 결정 5) ────────────────────────────────────────
# KIS's own TR-id convention prefixes every 모의(paper) order TR with `V`
# (`VTTC0011U`/`VTTC0012U`, N-17 collation memo
# docs/plans/2026-07-29-tos-p02-n17-spec-collation.md); every 실전(real) one uses
# `T` (`TTTC0011U`/`TTTC0012U`), and futures 야간(night) real TRs use `STTN`/`CTF*`.
# `tr_id_buy`/`tr_id_sell` MUST start with `V` — the loader refuses `T`/`STTN`/`CTF`
# prefixes outright, by name, so a config cannot smuggle a real-order TR id past it.
#
# Every value below is a named-TBD `null` except `mode` (dry_run — the only
# operator-safe default until Phase 5/P0-2 close, plan §0 "핵심 귀결") and
# `allow_plaintext_for_tests` (false — plaintext HTTP is a hermetic-test-only escape
# hatch, never a real deployment value). `field_map`'s own keys are already fixed
# (the closed dynamic-source vocabulary this loader admits, `tos_runtime.transport.
# kis_mock.config.DYNAMIC_FIELD_SOURCES`); only its VALUES (the KIS wire field names
# each source populates) are named-TBD, pending the operator's disposition of the
# plan's §6 확인 지점 2 proposal table (docs/runbooks/tos-kis-mock-transport.md).
#
# ⚠ Known T1 gap (see the runbook's proposal table): KIS's `order_cash` body has
# nine required fields (N-17 memo); `field_map`'s closed source vocabulary
# (account/instrument/quantity/price) can only ever populate four of them. The
# remaining five (ACNT_PRDT_CD/ORD_DVSN/EXCG_ID_DVSN_CD/SLL_TYPE/CNDT_PRIC) have no
# per-attempt kernel-side source at all and are NOT populated by this config/loader
# — a future revision widening this schema with a small set of per-deployment
# static literals is the recommended follow-up, not a value invented here.
mode: dry_run
endpoint_rest_base: null
order_path: null
token_path: null
tr_id_buy: null
tr_id_sell: null
field_map:
  account: null
  instrument: null
  quantity: null
  price: null
min_send_interval_ms: null
token_reissue_min_interval_s: null
request_timeout_s: null
allow_plaintext_for_tests: false
