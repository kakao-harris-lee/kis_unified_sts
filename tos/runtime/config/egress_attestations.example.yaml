# Operator-attested egress-gate stand-ins (tos_runtime.compose._egress_attestations).
#
# Five SendBoundaryContext fields the gateway's own item-6/item-12/item-16
# checks consume have NO Phase 2 runtime producer:
#
#   * account_instrument_action_allowed / venue_session_account_facts_current /
#     broker_constraint_generation_current (items 6/12) — the kernel's own
#     check-reason strings say why: "pending the P0-2 approved Profile
#     INSTANCE" / "the versioned Profile is P0-2-blocked"
#     (tos/src/tos/egressgw/gateway.py, _check_allowance / _check_venue_generations).
#     Phase 4 (the P0-2 approved Profile INSTANCE) replaces these operator
#     attestations.
#
#   * restrictive_latch_state / worst_credible_capacity (item 16) — no Phase 2
#     lane owns a real local-restrictive-latch service or a real
#     worst-credible-capacity computation. Phase 5 (a real latch/capacity-owning
#     runtime service) replaces these operator attestations.
#
# Every field below is a named-TBD `null` in this example — an operator MUST
# fill in a concrete value for every field before compose_paper_runtime will
# start; a still-null field refuses composition at startup (fail-closed,
# never a silent default).
#
# max_quantity_within_allowance (also an item-6 field) is NOT configured
# here: it has a genuine Phase 2 producer (step 2's own
# CandidateConstruction.no_silent_widening_ok) and is always derived from
# that live value instead.
account_instrument_action_allowed:
  attested: null
venue_session_account_facts_current:
  attested: null
broker_constraint_generation_current:
  attested: null
restrictive_latch_state:
  clear: null
worst_credible_capacity:
  value: null
