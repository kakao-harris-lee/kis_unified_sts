# tos_runtime.release example config (design #40 §5 order 6, lane R item 4)
#
# Loader: tos_runtime.release.config.load_release_config
#
# Phase 2 has no live SCI (ADR-002-029) admission-decision runtime — no real
# source/build/dependency/signer/registry scanning exists yet. Every value
# below is therefore an OPERATOR-APPROVED STATIC SNAPSHOT, never a computed
# one; "config YAML with null=named-TBD ⇒ refuse to start" (slice plan §3
# item 4). A real deployment copies this file and has an operator sign off
# each value before service construction succeeds
# (tos_runtime.release.config.ReleaseAdmissionConfigError otherwise).

# The expected SOURCE-TREE digest this release must match (Phase 5 W4 §2
# decision 5): a sha256-per-file fold over every *.py file under the
# installed `tos` + `tos_runtime` package trees, computed by
# tos_runtime.operations.dependency_admission.observe_source_tree_digest
# and compared against that same real measurement — "runtime input
# collection: equality" (tos_runtime.release.admission module docstring; no
# kernel predicate computes this comparison). Obtain this value for THIS
# deployment tree by running the `print-digests` CLI subcommand on the
# server the config will actually run on — it differs per deployment tree,
# never copy it from another environment's release.yaml.
expected_code_digest: null

# The expected installed DEPENDENCY-SET digest this release must match
# (Phase 5 W4 §2 decision 5): the sorted (name, version) pairs from
# `importlib.metadata.distributions()` plus the interpreter/sqlite
# coordinates, computed by
# tos_runtime.operations.dependency_admission.observe_dependency_set_digest.
# Also obtained from the `print-digests` CLI subcommand, on the same
# deployment tree.
expected_dependency_set_digest: null

# The exact tos.sci.AdmissionResult for the deployed artifact: "ADMIT",
# "DENY", or "UNKNOWN". Phase 2 has no automatic admission — this is an
# operator-signed static decision, never computed here.
admission_result: null

# Whether this static restriction-registry snapshot itself is trustworthy
# (bool). An unresolved lookup denies conservatively regardless of what
# `restriction_present`/`restriction` below carry (SCI-INV-014).
restriction_state_resolved: null

# Whether an active tos.sci.ReleaseRestriction currently applies to this
# release's scope (bool, negative polarity — present OR unknown denies).
restriction_present: null

# Populated only when `restriction_present` is true; ignored otherwise.
restriction:
  restriction_id: null
  restriction_generation: null
  trigger_class: null
