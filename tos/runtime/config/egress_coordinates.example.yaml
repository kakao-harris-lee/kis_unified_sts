# Operator-configured egress coordinates + capsule-terminus stand-in inputs
# (tos_runtime.compose._egress_coordinates).
#
# These are the ADR-002-013 §11.2/§12 authorized-egress-coordinate values
# BrokerEgressGateway verifies every attempt's request against (item 17,
# exact_binding_holds) — action / method / route identity / credential and
# broker-session and egress generation / active principal — plus
# capsule_terminus_fields, which names the ConstructionConfig fields whose
# values feed capsule_egress_request_digest.
#
# capsule_egress_request_digest is a STAND-IN for the eventual capsule-chain
# terminus (design #34 / EGRESS-EV-003 "+Security" byte-level reconstruction
# / route confinement, not landed in this Phase) — capsule_terminus_fields
# only selects which ConstructionConfig fields feed that stand-in digest; the
# digest itself is still a genuine per-attempt derivation, never a literal.
# Phase 5+ (a real capsule chain) replaces this stand-in with a genuine
# capsule-terminus digest.
#
# Every field below is a named-TBD `null` in this example — an operator MUST
# fill in a concrete value for every field before compose_paper_runtime will
# start; a still-null field refuses composition at startup (fail-closed,
# never a silent default).
#
# active_principal MAY contain the literal token `{environment_label}`,
# substituted by the loader with the runtime's own environment label — the
# ONLY templating this loader performs.
action:
  value: null
method:
  value: null
route_identity:
  value: null
credential_generation:
  value: null
broker_session_generation:
  value: null
egress_generation:
  value: null
active_principal:
  value: null
capsule_terminus_fields:
  value: null
