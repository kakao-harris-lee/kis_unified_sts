# tos_runtime.marketfeed critical input policy example config
# (TOS tick-source wave, plan docs/plans/2026-09-16-tos-tick-source-plan.md §2 decision 2)
#
# Loader: tos_runtime.marketfeed.policy.load_critical_input_policy
#
# Every value below is `null` (named-TBD): this is an EXAMPLE file, not an
# approved policy. A real deployment copies this file (e.g. under
# config/tos_runtime/paper/), gets it approved through this repo's normal
# config-driven governance (CLAUDE.md "configuration-driven only"), and fills
# in every leaf. A still-null or missing required leaf is a fail-closed
# refusal at load (tos_runtime.marketfeed.policy.CriticalInputPolicyConfigError),
# never a silent default.
#
# This policy governs which raw observation fields tos_runtime.marketfeed may
# ever admit as a Critical Input value, and under what freshness ceiling
# (plan §2 decision 2 — "필드 상태는 거버넌스 정책에서 파생한다, 절대 VALID 를
# 찍지 않는다"). A field NOT listed under `fields:` below is dropped by the
# kernel's own UNKNOWN floor (tos/src/tos/marketfeed/value.py:225-229) even
# if it is present in an observation's raw payload.

# --- identity ---------------------------------------------------------------

policy_id: null
policy_version: null
policy_generation: null

# The principal this policy attributes issued snapshots to
# (tos.capsule.CriticalInputSnapshot.issuer_principal_id).
issuer_principal_id: null

# --- scope --------------------------------------------------------------
# Single-live-scope (v1) — this policy governs exactly one environment/
# decision class. tos_runtime.marketfeed.snapshot.SnapshotIssuer combines
# this with the per-observation instrument and the injected account to form
# the issued snapshot's SnapshotScope.

environment: null
decision_class: null
intended_use: null

# --- admissible fields -------------------------------------------------
# One entry per DSL-visible field_key this policy admits. An empty list
# refuses to load (a policy admitting nothing is almost certainly a
# misfill, not a deliberate deny-all — see the loader's own docstring).
#
# unit / scale / multiplier / sign are carried as separate, distinct safety
# fields (tos/src/tos/capsule/observation.py's own Mapping docstring) — never
# folded into one combined token, even though they are all strings here.
#
# max_age_ms is this field's freshness ceiling in milliseconds: an
# observation strictly older than this (now_ms - as_of_ms > max_age_ms) is
# derived UNKNOWN, never VALID, regardless of anything else about it (plan
# §6 operator confirmation ② — a wave-local bound, not yet a registered
# VER-002 key).

fields:
  - field_key: null
    unit: null
    scale: null
    multiplier: null
    sign: null
    max_age_ms: null
