# Monitor-coverage bounds for the slim runtime monitor
# (tos_runtime.safety.monitoring.MonitoringService).
#
# The kernel tos.stm coverage manifest and verify item 10 went with plan S2-a
# (docs/plans/2026-11-13-tos-code-halving-plan.md): the manifest was a static
# YAML constant in every shipped tenant tree and item 10 never denied. What is
# left is the two self-observations the monitor actually makes, once per
# MONITORING currentness reading:
#   * the evidence store's own append tip is still advancing within
#     `bounds.max_evidence_tip_stall_ms`;
#   * the engine inbox's unconsumed-row count is within
#     `bounds.max_inbox_unconsumed`.
#
# Time health is deliberately absent: the Trustworthy Time service owns the
# TRUSTWORTHY_TIME currentness dimension and judging that fact twice is what
# S2-a removed.
#
# named-TBD discipline: every value below is null. The loader refuses to start
# on any unfilled required field (MonitoringConfigError).
coverage:
  # Stamped onto the MONITORING dimension's `bound_generation`.
  coverage_generation: null
  bounds:
    max_evidence_tip_stall_ms: null
    max_inbox_unconsumed: null
