# tos_runtime custody manifest example (design #40 D4.1, slice plan §2 item 4).
#
# Loader: tos_runtime.custody.file_custody.CustodyManifest.load
# (consumed by tos_runtime.custody.file_custody.FileCustody's constructor).
#
# `environment_label` MUST byte-exact match the runtime's own boot-argument
# label (tos.workload.environment_label_consistent — case-sensitive, no
# prefix/substring match, no environment-family grouping) or FileCustody
# refuses to construct at all: a fail-closed BOOT refusal, not a per-load
# refusal (ADR-002-013 :498, design #40 D4.1 line 113). This example leaves
# it `null` (named-TBD) — a real deployment's copy MUST set a concrete label
# ("non-live-test" / "paper" / "restricted-live" / "production") before this
# file is usable, since `null` never equals any runtime label (the predicate
# treats an absent/blank label on EITHER side as "not provably consistent",
# never as a vacuous match).
environment_label: null

# Phase 2 provisions exactly three scopes
# (tos_runtime.custody.file_custody.PROVISIONED_SCOPES): `read.principal`,
# `evidence.key`, `replay.params`. `order.*` is deliberately absent and
# always will be for futures REAL (root CLAUDE.md non-negotiable rule).
#
# Stock order-scope custody is Phase 4 (tos-kis-mock-transport plan) — the
# two `kis_mock.*` rows below are that phase's own scopes, named for the KIS
# MOCK stock transport
# (tos_runtime.transport.kis_mock.adapter.KisMockTransport) rather than
# `order.*` (the scope names this plan's transport actually consumes; the
# `order.*` prohibition above is about that different, unrelated name).
# **Provisioned as of T2 lane C.** `tos_runtime.custody.file_custody.
# PROVISIONED_SCOPES` now includes `kis_mock.app_key`/`kis_mock.app_secret` —
# see the runbook `docs/runbooks/tos-kis-mock-transport.md` for the custody
# file preparation steps. There is deliberately NO `kis_mock.account` scope
# (review F2): the KIS account number is not a custody credential in this
# design — it is the sealed outbound `account` coordinate, read directly off
# the `SendSeal` (see `tos_runtime.transport.kis_mock.codec`'s own module
# docstring).
#
# Each `kis_mock.*` row's `principal` mirrors `broker_scopes.example.yaml`'s
# `MOCK_STOCK_ORDER.principal` (`"kis-mock-order-{environment_label}"`)
# verbatim — the plan's decision 4 requires both to match the ACTIVE broker
# scope's own (already `{environment_label}`-substituted) `principal` string
# before `compose --transport kis-mock` may boot
# (`tos_runtime.compose._transport_wiring.refuse_custody_principal_mismatch`
# — one principal names both the credential and the route). Note that,
# unlike `broker_scopes.yaml`, `CustodyManifest` performs NO
# `{environment_label}` substitution of its own: this example's literal
# token string is illustrative only, and a real deployment's manifest MUST
# write the concrete, already-substituted principal (e.g.
# `kis-mock-order-paper`) for the check above to ever pass.
#
# Each scope names:
#   file            - path to the credential file, RELATIVE to this
#                     manifest's own directory (never absolute).
#   principal       - this scope's own, distinct principal string
#                     (ADR-002-013 :267-269 - no two scopes may share one).
#   expected_sha256 - the file's expected sha256 hex digest, or `null`
#                     (named-TBD - digest pinning not yet approved for this
#                     scope). `null` skips the digest check entirely and
#                     FileCustody.load instead records a "digest 미고정"
#                     note in the scope's evidence entry - never treated as
#                     a vacuous match.
#
# Every scope file below must exist with mode exactly 0600, owned by the
# uid FileCustody was constructed with as `expected_owner_uid` - anything
# else (0644, wrong owner, missing file) is a load-time refusal
# (CustodyLoadRefused), never a warning.
scopes:
  read.principal:
    file: read.principal
    principal: read-principal-v1
    expected_sha256: null
  evidence.key:
    file: evidence.key
    principal: evidence-key-v1
    expected_sha256: null
  replay.params:
    file: replay.params
    principal: replay-params-v1
    expected_sha256: null
  kis_mock.app_key:
    file: kis_mock.app_key
    principal: "kis-mock-order-{environment_label}"
    expected_sha256: null
  kis_mock.app_secret:
    file: kis_mock.app_secret
    principal: "kis-mock-order-{environment_label}"
    expected_sha256: null
